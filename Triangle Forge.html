<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Triangle Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn to design a RISC-V graphics card, from rasterizing triangles to the PCB, firmware and drivers, with short visual exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Exo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one mobile-first column; a lesson path drawn like a scanline; bottom tab bar; full-screen lesson player.
   Palette: violet-tinted neutrals around a deep "shader violet" brand, solder-amber for progress and rewards,
   and seven category colours that double as the red, green and blue of the pixel lessons. */
:root {
  --bg: #EEEDF5;
  --surface: #F7F6FB;
  --card: #FFFFFF;
  --ink: #17132B;
  --ink-2: #4A4566;
  --ink-3: #777293;
  --line: #D4D0E3;
  --line-2: #E6E3EF;
  --brand: #5B30D6;
  --brand-2: #E7E0FB;
  --brand-ink: #FFFFFF;
  --gold: #B97508;
  --gold-2: #F6E4BF;
  --gold-ink: #392500;
  --ok: #1B8656;
  --ok-2: #D9F1E4;
  --bad: #C8372E;
  --bad-2: #F9DEDB;
  --wire: #A9A3C2;
  --hot: #E0442F;
  --f-op: #23925A;
  --f-rd: #2E68D6;
  --f-f3: #D24A44;
  --f-rs1: #8448CC;
  --f-rs2: #C87510;
  --f-f7: #0F8E92;
  --f-imm: #BC3E87;
  --f-op-2: #DDF2E6;
  --f-rd-2: #DEE8FA;
  --f-f3-2: #F9E1DF;
  --f-rs1-2: #EDE3F9;
  --f-rs2-2: #F8EBD8;
  --f-f7-2: #D8F1F1;
  --f-imm-2: #F6E0EC;
  --screen: #07060E;
  --shadow: 0 1px 0 rgba(23, 19, 43, .06), 0 6px 18px -10px rgba(23, 19, 43, .28);
  --font-display: "Exo 2", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0B18; --surface: #141126; --card: #1A1631; --ink: #ECE9F7; --ink-2: #ABA5C6; --ink-3: #7B7599;
    --line: #332D53; --line-2: #241F3E; --brand: #A68CFF; --brand-2: #2D2358; --brand-ink: #0D0B18;
    --gold: #F2B530; --gold-2: #3A2C10; --gold-ink: #1A1100; --ok: #46C98A; --ok-2: #10301F; --bad: #F2706A; --bad-2: #3A1717;
    --wire: #4D4672; --hot: #FF6B57;
    --f-op: #4CC584; --f-rd: #6A9DF5; --f-f3: #F07D77; --f-rs1: #B795F2; --f-rs2: #F2AC4E; --f-f7: #3DCACC; --f-imm: #EC7DBA;
    --f-op-2: #10301F; --f-rd-2: #14254A; --f-f3-2: #3A1A19; --f-rs1-2: #2B1D48; --f-rs2-2: #3A2810; --f-f7-2: #0E3233; --f-imm-2: #3A1730;
    --screen: #030207;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0B18; --surface: #141126; --card: #1A1631; --ink: #ECE9F7; --ink-2: #ABA5C6; --ink-3: #7B7599;
  --line: #332D53; --line-2: #241F3E; --brand: #A68CFF; --brand-2: #2D2358; --brand-ink: #0D0B18;
  --gold: #F2B530; --gold-2: #3A2C10; --gold-ink: #1A1100; --ok: #46C98A; --ok-2: #10301F; --bad: #F2706A; --bad-2: #3A1717;
  --wire: #4D4672; --hot: #FF6B57;
  --f-op: #4CC584; --f-rd: #6A9DF5; --f-f3: #F07D77; --f-rs1: #B795F2; --f-rs2: #F2AC4E; --f-f7: #3DCACC; --f-imm: #EC7DBA;
  --f-op-2: #10301F; --f-rd-2: #14254A; --f-f3-2: #3A1A19; --f-rs1-2: #2B1D48; --f-rs2-2: #3A2810; --f-f7-2: #0E3233; --f-imm-2: #3A1730;
  --screen: #030207;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: .01em; white-space: nowrap; min-width: 0; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: 62vh; overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.opt[aria-pressed="true"] .k { border-color: var(--brand); color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt code { white-space: normal; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 64px; }
.numwrap { display: flex; gap: 10px; align-items: center; }
.num {
  flex: 1; min-width: 0; height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px;
  font-family: var(--font-mono); font-size: 20px; font-weight: 500;
}
.num:focus { border-color: var(--brand); outline: none; }
.num.right { border-color: var(--ok); background: var(--ok-2); } .num.wrong { border-color: var(--bad); background: var(--bad-2); }
.unit-label { font-weight: 700; color: var(--ink-2); }
.bits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bitgrp { display: flex; gap: 3px; }
.bit {
  width: 34px; height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; display: grid; place-items: center; color: var(--ink-3); box-shadow: 0 3px 0 var(--line); position: relative;
}
.bit.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.bit small { position: absolute; top: -17px; font-size: 10px; color: var(--ink-3); font-weight: 500; }
.bit.locked { opacity: .5; cursor: default; }
.bits.dense .bit { width: 22px; height: 34px; font-size: 14px; border-radius: 6px; }
.bits.dense .bit small { font-size: 9px; top: -15px; }

      const onEdge = r.pixels.filter(px => px.ew.some(v => Math.abs(v) < 1e-9) && px.ew.every(v => v > -1e-9)).length;
      return { t: 'cover', q: 'Paint every pixel this triangle covers (top-left rule).', tri, n, rule: 'topleft', why: 'A pixel is covered when its centre is inside all three edges. ' + (onEdge > 1 ? onEdge + ' centres sit exactly on an edge: they count only on a top or left edge.' : onEdge === 1 ? 'One centre sits exactly on an edge: it counts only on a top or left edge.' : 'No centre sits exactly on an edge here.'), ref: REF.raster };
    },
    bary() {
      let tri, area2;
      do { tri = [[rint(0, 3), rint(0, 3)], [rint(6, 10), rint(0, 4)], [rint(0, 6), rint(7, 10)]]; area2 = GFX.area2({ x: tri[0][0], y: tri[0][1] }, { x: tri[1][0], y: tri[1][1] }, { x: tri[2][0], y: tri[2][1] }); } while (Math.abs(area2) < 20);
      const wts = pick([[2, 3, 3], [4, 2, 2], [1, 3, 4], [2, 2, 4], [5, 2, 1], [3, 4, 1], [6, 1, 1]]);
      const p = [0, 1].map(k => (wts[0] * tri[0][k] + wts[1] * tri[1][k] + wts[2] * tri[2][k]) / 8);

    winding() {

      return { t: 'mcq', q: 'On a y-down screen, do v0 (' + tri[0] + '), v1 (' + tri[1] + '), v2 (' + tri[2] + ') go clockwise or counter-clockwise?', opts: ['Clockwise', 'Counter-clockwise'], fixed: true, two: true, a: a2 > 0 ? 0 : 1, viz: triPlot(tri), why: 'Doubled signed area = (x1 − x0)(y2 − y0) − (y1 − y0)(x2 − x0) = ' + a2 + '. ' + (a2 > 0 ? 'Positive: clockwise when y points down.' : 'Negative: counter-clockwise when y points down.') + ' Culling compares this sign with the front-face setting.', ref: 'Vulkan specification, Basic Polygon Rasterization (signed area and VkFrontFace).' };
    },
    fixedpt() {

    },

    /* ---------------- spaces and depth ---------------- */
    ndc() {
      const W = pick([1920, 1280, 800, 640]), H = { 1920: 1080, 1280: 720, 800: 600, 640: 480 }[W];
      const v = pick([-1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1]);
      if (R() < 0.5) return { t: 'num', q: 'A vertex lands at x_ndc = ' + v + '. The viewport is ' + W + ' pixels wide and starts at x = 0. Which framebuffer x does it map to?', a: (v + 1) / 2 * W, tol: 0.01, why: 'x_fb = (x_ndc + 1) ÷ 2 × width = (' + v + ' + 1) ÷ 2 × ' + W + ' = ' + ((v + 1) / 2 * W) + '. NDC −1 is the left edge, +1 the right edge.', ref: REF.viewport };
      return { t: 'num', q: 'In Vulkan, a vertex lands at y_ndc = ' + v + '. The viewport is ' + H + ' pixels tall and starts at y = 0. Which framebuffer y does it map to?', a: (v + 1) / 2 * H, tol: 0.01, why: 'y_fb = (y_ndc + 1) ÷ 2 × height = ' + ((v + 1) / 2 * H) + '. In Vulkan, y_ndc = −1 is the top row: y grows downward, unlike OpenGL.', ref: REF.viewport };
    },
    persp() {
      const w = pick([2, 4, 5, 8, 10]);
      const x = rint(-2 * w, 2 * w) / 2, y = rint(-2 * w, 2 * w) / 2, z = rnd(w * 0.9, 1);

    },
    depthval() {
      const n = pick([0.1, 0.5, 1]), f = pick([100, 1000]);

      const z = GFX.depth(d, n, f);

    },

    /* ---------------- textures and blending ---------------- */
    blend() {
      const a = pick([0.2, 0.25, 0.4, 0.5, 0.6, 0.75, 0.8]), src = rint(0, 255), dst = rint(0, 255);

    },
    miplevels() {
      const w = pick([256, 512, 1024, 2048, 4096, 1920, 1000, 640, 300]), hh = pick([256, 512, 1024, 1080, 600, 64]);
      const lv = GFX.mipLevels(w, hh);
      if (R() < 0.75) return { t: 'num', q: 'How many levels are in the complete mip chain of a ' + w + ' × ' + hh + ' texture?', a: lv, why: 'Halve the larger side (rounding down) until it reaches 1: ⌊log2(' + Math.max(w, hh) + ')⌋ + 1 = ' + lv + ' levels.', ref: REF.mips };
      return { t: 'mcq', q: 'Roughly how much extra memory does a full mip chain add to a texture?', opts: ['About one third', 'About one half', 'About one quarter', 'Double'], a: 0, fixed: true, why: 'Each level has a quarter of the texels of the one above: 1/4 + 1/16 + 1/64 + … = 1/3.', ref: REF.mips };
    },
    bc1size() {
      const w = pick([256, 512, 1024, 2048]), hh = pick([256, 512, 1024, 2048]);

      const kib = (w / 4) * (hh / 4) * bpb / 1024;
      return { t: 'num', q: 'A ' + w + ' × ' + hh + ' texture is compressed with ' + fmt + ' (' + bpb + ' bytes per 4 × 4 block). How many KiB does the top level take?', a: kib, unit: 'KiB', why: '(' + w + '/4) × (' + hh + '/4) blocks × ' + bpb + ' bytes = ' + ((w / 4) * (hh / 4) * bpb).toLocaleString('en-US') + ' bytes = ' + kib + ' KiB, against ' + (w * hh * 4 / 1024) + ' KiB as RGBA8: ' + (64 / bpb) + '× smaller, and the texture unit decodes blocks for free.', ref: REF.dfs };
    },
    bilinear() {
      const fx = pick([0.25, 0.5, 0.75, 0.2, 0.6]), fy = pick([0.25, 0.5, 0.75, 0.4]);
      const corners = [['top-left', (1 - fx) * (1 - fy)], ['top-right', fx * (1 - fy)], ['bottom-left', (1 - fx) * fy], ['bottom-right', fx * fy]];
      const [name, wv] = pick(corners);

    },
    morton() {
      const x = rint(0, 7), y = rint(0, 7);

    },

    /* ---------------- shader cores ---------------- */
    warps() {
      const alu = pick([2, 3, 4, 5, 7, 9]), lat = pick([20, 24, 30, 40, 60, 100]);
      const need = GPU.warpsNeeded(alu, lat);
      return { t: 'num', q: 'Each warp issues ' + alu + ' ALU instructions, then a load whose data returns ' + lat + ' cycles later. One instruction issues per cycle. What is the smallest number of warps that keeps the scheduler issuing every cycle?', a: need, why: 'A warp issues ' + (alu + 1) + ' instructions, then waits ' + lat + ' cycles: a round trip of ' + (alu + 1 + lat) + ' cycles. ⌈' + (alu + 1 + lat) + ' ÷ ' + (alu + 1) + '⌉ = ' + need + ' warps fill it.', ref: REF.simt };
    },
    occupancy() {
      const rf = pick([65536, 32768]), regs = pick([24, 32, 40, 48, 64, 96, 128, 168]), max = pick([32, 48, 64]);
      const o = GPU.occupancy({ rf, regs, warp: 32, maxWarps: max });
      return { t: 'num', q: 'A shader core has ' + rf.toLocaleString('en-US') + ' registers, 32-lane warps and scheduler slots for ' + max + ' warps. A shader needs ' + regs + ' registers per lane. How many warps can be resident?', a: o.warps, why: '⌊' + rf.toLocaleString('en-US') + ' ÷ (' + regs + ' × 32)⌋ = ' + o.byRegs + ' warps fit in the register file' + (o.limit === 'registers' ? ', so registers are the limit.' : ', but the scheduler only tracks ' + max + '.') + ' Fewer resident warps means less latency hiding.', ref: REF.occupancy };
    },
    util() {
      const c = rint(2, 6), k = rint(1, 7), a = rint(2, 9), b = rint(1, 9);
      const issued = c + a + b, useful = 8 * c + k * a + (8 - k) * b;
      const u = useful / (issued * 8);
      return { t: 'num', q: 'An 8-lane warp runs ' + c + ' instructions together, then an if/else: ' + k + ' lane' + (k > 1 ? 's take' : ' takes') + ' the if side (' + a + ' instructions) and ' + (8 - k === 1 ? 'the other lane takes' : 'the other ' + (8 - k) + ' take') + ' the else side (' + b + ' instructions). What fraction of lane slots does useful work? (2 decimals)', a: rnd(u, 2), tol: 0.011, why: 'Both sides run one after the other with lanes masked off: ' + c + ' + ' + a + ' + ' + b + ' = ' + issued + ' issues × 8 lanes = ' + (issued * 8) + ' slots. Useful work: 8·' + c + ' + ' + k + '·' + a + ' + ' + (8 - k) + '·' + b + ' = ' + useful + '. ' + useful + ' ÷ ' + (issued * 8) + ' ≈ ' + u.toFixed(2) + '.', ref: REF.vortex };
    },
    simtmask() {
      const bx = rint(0, 7) * 4, by = rint(0, 7) * 2;
      const kind = pick(['xlt', 'yeq', 'odd', 'xge', 'circle']);
      let label, fn;
      if (kind === 'xlt') { const t = bx + rint(1, 3); label = 'x < ' + t; fn = (x, y) => x < t; }
      else if (kind === 'xge') { const t = bx + rint(1, 3); label = 'x >= ' + t; fn = (x, y) => x >= t; }
      else if (kind === 'yeq') { label = 'y == ' + by; fn = (x, y) => y === by; }
      else if (kind === 'odd') { label = '(x + y) & 1'; fn = (x, y) => ((x + y) & 1) === 1; }
      else { const t = bx + by + rint(2, 4); label = 'x + y < ' + t; fn = (x, y) => x + y < t; }
      let mask = 0;
      const lanes = [];
      for (let i = 0; i < 8; i++) { const x = bx + (i % 4), y = by + (i >> 2); if (fn(x, y)) { mask |= 1 << i; lanes.push(i + ' (' + x + ',' + y + ')'); } }
      return { t: 'bits', q: 'A warp shades the 4 × 2 block x = ' + bx + '…' + (bx + 3) + ', y = ' + by + '…' + (by + 1) + '. Lane i is pixel (' + bx + ' + i mod 4, ' + by + ' + i div 4). Set bit i for each lane that takes `if (' + label + ')`.', n: 8, a: mask, labels: 'index', readout: 'hex', why: (lanes.length ? 'Active lanes: ' + lanes.join(', ') + '.' : 'No lane passes the test.') + ' Mask = `' + bin(mask, 8) + '`. Lanes outside the mask sit idle while the if side runs.', ref: REF.vortex };
    },
    tflops() {
      const cores = pick([16, 24, 32, 48, 64, 80, 96, 128]), lanes = pick([32, 64, 128]), ghz = pick([1.5, 1.8, 2.0, 2.2, 2.5]);
      const tf = cores * lanes * 2 * ghz / 1000;
      return { t: 'num', q: 'A GPU has ' + cores + ' shader cores with ' + lanes + ' FP32 lanes each, clocked at ' + ghz + ' GHz. Each lane can finish one fused multiply-add per clock. What is the peak FP32 throughput in TFLOPS? (2 decimals)', a: rnd(tf, 2), tol: 0.011, unit: 'TFLOPS', why: 'An FMA counts as 2 floating-point operations: ' + cores + ' × ' + lanes + ' × 2 × ' + ghz + ' GHz = ' + rnd(tf * 1000, 1) + ' GFLOPS = ' + rnd(tf, 2) + ' TFLOPS.', ref: REF.fma };
    },
    floatbits() {
      const v = pick([1, 0.5, 2, -1, 0.25, 1.5, 3, 0.75, 255, -0.5, 4, 0.125]);
      const b = RV.f32bits(v);
      const e = (b >>> 23) & 255;
      return { t: 'num', q: 'RISC-V has no floating-point immediates. To put ' + v + ' in fa0, a shader runs `li t0, X` then `fmv.w.x fa0, t0`. What is X? (hex)', a: b, base: 'hex', viz: { k: 'field', fields: [{ key: 'sign', hi: 31, lo: 31, label: 's' }, { key: 'exp', hi: 30, lo: 23, label: 'exponent' }, { key: 'frac', hi: 22, lo: 0, label: 'fraction' }], n: 32, vals: false }, why: 'sign ' + (b >>> 31) + ', exponent ' + (e - 127) + ' + 127 = ' + e + ' (`' + bin(e, 8) + '`), fraction `' + bin(b & 0x7FFFFF, 23).replace(/0+$/, '') + (b & 0x7FFFFF ? '' : '0') + '…` → ' + hx(b, 8) + '.', ref: REF.rvf };
    },
    fcvt() {
      const v = pick([2.5, -2.5, 3.7, -3.7, 1.5, -0.5, 0.5, -1.2]);
      const rm = pick(['rtz', 'rdn', 'rup', 'rne']);
      const fn = { rtz: Math.trunc, rdn: Math.floor, rup: Math.ceil, rne: x => { const f = Math.floor(x), d = x - f; return d > 0.5 ? f + 1 : d < 0.5 ? f : (f % 2 === 0 ? f : f + 1); } }[rm];
      const a = fn(v) || 0;
      return { t: 'num', q: '`fcvt.w.s a0, fa0, ' + rm + '` runs with fa0 = ' + v + '. What integer lands in a0?', a, why: { rtz: 'rtz rounds toward zero (truncates)', rdn: 'rdn rounds down, toward −∞', rup: 'rup rounds up, toward +∞', rne: 'rne rounds to nearest, and ties go to the even integer' }[rm] + ': ' + v + ' → ' + a + '. Shaders use rdn to compute floor() for texture tiling and checkerboards.', ref: REF.rvf };
    },

    /* ---------------- memory and display ---------------- */
    vrambw() {
      const [type, rates] = pick([['GDDR6', [14, 16, 18, 20]], ['GDDR7', [28, 30, 32]]]);
      const bus = pick([128, 192, 256, 320, 384]), rate = pick(rates);
      const bw = bus * rate / 8;
      return { t: 'num', q: 'A card has a ' + bus + '-bit ' + type + ' bus running at ' + rate + ' Gbit/s per pin. What is its peak memory bandwidth in GB/s?', a: bw, tol: 0.5, unit: 'GB/s', why: bus + ' pins × ' + rate + ' Gbit/s ÷ 8 bits per byte = ' + bw + ' GB/s, from ' + (bus / 32) + ' chips of 32 bits each.', ref: REF.gddr };
    },
    fbtraffic() {
      const [w, hh] = pick(RESOLUTIONS.slice(1)), fps = pick([60, 120, 144]);
      const gb = w * hh * 4 * fps / 1e9;
      return { t: 'num', q: 'The display engine reads every pixel of a ' + w + ' × ' + hh + ' RGBA8 framebuffer ' + fps + ' times a second. How much memory bandwidth does scanout use? (GB/s, 2 decimals)', a: rnd(gb, 2), tol: 0.011, unit: 'GB/s', why: w + ' × ' + hh + ' × 4 bytes × ' + fps + ' = ' + (w * hh * 4 * fps).toLocaleString('en-US') + ' bytes/s ≈ ' + gb.toFixed(2) + ' GB/s. Small next to rendering, but it can never stall: the display needs every pixel on time.', ref: REF.timing };
    },
    fillrate() {
      const rops = pick([16, 32, 48, 64, 96, 128]), ghz = pick([1.5, 2, 2.5]);
      return { t: 'num', q: 'A GPU has ' + rops + ' ROPs, each able to write one pixel per clock, at ' + ghz + ' GHz. What is its peak pixel fill rate in Gpixels/s?', a: rops * ghz, tol: 0.01, unit: 'Gpix/s', why: rops + ' × ' + ghz + ' GHz = ' + (rops * ghz) + ' Gpixels/s. A 4K frame is 8.3 Mpixels, so even 10 layers of overdraw at 60 fps is only about 5 Gpixels/s: bandwidth usually runs out first.', ref: REF.rtr23 };
    },
    pclk() {
      const key = pick(Object.keys(DISP.MODES));
      const m = DISP.MODES[key], t = DISP.timing(m);
      const hz = pick(key === 'uhd' || key === 'qhd' ? [30, 60] : [60, 75, 120]);

      return { t: 'num', q: 'A ' + m.h[0] + ' × ' + m.v[0] + ' video mode has ' + t.htotal + ' pixel clocks per line (including blanking) and ' + t.vtotal + ' lines per frame. What pixel clock gives ' + hz + ' Hz? (MHz, 1 decimal)', a: rnd(p, 1), tol: 0.06, unit: 'MHz', why: t.htotal + ' × ' + t.vtotal + ' × ' + hz + ' = ' + Math.round(p * 1e6).toLocaleString('en-US') + ' Hz = ' + p.toFixed(2) + ' MHz. Blanking counts too: only ' + Math.round((1 - t.blank) * 100) + '% of the clocks carry visible pixels.', ref: REF.timing };
    },
    link() {
      const key = pick(['fhd', 'qhd', 'uhd']);
      const m = DISP.MODES[key], t = DISP.timing(m);
      const hz = pick([60, 120]), bpc = pick([8, 10]);
      const p = DISP.pclk(t.htotal, t.vtotal, hz);
      const res = pick(DISP.check(p, bpc));
      return { t: 'tf', q: 'Can **' + res.link.name + '** carry ' + m.h[0] + ' × ' + m.v[0] + ' at ' + hz + ' Hz with ' + bpc + '-bit RGB 4:4:4 and no compression? (pixel clock ' + p.toFixed(1) + ' MHz)', a: res.ok, why: (res.link.kind === 'tmds' ? 'TMDS clock = pixel clock × ' + bpc + ' ÷ 8 = ' + (p * bpc / 8).toFixed(1) + ' MHz against a ' + res.link.maxTmds + ' MHz limit.' : 'Needed: pixel clock × 3 × ' + bpc + ' = ' + res.need.toFixed(2) + ' Gbit/s; usable after line coding: ' + res.cap.toFixed(2) + ' Gbit/s.') + (res.ok ? ' It fits.' : ' It does not fit.'), ref: REF.links };
    },
    vblank() {
      const key = pick(['vga', 'hd', 'fhd', 'uhd']);
      const m = DISP.MODES[key], t = DISP.timing(m);
      const lines = t.vtotal - m.v[0];
      const us = lines * t.htotal / m.clock;
      return { t: 'num', q: 'In ' + m.name + ' (pixel clock ' + m.clock + ' MHz, ' + t.htotal + ' clocks per line), vertical blanking lasts ' + lines + ' lines. How long is that in microseconds? (nearest whole number)', a: Math.round(us), tol: 1, unit: 'µs', why: 'One line takes ' + t.htotal + ' ÷ ' + m.clock + ' MHz = ' + (t.htotal / m.clock).toFixed(2) + ' µs; × ' + lines + ' lines = ' + us.toFixed(1) + ' µs. A page flip latched in this window never tears.', ref: REF.timing + ' Linux KMS completes page flips at vblank (drm_crtc_send_vblank_event).' };
    },
    ring() {
      const size = pick([8, 16, 32, 64]);
      const rptr = rint(0, size - 1), wptr = rint(0, size - 1);
      const queued = (wptr - rptr + size) % size, free = size - 1 - queued;
      const viz = size <= 16 ? { k: 'ring', slots: size, rptr, wptr } : null;
      if (R() < 0.5) return { t: 'num', q: 'A command ring has ' + size + ' slots. The GPU’s read pointer is ' + rptr + ' and the driver’s write pointer is ' + wptr + '. How many packets are waiting?', a: queued, viz, why: 'queued = (WPTR − RPTR) mod size = (' + wptr + ' − ' + rptr + ') mod ' + size + ' = ' + queued + '.', ref: REF.circ };
      return { t: 'num', q: 'A command ring has ' + size + ' slots and always keeps one empty so “full” and “empty” look different. RPTR = ' + rptr + ', WPTR = ' + wptr + '. How many more packets can the driver write?', a: free, viz, why: queued + ' are queued, so free = ' + size + ' − 1 − ' + queued + ' = ' + free + '. If WPTR caught up with RPTR completely, a full ring would look empty.', ref: REF.circ };
    },

    /* ---------------- PCI Express ---------------- */
    pciebw() {
      const gen = rint(1, 5), lanes = pick([1, 4, 8, 16]);
      const g = PCIE.GENS[gen - 1];
      const bw = PCIE.bw(gen, lanes);

    src: `    li   t0, 0x41000000      # 8.0f: eight squares across

  function slider(label, min, max, step, value, fmt, onChange) {

    b.addEventListener('click', () => {
      const t = getText();
      const ok = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); };
      const fallback = () => {
        const pre = b.closest('.panel') && b.closest('.panel').querySelector('pre');
        if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = 'Selected: copy it'; }
      };
      try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
    });
    return b;
  }
  function codePanel(title, text) {
    return h('div', { class: 'panel' }, h('div', { class: 'row' }, h('h3', { class: 'grow' }, title), copyBtn(() => text)), h('pre', { class: 'code' }, text));
  }
  function textarea(id, value, rows) {
    return h('textarea', { class: 'code', id, spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', rows: rows || 14, 'aria-label': 'assembly source' }, value);
  }
  function runButton(fn) {
    const b = h('button', { class: 'btn primary small', type: 'button' }, U.icon('play'), 'Run');
    b.addEventListener('click', fn);
    return b;
  }
  function lab(id, title, icon, blurb, render) { T.labs[id] = { id, title, icon, blurb, render }; T.labOrder.push(id); }

  /* =========================================================
     Rasterizer
     ========================================================= */
  const RPRESETS = {
    basic: ['A triangle', 8, [[1.2, 0.7], [7.1, 2.4], [2.6, 7.3]]],
    shared: ['Two triangles sharing an edge', 8, [[0.5, 0.5], [6.5, 0.5], [0.5, 6.5]], [[6.5, 0.5], [6.5, 6.5], [0.5, 6.5]]],
    sliver: ['A thin sliver', 12, [[0.6, 1.3], [11.4, 3.1], [1.3, 2.4]]],
    big: ['A bigger one (16 × 16)', 16, [[2.2, 1.4], [14.6, 5.2], [5.3, 14.7]]],
    ccw: ['Counter-clockwise winding', 8, [[1.2, 0.7], [2.6, 7.3], [7.1, 2.4]]]
  };
  lab('raster', 'Rasterizer', 'tri', 'Move the vertices and watch which pixel centres fall inside. Switch on edge-function values, barycentric colours, 4× MSAA samples and the fill rule.', root => {
    const st = { mode: 'cover', rule: 'topleft', edge: 0, pick: 0 };
    let n = 8, tri = RPRESETS.basic[2].map(p => p.slice()), tri2 = null;
    const fig = h('div', { class: 'fig-box' });
    const stats = h('div', { class: 'stats tight' });
    const eqs = h('div');
    const inputs = h('div', { class: 'vin' });
    function buildInputs() {
      U.clear(inputs);
      tri.forEach((p, i) => [0, 1].forEach(k => {
        const inp = h('input', { class: 'txt num-in', type: 'number', step: 0.1, value: p[k], 'aria-label': 'v' + i + (k ? ' y' : ' x') });
        inp.addEventListener('input', () => { const v = Number(inp.value); if (inp.value !== '' && !isNaN(v)) { tri[i][k] = Math.max(-n, Math.min(2 * n, v)); draw(); } });
        inputs.appendChild(h('label', { class: 'vin-cell' }, h('span', null, 'v' + i + '.' + (k ? 'y' : 'x')), inp));
      }));
    }
    function drawPair() {
      const c1 = GFX.coverage(tri.map(p => ({ x: p[0], y: p[1] })), n, st.rule), c2 = GFX.coverage(tri2.map(p => ({ x: p[0], y: p[1] })), n, st.rule);
      let dbl = 0;
      const svg = V.pixgrid({
        w: n, h: n, tri, click: true, label: 'two triangles sharing an edge',
        fill: (x, y) => { const k = x + ',' + y, a = c1.has(k), b = c2.has(k); if (a && b) { dbl++; return 'var(--bad-2)'; } return a ? 'var(--brand-2)' : b ? 'var(--f-op-2)' : null; },
        centers: (x, y) => c1.has(x + ',' + y) || c2.has(x + ',' + y),
        text: (x, y) => (c1.has(x + ',' + y) && c2.has(x + ',' + y) ? '2×' : '')
      });
      const cell = Math.min(42, Math.floor(332 / n));
      svg.appendChild(s('polygon', { points: tri2.map(p => (16 + p[0] * cell) + ',' + (13 + p[1] * cell)).join(' '), style: 'fill:none;stroke:var(--ok);stroke-width:2;stroke-dasharray:5 3' }));
      fig.appendChild(svg);
      const total = c1.size + c2.size - dbl;
      stats.appendChild(stat('first triangle', c1.size));
      stats.appendChild(stat('second triangle', c2.size));
      stats.appendChild(stat('drawn twice', dbl, dbl ? 'badc' : 'good'));
      stats.appendChild(stat('pixels in the square', total + ' of 36', total === 36 && !dbl ? 'good' : ''));
      eqs.appendChild(h('p', { class: 'muted small' }, 'The shared diagonal passes exactly through pixel centres. The inclusive rule draws those pixels twice (with blending you would see a seam); the strict rule leaves them, and the square’s top and left rows, empty. The top-left rule gives every pixel to exactly one triangle.'));
    }
    function draw() {
      U.clear(fig); U.clear(stats); U.clear(eqs);
      if (tri2) { drawPair(); return; }
      const T1 = tri.map(p => ({ x: p[0], y: p[1] }));
      const r = GFX.rasterize(T1, { w: n, h: n, rule: st.rule, samples: st.mode === 'msaa' ? 4 : 1 });
      fig.appendChild(V.raster({ tri, n, mode: st.mode, rule: st.rule, edge: st.edge, click: true, showBox: st.mode === 'bbox' }));
      stats.appendChild(stat('area (px²)', f2(Math.abs(r.area))));
      stats.appendChild(stat('winding', r.degenerate ? 'none' : r.cw ? 'clockwise' : 'counter-cw'));
      stats.appendChild(stat('pixels tested', r.tested));
      stats.appendChild(stat('covered', st.mode === 'msaa' ? r.samplesCovered + ' samples' : r.covered, 'good'));
      if (r.edges.length) {
        eqs.appendChild(V.figure(V.htmlTable({ head: ['Edge', 'A (step →)', 'B (step ↓)', 'C', 'Top or left?'], rows: r.edges.map((e, i) => ['E' + i + ': v' + e.from + '→v' + e.to, f2(e.A), f2(e.B), f2(e.C), e.topLeft ? 'yes' : 'no']), mono: [1, 2, 3] }), 'E(x, y) = A·x + B·y + C at each pixel centre (x + 0.5, y + 0.5). Vertices snap to 1/16 pixel first, as in real rasterizers. Edges are listed after the winding is made clockwise.', { flush: true }));
      } else eqs.appendChild(h('p', { class: 'muted small' }, 'Zero area: the three vertices are in a line, so no pixel is covered.'));
    }
    fig.addEventListener('click', e => {
      const g = e.target.closest('[data-id]');
      if (!g) return;
      const m = /^p(\d+)_(\d+)$/.exec(g.getAttribute('data-id') || '');
      if (!m) return;
      tri[st.pick] = [Number(m[1]) + 0.5, Number(m[2]) + 0.5];
      buildInputs(); draw();
    });
    const presetSel = select('ras-preset', Object.keys(RPRESETS).map(k => [k, RPRESETS[k][0]]), 'basic', v => {
      n = RPRESETS[v][1]; tri = RPRESETS[v][2].map(p => p.slice()); tri2 = RPRESETS[v][3] ? RPRESETS[v][3].map(p => p.slice()) : null;
      buildInputs(); draw();
    });
    root.appendChild(panel(null,
      field('Triangle', presetSel),
      row('View', seg([['cover', 'Cover'], ['colors', 'Colour'], ['edge', 'Edge'], ['msaa', 'MSAA'], ['bbox', 'Box']], st.mode, v => { st.mode = v; draw(); }, 'text')),
      row('Edge', seg([[0, 'E0'], [1, 'E1'], [2, 'E2']], 0, v => { st.edge = v; draw(); })),
      row('Fill rule', seg([['topleft', 'Top-left'], ['both', 'Inclusive'], ['none', 'Strict']], st.rule, v => { st.rule = v; draw(); }, 'text')),
      row('A tap moves', seg([[0, 'v0'], [1, 'v1'], [2, 'v2']], 0, v => { st.pick = v; })),
      inputs));
    root.appendChild(V.figure(fig, 'Dots are pixel centres (dark = inside). Tap a pixel to move the chosen vertex to its centre, or type exact coordinates above.'));
    root.appendChild(stats);
    root.appendChild(eqs);
    buildInputs(); draw();
  });

  /* =========================================================

  lab('transform', '3D pipeline', 'cube', 'Spin a cube through the model, view and projection matrices into pixels, with back-face culling, near-plane clipping and a depth buffer.', root => {
    const st = { rx: 20, ry: 30, dist: 4.5, fov: 60, near: 0.5, cull: true, depth: true, corner: 6 };
    const img = h('div', { class: 'fig-box center' });
    const stats = h('div', { class: 'stats tight' });
    const tbl = h('div');
    function draw() {
      U.clear(img);
      const cv = V.cube({ rx: st.rx, ry: st.ry, dist: st.dist, fov: st.fov, near: st.near, cull: st.cull, depth: st.depth });
      img.appendChild(cv);
      const sx = cv.stats;
      U.clear(stats);
      stats.appendChild(stat('triangles', sx.tris));
      stats.appendChild(stat('culled', sx.culled));
      stats.appendChild(stat('clipped', sx.clipped));
      stats.appendChild(stat('pixels written', sx.pixels, 'good'));
      stats.appendChild(stat('failed depth test', sx.depthFail));
      const M = GFX.m4.mul(GFX.m4.rotY(st.ry * Math.PI / 180), GFX.m4.rotX(st.rx * Math.PI / 180));
      const Vw = GFX.m4.translate(0, 0, -st.dist);
      const P = GFX.m4.perspective(st.fov * Math.PI / 180, 4 / 3, st.near, 50, 'vk');
      const p = GFX.vertexStages(GFX.CUBE.pos[st.corner], M, Vw, P, { w: 128, h: 96 }, 'vk');
      const f = a => '(' + a.map(v => (Math.abs(v) > 999 ? v.toExponential(1) : v.toFixed(2))).join(', ') + ')';
      const clipped = p.clip[2] < 0;
      const scr = [(p.ndc[0] + 1) / 2 * 128, (1 - p.ndc[1]) / 2 * 96, p.ndc[2]];
      U.clear(tbl);
      tbl.appendChild(V.figure(V.htmlTable({
        head: ['Space', 'Corner ' + st.corner], mono: [1], rows: [
          ['object', f(p.obj.slice(0, 3))], ['world = M · object', f(p.world.slice(0, 3))], ['view = V · world', f(p.view.slice(0, 3))], ['clip = P · view', f(p.clip)],
          ['NDC = clip ÷ w', clipped ? 'closer than the near plane: clipped away' : f(p.ndc)],
          ['framebuffer (128 × 96)', clipped ? '—' : '(' + scr[0].toFixed(1) + ', ' + scr[1].toFixed(1) + '), depth ' + scr[2].toFixed(3)]]
      }), 'One cube corner through every space. In clip space, w is the corner’s distance in front of the camera.', { flush: true }));
    }
    root.appendChild(panel(null,
      slider('Rotate about x', -180, 180, 1, st.rx, v => v + '°', v => { st.rx = v; draw(); }),
      slider('Rotate about y', -180, 180, 1, st.ry, v => v + '°', v => { st.ry = v; draw(); }),
      slider('Camera distance', 1.2, 10, 0.1, st.dist, v => v.toFixed(1), v => { st.dist = v; draw(); }),
      slider('Field of view', 20, 120, 1, st.fov, v => v + '°', v => { st.fov = v; draw(); }),
      slider('Near plane', 0.1, 3, 0.05, st.near, v => v.toFixed(2), v => { st.near = v; draw(); }),
      row('Back faces', seg([[true, 'Culled'], [false, 'Drawn']], true, v => { st.cull = v; draw(); }, 'text')),
      row('Depth test', seg([[true, 'On'], [false, 'Off']], true, v => { st.depth = v; draw(); }, 'text')),
      field('Follow corner', select('xf-corner', GFX.CUBE.pos.map((q, i) => [i, i + ': (' + q.join(', ') + ')']), st.corner, v => { st.corner = Number(v); draw(); }))));
    root.appendChild(V.figure(img, 'Rendered at 128 × 96 by this course’s own rasterizer. Move the camera inside the cube to see near-plane clipping; turn off the depth test and the last face drawn wins.'));
    root.appendChild(stats);
    root.appendChild(tbl);
    draw();

  lab('shader', 'Shader core (SIMT)', 'shader', 'Write a RISC-V fragment shader. Every covered pixel runs it as one lane, and 8 lanes form a warp that issues one instruction at a time. Watch divergence eat lane utilisation.', root => {
    let key = 'checker', tex = 'checker';
    const ta = textarea('sh-src', SHADER_PRESETS[key].src, 16);
    const blurb = h('p', { class: 'muted small' }, SHADER_PRESETS[key].blurb);
    const out = h('div', { class: 'stack' });
    const run = () => {
      U.clear(out);
      const box = V.shaderRun({ src: ta.value, tex });
      out.appendChild(V.figure(box, 'The triangle at 48 × 48. Lane utilisation = useful lane-instructions ÷ (warp instructions × 8).'));
      if (box.result && box.result.ok && box.result.stats.warps) out.appendChild(V.figure(V.simtViz({ src: ta.value, tex }), 'The most divergent full warp: each row is one issued instruction. Coloured lanes did work; grey lanes sat masked off.'));
    };
    const sel = select('sh-preset', Object.keys(SHADER_PRESETS).map(k => [k, SHADER_PRESETS[k].name]), key, v => { key = v; ta.value = SHADER_PRESETS[v].src; blurb.textContent = SHADER_PRESETS[v].blurb; run(); });
    root.appendChild(panel(null, h('div', { class: 'ctrl-row' }, field('Shader', sel), runButton(run)), blurb,
      field('Texture used by tex', select('sh-tex', [['checker', 'Checker 8×8'], ['bricks', 'Bricks 16×16'], ['uv', 'UV gradient'], ['stripes', 'Stripes']], tex, v => { tex = v; run(); })),
      ta, h('p', { class: 'faint small' }, 'Inputs: a0 = x, a1 = y, a2 = lane number; fa0–fa2 = barycentric weights; fa3 = u, fa4 = v; fa5 = depth. Outputs: fa0–fa2 = red, green, blue from 0.0 to 1.0. End with ret. RV32IMF plus tex rd, fu, fv.')));
    root.appendChild(out);

  });

  /* =========================================================
     Latency hiding and occupancy
     ========================================================= */
  lab('warps', 'Latency hiding', 'pipe', 'One scheduler, many warps: while one waits hundreds of cycles for memory, the others issue. Find how many warps keep the core busy, and how registers limit them.', root => {
    const st = { warps: 3, alu: 4, latency: 24, regs: 32 };
    const fig = h('div', { class: 'fig-box' });
    const stats = h('div', { class: 'stats tight' });
    const occ = h('div', { class: 'fig-box' });
    function draw() {
      U.clear(fig);
      const svg = V.warpsViz({ warps: st.warps, alu: st.alu, latency: st.latency, cycles: 80 });
      fig.appendChild(svg);
      U.clear(stats);
      stats.appendChild(stat('issue slots used', Math.round(svg.utilization * 100) + '%', svg.utilization > 0.95 ? 'good' : ''));
      stats.appendChild(stat('warps needed', GPU.warpsNeeded(st.alu, st.latency)));
      U.clear(occ);
      const o = GPU.occupancy({ regs: st.regs, rf: 65536, warp: 32, maxWarps: 48 });
      occ.appendChild(V.occupancyViz({ regs: st.regs, rf: 65536, warp: 32, maxWarps: 48 }));
      occ.appendChild(h('p', { class: 'muted small' }, o.warps + ' resident warps hide a memory latency of about ' + (o.warps * (st.alu + 1) - st.alu - 1) + ' cycles when each does ' + st.alu + ' ALU instructions per load.'));
    }
    root.appendChild(panel(null,
      slider('Resident warps', 1, 12, 1, st.warps, v => String(v), v => { st.warps = v; draw(); }),
      slider('ALU instructions per load', 1, 16, 1, st.alu, v => String(v), v => { st.alu = v; draw(); }),
      slider('Memory latency', 4, 60, 1, st.latency, v => v + ' cycles', v => { st.latency = v; draw(); })));
    root.appendChild(V.figure(fig, 'Greedy scheduling: a warp keeps issuing until it waits on memory, then the oldest ready warp takes over. Warps needed = ⌈(ALU + 1 + latency) ÷ (ALU + 1)⌉.'));
    root.appendChild(stats);
    root.appendChild(panel('Occupancy', slider('Registers per thread', 16, 255, 1, st.regs, v => String(v), v => { st.regs = v; draw(); }), occ,
      h('p', { class: 'muted small' }, 'Every resident warp keeps its registers in the register file at once. A shader that needs more registers leaves room for fewer warps, and fewer warps hide less latency.')));
    draw();
  });

  /* =========================================================

     ========================================================= */
  lab('texture', 'Texture unit', 'grid', 'Sample a texture with nearest or bilinear filtering, walk down the mip chain, and compare cache misses for linear and tiled layouts.', root => {
    const st = { tex: 'checker', filter: 'bilinear', u: 0.3, v: 0.42, pattern: 'column', tpp: 1 };
    const fig = h('div', { class: 'fig-box' });
    const mips = h('div', { class: 'fig-box' });
    const cache = h('div', { class: 'stats tight' });
    const lod = h('div', { class: 'stats tight' });
    function drawTex() { U.clear(fig); fig.appendChild(V.texfilter({ tex: st.tex, u: st.u, v: st.v, filter: st.filter })); }
    function drawLod() {
      U.clear(lod);
      const L = Math.log2(Math.max(1e-6, st.tpp));
      const lvl = L <= 0 ? '0 (magnified)' : Math.abs(L - Math.round(L)) < 0.01 ? String(Math.round(L)) : Math.floor(L) + ' and ' + Math.ceil(L) + ' (trilinear)';
      lod.appendChild(stat('LOD: log2 of texels per pixel', L.toFixed(2)));
      lod.appendChild(stat('mip level read', lvl));
    }
    function drawCache() {
      U.clear(cache);
      const lin = GFX.texWalk({ layout: 'linear', pattern: st.pattern, lines: 8 }), til = GFX.texWalk({ layout: 'tiled', pattern: st.pattern, lines: 8 });
      cache.appendChild(stat('linear: miss rate', Math.round(lin.missRate * 100) + '%'));
      cache.appendChild(stat('4×4 tiles: miss rate', Math.round(til.missRate * 100) + '%', til.missRate < lin.missRate ? 'good' : ''));
    }
    root.appendChild(panel(null,
      field('Texture', select('tx-tex', [['checker', 'Checker 8×8'], ['bricks', 'Bricks 16×16'], ['uv', 'UV gradient 16×16'], ['stripes', 'Stripes 16×16']], st.tex, v => { st.tex = v; drawTex(); })),
      row('Filter', seg([['nearest', 'Nearest'], ['bilinear', 'Bilinear']], st.filter, v => { st.filter = v; drawTex(); }, 'text')),
      slider('u', 0, 1, 0.005, st.u, v => v.toFixed(3), v => { st.u = v; drawTex(); }),
      slider('v', 0, 1, 0.005, st.v, v => v.toFixed(3), v => { st.v = v; drawTex(); })));
    root.appendChild(V.figure(fig, 'The red dot is the sample point. Bilinear filtering blends the four nearest texel centres with the weights shown.'));
    mips.appendChild(V.mips({ tex: 'bricks', size: 256 }));
    root.appendChild(panel('Mipmaps', mips, slider('Texels per screen pixel', 0.25, 64, 0.25, st.tpp, v => v.toFixed(2), v => { st.tpp = v; drawLod(); }), lod,
      h('p', { class: 'muted small' }, 'When a texture is far away, many texels land in one pixel and point sampling shimmers. The texture unit reads a pre-shrunk level instead: level λ has 2^λ texels per pixel.')));
    root.appendChild(panel('Texture cache', row('Walk', seg([['row', 'Along rows'], ['column', 'Down columns'], ['diagonal', 'Diagonal']], st.pattern, v => { st.pattern = v; drawCache(); }, 'text')), cache,
      h('p', { class: 'muted small' }, 'An 8-line cache with 64-byte lines. A linear layout puts 16 texels of one row in each line; 4 × 4 tiling puts a small square in each line, so walks in any direction reuse it.'),
      V.figure(V.mortonViz({ n: 8 }), 'Morton (Z) order interleaves the bits of x and y, so nearby texels get nearby addresses in both directions.')));
    drawTex(); drawLod(); drawCache();
  });

  /* =========================================================
     Memory bandwidth
     ========================================================= */
  const MEMTYPES = { gddr6_14: ['GDDR6, 14 Gbit/s per pin', 14, 32, 'GDDR6'], gddr6_18: ['GDDR6, 18 Gbit/s', 18, 32, 'GDDR6'], gddr6_20: ['GDDR6, 20 Gbit/s', 20, 32, 'GDDR6'], gddr7_28: ['GDDR7, 28 Gbit/s', 28, 32, 'GDDR7'], gddr7_32: ['GDDR7, 32 Gbit/s', 32, 32, 'GDDR7'], hbm3: ['HBM3, 6.4 Gbit/s (1024-bit stacks)', 6.4, 1024, 'HBM3'] };
  lab('memory', 'Memory bandwidth', 'mem', 'Pick a VRAM type and bus width, then a resolution, frame rate and overdraw, and see whether memory can feed the frame.', root => {
    const st = { mem: 'gddr6_18', bus: 128, res: '2160', fps: 120, overdraw: 4, msaa: 1, comp: 1.5, tex: 16 };
    const fig = h('div', { class: 'fig-box' });
    const chart = h('div', { class: 'fig-box' });
    const stats = h('div', { class: 'stats tight' });
    const busBox = h('div');
    function busOptions() {
      return MEMTYPES[st.mem][2] === 1024 ? [[1024, '1 stack (1024-bit)'], [2048, '2 stacks'], [4096, '4 stacks']] : [[64, '64-bit'], [128, '128-bit'], [192, '192-bit'], [256, '256-bit'], [320, '320-bit'], [384, '384-bit'], [512, '512-bit']];
    }
    function rebuildBus() {
      const opts = busOptions();
      if (!opts.some(o => o[0] === st.bus)) st.bus = opts[opts.length > 2 ? 1 : 0][0];
      U.clear(busBox); busBox.appendChild(field('Bus width', select('mem-bus', opts, st.bus, v => { st.bus = Number(v); draw(); })));
    }
    function draw() {
      const m = MEMTYPES[st.mem];
      U.clear(fig); fig.appendChild(V.membus({ bus: st.bus, gbps: m[1], type: m[3], chipBits: m[2] }));
      const [w, hh] = CARD.RES[st.res];
      const fb = GPU.frameBytes({ w, h: hh, overdraw: st.overdraw, msaa: st.msaa, compression: st.comp, tex: st.tex });
      const k = st.fps / 1e9, need = fb.total * k, have = st.bus * m[1] / 8;
      U.clear(chart);
      chart.appendChild(V.stackBars({
        bars: [{ label: 'needed', parts: [{ v: fb.color * k, color: 'var(--f-f3)' }, { v: fb.depth * k, color: 'var(--f-rd)' }, { v: fb.tex * k, color: 'var(--f-op)' }, { v: fb.scanout * k, color: 'var(--f-f7)' }] }, { label: 'available', parts: [{ v: have, color: 'var(--brand)' }] }],
        unit: ' GB/s', fmt: v => v.toFixed(0), lw: 70, legend: [['colour', 'var(--f-f3)'], ['depth', 'var(--f-rd)'], ['textures', 'var(--f-op)'], ['scanout', 'var(--f-f7)']]
      }));
      U.clear(stats);
      stats.appendChild(stat('VRAM bandwidth', have.toFixed(0) + ' GB/s'));
      stats.appendChild(stat('this workload', need.toFixed(1) + ' GB/s'));
