      items: [
        { t: 'learn', h: 'Escaping the ball grid', body: 'The GPU sits on a **BGA** package: a grid of well over a thousand solder balls underneath. Signals escape the grid through **vias**, plated holes between layers. **Via-in-pad** puts vias directly under the balls.', viz: { k: 'stackup', hl: [0, 2], cap: 'A signal dropping from layer 1 to layer 3 through a via leaves an unused stub below layer 3, unless it is drilled out.' } },
        { t: 'learn', h: 'Stubs resonate', body: 'A through-hole via that only goes from layer 1 to layer 3 still has copper all the way down. That **stub** resonates at f ≈ 1 ÷ (4 × its delay) and notches out high frequencies. Fast boards **back-drill** the stubs away or use blind and buried vias.' },
        { t: 'num', q: 'A 1.5 mm via stub has a delay of 10 ps. At about what frequency does it resonate, f = 1 ÷ (4 × delay)? (GHz)', a: 25, tol: 0.5, unit: 'GHz', why: '1 ÷ 40 ps = 25 GHz: right where PCIe Gen 5 and 6 signals have energy.' },
        { t: 'mcq', q: 'What is back-drilling?', opts: ['Drilling out the unused part of a via', 'Drilling holes for screws', 'Repairing a broken trace', 'Cooling a via'], a: 0, why: 'A slightly larger drill removes the plating below the last used layer.' },
        { t: 'tf', q: 'A BGA package connects to the board through solder balls on its underside.', a: true, why: 'Ball grid array: the whole underside is used for connections.' },
        { t: 'mcq', q: 'Why are vias a concern for 32 GT/s signals?', opts: ['Their stubs and impedance changes reflect and resonate', 'They are too short', 'They carry power', 'They block airflow'], a: 0, why: 'At these speeds every millimetre of discontinuity matters.' }

        { t: 'mcq', q: 'Which changes does the VRM’s control loop handle best?', opts: ['Slow ones, over microseconds and longer', 'Nanosecond spikes', 'Display timing', 'PCIe errors'], a: 0, why: 'Its bandwidth is far too low for nanosecond steps.' }

        { t: 'learn', h: 'From 12 V to a working card', body: 'Power-on follows a strict order, run mostly by the management core.', viz: { k: 'chain', items: [['12 V arrives; VRMs ramp the rails in order', 'power sequencing', 'f3'], ['management core leaves reset, runs its boot ROM', 'mask ROM', 'imm'], ['boot ROM verifies and loads firmware from flash', 'signed images', 'imm'], ['GDDR training', 'per-pin timing and voltage', 'rs2'], ['PCIe link training', '2.5 GT/s first, then faster', 'f7'], ['host firmware finds the card and runs its option ROM', 'boot screen', 'op']] } },
        { t: 'learn', h: 'Why train memory?', body: 'At 18+ Gbit/s per pin, every board and every chip differs slightly. Training sends known patterns and checks what comes back, to find for each pin **when** to sample (read and write timing) and **where** (the voltage reference). Results can be stored in flash to speed up later boots.', viz: { k: 'eye', loss: 0.45, jitter: 0.05, noise: 0.04, cap: 'Training looks for the centre of each pin’s eye.' } },

        { t: 'mcq', q: 'An option ROM image starts with which two bytes?', opts: ['55 AA', '7F 45', '4D 5A', 'AA 55'], a: 0, why: 'The signature 0xAA55 stored little-endian. 7F 45 starts ELF files and 4D 5A (“MZ”) Windows executables.' },
        { t: 'mcq', q: 'Code type 3 in the PCI Data Structure means…', opts: ['a UEFI image', 'x86 legacy BIOS code', 'Open Firmware', 'a RISC-V ELF file'], a: 0, why: '0 = x86 BIOS, 1 = Open Firmware, 2 = PA-RISC, 3 = UEFI.' },

        { t: 'mcq', q: 'What does GOP give a boot loader?', opts: ['A framebuffer address, a list of modes and Blt', 'A 3D API', 'Only the EDID', 'A network stack'], a: 0, why: 'Just enough to draw pixels before any GPU driver exists.' },

        { t: 'learn', h: 'Power limits', body: 'Board power is measured with small **shunt resistors** on each 12 V input: the voltage across them is proportional to the current. If a game would push the card past its rating, firmware steps the voltage and clock down within milliseconds.' },
        { t: 'mcq', q: 'What does a power limit do?', opts: ['Lowers clocks when measured board power exceeds the rating', 'Turns the card off', 'Only speeds up the fan', 'Changes the PCIe width'], a: 0, why: 'It keeps the card inside its connector and cooler ratings.' },
        { t: 'num', q: 'A 1 mΩ shunt carries 25 A. What voltage appears across it? (mV)', a: 25, unit: 'mV', why: 'V = I × R = 25 × 0.001 = 0.025 V.' },

        { t: 'order', q: 'Order the probe steps.', items: ['pcim_enable_device(): power up, enable BAR decoding', 'pci_set_master(): allow DMA', 'dma_set_mask_and_coherent(): declare reachable addresses', 'pci_iomap(): map the register BAR', 'request_firmware(): load the command-processor image'], why: 'After this, the driver starts the firmware and registers with DRM.' },

      items: [
        { t: 'learn', h: 'Buffer objects', body: 'User space never sees raw VRAM addresses. It asks the driver for **buffer objects (BOs)** through ioctls and gets back a **GEM handle**. Drivers for cards with their own VRAM (amdgpu, nouveau, xe) use **TTM** to decide where each BO lives, VRAM or system memory, and to **evict** BOs when VRAM fills.', viz: { k: 'chain', items: [['app: vkAllocateMemory', 'user space', 'rd'], ['user-mode driver: GEM create ioctl', 'user space', 'rd'], ['kernel: TTM places the BO in VRAM', 'kernel', 'f3'], ['GPU page tables map it', 'kernel', 'f3'], ['handle returned to the app', '', 'op']] } },

        { t: 'mcq', q: 'A shader touches an unmapped GPU address. What happens?', opts: ['A GPU page fault: the driver logs it and usually stops that context', 'Nothing at all', 'The PC reboots', 'The monitor turns off'], a: 0, why: 'Faults are reported to the kernel driver, which isolates the offender.' },
        { t: 'tf', q: 'Separate processes using the GPU get separate GPU address spaces.', a: true, why: 'Each has its own page tables, switched when its work runs.' }

        { t: 'learn', h: 'From ioctl to ring', body: 'A submit ioctl hands the kernel a list of command buffers (already in GPU memory) and the buffers they use. The **DRM scheduler** waits for the job’s dependency fences, then the driver writes a small packet into the ring that **points at** the command buffer, rings the doorbell, and returns a fence for the job.', viz: { k: 'chain', items: [['user-mode driver records a command buffer', 'in a GPU buffer', 'rd'], ['submit ioctl: command buffer + buffer list', 'kernel', 'f3'], ['drm_sched waits for dependency fences', '', 'f3'], ['driver writes an indirect-buffer packet to the ring', 'doorbell', 'f3'], ['command processor runs the command buffer', 'GPU', 'op'], ['fence signals; waiters wake', '', 'op']] } },

        { t: 'mcq', q: 'What happens when a job hangs?', opts: ['The timeout handler resets the GPU or queue and recovers', 'The PC reboots', 'It waits forever', 'The game is uninstalled'], a: 0, why: 'Recovery keeps one bad shader from freezing the whole desktop.' }

        { t: 'tf', q: 'With atomic modesetting, a state that fails its checks leaves the current display untouched.', a: true, why: 'Compositors can even test a state first with DRM_MODE_ATOMIC_TEST_ONLY.' },
        { t: 'mcq', q: 'A hardware cursor is usually…', opts: ['a small extra plane blended by the CRTC', 'drawn by the fragment shader every frame', 'a separate monitor', 'part of the EDID'], a: 0, why: 'Moving it only changes the plane’s position, with no redraw.' }

    {

      ref: 'Linux kernel docs, Runtime Power Management Framework for I/O Devices; PCI Express Base Specification (device power states D0–D3).',

  /* ---------------- boot ---------------- */
  function start(data) {
    Store.load();
    indexCourse();
    buildShell(document.getElementById('app'));
    let tab = (data && data.tab) || 'learn';
    const hash = (location.hash || '').slice(1);
    if (['learn', 'lab', 'practice', 'ref', 'me'].includes(hash)) tab = hash;
    else if (T.labs[hash]) { tab = 'lab'; App.labId = hash; }
    if (data && data.lab) App.labId = data.lab;
    go(tab, App.labId);
    Store.on(() => { renderTop(); if (!App.player && (App.tab === 'learn' || App.tab === 'me' || App.tab === 'practice')) render(); });
    Store.initRemote();
    if (data && data.lesson && App.lessons[data.lesson]) openLesson(data.lesson);
  }
