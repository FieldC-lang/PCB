  const stat = (label, value, cls) => h('div', { class: 'stat' + (cls ? ' ' + cls : '') }, h('div', { class: 'v' }, String(value)), h('div', { class: 'l' }, label));
  const row = (label, ctl) => h('div', { class: 'ctrl-row' }, h('span', { class: 'small muted' }, label), ctl);
  function slider(label, min, max, step, value, fmt, onChange) {
    const out = h('span', { class: 'slider-val' }, fmt(value));
    const r = h('input', { type: 'range', class: 'scrub', min, max, step, value, 'aria-label': label });
    r.addEventListener('input', () => { const v = Number(r.value); out.textContent = fmt(v); onChange(v); });
    return h('label', { class: 'slider' }, h('span', { class: 'slider-top' }, h('span', { class: 'slider-label' }, label), out), r);
  }
  function copyBtn(getText) {
    const b = h('button', { class: 'btn small ghost', type: 'button' }, 'Copy');
    b.addEventListener('click', () => {
      const t = getText();
      const ok = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); };
      const fallback = () => {
        const pre = b.closest('.panel') && b.closest('.panel').querySelector('pre');
        if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = 'Selected: copy it'; }
      };
      try { navigator.clipboard.writeText(t).then(ok, fallback); } catch (e) { fallback(); }
    });
    return b;
  }
  function codePanel(title, text) {
    return h('div', { class: 'panel' }, h('div', { class: 'row' }, h('h3', { class: 'grow' }, title), copyBtn(() => text)), h('pre', { class: 'code' }, text));
  }
  function textarea(id, value, rows) {
    return h('textarea', { class: 'code', id, spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', rows: rows || 14, 'aria-label': 'assembly source' }, value);
  }
  function runButton(fn) {
    const b = h('button', { class: 'btn primary small', type: 'button' }, U.icon('play'), 'Run');
    b.addEventListener('click', fn);
    return b;
  }
  function lab(id, title, icon, blurb, render) { T.labs[id] = { id, title, icon, blurb, render }; T.labOrder.push(id); }

  /* =========================================================
     Rasterizer
     ========================================================= */
  const RPRESETS = {
    basic: ['A triangle', 8, [[1.2, 0.7], [7.1, 2.4], [2.6, 7.3]]],
    shared: ['Two triangles sharing an edge', 8, [[0.5, 0.5], [6.5, 0.5], [0.5, 6.5]], [[6.5, 0.5], [6.5, 6.5], [0.5, 6.5]]],
    sliver: ['A thin sliver', 12, [[0.6, 1.3], [11.4, 3.1], [1.3, 2.4]]],
    big: ['A bigger one (16 × 16)', 16, [[2.2, 1.4], [14.6, 5.2], [5.3, 14.7]]],
    ccw: ['Counter-clockwise winding', 8, [[1.2, 0.7], [2.6, 7.3], [7.1, 2.4]]]
  };
  lab('raster', 'Rasterizer', 'tri', 'Move the vertices and watch which pixel centres fall inside. Switch on edge-function values, barycentric colours, 4× MSAA samples and the fill rule.', root => {
    const st = { mode: 'cover', rule: 'topleft', edge: 0, pick: 0 };
    let n = 8, tri = RPRESETS.basic[2].map(p => p.slice()), tri2 = null;
    const fig = h('div', { class: 'fig-box' });
    const stats = h('div', { class: 'stats tight' });
    const eqs = h('div');
    const inputs = h('div', { class: 'vin' });
    function buildInputs() {
      U.clear(inputs);
      tri.forEach((p, i) => [0, 1].forEach(k => {
        const inp = h('input', { class: 'txt num-in', type: 'number', step: 0.1, value: p[k], 'aria-label': 'v' + i + (k ? ' y' : ' x') });
        inp.addEventListener('input', () => { const v = Number(inp.value); if (inp.value !== '' && !isNaN(v)) { tri[i][k] = Math.max(-n, Math.min(2 * n, v)); draw(); } });
        inputs.appendChild(h('label', { class: 'vin-cell' }, h('span', null, 'v' + i + '.' + (k ? 'y' : 'x')), inp));
      }));
    }
    function drawPair() {
      const c1 = GFX.coverage(tri.map(p => ({ x: p[0], y: p[1] })), n, st.rule), c2 = GFX.coverage(tri2.map(p => ({ x: p[0], y: p[1] })), n, st.rule);
      let dbl = 0;
      const svg = V.pixgrid({
        w: n, h: n, tri, click: true, label: 'two triangles sharing an edge',
        fill: (x, y) => { const k = x + ',' + y, a = c1.has(k), b = c2.has(k); if (a && b) { dbl++; return 'var(--bad-2)'; } return a ? 'var(--brand-2)' : b ? 'var(--f-op-2)' : null; },
        centers: (x, y) => c1.has(x + ',' + y) || c2.has(x + ',' + y),
        text: (x, y) => (c1.has(x + ',' + y) && c2.has(x + ',' + y) ? '2×' : '')
      });
      const cell = Math.min(42, Math.floor(332 / n));
      svg.appendChild(s('polygon', { points: tri2.map(p => (16 + p[0] * cell) + ',' + (13 + p[1] * cell)).join(' '), style: 'fill:none;stroke:var(--ok);stroke-width:2;stroke-dasharray:5 3' }));
      fig.appendChild(svg);
      const total = c1.size + c2.size - dbl;
      stats.appendChild(stat('first triangle', c1.size));
      stats.appendChild(stat('second triangle', c2.size));
      stats.appendChild(stat('drawn twice', dbl, dbl ? 'badc' : 'good'));
      stats.appendChild(stat('pixels in the square', total + ' of 36', total === 36 && !dbl ? 'good' : ''));
      eqs.appendChild(h('p', { class: 'muted small' }, 'The shared diagonal passes exactly through pixel centres. The inclusive rule draws those pixels twice (with blending you would see a seam); the strict rule leaves them, and the square’s top and left rows, empty. The top-left rule gives every pixel to exactly one triangle.'));
    }
    function draw() {
      U.clear(fig); U.clear(stats); U.clear(eqs);
      if (tri2) { drawPair(); return; }
      const T1 = tri.map(p => ({ x: p[0], y: p[1] }));
      const r = GFX.rasterize(T1, { w: n, h: n, rule: st.rule, samples: st.mode === 'msaa' ? 4 : 1 });
      fig.appendChild(V.raster({ tri, n, mode: st.mode, rule: st.rule, edge: st.edge, click: true, showBox: st.mode === 'bbox' }));
      stats.appendChild(stat('area (px²)', f2(Math.abs(r.area))));
      stats.appendChild(stat('winding', r.degenerate ? 'none' : r.cw ? 'clockwise' : 'counter-cw'));
      stats.appendChild(stat('pixels tested', r.tested));
      stats.appendChild(stat('covered', st.mode === 'msaa' ? r.samplesCovered + ' samples' : r.covered, 'good'));
      if (r.edges.length) {
        eqs.appendChild(V.figure(V.htmlTable({ head: ['Edge', 'A (step →)', 'B (step ↓)', 'C', 'Top or left?'], rows: r.edges.map((e, i) => ['E' + i + ': v' + e.from + '→v' + e.to, f2(e.A), f2(e.B), f2(e.C), e.topLeft ? 'yes' : 'no']), mono: [1, 2, 3] }), 'E(x, y) = A·x + B·y + C at each pixel centre (x + 0.5, y + 0.5). Vertices snap to 1/16 pixel first, as in real rasterizers. Edges are listed after the winding is made clockwise.', { flush: true }));
      } else eqs.appendChild(h('p', { class: 'muted small' }, 'Zero area: the three vertices are in a line, so no pixel is covered.'));
    }
    fig.addEventListener('click', e => {
      const g = e.target.closest('[data-id]');
      if (!g) return;
      const m = /^p(\d+)_(\d+)$/.exec(g.getAttribute('data-id') || '');
      if (!m) return;
      tri[st.pick] = [Number(m[1]) + 0.5, Number(m[2]) + 0.5];
      buildInputs(); draw();
    });
    const presetSel = select('ras-preset', Object.keys(RPRESETS).map(k => [k, RPRESETS[k][0]]), 'basic', v => {
      n = RPRESETS[v][1]; tri = RPRESETS[v][2].map(p => p.slice()); tri2 = RPRESETS[v][3] ? RPRESETS[v][3].map(p => p.slice()) : null;
      buildInputs(); draw();
    });
    root.appendChild(panel(null,
      field('Triangle', presetSel),
      row('View', seg([['cover', 'Cover'], ['colors', 'Colour'], ['edge', 'Edge'], ['msaa', 'MSAA'], ['bbox', 'Box']], st.mode, v => { st.mode = v; draw(); }, 'text')),
      row('Edge', seg([[0, 'E0'], [1, 'E1'], [2, 'E2']], 0, v => { st.edge = v; draw(); })),
      row('Fill rule', seg([['topleft', 'Top-left'], ['both', 'Inclusive'], ['none', 'Strict']], st.rule, v => { st.rule = v; draw(); }, 'text')),
      row('A tap moves', seg([[0, 'v0'], [1, 'v1'], [2, 'v2']], 0, v => { st.pick = v; })),
      inputs));
    root.appendChild(V.figure(fig, 'Dots are pixel centres (dark = inside). Tap a pixel to move the chosen vertex to its centre, or type exact coordinates above.'));
    root.appendChild(stats);
    root.appendChild(eqs);
    buildInputs(); draw();
  });

  /* =========================================================
     3D pipeline
     ========================================================= */
  lab('transform', '3D pipeline', 'cube', 'Spin a cube through the model, view and projection matrices into pixels, with back-face culling, near-plane clipping and a depth buffer.', root => {
    const st = { rx: 20, ry: 30, dist: 4.5, fov: 60, near: 0.5, cull: true, depth: true, corner: 6 };
    const img = h('div', { class: 'fig-box center' });
    const stats = h('div', { class: 'stats tight' });
    const tbl = h('div');
    function draw() {
      U.clear(img);
      const cv = V.cube({ rx: st.rx, ry: st.ry, dist: st.dist, fov: st.fov, near: st.near, cull: st.cull, depth: st.depth });
      img.appendChild(cv);
      const sx = cv.stats;
      U.clear(stats);
      stats.appendChild(stat('triangles', sx.tris));
      stats.appendChild(stat('culled', sx.culled));
      stats.appendChild(stat('clipped', sx.clipped));
      stats.appendChild(stat('pixels written', sx.pixels, 'good'));
      stats.appendChild(stat('failed depth test', sx.depthFail));
      const M = GFX.m4.mul(GFX.m4.rotY(st.ry * Math.PI / 180), GFX.m4.rotX(st.rx * Math.PI / 180));
      const Vw = GFX.m4.translate(0, 0, -st.dist);
      const P = GFX.m4.perspective(st.fov * Math.PI / 180, 4 / 3, st.near, 50, 'vk');
      const p = GFX.vertexStages(GFX.CUBE.pos[st.corner], M, Vw, P, { w: 128, h: 96 }, 'vk');
      const f = a => '(' + a.map(v => (Math.abs(v) > 999 ? v.toExponential(1) : v.toFixed(2))).join(', ') + ')';
      const clipped = p.clip[2] < 0;
      const scr = [(p.ndc[0] + 1) / 2 * 128, (1 - p.ndc[1]) / 2 * 96, p.ndc[2]];
      U.clear(tbl);
      tbl.appendChild(V.figure(V.htmlTable({
        head: ['Space', 'Corner ' + st.corner], mono: [1], rows: [
          ['object', f(p.obj.slice(0, 3))], ['world = M · object', f(p.world.slice(0, 3))], ['view = V · world', f(p.view.slice(0, 3))], ['clip = P · view', f(p.clip)],
          ['NDC = clip ÷ w', clipped ? 'closer than the near plane: clipped away' : f(p.ndc)],
          ['framebuffer (128 × 96)', clipped ? '—' : '(' + scr[0].toFixed(1) + ', ' + scr[1].toFixed(1) + '), depth ' + scr[2].toFixed(3)]]
      }), 'One cube corner through every space. In clip space, w is the corner’s distance in front of the camera.', { flush: true }));
    }
    root.appendChild(panel(null,
      slider('Rotate about x', -180, 180, 1, st.rx, v => v + '°', v => { st.rx = v; draw(); }),
      slider('Rotate about y', -180, 180, 1, st.ry, v => v + '°', v => { st.ry = v; draw(); }),
      slider('Camera distance', 1.2, 10, 0.1, st.dist, v => v.toFixed(1), v => { st.dist = v; draw(); }),
      slider('Field of view', 20, 120, 1, st.fov, v => v + '°', v => { st.fov = v; draw(); }),
      slider('Near plane', 0.1, 3, 0.05, st.near, v => v.toFixed(2), v => { st.near = v; draw(); }),
      row('Back faces', seg([[true, 'Culled'], [false, 'Drawn']], true, v => { st.cull = v; draw(); }, 'text')),
      row('Depth test', seg([[true, 'On'], [false, 'Off']], true, v => { st.depth = v; draw(); }, 'text')),
      field('Follow corner', select('xf-corner', GFX.CUBE.pos.map((q, i) => [i, i + ': (' + q.join(', ') + ')']), st.corner, v => { st.corner = Number(v); draw(); }))));
    root.appendChild(V.figure(img, 'Rendered at 128 × 96 by this course’s own rasterizer. Move the camera inside the cube to see near-plane clipping; turn off the depth test and the last face drawn wins.'));
    root.appendChild(stats);
    root.appendChild(tbl);
    draw();
  });

  /* =========================================================
     Shader core
     ========================================================= */
  lab('shader', 'Shader core (SIMT)', 'shader', 'Write an ARM (A32 + VFP) fragment shader. Every covered pixel runs it as one lane, and 8 lanes form a warp that issues one instruction at a time. Watch divergence eat lane utilisation, and predication win it back.', root => {
    let key = 'checker', tex = 'checker';
    const ta = textarea('sh-src', SHADER_PRESETS[key].src, 16);
    const blurb = h('p', { class: 'muted small' }, SHADER_PRESETS[key].blurb);
    const out = h('div', { class: 'stack' });
    const run = () => {
      U.clear(out);
      const box = V.shaderRun({ src: ta.value, tex });
      out.appendChild(V.figure(box, 'The triangle at 48 × 48. Lane utilisation = useful lane-instructions ÷ (warp instructions × 8).'));
      if (box.result && box.result.ok && box.result.stats.warps) out.appendChild(V.figure(V.simtViz({ src: ta.value, tex }), 'The most divergent full warp: each row is one issued instruction. Coloured lanes did work; grey lanes sat masked off.'));
    };
    const sel = select('sh-preset', Object.keys(SHADER_PRESETS).map(k => [k, SHADER_PRESETS[k].name]), key, v => { key = v; ta.value = SHADER_PRESETS[v].src; blurb.textContent = SHADER_PRESETS[v].blurb; run(); });
    root.appendChild(panel(null, h('div', { class: 'ctrl-row' }, field('Shader', sel), runButton(run)), blurb,
      field('Texture on coprocessor 0', select('sh-tex', [['checker', 'Checker 8×8'], ['bricks', 'Bricks 16×16'], ['uv', 'UV gradient'], ['stripes', 'Stripes']], tex, v => { tex = v; run(); })),
      ta, h('p', { class: 'faint small' }, 'Inputs: r0 = x, r1 = y, r2 = lane number; s0–s2 = barycentric weights; s3 = u, s4 = v; s5 = depth. Outputs: s0–s2 = red, green, blue from 0.0 to 1.0. End with bx lr. A32 + VFPv3; texture unit: mcrr p0, 0, Ru, Rv, c0 then mrc p0, 0, Rt, c0, c0, 0 → 0x00RRGGBB.')));
    root.appendChild(out);
    run();
  });

  /* =========================================================
     Latency hiding and occupancy
     ========================================================= */
  lab('warps', 'Latency hiding', 'pipe', 'One scheduler, many warps: while one waits hundreds of cycles for memory, the others issue. Find how many warps keep the core busy, and how registers limit them.', root => {
    const st = { warps: 3, alu: 4, latency: 24, regs: 32 };
    const fig = h('div', { class: 'fig-box' });
    const stats = h('div', { class: 'stats tight' });
    const occ = h('div', { class: 'fig-box' });
    function draw() {
      U.clear(fig);
      const svg = V.warpsViz({ warps: st.warps, alu: st.alu, latency: st.latency, cycles: 80 });
      fig.appendChild(svg);
      U.clear(stats);
      stats.appendChild(stat('issue slots used', Math.round(svg.utilization * 100) + '%', svg.utilization > 0.95 ? 'good' : ''));
      stats.appendChild(stat('warps needed', GPU.warpsNeeded(st.alu, st.latency)));
      U.clear(occ);
      const o = GPU.occupancy({ regs: st.regs, rf: 65536, warp: 32, maxWarps: 48 });
      occ.appendChild(V.occupancyViz({ regs: st.regs, rf: 65536, warp: 32, maxWarps: 48 }));
      occ.appendChild(h('p', { class: 'muted small' }, o.warps + ' resident warps hide a memory latency of about ' + (o.warps * (st.alu + 1) - st.alu - 1) + ' cycles when each does ' + st.alu + ' ALU instructions per load.'));
    }
    root.appendChild(panel(null,
      slider('Resident warps', 1, 12, 1, st.warps, v => String(v), v => { st.warps = v; draw(); }),
      slider('ALU instructions per load', 1, 16, 1, st.alu, v => String(v), v => { st.alu = v; draw(); }),
      slider('Memory latency', 4, 60, 1, st.latency, v => v + ' cycles', v => { st.latency = v; draw(); })));
    root.appendChild(V.figure(fig, 'Greedy scheduling: a warp keeps issuing until it waits on memory, then the oldest ready warp takes over. Warps needed = ⌈(ALU + 1 + latency) ÷ (ALU + 1)⌉.'));
    root.appendChild(stats);
    root.appendChild(panel('Occupancy', slider('Registers per thread', 16, 255, 1, st.regs, v => String(v), v => { st.regs = v; draw(); }), occ,
      h('p', { class: 'muted small' }, 'Every resident warp keeps its registers in the register file at once. A shader that needs more registers leaves room for fewer warps, and fewer warps hide less latency.')));
    draw();
  });

  /* =========================================================
     Texture unit
     ========================================================= */
  lab('texture', 'Texture unit', 'grid', 'Sample a texture with nearest or bilinear filtering, walk down the mip chain, and compare cache misses for linear and tiled layouts.', root => {
    const st = { tex: 'checker', filter: 'bilinear', u: 0.3, v: 0.42, pattern: 'column', tpp: 1 };
    const fig = h('div', { class: 'fig-box' });
    const mips = h('div', { class: 'fig-box' });
    const cache = h('div', { class: 'stats tight' });
    const lod = h('div', { class: 'stats tight' });
    function drawTex() { U.clear(fig); fig.appendChild(V.texfilter({ tex: st.tex, u: st.u, v: st.v, filter: st.filter })); }
    function drawLod() {
      U.clear(lod);
      const L = Math.log2(Math.max(1e-6, st.tpp));
      const lvl = L <= 0 ? '0 (magnified)' : Math.abs(L - Math.round(L)) < 0.01 ? String(Math.round(L)) : Math.floor(L) + ' and ' + Math.ceil(L) + ' (trilinear)';
      lod.appendChild(stat('LOD: log2 of texels per pixel', L.toFixed(2)));
      lod.appendChild(stat('mip level read', lvl));
    }
    function drawCache() {
      U.clear(cache);
      const lin = GFX.texWalk({ layout: 'linear', pattern: st.pattern, lines: 8 }), til = GFX.texWalk({ layout: 'tiled', pattern: st.pattern, lines: 8 });
      cache.appendChild(stat('linear: miss rate', Math.round(lin.missRate * 100) + '%'));
      cache.appendChild(stat('4×4 tiles: miss rate', Math.round(til.missRate * 100) + '%', til.missRate < lin.missRate ? 'good' : ''));
    }
    root.appendChild(panel(null,
      field('Texture', select('tx-tex', [['checker', 'Checker 8×8'], ['bricks', 'Bricks 16×16'], ['uv', 'UV gradient 16×16'], ['stripes', 'Stripes 16×16']], st.tex, v => { st.tex = v; drawTex(); })),
      row('Filter', seg([['nearest', 'Nearest'], ['bilinear', 'Bilinear']], st.filter, v => { st.filter = v; drawTex(); }, 'text')),
      slider('u', 0, 1, 0.005, st.u, v => v.toFixed(3), v => { st.u = v; drawTex(); }),
      slider('v', 0, 1, 0.005, st.v, v => v.toFixed(3), v => { st.v = v; drawTex(); })));
    root.appendChild(V.figure(fig, 'The red dot is the sample point. Bilinear filtering blends the four nearest texel centres with the weights shown.'));
    mips.appendChild(V.mips({ tex: 'bricks', size: 256 }));
    root.appendChild(panel('Mipmaps', mips, slider('Texels per screen pixel', 0.25, 64, 0.25, st.tpp, v => v.toFixed(2), v => { st.tpp = v; drawLod(); }), lod,
      h('p', { class: 'muted small' }, 'When a texture is far away, many texels land in one pixel and point sampling shimmers. The texture unit reads a pre-shrunk level instead: level λ has 2^λ texels per pixel.')));
    root.appendChild(panel('Texture cache', row('Walk', seg([['row', 'Along rows'], ['column', 'Down columns'], ['diagonal', 'Diagonal']], st.pattern, v => { st.pattern = v; drawCache(); }, 'text')), cache,
      h('p', { class: 'muted small' }, 'An 8-line cache with 64-byte lines. A linear layout puts 16 texels of one row in each line; 4 × 4 tiling puts a small square in each line, so walks in any direction reuse it.'),
      V.figure(V.mortonViz({ n: 8 }), 'Morton (Z) order interleaves the bits of x and y, so nearby texels get nearby addresses in both directions.')));
    drawTex(); drawLod(); drawCache();
  });

  /* =========================================================
     Memory bandwidth
     ========================================================= */
  const MEMTYPES = { gddr6_14: ['GDDR6, 14 Gbit/s per pin', 14, 32, 'GDDR6'], gddr6_18: ['GDDR6, 18 Gbit/s', 18, 32, 'GDDR6'], gddr6_20: ['GDDR6, 20 Gbit/s', 20, 32, 'GDDR6'], gddr7_28: ['GDDR7, 28 Gbit/s', 28, 32, 'GDDR7'], gddr7_32: ['GDDR7, 32 Gbit/s', 32, 32, 'GDDR7'], hbm3: ['HBM3, 6.4 Gbit/s (1024-bit stacks)', 6.4, 1024, 'HBM3'] };
  lab('memory', 'Memory bandwidth', 'mem', 'Pick a VRAM type and bus width, then a resolution, frame rate and overdraw, and see whether memory can feed the frame.', root => {
    const st = { mem: 'gddr6_18', bus: 128, res: '2160', fps: 120, overdraw: 4, msaa: 1, comp: 1.5, tex: 16 };
    const fig = h('div', { class: 'fig-box' });
    const chart = h('div', { class: 'fig-box' });
    const stats = h('div', { class: 'stats tight' });
    const busBox = h('div');
    function busOptions() {
      return MEMTYPES[st.mem][2] === 1024 ? [[1024, '1 stack (1024-bit)'], [2048, '2 stacks'], [4096, '4 stacks']] : [[64, '64-bit'], [128, '128-bit'], [192, '192-bit'], [256, '256-bit'], [320, '320-bit'], [384, '384-bit'], [512, '512-bit']];
    }
    function rebuildBus() {
      const opts = busOptions();
      if (!opts.some(o => o[0] === st.bus)) st.bus = opts[opts.length > 2 ? 1 : 0][0];
      U.clear(busBox); busBox.appendChild(field('Bus width', select('mem-bus', opts, st.bus, v => { st.bus = Number(v); draw(); })));
    }
    function draw() {
      const m = MEMTYPES[st.mem];
      U.clear(fig); fig.appendChild(V.membus({ bus: st.bus, gbps: m[1], type: m[3], chipBits: m[2] }));
      const [w, hh] = CARD.RES[st.res];
      const fb = GPU.frameBytes({ w, h: hh, overdraw: st.overdraw, msaa: st.msaa, compression: st.comp, tex: st.tex });
      const k = st.fps / 1e9, need = fb.total * k, have = st.bus * m[1] / 8;
      U.clear(chart);
      chart.appendChild(V.stackBars({
        bars: [{ label: 'needed', parts: [{ v: fb.color * k, color: 'var(--f-f3)' }, { v: fb.depth * k, color: 'var(--f-rd)' }, { v: fb.tex * k, color: 'var(--f-op)' }, { v: fb.scanout * k, color: 'var(--f-f7)' }] }, { label: 'available', parts: [{ v: have, color: 'var(--brand)' }] }],

        { t: 'learn', h: 'A screen is a grid of pixels', body: 'Every image a graphics card makes is a rectangle of **pixels**. Each pixel mixes **red**, **green** and **blue** light. With 8 bits per channel, each runs from 0 (off) to 255 (full).\n\nA 1920 × 1080 screen has 2,073,600 pixels, and the card decides the colour of every one at least 60 times a second.', viz: { k: 'raster', tri: [[1, 0.5], [7.5, 3], [2.5, 7.5]], n: 8, mode: 'colors', cap: 'A triangle drawn into an 8 × 8 grid. Each square is one pixel with one colour.' } },
        { t: 'learn', h: 'Light adds up', body: 'Red + green light looks **yellow**; all three at full is **white**; all off is **black**.\n\nColours are written in hex as `#RRGGBB`, one byte per channel. `#FF8000` is full red, half green and no blue: orange.', viz: { k: 'swatch', items: [['#FF0000', 'red'], ['#00FF00', 'green'], ['#0000FF', 'blue'], ['#FFFF00', 'yellow']], cap: 'The bars under each swatch show its red, green and blue values.' } },
        { t: 'rgb', q: 'Mix pure **yellow** (`#FFFF00`).', target: '#FFFF00', why: 'Red and green light together look yellow; blue stays off.' },
        { t: 'mcq', q: 'What colour is `#00FFFF`?', opts: ['Cyan', 'Magenta', 'Yellow', 'Grey'], a: 0, why: 'No red, full green, full blue. Green and blue light make cyan.' },
        { t: 'num', q: 'With 8 bits each for red, green and blue, how many different colours can one pixel show?', a: 16777216, why: '256 × 256 × 256 = 2²⁴ = 16,777,216.' },
        { t: 'match', q: 'Match each colour to its name.', pairs: [['`#FFFFFF`', 'white'], ['`#000000`', 'black'], ['`#FF00FF`', 'magenta'], ['`#808080`', 'mid grey']], why: 'Equal red, green and blue make a grey; all full is white, all off is black. Red + blue is magenta.' },
        { t: 'tf', q: '`#404040` is a lighter grey than `#C0C0C0`.', a: false, why: '0x40 = 64 and 0xC0 = 192 per channel, so `#C0C0C0` is the lighter one.' },
        { t: 'rgb', q: 'Mix **orange**: `#FF8000`.', target: '#FF8000', why: 'Red 255, green 128, blue 0.' }
      ]
    },
    {
      id: 'u1l2', title: 'The framebuffer',
      ref: 'Linux kernel docs, KMS “Frame Buffer Abstraction” (struct drm_framebuffer pitches[] and offsets[]); Vulkan specification, Rasterization (framebuffer origin at the upper left).',
      items: [
        { t: 'learn', h: 'Pixels live in memory', body: 'The image sits in video memory (VRAM) as a **framebuffer**: row after row of pixels. With 4 bytes per pixel, pixel (x, y) is at\n\n```\naddress = base + y × pitch + x × 4\n```\n\nThe **pitch** (or stride) is the number of bytes from one row to the next. It can be more than width × 4, because hardware likes rows aligned to 64 or 256 bytes.', viz: { k: 'fbmem', w: 4, h: 3, bpp: 4, pitch: 20, hl: [2, 1], cap: 'A 4 × 3 framebuffer with 4 bytes of padding per row (pitch 20). Pixel (2, 1) is highlighted.' } },
        { t: 'learn', h: 'Top-left is (0, 0)', body: 'Vulkan, Direct3D and display hardware put pixel (0, 0) at the **top-left**, and y grows **downward**. Each pixel’s centre is at (x + 0.5, y + 0.5).\n\nA 1920 × 1080 framebuffer at 4 bytes per pixel takes 1920 × 1080 × 4 = 8,294,400 bytes, about 7.9 MiB.', viz: { k: 'pixels', w: 8, h: 5, grid: grid(8, 5, (x, y) => 'rgb(' + (40 + x * 28) + ',' + (60 + y * 40) + ',200)'), hl: ['0,0'], cap: 'Pixel (0, 0) is outlined. x counts columns, y counts rows.' } },
        { t: 'num', q: 'A framebuffer starts at `0x1000` with a pitch of 64 bytes and 4 bytes per pixel. What is the address of pixel (3, 2)? (hex)', a: 0x108C, base: 'hex', why: '0x1000 + 2 × 64 + 3 × 4 = 0x1000 + 128 + 12 = 0x108C.' },
        { t: 'hotspot', q: 'Tap pixel **(5, 2)**.', viz: { k: 'pixels', w: 8, h: 5, grid: grid(8, 5, () => null) }, a: 'p5_2', aText: 'column 5, row 2 (both counted from 0)', why: 'x counts columns from the left starting at 0; y counts rows from the top starting at 0.' },
        { t: 'num', q: 'How many bytes does a 1280 × 720 framebuffer take at 4 bytes per pixel?', a: 3686400, why: '1280 × 720 × 4 = 3,686,400 bytes, about 3.5 MiB.' },
        { t: 'num', q: 'An image is 1000 pixels wide at 4 bytes per pixel, and rows must start on 256-byte boundaries. What is the pitch in bytes?', a: 4096, why: '1000 × 4 = 4000 bytes, rounded up to a multiple of 256: 16 × 256 = 4096. The last 96 bytes of each row are padding.' },
        { t: 'mcq', q: 'Why can the pitch be larger than width × bytes per pixel?', opts: ['Rows are padded to an alignment the hardware likes', 'Each row stores its own palette', 'The display needs a checksum per row', 'Odd rows hold bigger pixels'], a: 0, why: 'Aligned rows let memory controllers and display engines fetch whole bursts. Always step rows by the pitch, never by width × bytes per pixel.' },
        { t: 'tf', q: 'In a Vulkan framebuffer, row 0 is the top of the image.', a: true, why: 'Framebuffer coordinates start at the upper left. OpenGL window coordinates start at the lower left, which is why ported code flips y.' }
      ]
    },
    {
      id: 'u1l3', title: 'Pixel formats',
      ref: 'Linux uapi drm_fourcc.h (DRM_FORMAT_XRGB8888 is [31:0] x:R:G:B, little endian); Vulkan specification, Formats (VK_FORMAT_R5G6B5_UNORM_PACK16, VK_FORMAT_R16G16B16A16_SFLOAT).',
      items: [
        { t: 'learn', h: 'A format names the bits', body: '- **RGBA8**: four 8-bit channels, 4 bytes per pixel. A is alpha, the opacity.\n- **XRGB8888 / BGRA8**: the same 32 bits in a different order. Displays often scan these out.\n- **RGB565**: 16 bits: 5 red, 6 green, 5 blue. The eye is most sensitive to green, so it gets the extra bit.\n- **RGBA16F**: four 16-bit floats, for high dynamic range.', viz: { k: 'field', fields: [{ key: 'red', hi: 15, lo: 11, label: 'red' }, { key: 'green', hi: 10, lo: 5, label: 'green' }, { key: 'blue', hi: 4, lo: 0, label: 'blue' }], n: 16, word: 0xFC00, cap: 'RGB565: orange `#FF8000` packs to `0xFC00`: red 11111, green 100000, blue 00000.' } },
        { t: 'learn', h: 'Byte order in memory', body: 'ARM (as Linux and almost everyone configure it) and x86 are **little-endian**: the lowest byte of a word is stored first. XRGB8888 is the 32-bit value `0xXXRRGGBB`, so memory holds the bytes **blue, green, red, X**.', viz: { k: 'memory', base: 0x100, bytes: [0x00, 0x80, 0xFF, 0x00], hl: [0x102], cols: 4, cap: 'Orange (`0x00FF8000`) stored little-endian: blue 00, green 80, red FF (highlighted), then the unused X byte.' } },
        { t: 'bits', q: 'Pack pure green `#00FF00` into RGB565 (red 15–11, green 10–5, blue 4–0).', n: 16, a: 0x07E0, readout: 'hex', labels: 'index', why: 'Green keeps its top 6 bits, 111111, in bits 10–5. Red and blue are 0: `0x07E0`.' },
        { t: 'num', q: 'How many bytes does one RGBA16F pixel take?', a: 8, why: 'Four channels × 16 bits = 64 bits = 8 bytes.' },
        { t: 'mcq', q: 'An XRGB8888 pixel is stored little-endian. Which channel’s byte comes first in memory?', opts: ['Blue', 'Red', 'Green', 'The unused X byte'], a: 0, why: 'The value is `0xXXRRGGBB`; the lowest byte, BB, goes to the lowest address.' },
        { t: 'tf', q: 'RGB565 gives green one more bit than red and blue because the eye is most sensitive to green.', a: true, why: 'Six bits give 64 green levels against 32 for red and blue, where errors are least visible.' },
        { t: 'num', q: 'How many bytes does a 2560 × 1440 framebuffer take in RGB565?', a: 7372800, why: '2560 × 1440 × 2 = 7,372,800 bytes: half of RGBA8.' },
        { t: 'match', q: 'Match each format to its size per pixel.', pairs: [['RGBA8', '4 bytes'], ['RGB565', '2 bytes'], ['RGBA16F', '8 bytes'], ['R8 (one channel)', '1 byte']], why: 'Add up the bits of every channel and divide by 8.' }
      ]
    },
    {
      id: 'u1l4', title: 'Gamma and sRGB',
      ref: 'Khronos Data Format Specification, sRGB transfer functions; Vulkan specification, Formats and Blending (sRGB attachments are converted to linear before blending).',
      items: [
        { t: 'learn', h: 'Eyes are not linear', body: 'Twice the light does not look twice as bright. The **sRGB** encoding spends more codes on dark tones, where the eye notices steps. The catch: a stored 128 is only about **22%** of full light.\n\nLighting, blending and filtering must work on **linear** light, so values have to be decoded first.', viz: { k: 'line', series: [{ pts: srgbCurve, color: 'var(--brand)', name: 'sRGB → linear', area: true }, { pts: [[0, 0], [1, 1]], color: 'var(--ink-3)', name: 'straight line' }], xmin: 0, xmax: 1, ymin: 0, ymax: 1, xlab: 'stored value ÷ 255', ylab: 'light', xticks: [0, 0.5, 1], cap: 'Decoding sRGB: the curve sits well below the straight line in the middle.' } },
        { t: 'learn', h: 'The hardware converts for you', body: 'A format ending in **_SRGB**, such as `VK_FORMAT_R8G8B8A8_SRGB`, tells the GPU to convert automatically:\n\n- the texture unit **decodes** to linear when a shader samples it,\n- blending happens in **linear** light,\n- the ROP **encodes** back to sRGB when it writes.\n\nA `_UNORM` format does no conversion.', viz: { k: 'swatch', items: [['#808080', 'code 128'], ['#BCBCBC', 'code 188'], ['#FFFFFF', 'code 255']], bars: false, cap: 'Code 128 is about 22% of full light; half the light (linear 0.5) is stored as 188.' } },
        { t: 'num', q: 'A shader writes linear 0.5 to an sRGB target. Which 8-bit code is stored? (nearest whole number)', hint: 'Encoding is close to linear^(1/2.2) × 255.', a: 188, tol: 2, why: '1.055 × 0.5^(1/2.4) − 0.055 = 0.735; × 255 = 187.5 → 188.' },
        { t: 'mcq', q: 'In which space should a GPU blend two colours?', opts: ['Linear light', 'Raw sRGB codes', 'Hex', 'Whatever the display uses'], a: 0, why: 'Blending adds light, and light adds linearly. Blending sRGB codes directly makes mixes too dark.' },
        { t: 'tf', q: 'A stored sRGB value of 128 means half of full light.', a: false, why: 'It decodes to about 0.22. Half the light is code 188.' },
        { t: 'mcq', q: 'A shader samples an `_SRGB` texture. What does it receive?', opts: ['A linear value that the texture unit decoded', 'The raw code ÷ 255', 'An integer from 0 to 255', 'A gamma-2.2 encoded value'], a: 0, why: 'Decoding happens in the texture unit before filtering, so filtering is correct too.' },
        { t: 'num', q: 'An sRGB texture stores 64. About what linear value is that? (2 decimals)', hint: 'Decoding is close to (value ÷ 255)^2.2.', a: 0.05, tol: 0.01, why: '(64/255)^2.2 ≈ 0.048; the exact sRGB curve gives 0.051.' }
      ]
    },
    {
      id: 'u1l5', title: 'Double buffering',
      ref: 'Vulkan specification, Window System Integration: VkPresentModeKHR (FIFO is always supported); Linux kernel docs, KMS page flips complete at vblank.',
      items: [
        { t: 'learn', h: 'The display never stops reading', body: 'The display engine reads the framebuffer line by line, at a fixed pixel clock, all the time. If you draw into the buffer it is showing, the monitor shows the top of one frame and the bottom of another: **tearing**.', viz: { k: 'scanout', cap: 'Scanout order. The blanking intervals are the gaps between lines and between frames.' } },
        { t: 'learn', h: 'Draw behind, flip at vblank', body: 'Use two buffers. Draw into the **back buffer** while the **front buffer** is on screen, then ask the display controller to **flip** at the next vertical blank (**vblank**), the pause between frames. The Forge card below draws five frames this way.', viz: { k: 'cardrun', preset: 'flip', film: true, code: false, cap: 'Each thumbnail is a frame the monitor received at a vblank.' } },
        { t: 'order', q: 'Put one frame of double buffering in order.', items: ['Draw the next frame into the back buffer', 'Ask the display controller to flip to it', 'At vblank, the display latches the new base address', 'The old front buffer becomes the next back buffer'], why: 'The flip only takes effect at vblank, so the monitor never sees a half-drawn frame.' },
        { t: 'mcq', q: 'What causes tearing?', opts: ['Changing the visible image while it is being scanned out', 'A slow PCIe link', 'Too few colours', 'Using RGB565'], a: 0, why: 'The top part of the screen was read from the old image, the rest from the new one.' },
        { t: 'num', q: 'How many MiB do two 2560 × 1440 RGBA8 buffers take? (2 decimals)', a: 28.13, tol: 0.01, unit: 'MiB', why: '2 × 2560 × 1440 × 4 = 29,491,200 bytes ÷ 1,048,576 = 28.125 MiB.' },
        { t: 'tf', q: 'With vsync on, a game rendering 50 frames per second on a 60 Hz display shows some frames twice.', a: true, why: 'A flip waits for the next vblank, so a frame that misses one stays up for two refreshes. Variable refresh rate (VRR) moves the vblank instead.' },
        { t: 'mcq', q: 'Which Vulkan present mode must every driver support, and waits for vblank?', opts: ['VK_PRESENT_MODE_FIFO_KHR', 'VK_PRESENT_MODE_IMMEDIATE_KHR', 'VK_PRESENT_MODE_MAILBOX_KHR', 'VK_PRESENT_MODE_FIFO_RELAXED_KHR'], a: 0, why: 'FIFO queues images and shows one per vblank. IMMEDIATE may tear; MAILBOX and FIFO_RELAXED are optional.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u2', n: 2, track: 'gfx', tone: 'rd', title: 'Vectors, matrices and spaces',
  blurb: 'The maths that moves a 3D model onto your screen: vectors, dot and cross products, 4 × 4 matrices, perspective and the viewport.',
  lessons: [
    {
      id: 'u2l1', title: 'Points and vectors',
      ref: 'Real-Time Rendering, 4th ed., ch. 4 Transforms.',
      items: [
        { t: 'learn', h: 'Positions and directions', body: 'A 3D **point** is (x, y, z). A **vector** is a direction with a length; subtract two points to get the vector between them.\n\n- length = √(x² + y² + z²)\n- **normalize**: divide by the length to get a unit vector of length 1.', viz: { k: 'plot', range: [0, 8, 0, 6], items: [{ t: 'pt', at: [1, 1], label: 'a' }, { t: 'pt', at: [5, 4], label: 'b' }, { t: 'vec', from: [1, 1], to: [5, 4], label: 'b − a' }], cap: 'b − a = (4, 3), and its length is √(16 + 9) = 5.' } },
        { t: 'num', q: 'What is the length of the vector (3, 4)?', a: 5, why: '√(9 + 16) = √25 = 5.' },
        { t: 'num', q: 'a = (2, 7, 1) and b = (5, 3, 1). What is the x part of b − a?', a: 3, why: '5 − 2 = 3. The whole vector is (3, −4, 0).' },
        { t: 'num', q: 'Normalize (0, 6, 8). What is the z part of the unit vector? (1 decimal)', a: 0.8, tol: 0.001, why: 'Length = √(36 + 64) = 10, so the unit vector is (0, 0.6, 0.8).' },
        { t: 'tf', q: 'A point plus a vector gives another point.', a: true, why: 'Moving a position by a displacement lands on a new position. Point − point gives a vector; point + point means nothing on its own.' },
        { t: 'mcq', q: 'Which of these is a direction rather than a position?', opts: ['A surface normal', 'A vertex position', 'The camera position', 'A lamp’s position'], a: 0, why: 'A normal says which way a surface faces; it has no location.' }
      ]
    },
    {
      id: 'u2l2', title: 'Dot and cross products',
      ref: 'Real-Time Rendering, 4th ed., ch. 4 Transforms; Vulkan specification, Basic Polygon Rasterization (the signed area uses the same cross-product form).',
      items: [
        { t: 'learn', h: 'The dot product measures alignment', body: 'a · b = aₓbₓ + a_yb_y + a_zb_z = |a| |b| cos θ.\n\nFor unit vectors it is just the cosine of the angle between them: **1** = same direction, **0** = perpendicular, **−1** = opposite. Simple lighting uses it: brightness = max(0, N · L), the surface normal dotted with the direction to the light.' },
        { t: 'learn', h: 'The cross product makes normals', body: 'a × b is perpendicular to both a and b. The cross product of two triangle edges gives the triangle’s **normal**.\n\nIn 2D only one number survives: aₓb_y − a_yb_x. Its **sign** says whether b turns one way or the other from a. A rasterizer runs exactly this test for every pixel.', viz: { k: 'plot', range: [0, 6, 0, 5], items: [{ t: 'vec', from: [1, 1], to: [5, 2], label: 'a' }, { t: 'vec', from: [1, 1], to: [2, 4], label: 'b', tone: 'f3' }], cap: 'a = (4, 1), b = (1, 3): aₓb_y − a_yb_x = 12 − 1 = 11 > 0, so b turns counter-clockwise from a (y up).' } },
        { t: 'num', q: '(1, 2, 3) · (4, 5, 6) = ?', a: 32, why: '1·4 + 2·5 + 3·6 = 4 + 10 + 18 = 32.' },
        { t: 'num', q: 'A surface has normal N = (0, 1, 0). The direction to the light is L = (0, 0.6, 0.8). How bright is it: max(0, N · L)? (1 decimal)', a: 0.6, tol: 0.001, why: 'N · L = 0 + 0.6 + 0 = 0.6, so the surface gets 60% of the light.' },
        { t: 'mcq', q: 'For two non-zero vectors, a · b = 0 means…', opts: ['they are perpendicular', 'they are parallel', 'one is a unit vector', 'they point the same way'], a: 0, why: 'cos 90° = 0.' },
        { t: 'num', q: '2D cross product: a = (3, 1), b = (1, 2). What is aₓb_y − a_yb_x?', a: 5, why: '3 × 2 − 1 × 1 = 5.' },
        { t: 'tf', q: 'a × b = b × a.', a: false, why: 'Swapping the operands flips the sign: a × b = −(b × a). That is also why a triangle’s winding order decides which way it faces.' },
        { t: 'num', q: '(1, 0, 0) × (0, 1, 0) = (0, 0, z). What is z?', a: 1, why: 'x × y = z in a right-handed system.' }
      ]
    },
    {
      id: 'u2l3', title: 'Matrices move points',
      ref: 'Real-Time Rendering, 4th ed., §4.1 Basic Transforms.',
      items: [
        { t: 'learn', h: 'A matrix is a transform', body: 'Multiplying a column vector by a matrix moves it. The columns of the matrix are where the x and y axes end up.\n\n- rotate by θ: [[cos θ, −sin θ], [sin θ, cos θ]]\n- scale: [[sx, 0], [0, sy]]', viz: { k: 'plot', range: [-3, 3, -3, 3], items: [{ t: 'poly', pts: [[0, 0], [2, 0], [2, 1], [0, 1]], fill: false, label: 'before' }, { t: 'poly', pts: [[0, 0], [0, 2], [-1, 2], [-1, 0]], tone: 'f3', label: 'after' }], cap: 'Rotating a rectangle by 90° counter-clockwise: (x, y) → (−y, x).' } },
        { t: 'learn', h: 'Four numbers per point', body: 'A 3 × 3 matrix cannot **move** (translate) a point, so graphics uses **4 × 4** matrices and gives points a fourth coordinate, w = 1: (x, y, z, 1). The last column then adds the translation.\n\nDirections use w = 0, so translation leaves them alone.', viz: { k: 'table', head: ['', '', '', ''], rows: [['1', '0', '0', 'tx'], ['0', '1', '0', 'ty'], ['0', '0', '1', 'tz'], ['0', '0', '0', '1']], mono: [0, 1, 2, 3], cap: 'A translation matrix. Multiplied by (x, y, z, 1) it gives (x + tx, y + ty, z + tz, 1).' } },
        { t: 'num', q: 'Rotate (1, 0) by 90° counter-clockwise. What is the new y?', a: 1, why: '(x, y) → (−y, x) = (0, 1).' },
        { t: 'num', q: 'Scale (3, 5) by sx = 2, sy = 0.5. What is the new y? (1 decimal)', a: 2.5, tol: 0.001, why: '5 × 0.5 = 2.5. The new point is (6, 2.5).' },
        { t: 'mcq', q: 'Why do GPUs use 4 × 4 matrices for 3D?', opts: ['So a translation fits into one matrix multiply', 'To hold RGBA colours', 'Because a warp has four lanes', 'To store four vertices at once'], a: 0, why: 'With w = 1, the fourth column adds an offset, so rotate, scale and move combine into one matrix.' },
        { t: 'tf', q: 'For matrices, A · B always equals B · A.', a: false, why: 'Rotating then moving is not the same as moving then rotating.' },
        { t: 'mcq', q: 'To scale, then rotate, then translate a column vector v, which product do you use?', opts: ['T · R · S · v', 'S · R · T · v', 'R · T · S · v', 'T · S · R · v'], a: 0, why: 'The matrix next to v acts first.' },
        { t: 'tf', q: 'Translating a direction vector (w = 0) changes it.', a: false, why: 'The translation column is multiplied by w = 0. Directions only rotate and scale.' }
      ]
    },
    {
      id: 'u2l4', title: 'The chain of spaces',
      ref: 'Real-Time Rendering, 4th ed., §2.3 Geometry Processing; Vulkan specification, Coordinate Transformations.',
      items: [
        { t: 'learn', h: 'From model to screen', body: 'Every vertex passes through a chain of coordinate spaces. Three matrices do the work; the hardware does the divide and the viewport.', viz: { k: 'chain', items: [['object space', 'the model as it was built', 'imm'], ['world space', '× model matrix M', 'rd'], ['view space', '× view matrix V: camera at the origin', 'op'], ['clip space', '× projection P: 4D, w = depth', 'f3'], ['normalized device coords', '÷ w: everything visible is in −1…1', 'rs1'], ['framebuffer', 'viewport transform: pixels', 'rs2']], cap: 'Your vertex shader usually applies M, V and P; fixed-function hardware does the rest.' } },
        { t: 'learn', h: 'See it run', body: 'This cube’s eight corners go through M, V and P, and the course’s own rasterizer fills its twelve triangles. Open the **3D pipeline** lab to spin it and follow one corner through every space.', viz: { k: 'cube', rx: 22, ry: 35, cap: 'Rendered at 128 × 96 with back-face culling and a depth buffer.' } },
        { t: 'order', q: 'Order the spaces a vertex passes through.', items: ['object space', 'world space', 'view space', 'clip space', 'normalized device coordinates', 'framebuffer pixels'], why: 'M, V and P, then the divide by w, then the viewport.' },
        { t: 'match', q: 'Match each step to what it does.', pairs: [['model matrix', 'object → world'], ['view matrix', 'world → camera'], ['projection matrix', 'camera → clip'], ['divide by w', 'clip → NDC']], why: 'Each matrix moves the vertex one space along; the divide is done by fixed-function hardware.' },
        { t: 'mcq', q: 'In the usual right-handed convention (OpenGL and most Vulkan code), the camera in view space looks down…', opts: ['the −z axis', 'the +z axis', 'the +y axis', 'the −x axis'], a: 0, why: 'x points right, y up, and the camera looks toward −z, so visible points have negative z.' },
        { t: 'num', q: 'You multiply P · V · M into one MVP matrix before drawing. How many matrix–vector products does each vertex then need?', a: 1, why: 'Combine once on the CPU, then each vertex needs one 4 × 4 multiply instead of three.' },
        { t: 'tf', q: 'The vertex shader is the usual place where the M, V and P matrices are applied.', a: true, why: 'It outputs the clip-space position; the hardware takes it from there.' }
      ]
    },
    {
      id: 'u2l5', title: 'Perspective',
      ref: 'Real-Time Rendering, 4th ed., §4.7.2 Perspective Projection; Vulkan specification, Coordinate Transformations (perspective division).',
      items: [
        { t: 'learn', h: 'Divide by distance', body: 'Far things look smaller. A perspective matrix copies the distance in front of the camera into **w**, and the hardware divides x, y and z by w. A point twice as far away lands twice as close to the centre of the screen.', viz: { k: 'frustum', fov: 60, point: [7, 2], cap: 'Side view of the camera’s view volume. P projects onto the near plane at y × near ÷ z.' } },
        { t: 'learn', h: 'Field of view', body: 'With a vertical field of view **fovy**, the matrix scales y by f = 1 / tan(fovy / 2) and x by f / aspect. At fovy = 90°, f = 1.\n\nAfter the divide, visible points have x and y between −1 and 1. Vulkan puts visible depth between **0 and 1**; OpenGL’s default is −1 to 1.' },
        { t: 'num', q: 'A clip-space position is (3, −1, 2, 4). What is x after the perspective divide? (2 decimals)', a: 0.75, tol: 0.001, why: '3 ÷ 4 = 0.75.' },
        { t: 'mcq', q: 'After a perspective projection, what does w hold?', opts: ['The distance in front of the camera', 'The alpha channel', 'The vertex index', 'Always 1'], a: 0, why: 'The matrix’s bottom row copies −z_view into w, so the divide shrinks distant points.' },
        { t: 'num', q: 'For fovy = 90°, what is f = 1 / tan(fovy / 2)?', a: 1, tol: 0.001, why: 'tan 45° = 1.' },
        { t: 'num', q: 'f = 1, aspect 1. A point sits 2 units right of the view axis and 4 units in front of the camera. What is its x in NDC? (1 decimal)', a: 0.5, tol: 0.001, why: 'x_clip = f · x = 2 and w = 4, so x_ndc = 2 ÷ 4 = 0.5.' },

const cov = (tri, n, rule) => GFX.coverage(tri.map(p => ({ x: p[0], y: p[1] })), n, rule);

function sharedGrid(rule) {

  };
}

        { t: 'mcq', q: 'Why must triangles crossing the near plane be clipped?', opts: ['Vertices behind the camera have w ≤ 0, so the divide breaks', 'They are always too big', 'The depth buffer is full', 'The viewport is negative'], a: 0, why: 'Dividing by zero or a negative w would fling points across the screen.' }

FORGE.glossary.push(
  ['triangle', 'The primitive GPUs rasterize: always flat and convex, so inside = inside all three edges.'],
  ['mesh', 'A surface made of triangles that share vertices.'],
  ['index buffer', 'A list of vertex numbers, three per triangle, so shared vertices are stored once.'],
  ['rasterization', 'Finding which pixels (or samples) a triangle covers and producing fragments for them.'],
  ['fragment', 'A covered pixel on its way through the pipeline, with position, depth and interpolated values.'],
  ['bounding box', 'The smallest rectangle of pixels around a triangle; only these centres need testing.'],
  ['edge function', 'E(p) = (b.x − a.x)(p.y − a.y) − (b.y − a.y)(p.x − a.x): positive on one side of edge a→b.'],
  ['top-left rule', 'Fill rule: a centre exactly on an edge counts only for a top (horizontal, triangle below) or left edge.'],
  ['barycentric weights', 'Three weights λ₀, λ₁, λ₂ that sum to 1 and blend per-vertex values across a triangle.'],
  ['perspective-correct interpolation', 'Interpolating a/w and 1/w linearly, then dividing, so values are right in 3D.'],
  ['fixed point', 'Integers with an implied binary point, e.g. 12.4 = 12 integer and 4 fraction bits.'],
  ['subpixel precision', 'How finely vertex positions are snapped; Vulkan requires at least 4 bits (1/16 pixel).'],
  ['back-face culling', 'Skipping triangles that face away from the camera, decided by the sign of their area.'],
  ['winding order', 'Whether a triangle’s vertices go clockwise or counter-clockwise on screen.'],
  ['clipping', 'Cutting triangles against a plane, chiefly the near plane, so the divide by w stays valid.'],
  ['guard band', 'A region beyond the screen where triangles are rasterized without geometric clipping.'],
  ['MSAA', 'Multisample antialiasing: several coverage samples per pixel, one shader run per pixel.'],
  ['resolve', 'Averaging a pixel’s MSAA samples into one final colour.']
);

        { t: 'num', q: 'A triangle covers 500 pixels, with no MSAA. How many times does the fragment shader run?', a: 500, why: 'Once per covered pixel (plus a few helper lanes to fill 2 × 2 quads, as you will see later).' },
        { t: 'hotspot', q: 'Tap the stage that runs once per covered pixel.', viz: { k: 'pipeline' }, a: 'fs', aText: 'the fragment shader', why: 'The rasterizer emits fragments; the fragment shader colours each one.' },
        { t: 'tf', q: 'A fragment shader can choose which pixel it writes to.', a: false, why: 'Its pixel is fixed by the rasterizer. Writing to arbitrary places needs storage images or buffers instead.' },
        { t: 'mcq', q: 'Which of these is NOT interpolated from the vertices?', opts: ['A texel the shader samples', 'The fragment’s UV coordinates', 'The fragment’s vertex colour', 'The fragment’s depth'], a: 0, why: 'Textures are sampled by the shader at the interpolated UV; the texel itself is not interpolated from vertices.' },
        { t: 'mcq', q: 'Why can discard slow a GPU down?', opts: ['Depth can no longer be tested and written before shading', 'It deletes the texture', 'It turns on MSAA', 'It disables the vertex shader'], a: 0, why: 'The hardware must run the shader to know whether the fragment survives.' }

    {
      id: 'u5l4', title: 'Early-Z and overdraw',
      ref: 'Vulkan specification, Early Fragment Tests; Real-Time Rendering, 4th ed., §23.7 Depth Culling, Testing, and Compression.',
      items: [
        { t: 'learn', h: 'Overdraw', body: 'Pixels covered by several triangles get shaded several times, but only the nearest survives. **Overdraw** = fragments shaded per pixel.\n\nTesting depth **before** shading (**early-Z**) drops hidden fragments cheaply, especially when opaque objects are drawn front to back.', viz: { k: 'stack', bars: [{ label: 'no early-Z', parts: [{ v: 3.2, color: 'var(--f-f3)' }] }, { label: 'early-Z', parts: [{ v: 1.9, color: 'var(--f-rs2)' }] }, { label: 'front to back', parts: [{ v: 1.2, color: 'var(--f-op)' }] }], unit: '×', fmt: v => v.toFixed(1), lw: 96, cap: 'Fragments shaded per pixel in an example scene.' } },
        { t: 'learn', h: 'Hierarchical Z', body: 'GPUs also keep a coarse **Hi-Z** buffer: the farthest depth in each tile. If a whole block of a new triangle is behind it, the block is rejected before fine rasterization.' },
        { t: 'num', q: 'A 1920 × 1080 frame has an average overdraw of 2.5. How many fragments are shaded, in millions? (1 decimal)', a: 5.2, tol: 0.06, why: '2,073,600 × 2.5 = 5,184,000 ≈ 5.2 million.' },
        { t: 'mcq', q: 'For early-Z to save the most work, draw opaque objects…', opts: ['front to back', 'back to front', 'in random order', 'sorted by colour'], a: 0, why: 'Near surfaces fill the depth buffer first, so hidden fragments behind them fail before shading.' },
        { t: 'tf', q: 'A fragment shader that writes its own depth disables early depth testing.', a: true, why: 'The depth is not known until the shader has run.' },
        { t: 'num', q: 'Front-to-back drawing cuts overdraw from 3 to 1.2. By what factor does fragment shading work drop? (1 decimal)', a: 2.5, tol: 0.01, why: '3 ÷ 1.2 = 2.5.' },
        { t: 'mcq', q: 'What does a Hi-Z buffer keep for each tile?', opts: ['The farthest depth in the tile', 'The tile’s average colour', 'How many triangles touched it', 'The nearest light'], a: 0, why: 'If a new triangle’s nearest depth in the tile is behind that, nothing in it can pass.' }
      ]
    },
    {
      id: 'u5l5', title: 'Immediate-mode and tile-based',
      ref: 'Real-Time Rendering, 4th ed., §23.9 Architecture (immediate-mode and tile-based GPU designs).',
      items: [
        { t: 'learn', h: 'Two families', body: 'Desktop GPUs are mostly **immediate-mode**: each triangle is rasterized as it arrives, and framebuffer traffic goes through caches to VRAM.\n\nMost mobile GPUs are **tile-based**: they first sort the frame’s triangles into screen tiles, then render one tile at a time in small on-chip memory and write each finished tile once, saving bandwidth and power.', viz: { k: 'tiles', tile: 8, cap: 'Coarse rasterization on an 8 × 8 tile grid: green tiles are fully covered, gold ones need per-pixel tests, the rest are skipped.' } },
        { t: 'learn', h: 'Our card', body: 'Triangle Forge is a desktop card: immediate mode, with a wide VRAM bus and caches. Its raster engine still walks the screen in **tiles**, coarse then fine, because tiles keep memory accesses close together.' },
        { t: 'num', q: 'How many 16 × 16 tiles cover a 1920 × 1080 screen? Partial tiles count.', a: 8160, why: '1920 ÷ 16 = 120 columns; 1080 ÷ 16 = 67.5 → 68 rows; 120 × 68 = 8,160.' },
        { t: 'mcq', q: 'What does a tile-based design save most?', opts: ['Memory bandwidth', 'Shader ALU work', 'Triangle setup', 'PCIe bandwidth'], a: 0, why: 'Depth and colour stay on chip while a tile renders; only finished pixels go to memory.' },
        { t: 'tf', q: 'A tile-based GPU must see all of a frame’s triangles before it can finish any tile.', a: true, why: 'Any later triangle might touch any tile, so binning comes first.' },
        { t: 'mcq', q: 'In the tile picture, gold tiles are…', opts: ['tiles an edge crosses, needing per-pixel tests', 'fully covered tiles', 'tiles rejected outright', 'tiles off the screen'], a: 0, why: 'Fully inside tiles can be filled without testing each pixel; outside tiles are skipped.' }
      ]
    }
  ]

FORGE.glossary.push(
  ['depth buffer', 'Per-pixel storage of the nearest depth drawn so far; also called the z-buffer.'],
  ['depth test', 'Comparing a fragment’s depth with the stored one (usually LESS) to keep the nearest surface.'],
  ['z-fighting', 'Flicker between surfaces whose depths round to the same stored value.'],
  ['reversed Z', 'Storing 1 at the near plane and 0 at the far plane in float depth for even precision.'],
  ['alpha blending', 'result = src × α + dst × (1 − α): mixing a translucent fragment with the framebuffer.'],
  ['premultiplied alpha', 'Colours stored already multiplied by α; blending becomes src + dst × (1 − α).'],
  ['texture', 'An image that shaders sample, addressed by (u, v) coordinates from 0 to 1.'],
  ['texel', 'One pixel of a texture.'],
  ['UV coordinates', 'Per-vertex texture coordinates (u, v), interpolated across each triangle.'],
  ['bilinear filtering', 'Blending the four nearest texels by distance.'],
  ['mipmap', 'A chain of half-size copies of a texture, used when it is shrunk on screen.'],
  ['LOD', 'Level of detail: λ = log₂(texels per pixel) picks the mip level.'],
  ['trilinear filtering', 'Bilinear samples from two mip levels blended by the fractional LOD.'],
  ['anisotropic filtering', 'Several samples along the stretched direction of a slanted texture footprint.'],
  ['BC1', 'Block compression: a 4 × 4 block in 8 bytes (two RGB565 endpoints + 2-bit indices).'],
  ['BC7', 'Higher-quality block compression: 16 bytes per 4 × 4 block.'],
  ['ASTC', 'Adaptive scalable texture compression with block sizes from 4 × 4 to 12 × 12.'],
  ['draw call', 'One command to draw a set of primitives with the current pipeline state.'],
  ['input assembler', 'Fixed-function stage that reads indices and fetches vertex attributes.'],
  ['vertex shader', 'Program run once per vertex; outputs a clip-space position and other values.'],
  ['fragment shader', 'Program run per fragment (pixel or sample) that outputs its colour.'],
  ['triangle strip', 'A topology where each new vertex makes a triangle with the previous two.'],
  ['overdraw', 'The number of fragments shaded per pixel in a frame.'],
  ['early-Z', 'Running the depth test before the fragment shader to skip hidden fragments.'],
  ['Hi-Z', 'Hierarchical Z: a coarse per-tile depth used to reject blocks of fragments early.'],
  ['immediate-mode rendering', 'Rasterizing each triangle as it arrives, through caches to VRAM (desktop GPUs).'],
  ['tile-based rendering', 'Binning a frame’s triangles into tiles, then rendering each tile on chip (most mobile GPUs).']
);

FORGE.units.push({
  id: 'u6', n: 6, track: 'gpu', tone: 'rs1', title: 'Why GPUs are parallel',
  blurb: 'Millions of independent pixels per frame: SIMD and SIMT, counting FLOPS, hiding memory latency with warps, and the CPU’s share of the work.',
  lessons: [
    {
      id: 'u6l1', title: 'Millions of pixels',
      ref: 'Real-Time Rendering, 4th ed., ch. 3 The Graphics Processing Unit (§3.1 Data-Parallel Architectures).',
      items: [
        { t: 'learn', h: 'Count the work', body: 'At 1920 × 1080 and 60 frames per second, a GPU must finish **124 million pixels every second**, and a modern game spends thousands of arithmetic operations on each.\n\nThe saving grace: every pixel runs the **same program** on its own data, with no dependencies between pixels.', viz: { k: 'stack', bars: [{ label: '1080p 60', parts: [{ v: 124.4, color: 'var(--f-op)' }] }, { label: '4K 60', parts: [{ v: 497.7, color: 'var(--f-rd)' }] }, { label: '1440p 144', parts: [{ v: 530.8, color: 'var(--f-rs1)' }] }, { label: '4K 120', parts: [{ v: 995.3, color: 'var(--f-f3)' }] }], unit: ' M px/s', fmt: v => v.toFixed(0), lw: 80, cap: 'Pixels per second that must be shaded, in millions.' } },
        { t: 'learn', h: 'Latency or throughput', body: 'A CPU core is built to finish **one** thread fast: large caches, branch prediction, out-of-order execution. A GPU is built to finish **millions** of threads per frame: it spends its transistors on many simple lanes and hides memory delays by switching threads.', viz: { k: 'table', head: ['', 'CPU', 'GPU'], rows: [['cores', '8–24 large cores', 'thousands of simple lanes'], ['goal', 'low latency per thread', 'high total throughput'], ['slow memory', 'caches and prediction', 'switch to another warp'], ['clock', 'up to ~6 GHz', '~1.5–3 GHz']] } },
        { t: 'num', q: 'How many pixels per second does 2560 × 1440 at 144 Hz need, in millions? (nearest whole number)', a: 531, tol: 1, why: '2560 × 1440 × 144 = 530,841,600 ≈ 531 million.' },
        { t: 'mcq', q: 'What makes pixel shading easy to parallelize?', opts: ['Every pixel runs the same program, independently', 'All pixels share one register', 'Each pixel needs the previous one’s result', 'Pixels must be shaded in sorted order'], a: 0, why: 'Independent work with identical code is ideal for wide SIMD hardware.' },
        { t: 'tf', q: 'A GPU core is designed to run a single thread as fast as possible.', a: false, why: 'That is the CPU’s design goal. GPUs maximise how much total work finishes per second.' },
        { t: 'num', q: '124 million pixels per second at 2,000 floating-point operations each: how many billion operations per second?', a: 248, why: '124 × 10⁶ × 2,000 = 2.48 × 10¹¹ = 248 billion (0.25 TFLOPS).' },
        { t: 'mcq', q: 'How does a GPU mostly cope with slow memory?', opts: ['It switches to other threads while one waits', 'It predicts every branch', 'It runs at a higher clock', 'It avoids memory entirely'], a: 0, why: 'Many resident threads, each ready at different times, keep the arithmetic units busy.' }
      ]
    },
    {
      id: 'u6l2', title: 'SIMD and SIMT',
      ref: 'NVIDIA CUDA C++ Programming Guide, SIMT Architecture; Aamodt, Fung & Rogers, General-Purpose Graphics Processor Architectures, ch. 2–3.',
      items: [
        { t: 'learn', h: 'One instruction, many lanes', body: 'A **SIMD** unit applies one instruction to many data lanes at once. GPUs present it as **SIMT**: you write a program for **one** thread (one pixel), and the hardware runs a group of threads, a **warp**, in lockstep, one lane each.\n\nIn this course a warp has 8 lanes covering a 4 × 2 block of pixels. NVIDIA warps have 32 threads; AMD wavefronts have 32 or 64.', viz: { k: 'smcore', cap: 'Inside one shader core: the scheduler issues one instruction per cycle for a warp to the lanes, the special-function unit, the load/store unit or the texture unit.' } },
        { t: 'learn', h: 'Each lane has its own registers', body: 'Every lane has its own r0–r15, s0–s31 and condition flags, so each pixel keeps its own values. In the classic SIMT model the warp shares one **program counter**, which is what makes branches interesting (unit 7).' },
        { t: 'mcq', q: 'In SIMT, you write a program for…', opts: ['one thread; the hardware runs many in lockstep', 'a whole warp, using vector instructions', 'the CPU only', 'each pixel, compiled separately'], a: 0, why: 'The compiler sees scalar code per thread; the hardware groups threads into warps.' },
        { t: 'num', q: 'A GPU has 64 shader cores, each with 128 FP32 lanes. How many lanes in total?', a: 8192, why: '64 × 128 = 8,192 lanes.' },
        { t: 'tf', q: 'In the classic SIMT model used in this course, all lanes of a warp share one program counter.', a: true, why: 'One instruction is fetched and issued for the whole warp; a mask says which lanes take part.' },
        { t: 'match', q: 'Match each term to its meaning.', pairs: [['SIMD', 'one instruction on many data lanes'], ['SIMT', 'thread-style programs run in lockstep groups'], ['warp', 'threads issued together'], ['lane', 'one thread’s slot in a warp']], why: 'SIMT is SIMD hardware with a per-thread programming model.' },
        { t: 'num', q: 'An 8-lane warp covers a 4 × 2 pixel block. How many warps cover a 16 × 16 tile?', a: 32, why: '256 pixels ÷ 8 = 32 warps.' }
      ]
    },
    {
      id: 'u6l3', title: 'Counting FLOPS',
      ref: 'Arm Architecture Reference Manual ARMv7-A/R (DDI 0406), VFPv4 VFMA; IEEE 754-2019 fusedMultiplyAdd. Peak FLOPS counts an FMA as two operations.',
      items: [
        { t: 'learn', h: 'Peak throughput', body: 'A fused multiply-add (a × b + c) counts as **2 floating-point operations**. So\n\n```\npeak = cores × lanes × 2 × clock\n```\n\nThe default Card Studio design: 32 cores × 32 lanes × 2 × 2.0 GHz = **4.1 TFLOPS**.', viz: { k: 'gpu', cap: 'The chip: shader cores do the FLOPS; everything around them feeds them.' } },
        { t: 'learn', h: 'Peak is a ceiling', body: 'Real shaders also load memory, branch and wait, so they reach only part of the peak. That is why the Card Studio estimates frame rate from the loads on shaders, memory and ROPs together, and reports which one limits.' },
        { t: 'num', q: '48 cores × 64 lanes at 2.5 GHz. What is the peak in TFLOPS? (2 decimals)', a: 15.36, tol: 0.011, unit: 'TFLOPS', why: '48 × 64 × 2 × 2.5 = 15,360 GFLOPS = 15.36 TFLOPS.' },
        { t: 'num', q: '128 cores × 128 lanes at 2.0 GHz. Peak TFLOPS? (2 decimals)', a: 65.54, tol: 0.011, unit: 'TFLOPS', why: '128 × 128 × 2 × 2.0 = 65,536 GFLOPS ≈ 65.54 TFLOPS.' },
        { t: 'mcq', q: 'Why does an FMA count as two FLOPs?', opts: ['It does a multiply and an add', 'It takes two cycles', 'It uses two lanes', 'It reads two registers'], a: 0, why: 'Peak numbers count operations, and vfma.f32 does two of them (with one rounding).' },
        { t: 'tf', q: 'Doubling the clock doubles peak TFLOPS, everything else equal.', a: true, why: 'Peak is linear in clock; power, however, rises faster (unit 14).' },
        { t: 'num', q: 'A 2 TFLOPS GPU runs a shader of 1,000 FLOPs per pixel. In theory, how many 1080p frames per second is that? (nearest whole number)', a: 965, tol: 1, why: '2 × 10¹² ÷ (2,073,600 × 1,000) ≈ 964.5 frames per second, if nothing else limited it.' }
      ]
    },
    {
      id: 'u6l4', title: 'Hiding latency',
      ref: 'Aamodt, Fung & Rogers, General-Purpose Graphics Processor Architectures, ch. 3; Real-Time Rendering, 4th ed., §23.3 Latency and Occupancy.',
      items: [
        { t: 'learn', h: 'Memory is slow', body: 'A texture fetch or VRAM load takes **hundreds of cycles**. A CPU hides that with caches and out-of-order execution. A GPU keeps **many warps** resident and, every cycle, issues from one that is ready. Switching costs nothing, because every warp’s registers stay in the register file.', viz: { k: 'warps', warps: 2, alu: 4, latency: 24, cycles: 80, cap: 'Two warps, 4 ALU instructions per load, 24-cycle latency: the scheduler often has nothing to issue.' } },
        { t: 'learn', h: 'Enough warps', body: 'Each warp issues ALU + 1 instructions, then waits. With enough warps, some warp is always ready:\n\n```\nwarps = ⌈(ALU + 1 + latency) ÷ (ALU + 1)⌉\n```', viz: { k: 'warps', warps: 6, alu: 4, latency: 24, cycles: 80, cap: 'Six warps: after the start-up, an instruction issues every cycle.' } },
        { t: 'num', q: '4 ALU instructions per load and a 24-cycle latency. How many warps keep the scheduler busy?', a: 6, why: '⌈(4 + 1 + 24) ÷ 5⌉ = ⌈5.8⌉ = 6.' },
        { t: 'num', q: '9 ALU instructions per load and a 40-cycle latency. How many warps?', a: 5, why: '⌈(9 + 1 + 40) ÷ 10⌉ = 5.' },
        { t: 'tf', q: 'Switching between resident warps costs dozens of cycles, like a CPU context switch.', a: false, why: 'Nothing is saved or restored: all resident warps keep their registers on chip.' },
        { t: 'mcq', q: 'Warps wait 100 cycles for each load. What helps most?', opts: ['More resident warps, or more maths per load', 'A higher clock', 'Fewer warps', 'Bigger triangles'], a: 0, why: 'Both make the waiting time a smaller part of each warp’s cycle.' },
        { t: 'num', q: 'One warp issues 5 instructions, then waits 45 cycles. Alone, what fraction of cycles does it keep the scheduler busy? (2 decimals)', a: 0.1, tol: 0.001, why: '5 busy cycles out of every 50 = 0.10. Ten such warps would fill it.' }
      ]
    },
    {
      id: 'u6l5', title: 'The CPU’s share',
      ref: 'Amdahl, “Validity of the single processor approach to achieving large scale computing capabilities”, AFIPS 1967; Vulkan specification, Command Buffers (recording on multiple threads).',
      items: [
        { t: 'learn', h: 'Amdahl’s law', body: 'If only part of the work gets faster, the rest limits you:\n\n```\nspeedup = 1 ÷ ((1 − p) + p ÷ s)\n```\n\nA frame needs CPU work (game logic, building command buffers) and GPU work. They overlap, so the **longer** one sets the frame rate.', viz: { k: 'amdahl', p: 0.9, cap: 'With 90% of the work sped up, the overall speedup can never pass 10×.' } },
        { t: 'learn', h: 'CPU-bound or GPU-bound', body: 'If the GPU waits for commands, the game is **CPU-bound** and a faster card will not help. Vulkan and Direct3D 12 cut CPU cost by recording command buffers on many threads and reusing them.' },
        { t: 'num', q: '90% of the run time is sped up 10×. What is the overall speedup? (2 decimals)', a: 5.26, tol: 0.011, unit: '×', why: '1 ÷ (0.1 + 0.9 ÷ 10) = 1 ÷ 0.19 ≈ 5.26.' },
        { t: 'mcq', q: 'A game runs at 60 fps and the GPU is busy only half of each frame. What is the bottleneck most likely to be?', opts: ['The CPU', 'The GPU', 'VRAM', 'The display'], a: 0, why: 'An idle GPU is waiting for work.' },
        { t: 'tf', q: 'Vulkan lets several CPU threads record command buffers in parallel.', a: true, why: 'Each thread records into its own command buffer from its own command pool.' },
        { t: 'num', q: 'CPU work takes 8 ms per frame and GPU work 12 ms, overlapped. About what frame rate results? (nearest whole number)', a: 83, tol: 1, unit: 'fps', why: 'The longer stage sets the pace: 1000 ÷ 12 ≈ 83 fps.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u7', n: 7, track: 'gpu', tone: 'rd', title: 'The ARM shader core',
  blurb: 'A shader core built from ARMv7 lanes: why a CPU instruction set, VFP floats, writing shaders in assembly, divergence and predication, a texture unit on coprocessor 0, and occupancy.',
  lessons: [
    {
      id: 'u7l1', title: 'Why an ARM core',
      ref: 'Arm Architecture Reference Manual ARMv7-A/R (DDI 0406): A32 conditional execution, VFPv3/VFPv4, coprocessors 0–7 IMPLEMENTATION DEFINED; Seiler et al., “Larrabee: A Many-Core x86 Architecture for Visual Computing”, SIGGRAPH 2008.',
      items: [
        { t: 'learn', h: 'A shader ISA you already read', body: 'This course’s GPU builds each shader lane from an ARMv7 core’s instruction set: **A32** integer code, **VFPv3** single-precision floats, and a **texture unit on coprocessor 0**. ARMv7 leaves coprocessors 0–7 to implementers, so a texture unit fits without inventing new opcodes.\n\nA32 brings one gift a GPU loves: almost every instruction carries a **condition**, so short if/else code needs no branch at all.', viz: { k: 'layers', items: [{ label: 'CP0: texture unit', sub: 'mcrr / mrc', tone: 'f3' }, { label: 'VFPv3', sub: 's0–s31, vadd, vmul, vdiv', tone: 'op' }, { label: 'MUL / MLA', sub: 'multiply, multiply-accumulate', tone: 'rd' }, { label: 'A32', sub: 'integer base, conditions', tone: 'rs1' }], cap: 'The shader ISA used in this course: A32 + VFPv3 + a texture coprocessor.' } },
        { t: 'learn', h: 'Honesty about real GPUs', body: 'Real GPUs, including Arm’s own **Mali** and **Immortalis**, run their own shader instruction sets, designed for wide SIMT lanes; they do not execute A32. Using a CPU instruction set in shader cores has been tried: Intel’s **Larrabee** used x86 cores with wide vector units, and the open-source **Vortex** GPU uses RISC-V.\n\nWe use A32 + VFP so you can read every shader instruction with what you know, and run each one on the course’s emulator.' },
        { t: 'mcq', q: 'Where does this course’s shader core put its texture unit?', opts: ['On coprocessor 0, reached with mcrr and mrc', 'In a new opcode that ARMv7 reserves for GPUs', 'On coprocessor 15, next to the MMU registers', 'In the VFP'], a: 0, why: 'ARMv7 leaves coprocessors 0–7 to implementers; 10 and 11 are VFP and NEON, 14 debug, 15 system control.' },
        { t: 'tf', q: 'Arm’s Mali GPUs execute A32 instructions in their shader cores.', a: false, why: 'Mali shader cores run Arm’s own GPU instruction sets. A32 here is a teaching choice.' },
        { t: 'match', q: 'Match each part of the shader ISA to its role.', pairs: [['A32', 'integer maths, addresses, control'], ['MUL / MLA', 'integer multiply and multiply-accumulate'], ['VFPv3', 'single-precision floats'], ['CP0', 'texture sampling']], why: 'A shader needs integers for addresses and loops, floats for colour maths, and a way to reach the texture unit.' },
        { t: 'mcq', q: 'Why are conditional instructions valuable in a SIMT core?', opts: ['Short if/else code can run without a branch, so a warp never splits', 'They make the clock faster', 'They save registers', 'They replace the texture unit'], a: 0, why: 'Every lane executes the same instructions; those whose condition fails do nothing (lesson 4).' },
        { t: 'mcq', q: 'Which GPU design ran a CPU instruction set in its cores, alongside wide vector units?', opts: ['Intel’s Larrabee (x86)', 'Every NVIDIA GPU', 'Arm Mali', 'The original Voodoo'], a: 0, why: 'Larrabee never shipped as a consumer graphics card; its ideas lived on in the Xeon Phi accelerators.' }
      ]
    },
    {
      id: 'u7l2', title: 'VFP floats',
      ref: 'Arm Architecture Reference Manual ARMv7-A/R (DDI 0406), Floating-point (VFP) instructions: VMOV (immediate), VMLA, VFMA, VCVT, VCMP/VMRS; IEEE 754-2019 binary32.',
      items: [
        { t: 'learn', h: 'Floats in VFP', body: 'VFPv3 gives each lane 32 single-precision registers **s0–s31** (pairs of them form the doubles d0–d15) and IEEE-754 instructions: `vadd.f32`, `vsub.f32`, `vmul.f32`, `vdiv.f32`, `vsqrt.f32`, `vcmp.f32`, conversions with `vcvt`, and multiply-accumulate:\n\n```\nvmla.f32 s0, s1, s2   @ s0 = s0 + s1 × s2, rounded twice\nvfma.f32 s0, s1, s2   @ VFPv4: fused, rounded once\n```', viz: { k: 'field', ins: 'vmul.f32 s0, s1, s2', cap: 'A VFP data-processing instruction: coprocessor 10 means single precision; each register number is split into 4 bits and 1 extra bit.' } },
        { t: 'learn', h: 'Small float immediates', body: 'VFPv3 can encode some constants right in the instruction: **±(16…31)/16 × 2^(−3…4)**, such as 1.0, 0.5, 0.25, 1.5, 3.0 or 8.0. Anything else, and 0.0 too, travels as its IEEE-754 bit pattern through a core register:\n\n```\nvmov.f32 s0, #1.0      @ fits\nldr  r3, =0x3DCCCCCD   @ 0.1 does not: load its bits\nvmov s1, r3\n```', viz: { k: 'float', value: 1, cap: '1.0 = sign 0, exponent 127, fraction 0 = 0x3F800000. Tap bits to explore.' } },
        { t: 'goal', q: 'Make the float hold **2.0**.', viz: { k: 'float', value: 1 }, goal: w => w.bits === 0x40000000, solve: 0x40000000, aText: '0x40000000: sign 0, exponent 128, fraction 0', why: '2.0 = 1.0 × 2¹, so the exponent field is 127 + 1 = 128 = `10000000`.' },

  ['warp', 'A group of threads issued together by one scheduler; 32 on NVIDIA, 32 or 64 on AMD, 8 in this course.'],
  ['lane', 'One thread’s slot in a warp, with its own registers.'],

const QTRI = [[0.6, 0.4], [4.6, 1.2], [1.4, 3.6]];
const quadView = (() => {
  const c = GFX.coverage(QTRI.map(p => ({ x: p[0], y: p[1] })), 6, 'topleft');
  const quads = new Set();
  c.forEach(k => { const [x, y] = k.split(',').map(Number); quads.add((x >> 1) + ',' + (y >> 1)); });
  const grid = [], text = [];
  let helpers = 0;
  for (let y = 0; y < 4; y++) {
    grid.push([]); text.push([]);
    for (let x = 0; x < 6; x++) {
      const k = x + ',' + y, inQuad = quads.has((x >> 1) + ',' + (y >> 1));
      if (c.has(k)) { grid[y].push('var(--brand-2)'); text[y].push(''); }
      else if (inQuad) { grid[y].push('var(--gold-2)'); text[y].push('H'); helpers++; }
      else { grid[y].push(null); text[y].push(''); }
    }
  }
  return { grid, text, covered: c.size, helpers, quads: quads.size };
})();

        { t: 'learn', h: 'The Forge raster unit', body: 'The emulated card’s raster unit lives at `0x3000_1000`. Firmware writes three vertices in **12.4 fixed point**, a colour, the target buffer and its pitch, then a command: **1** = flat triangle, **2** = Gouraud (per-vertex colours), **3** = clear. It follows the top-left rule.', viz: { k: 'table', head: ['Offset', 'Register', 'Meaning'], rows: [['+0x00 … +0x14', 'X0 Y0 X1 Y1 X2 Y2', 'vertices, pixels × 16'], ['+0x18', 'COLOR', '0x00RRGGBB'], ['+0x1C … +0x24', 'C0 C1 C2', 'vertex colours (Gouraud)'], ['+0x28', 'TARGET', 'VRAM address to draw into'], ['+0x2C', 'PITCH', 'bytes per row'], ['+0x30', 'CMD', '1 flat, 2 Gouraud, 3 clear'], ['+0x34', 'STATUS', 'bit 0 busy, bit 1 command dropped'], ['+0x38', 'COUNT', 'pixels written']], mono: [0, 1] } },

  blurb: 'GDDR6, GDDR7 and HBM, bandwidth budgets for a frame, caches and coalescing, and how memory controllers keep many channels busy.',

        { t: 'learn', h: 'Bandwidth', body: '```\nbandwidth = bus width × per-pin rate ÷ 8\n```\n\nA 256-bit GDDR6 bus at 18 Gbit/s gives **576 GB/s**, more than five times a desktop CPU’s dual-channel DDR5 (about 100 GB/s).' },
        { t: 'num', q: 'A 192-bit GDDR6 bus runs at 16 Gbit/s per pin. What is its bandwidth in GB/s?', a: 384, unit: 'GB/s', why: '192 × 16 ÷ 8 = 384 GB/s.' },

        { t: 'learn', h: 'More bits per symbol', body: 'GDDR6 sends one bit per symbol (NRZ: two voltage levels). **GDDR7** uses **PAM3**: three levels, carrying 3 bits in every 2 symbols. Pins run at 28–32 Gbit/s on today’s cards, and the standard (JEDEC JESD239) goes higher.', viz: { k: 'membus', bus: 256, gbps: 28, type: 'GDDR7', cap: 'A 256-bit GDDR7 bus at 28 Gbit/s per pin.' } },

    {

      items: [
        { t: 'learn', h: 'What one frame moves', body: 'Every frame reads and writes colour and depth, reads textures, and the display reads the finished image. Multiply by the frame rate and compare with VRAM bandwidth. Below: a simple renderer at 2560 × 1440, 60 fps, overdraw 3.', viz: { k: 'stack', bars: [{ label: 'colour', parts: [{ v: gbs(fb.color), color: 'var(--f-f3)' }] }, { label: 'depth', parts: [{ v: gbs(fb.depth), color: 'var(--f-rd)' }] }, { label: 'textures', parts: [{ v: gbs(fb.tex), color: 'var(--f-op)' }] }, { label: 'scanout', parts: [{ v: gbs(fb.scanout), color: 'var(--f-f7)' }] }], unit: ' GB/s', fmt: v => v.toFixed(1), lw: 70, cap: 'Depth is read and written; colour and depth are compressed 1.5×; 8 bytes of texture per fragment.' } },

        { t: 'num', q: '400 bytes per pixel per frame at 2560 × 1440 and 60 fps: how many GB/s? (1 decimal)', a: 88.5, tol: 0.06, unit: 'GB/s', why: '2560 × 1440 × 400 × 60 = 88.47 × 10⁹ bytes/s.' },
        { t: 'mcq', q: 'For the same image, which saves the most memory bandwidth?', opts: ['Colour and depth compression', 'A faster CPU', 'More shader cores', 'A bigger power supply'], a: 0, why: 'Compression moves fewer bytes for the same pixels.' },

      items: [

        { t: 'learn', h: 'Coalescing', body: 'When the 32 lanes of a warp load 32 consecutive 4-byte words, the load/store unit merges them into a couple of wide memory transactions. Scattered addresses need up to one transaction per lane: up to 32 times the traffic.' },
        { t: 'num', q: '32 lanes each load the next 4-byte word. How many 64-byte cache lines does the warp touch (aligned start)?', a: 2, why: '32 × 4 = 128 bytes = 2 lines.' },
        { t: 'num', q: '32 lanes load words 256 bytes apart. How many 64-byte lines?', a: 32, why: 'Every lane lands in its own line: 32 lines for 128 useful bytes.' },
        { t: 'mcq', q: 'What does the shared L2 sit in front of?', opts: ['The memory controllers', 'Only the PCIe link', 'The register file', 'The display'], a: 0, why: 'All VRAM traffic passes through it.' },
        { t: 'tf', q: 'A GPU’s L2 cache is shared by all shader cores.', a: true, why: 'L1 and texture caches are per core; L2 is chip-wide.' }

    {
      id: 'u9l5', title: 'Memory controllers',
      ref: 'JEDEC JESD250 (GDDR6): independent channels, refresh and link training sequences.',
      items: [
        { t: 'learn', h: 'Many channels', body: 'The memory system is split into **channels**, two per GDDR6 chip, each with its own controller queue. Addresses are **interleaved** across channels so all of them stay busy. Controllers reorder requests to keep DRAM rows open and to avoid switching between reads and writes too often.', viz: { k: 'gpu', hl: ['mc'], cap: 'Memory controllers, each driving its own chips.' } },
        { t: 'learn', h: 'Refresh and training', body: 'DRAM cells leak, so every row must be **refreshed** regularly. At power-on the controller also **trains** each link: it sweeps timing and voltage references per pin until data is read back reliably (more in unit 15).' },
        { t: 'num', q: '12 GDDR6 chips with 2 channels each: how many channels?', a: 24, why: '12 × 2 = 24 independent channels.' },
        { t: 'mcq', q: 'Why interleave addresses across channels?', opts: ['So consecutive accesses spread over all channels at once', 'To encrypt data', 'To save power', 'To shorten addresses'], a: 0, why: 'A large linear read then uses every channel in parallel.' },
        { t: 'tf', q: 'DRAM keeps its data without refresh as long as power is on.', a: false, why: 'Each cell is a tiny capacitor that leaks; refresh rewrites it within milliseconds.' },
        { t: 'mcq', q: 'What is memory training?', opts: ['Tuning per-pin timing and voltage at power-on until links are reliable', 'Teaching the GPU new shaders', 'Clearing memory to zero', 'Compressing textures'], a: 0, why: 'Every board and chip is slightly different; training measures and compensates.' }
      ]
    }
  ]

  id: 'u10', n: 10, track: 'gpu', tone: 'f3', title: 'The command processor',
