    {
      id: 'u10l1', title: 'Command rings',
      ref: 'Linux kernel docs, Circular Buffers (CIRC_CNT and CIRC_SPACE keep one slot empty); DRM GPU Scheduler (drm_sched).',
      items: [
        { t: 'learn', h: 'A ring of commands', body: 'The driver and the GPU talk through **ring buffers** in memory. The driver writes packets at the **write pointer** (WPTR) and tells the GPU by writing a **doorbell** register. The GPU’s **command processor** reads at the **read pointer** (RPTR) and advances it. Both pointers wrap around at the end.', viz: { k: 'ring', slots: 8, rptr: 2, wptr: 6, cap: 'Four packets queued between RPTR and WPTR.' } },
        { t: 'learn', h: 'Full or empty?', body: 'WPTR == RPTR means **empty**. To tell “full” apart from empty, one slot always stays unused:\n\n```\nqueued = (WPTR − RPTR) mod size\nfree   = size − 1 − queued\n```', viz: { k: 'ring', slots: 8, rptr: 5, wptr: 4, cap: 'A full ring: seven packets queued and one slot left empty on purpose.' } },
        { t: 'num', q: 'A ring has 16 slots. RPTR = 13 and WPTR = 3. How many packets are queued?', a: 6, why: '(3 − 13) mod 16 = 6: slots 13, 14, 15, 0, 1 and 2.' },
        { t: 'num', q: 'A ring has 8 slots. RPTR = 2 and WPTR = 6. How many more packets can the driver write?', a: 3, why: '4 are queued, so free = 8 − 1 − 4 = 3.' },
        { t: 'mcq', q: 'How does the driver tell the GPU that new packets are ready?', opts: ['It writes the new WPTR to a doorbell register', 'It sends the GPU an interrupt', 'It waits for vblank', 'It resets the command processor'], a: 0, why: 'A doorbell is a memory-mapped register (often its own BAR page) that wakes the command processor.' },
        { t: 'tf', q: 'The command processor advances RPTR after consuming a packet.', a: true, why: 'That frees the space for the driver to reuse.' }
      ]
    },
    {
      id: 'u10l2', title: 'Packets',
      ref: 'Forge card firmware (Labs → Forge card emulator, “Command processor: ring buffer”); AMD PM4 packet format (AMD GPU register references and Mesa src/amd); Linux kernel docs, DRM GPU Scheduler.',
      items: [
        { t: 'learn', h: 'A packet language', body: 'Each packet starts with an **opcode** word and is followed by its arguments. The Forge card’s ring uses four packet types. Real GPUs work the same way with hundreds of types: AMD’s **PM4** packets, NVIDIA’s pushbuffer **methods**.', viz: { k: 'table', head: ['Opcode', 'Packet', 'Arguments', 'Size'], rows: [['1', 'clear', 'colour', '8 bytes'], ['2', 'flat triangle', 'x0 y0 x1 y1 x2 y2, colour', '32 bytes'], ['3', 'Gouraud triangle', '(x, y, colour) × 3', '40 bytes'], ['4', 'fence', 'value', '8 bytes']], mono: [0, 3] } },
        { t: 'learn', h: 'Watch the firmware', body: 'The command processor’s firmware loops: read a packet, program the unit it targets, advance RPTR, repeat until it catches up with WPTR.', viz: { k: 'cardrun', preset: 'ring', cap: 'Four packets from the driver: clear, flat triangle, Gouraud triangle, fence.' } },
        { t: 'num', q: 'How many bytes is the Forge ring’s flat-triangle packet?', a: 32, why: 'Opcode + 6 coordinates + colour = 8 words × 4 bytes.' },
        { t: 'num', q: 'The driver queues a clear, two flat triangles and a fence. How many bytes does it write?', a: 80, why: '8 + 2 × 32 + 8 = 80 bytes.' },
        { t: 'order', q: 'Order one turn of the command processor’s loop.', items: ['Compare RPTR with WPTR', 'Read the packet’s opcode', 'Program the unit the packet targets', 'Advance RPTR past the packet'], why: 'If RPTR has caught up with WPTR, the ring is empty and the processor waits.' },
        { t: 'mcq', q: 'The Forge firmware meets an opcode it does not know. What does it do?', opts: ['Stops and reports an error', 'Skips 4 bytes and continues', 'Treats it as a fence', 'Draws a triangle'], a: 0, why: 'Skipping would desynchronise the stream. Real GPUs raise an error interrupt for the driver.' },

      ]

    {
      id: 'u10l3', title: 'Fences and interrupts',
      ref: 'Linux kernel docs, DMA fences (dma_fence); Vulkan specification, Synchronization and Cache Control (fences and semaphores); PCI Express Base Specification, MSI-X.',
      items: [
        { t: 'learn', h: 'How the driver knows work is done', body: 'After a batch of work, the driver queues a **fence** packet with an increasing number. When the GPU reaches it, everything before it has finished. The command processor writes the number to a fence location and raises an **interrupt** (an MSI-X message over PCIe). The kernel then wakes whoever waits on that fence.', viz: { k: 'chain', items: [['driver queues work, then “fence 42”', 'user space waits on fence 42', 'rd'], ['command processor executes the packets', 'on the GPU', 'f3'], ['GPU writes 42 to the fence location', 'memory or a register', 'op'], ['MSI-X interrupt to the CPU', 'a memory write over PCIe', 'f7'], ['kernel signals dma_fence 42', 'waiters wake up', 'rs1']] } },
        { t: 'learn', h: 'Fences everywhere', body: 'Linux represents them as **dma_fence** objects. Vulkan exposes **VkFence** (the CPU waits for the GPU) and **semaphores** (GPU queues wait for each other). Fences on one ring complete **in order**, so “fence value ≥ n” means job n is done.' },
        { t: 'tf', q: 'A ring’s fence register reads 57. Has the job that signals fence 55 finished?', a: true, why: 'Fences on one ring complete in order, so everything up to 57 is done.' },
        { t: 'tf', q: 'The same ring’s fence register reads 57. Has the job that signals fence 60 finished?', a: false, why: 'It is still queued or running.' },
        { t: 'order', q: 'Order the life of a fence.', items: ['The driver queues work and a fence packet', 'The GPU executes the work', 'The GPU writes the fence value', 'An MSI-X interrupt reaches the CPU', 'The kernel wakes the waiting process'], why: 'Interrupts avoid polling, so the CPU can sleep while the GPU works.' },
        { t: 'mcq', q: 'What does a VkFence let you do?', opts: ['Let the CPU wait until submitted GPU work finishes', 'Make two GPU queues wait for each other', 'Lock a buffer for writing', 'Cap the frame rate'], a: 0, why: 'Semaphores order work between queues; fences report completion to the host.' },

    {
      id: 'u10l4', title: 'Dispatching work',
      ref: 'Vulkan specification, Dispatching Commands (vkCmdDispatch, workgroups) and shared memory; Aamodt, Fung & Rogers, General-Purpose Graphics Processor Architectures, ch. 2.',
      items: [
        { t: 'learn', h: 'From packets to warps', body: 'For a draw, the command processor starts the geometry front end, and the rasterizer creates fragment warps for cores with free slots. For compute, a **dispatch** launches a grid of **workgroups**. Each workgroup is split into warps placed on **one** core, where they can share fast **shared memory** and wait at barriers.', viz: { k: 'gpu', hl: ['cp', 'geo', 'rast', 'sm'], cap: 'Work flows from the command processor through the front end to the shader cores.' } },
        { t: 'learn', h: 'Keeping every core fed', body: 'A hardware scheduler hands out workgroups and warps as slots free up. That is why twice the cores run the same frame about twice as fast, until memory bandwidth or the CPU becomes the limit.' },
        { t: 'num', q: '`vkCmdDispatch(100, 1, 1)` with 256 threads per workgroup and 32-lane warps. How many warps run?', a: 800, why: '100 groups × 256 threads ÷ 32 = 800 warps.' },
        { t: 'num', q: 'A 1920 × 1080 image is processed in 16 × 16 workgroups. How many workgroups? Partial groups count.', a: 8160, why: '120 × 68 = 8,160.' },
        { t: 'mcq', q: 'All threads of one workgroup run on…', opts: ['the same shader core, so they can share memory and barriers', 'any core, chosen per thread', 'the CPU', 'different GPUs'], a: 0, why: 'Shared memory is physically inside one core.' },
        { t: 'tf', q: 'The command processor runs the shader programs itself.', a: false, why: 'It only reads commands and launches work; the shader cores run the shaders.' }
      ]
    },
    {
      id: 'u10l5', title: 'Firmware inside the GPU',
      ref: 'Linux kernel docs, Firmware API (request_firmware); NVIDIA open-gpu-kernel-modules documentation (GSP firmware on Turing and later).',
      items: [
        { t: 'learn', h: 'A processor that feeds processors', body: 'The command processor is itself a small CPU running **microcode** that ships with the driver. On the Forge card it is an ARMv7 core running without an MMU, the way a Cortex-R controller works. In real GPUs it may be an Arm core, a RISC-V core or a vendor design; Arm’s newer Mali GPUs run their command-stream firmware on a microcontroller inside the GPU. Its firmware decodes packets, programs units, schedules queues and handles power events.', viz: { k: 'gpu', hl: ['cp', 'mgmt'], cap: 'The command processor and the management core both run firmware.' } },
        { t: 'learn', h: 'NVIDIA’s GSP', body: 'Since the Turing generation, NVIDIA GPUs contain a RISC-V **GPU System Processor (GSP)**. NVIDIA’s open-source kernel modules and the nouveau/NVK stack load **GSP-RM** firmware onto it, moving much of the driver’s work onto the GPU itself.' },
        { t: 'order', q: 'Order how the command processor’s firmware starts.', items: ['The kernel driver probes the card', 'It loads cp.bin with request_firmware()', 'It copies the image into GPU memory', 'It releases the command processor from reset', 'The firmware reports “alive” in a status register'], why: 'Only after the alive check does the driver set up rings and accept work.' },
        { t: 'mcq', q: 'Where does command-processor microcode usually come from?', opts: ['Files shipped with the driver, such as the linux-firmware package', 'The game', 'The monitor', 'The motherboard BIOS'], a: 0, why: 'request_firmware() looks it up under /lib/firmware.' },
        { t: 'tf', q: 'NVIDIA’s GSP is a RISC-V processor inside the GPU.', a: true, why: 'It runs GSP-RM, which handles much of the GPU’s initialisation and management.' },
        { t: 'mcq', q: 'Why put scheduling logic in firmware rather than fixed hardware?', opts: ['It can be fixed and improved after the chip ships', 'Firmware is always faster', 'Hardware cannot schedule', 'To bypass the driver'], a: 0, why: 'Silicon is fixed at tape-out; firmware updates arrive with every driver release.' }

        { t: 'learn', h: 'Interrupts are writes', body: '**MSI-X** gives a device a table of up to 2,048 vectors, each an address plus a data value; the table lives in one of the card’s BARs. To interrupt, the device simply writes that value to that address.' },
        { t: 'num', q: 'A copy engine moves 256 MiB over a Gen 4 ×16 link (31.5 GB/s) at 90% efficiency. How many milliseconds does it take? (1 decimal)', a: 9.5, tol: 0.06, unit: 'ms', why: '268,435,456 bytes ÷ (31.5 × 0.9 × 10⁹ bytes/s) = 9.47 ms.' },
        { t: 'mcq', q: 'Which Command register bit must be set before a GPU may start DMA?', opts: ['Bus Master Enable (bit 2)', 'Memory Space Enable (bit 1)', 'I/O Space Enable (bit 0)', 'Interrupt Disable (bit 10)'], a: 0, why: 'Without it the device may not issue requests on the bus.' },
        { t: 'tf', q: 'Behind an IOMMU, a device can reach only memory that the OS mapped for it.', a: true, why: 'That protects the system from buggy or malicious devices.' },
        { t: 'num', q: 'How many vectors can an MSI-X table hold at most?', a: 2048, why: 'Enough for one interrupt per ring, engine or queue.' },
        { t: 'order', q: 'Order a texture upload by DMA.', items: ['The driver places the texture in pinned host memory', 'It queues a copy packet on the copy engine’s ring', 'The copy engine issues PCIe read requests', 'Completions bring the data, which is written to VRAM', 'A fence signals that the copy is done'], why: 'The CPU never touches the bytes after the first step.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u13', n: 13, track: 'board', tone: 'op', title: 'The circuit board',
  blurb: 'Designing the card’s PCB: placement, layer stack-ups, controlled impedance, timing and length matching, eye diagrams, and vias.',
  lessons: [
    {
      id: 'u13l1', title: 'The board at a glance',
      ref: 'PCI Express Card Electromechanical (CEM) Specification: card outline, edge connector and the 100 MHz reference clock supplied by the slot.',
      items: [
        { t: 'learn', h: 'What sits where', body: 'A graphics card is a large multi-layer **printed circuit board (PCB)**. The GPU package sits in the middle, ringed by GDDR chips. The **VRM** that powers it takes up much of one side. The **PCIe edge fingers** plug into the slot, display connectors sit on the bracket, and a small **SPI flash** holds firmware.', viz: { k: 'board', cap: 'Top view of the card. The PCIe reference clock (100 MHz) comes from the slot; the crystal feeds on-card clocks such as display PLLs.' } },
        { t: 'hotspot', q: 'Tap the **VRM**, which turns 12 V into the core voltage.', viz: { k: 'board' }, a: 'vrm', aText: 'the VRM block beside the GPU', why: 'It sits close to the GPU so the high-current path is short.' },
        { t: 'hotspot', q: 'Tap the **PCIe edge connector**.', viz: { k: 'board' }, a: 'pcie', aText: 'the gold fingers along the bottom edge', why: 'The ×16 fingers carry the lanes, the reference clock and up to 75 W.' },
        { t: 'hotspot', q: 'Tap one of the **GDDR memory** chips.', viz: { k: 'board' }, a: 'vram', aText: 'any VRAM chip around the GPU', why: 'They ring the GPU to keep every trace short.' },
        { t: 'match', q: 'Match each part to its job.', pairs: [['SPI flash', 'VBIOS and firmware images'], ['VRM', '12 V to about 1 V at hundreds of amps'], ['edge fingers', 'the PCIe ×16 connection'], ['crystal', 'reference for on-card clocks']], why: 'Every one of them has to be placed and routed on the PCB.' },
        { t: 'tf', q: 'GDDR chips are placed far from the GPU to spread out their heat.', a: false, why: 'Short traces matter more; the cooler spans both.' }
      ]
    },
    {
      id: 'u13l2', title: 'Layer stack-ups',
      ref: 'IPC-2141A, Design Guide for High-Speed Controlled Impedance Circuit Boards; Johnson & Graham, High-Speed Digital Design.',
      items: [
        { t: 'learn', h: 'Signal next to plane', body: 'Graphics cards use **8–14 copper layers**. Fast signals run on layers right next to solid **ground planes**, which give each signal a clean return path and set its impedance. Power gets its own planes.', viz: { k: 'stackup', cap: 'A 10-layer stack-up: every signal layer touches a ground plane.' } },
        { t: 'learn', h: 'Microstrip and stripline', body: 'A **microstrip** is a trace on an outer layer above one plane; part of its field is in air. A **stripline** is buried between two planes: better shielded, and its signals travel a little slower because their field is entirely in the dielectric.' },
        { t: 'mcq', q: 'Why put a ground plane right next to each high-speed signal layer?', opts: ['It gives the signal a continuous return path and a controlled impedance', 'It makes the board stiffer', 'It carries heat to the fan', 'It saves copper'], a: 0, why: 'Return current flows in the plane right under the trace; gaps in it cause noise and radiation.' },
        { t: 'tf', q: 'A stripline is a trace buried between two reference planes.', a: true, why: 'That is the definition; microstrips run on the surface.' },
        { t: 'mcq', q: 'Which carries signals slightly faster?', opts: ['A microstrip on an outer layer', 'A stripline buried inside', 'They are always the same', 'Neither: both at the speed of light in vacuum'], a: 0, why: 'Part of a microstrip’s field is in air, so its effective εr is lower.' },
        { t: 'num', q: 'A 12-layer board has 4 ground planes and 2 power planes. How many signal layers does that leave?', a: 6, why: '12 − 4 − 2 = 6.' }
      ]
    },
    {
      id: 'u13l3', title: 'Controlled impedance',
      ref: 'IPC-2141A (microstrip and stripline impedance equations); PCI Express CEM Specification (85 Ω differential routing).',
      items: [
        { t: 'learn', h: 'Every trace has an impedance', body: 'A trace’s **characteristic impedance** depends on its width, its height above the plane and the dielectric. Wherever it changes (vias, connectors, a wrong width), part of the signal **reflects**. PCIe pairs are routed at about **85 Ω differential**; HDMI and DisplayPort at about 100 Ω.', viz: { k: 'diffpair', z: 85, cap: 'A differential pair: two equal traces of width w, gap s, height h above the plane.' } },
        { t: 'learn', h: 'Estimates and solvers', body: 'IPC-2141 gives quick estimates, for example for a microstrip:\n\n```\nZ0 ≈ 87 / √(εr + 1.41)\n     × ln(5.98h / (0.8w + t))\n```\n\nReal designs use a field solver and the fabricator’s measured stack-up. Try it in the Board designer lab.' },
        { t: 'num', q: 'Estimate Z0 for a microstrip with εr = 3.8, h = 0.1 mm, w = 0.15 mm and t = 0.035 mm. (Ω, nearest whole number)', a: 51, tol: 1, unit: 'Ω', why: '87 ÷ √5.21 = 38.1; ln(0.598 ÷ 0.155) = 1.35; 38.1 × 1.35 ≈ 51 Ω.' },
        { t: 'mcq', q: 'What happens at an impedance discontinuity?', opts: ['Part of the signal reflects back', 'The signal speeds up', 'Nothing', 'The trace overheats'], a: 0, why: 'Reflections add to later bits and close the eye.' },
        { t: 'mcq', q: 'To lower a trace’s impedance you can…', opts: ['make it wider', 'make it narrower', 'move it farther from the plane', 'use a lower-εr material'], a: 0, why: 'More capacitance per length lowers impedance; the other three raise it.' },
        { t: 'tf', q: 'PCIe add-in cards route their lanes at about 85 Ω differential.', a: true, why: 'The CEM specification targets 85 Ω for the card’s lanes.' }
      ]
    },
    {
      id: 'u13l4', title: 'Timing and length matching',
      ref: 'IPC-2141A; PCI Express Base Specification (receivers deskew lanes individually; intra-pair skew limits).',
      items: [
        { t: 'learn', h: 'Signals take time', body: 'In FR-4 (εr ≈ 4) a signal travels about **0.15 mm per picosecond**: 6.7 ps for every millimetre. At PCIe Gen 5, one bit lasts 31 ps, about 5 mm of trace.', viz: { k: 'table', head: ['Link', 'Bit time', 'Trace length per bit'], rows: [['PCIe Gen 3 (8 GT/s)', '125 ps', '≈ 19 mm'], ['PCIe Gen 4 (16 GT/s)', '62.5 ps', '≈ 9.4 mm'], ['PCIe Gen 5 (32 GT/s)', '31.25 ps', '≈ 4.7 mm'], ['GDDR6 at 18 Gbit/s', '55.6 ps', '≈ 8.3 mm']], mono: [1, 2] } },
        { t: 'learn', h: 'Matching lengths', body: 'The two wires of a differential pair must match to a small fraction of a bit, so routers add tiny **serpentines** to the shorter one. Separate PCIe lanes may differ much more, because each receiver lane is deskewed on its own. GDDR data lines within a byte group are matched tightly.' },
        { t: 'num', q: 'A 100 mm trace in εr = 4. How long is the delay? (ps, nearest whole number)', a: 667, tol: 2, unit: 'ps', why: '100 × √4 ÷ 0.2998 ≈ 667 ps.' },
        { t: 'num', q: 'At PCIe Gen 4 (62.5 ps per bit), a pair’s P and N traces differ by 1 mm (6.67 ps). What percentage of a bit is that? (nearest whole number)', a: 11, tol: 1, unit: '%', why: '6.67 ÷ 62.5 = 10.7%: far too much for one pair.' },
        { t: 'num', q: 'How many millimetres of FR-4 trace equal one bit time at 16 Gbit/s (62.5 ps, 6.67 ps per mm)? (1 decimal)', a: 9.4, tol: 0.06, unit: 'mm', why: '62.5 ÷ 6.67 = 9.4 mm.' },
        { t: 'mcq', q: 'Why are the two traces of a differential pair matched so closely?', opts: ['P/N skew turns into common-mode noise and closes the eye', 'To look tidy', 'To save copper', 'So both carry more current'], a: 0, why: 'A differential receiver needs both halves to switch at the same moment.' },
        { t: 'tf', q: 'Different PCIe lanes must be matched to within a picosecond of each other.', a: false, why: 'Lane-to-lane skew of many bit times is tolerated and removed at the receiver.' }
      ]
    },
    {
      id: 'u13l5', title: 'Eye diagrams',
      ref: 'PCI Express Base Specification, link equalization (Gen 3 and later); Johnson & Graham, High-Speed Digital Design.',
      items: [
        { t: 'learn', h: 'Seeing signal quality', body: 'Overlay many bit periods of a received signal and you get an **eye diagram**. A wide-open eye means the receiver easily tells 1 from 0. Loss, reflections, crosstalk and jitter close it.', viz: { k: 'eye', loss: 0.35, jitter: 0.04, noise: 0.03, cap: 'A healthy channel: the eye is open in the middle.' } },
        { t: 'learn', h: 'Equalisation', body: 'Long channels lose high frequencies, smearing each bit into the next (**inter-symbol interference**). Transmitters pre-emphasise edges; receivers use **CTLE** and **DFE** equalisers to reopen the eye. PCIe Gen 3 and later tune these settings automatically during **link training**.', viz: { k: 'eye', loss: 0.85, jitter: 0.08, noise: 0.05, cap: 'Heavy loss and jitter: the eye has almost closed.' } },
        { t: 'mcq', q: 'A closed eye means…', opts: ['the receiver can no longer reliably tell 1s from 0s', 'the link is idle', 'the signal is too strong', 'the cable is unplugged'], a: 0, why: 'The sampling point no longer separates the two levels.' },
        { t: 'mcq', q: 'What causes inter-symbol interference?', opts: ['Loss that smears each bit into its neighbours', 'Too many lanes', 'A fast clock', 'Short traces'], a: 0, why: 'Slow edges leave each bit still settling when the next arrives.' },
        { t: 'tf', q: 'For PCIe Gen 3 and later, equaliser settings are negotiated automatically during link training.', a: true, why: 'Both ends try presets and keep the best eye.' },
        { t: 'match', q: 'Match each impairment to its description.', pairs: [['jitter', 'edges arrive at uncertain times'], ['loss', 'the channel weakens high frequencies'], ['crosstalk', 'neighbouring traces couple in'], ['reflection', 'energy bounces off impedance changes']], why: 'Each one eats into the eye from a different side.' }
      ]
    },
    {
      id: 'u13l6', title: 'Vias and BGA fan-out',
      ref: 'IPC-2226, Design Standard for High Density Interconnect (blind, buried and via-in-pad structures); Johnson & Graham, High-Speed Digital Design (via stubs).',
      items: [
        { t: 'learn', h: 'Escaping the ball grid', body: 'The GPU sits on a **BGA** package: a grid of well over a thousand solder balls underneath. Signals escape the grid through **vias**, plated holes between layers. **Via-in-pad** puts vias directly under the balls.', viz: { k: 'stackup', hl: [0, 2], cap: 'A signal dropping from layer 1 to layer 3 through a via leaves an unused stub below layer 3, unless it is drilled out.' } },
        { t: 'learn', h: 'Stubs resonate', body: 'A through-hole via that only goes from layer 1 to layer 3 still has copper all the way down. That **stub** resonates at f ≈ 1 ÷ (4 × its delay) and notches out high frequencies. Fast boards **back-drill** the stubs away or use blind and buried vias.' },
        { t: 'num', q: 'A 1.5 mm via stub has a delay of 10 ps. At about what frequency does it resonate, f = 1 ÷ (4 × delay)? (GHz)', a: 25, tol: 0.5, unit: 'GHz', why: '1 ÷ 40 ps = 25 GHz: right where PCIe Gen 5 and 6 signals have energy.' },
        { t: 'mcq', q: 'What is back-drilling?', opts: ['Drilling out the unused part of a via', 'Drilling holes for screws', 'Repairing a broken trace', 'Cooling a via'], a: 0, why: 'A slightly larger drill removes the plating below the last used layer.' },
        { t: 'tf', q: 'A BGA package connects to the board through solder balls on its underside.', a: true, why: 'Ball grid array: the whole underside is used for connections.' },
        { t: 'mcq', q: 'Why are vias a concern for 32 GT/s signals?', opts: ['Their stubs and impedance changes reflect and resonate', 'They are too short', 'They carry power', 'They block airflow'], a: 0, why: 'At these speeds every millimetre of discontinuity matters.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u14', n: 14, track: 'board', tone: 'rs2', title: 'Power and cooling',
  blurb: 'Feeding hundreds of watts into a chip running at about one volt: connectors, multiphase VRMs, power integrity, voltage–frequency scaling and cooling.',
  lessons: [
    {
      id: 'u14l1', title: 'Power inputs',
      ref: 'PCI Express CEM Specification (75 W from an x16 slot); PCIe x16 Graphics 150W-ATX Specification (6-pin); PCIe 225 W/300 W High Power CEM Specification (8-pin); PCIe CEM 5.1 (12V-2x6 with sense pins).',
      items: [
        { t: 'learn', h: 'Slot plus cables', body: 'A graphics card takes power from the **×16 slot**, up to **75 W** (mostly 12 V), and from auxiliary cables: a **6-pin** adds 75 W, an **8-pin** 150 W, and the newer **12V-2x6** connector up to **600 W**, its limit set by sense pins that tell the card what the power supply allows.', viz: { k: 'board', hl: ['power', 'pcie'], cap: 'Power enters through the slot and the auxiliary connector.' } },
        { t: 'num', q: 'A card has one 8-pin and one 6-pin connector plus the slot. What is its maximum power by the specifications?', a: 300, unit: 'W', why: '75 + 150 + 75 = 300 W.' },
        { t: 'num', q: 'A card draws 450 W. How many 8-pin connectors (plus the slot) does it need at minimum?', a: 3, why: '75 + 2 × 150 = 375 W is not enough; 75 + 3 × 150 = 525 W is. Or one 12V-2x6.' },
        { t: 'mcq', q: 'How does a 12V-2x6 connector tell the card how much power the supply can deliver?', opts: ['Through sense pins', 'With a PCIe message', 'Through the EDID', 'Through the fan header'], a: 0, why: 'The sideband sense pins encode 150, 300, 450 or 600 W.' },
        { t: 'tf', q: 'The PCIe ×16 slot can supply up to 75 W to a graphics card.', a: true, why: 'About 66 W on 12 V and 10 W on 3.3 V, 75 W in total.' },
        { t: 'num', q: 'The slot’s 12 V rail allows 5.5 A. How many watts is that?', a: 66, unit: 'W', why: '12 × 5.5 = 66 W.' }
      ]
    },
    {
      id: 'u14l2', title: 'The VRM',
      ref: 'Erickson & Maksimović, Fundamentals of Power Electronics (buck converters and multiphase interleaving).',
      items: [
        { t: 'learn', h: 'A multiphase buck converter', body: 'The GPU core runs at about **0.7–1.1 V** but draws hundreds of amps. The **voltage regulator module (VRM)** is a multiphase buck converter: several **phases**, each a power stage plus an inductor, share the current and switch out of step so their ripples partly cancel.', viz: { k: 'vrm', phases: 6, amps: 300, volts: 0.9, cap: 'Six phases sharing 300 A at 0.9 V.' } },
        { t: 'learn', h: 'Current is the hard part', body: 'I = P ÷ V. 270 W at 0.9 V is **300 A**, through copper planes and dozens of package balls. Each phase is sized for a comfortable current, and more phases spread the heat. At 90% efficiency the VRM itself turns 10% of its input into heat.' },
        { t: 'num', q: 'The core draws 300 W at 0.9 V, and each phase can supply 40 A. How many phases are needed at minimum?', a: 9, why: '300 ÷ 0.9 = 333 A; 333 ÷ 40 = 8.3 → 9 phases.' },
        { t: 'num', q: 'How many amps does 250 W at 0.85 V take? (nearest whole number)', a: 294, tol: 0.6, unit: 'A', why: '250 ÷ 0.85 = 294 A.' },
        { t: 'num', q: 'A VRM is 90% efficient and delivers 270 W to the core. How many watts does the VRM itself turn into heat?', a: 30, tol: 0.1, unit: 'W', why: 'Input = 270 ÷ 0.9 = 300 W; loss = 30 W.' },
        { t: 'mcq', q: 'Why do the phases switch out of step (interleaved)?', opts: ['Their ripple currents partly cancel', 'To save fan power', 'To raise the clock', 'To reduce VRAM latency'], a: 0, why: 'Interleaving also multiplies the effective ripple frequency, so smaller capacitors suffice.' },
        { t: 'tf', q: 'A buck converter steps voltage down while stepping current up.', a: true, why: 'Power in ≈ power out: 12 V × 25 A in becomes about 1 V × 300 A out, minus losses.' }
      ]
    },
    {
      id: 'u14l3', title: 'Power integrity',
      ref: 'Smith & Bogatin, Principles of Power Integrity for PDN Design: target impedance and decoupling.',
      items: [
        { t: 'learn', h: 'Holding the voltage steady', body: 'When thousands of lanes start switching, current jumps by **tens of amps within nanoseconds**, yet the voltage must not dip more than a few percent. The **power distribution network** (planes, hundreds of capacitors under the GPU, capacitance in the package and on the die) must keep its impedance below a **target**:\n\n```\nZ_target = V × ripple ÷ ΔI\n```', viz: { k: 'board', hl: ['gpu', 'vrm'], cap: 'Decoupling capacitors crowd the back of the board right under the GPU.' } },
        { t: 'learn', h: 'Fast and slow', body: 'The VRM’s control loop handles slow changes, over microseconds. Faster spikes come from the board capacitors, and the fastest from the package and on-die capacitance, because only they are close enough.' },
        { t: 'num', q: 'The rail is 0.9 V and may move 3%. The load can jump 100 A. What target impedance is needed? (milliohms, 2 decimals)', a: 0.27, tol: 0.006, unit: 'mΩ', why: '0.9 × 0.03 ÷ 100 = 0.00027 Ω = 0.27 mΩ.' },
        { t: 'num', q: '1.0 V, 5% allowed, a 50 A step. Target impedance in milliohms?', a: 1, tol: 0.01, unit: 'mΩ', why: '1.0 × 0.05 ÷ 50 = 0.001 Ω.' },
        { t: 'mcq', q: 'Why are many small capacitors placed right under the GPU?', opts: ['They supply fast current changes through very little inductance', 'For decoration', 'To filter the display signal', 'To store firmware'], a: 0, why: 'Distance means inductance, and inductance blocks fast current.' },
        { t: 'tf', q: 'A lower target impedance means a stiffer supply.', a: true, why: 'The same current step causes a smaller voltage change.' },
        { t: 'mcq', q: 'Which changes does the VRM’s control loop handle best?', opts: ['Slow ones, over microseconds and longer', 'Nanosecond spikes', 'Display timing', 'PCIe errors'], a: 0, why: 'Its bandwidth is far too low for nanosecond steps.' }
      ]
    },
    {
      id: 'u14l4', title: 'Dynamic power and DVFS',
      ref: 'Weste & Harris, CMOS VLSI Design, 4th ed., ch. 5 Power (P = α·C·V²·f, leakage).',
      items: [
        { t: 'learn', h: 'Voltage counts twice', body: 'CMOS switching power is\n\n```\nP = α · C · V² · f\n```\n\nVoltage counts **squared**, and higher clocks need higher voltage, so the last few hundred MHz cost a lot of watts. **DVFS** (dynamic voltage and frequency scaling) lets firmware pick voltage–frequency pairs on the fly, inside power and temperature limits.', viz: { k: 'line', series: [{ pts: dvfsPts, color: 'var(--f-f3)', name: 'relative power', area: true }], xmin: 0.5, xmax: 3, ymin: 0, xlab: 'core clock (GHz)', ylab: 'power, % of 2.0 GHz', xticks: [0.5, 1, 1.5, 2, 2.5, 3], cap: 'With voltage rising alongside the clock (0.7 V + 0.12 V per GHz), power grows faster than linearly.' } },
        { t: 'num', q: 'A core burns 200 W at 0.9 V and 2.0 GHz. About how much at 1.0 V and 2.4 GHz? (W, nearest whole number)', a: 296, tol: 1, unit: 'W', why: '200 × (1.0 ÷ 0.9)² × (2.4 ÷ 2.0) = 296 W: 20% more speed for 48% more power.' },
        { t: 'num', q: 'Undervolting from 1.0 V to 0.9 V at the same clock saves what percentage of dynamic power? (nearest whole number)', a: 19, tol: 0.6, unit: '%', why: '0.9² = 0.81, so 19% less.' },
        { t: 'mcq', q: 'What does DVFS adjust?', opts: ['Voltage and frequency together', 'Only the fan speed', 'Only the resolution', 'The PCIe generation'], a: 0, why: 'Lower clocks allow lower voltage, which saves power quadratically.' },
        { t: 'tf', q: 'Leakage (static) power flows even when no transistor switches.', a: true, why: 'Transistors never turn off perfectly; leakage rises with temperature.' }
      ]
    },
    {
      id: 'u14l5', title: 'Cooling',
      ref: 'JEDEC JESD51 series (thermal test methods and θ metrics); Forge card management block (Reference tab → Forge card emulator).',
      items: [
        { t: 'learn', h: 'Watts become heat', body: 'All the power ends up as heat. The chip’s junction temperature is\n\n```\nTj = T_air + P × θ\n```\n\nwhere θ (°C/W) is the thermal resistance from die to air: thermal paste, a vapour chamber or heat pipes, fins and fans. Management firmware runs a **fan curve** and throttles if Tj passes a limit.', viz: { k: 'cardrun', preset: 'fan', code: false, cap: 'A fan curve: quiet when cool, full speed by 85 °C. A gaming load starts after 4 seconds.' } },
        { t: 'learn', h: 'Without fan control', body: 'With the fan stuck at a low duty, the same load heats the chip until it **throttles**: hardware cuts clocks to protect itself, and performance drops.', viz: { k: 'cardrun', preset: 'fixedfan', code: false, cap: 'Fan stuck at duty 60: the temperature climbs past 95 °C and the chip throttles.' } },
        { t: 'num', q: 'A GPU dissipates 300 W with θ = 0.15 °C/W in 35 °C air. What is its junction temperature?', a: 80, tol: 0.5, unit: '°C', why: '35 + 300 × 0.15 = 80 °C.' },
        { t: 'num', q: 'A 250 W GPU in 40 °C air must stay at or below 90 °C. What is the largest θ the cooler may have? (°C/W, 1 decimal)', a: 0.2, tol: 0.001, unit: '°C/W', why: '(90 − 40) ÷ 250 = 0.2 °C/W.' },
        { t: 'mcq', q: 'What does thermal throttling do?', opts: ['Lowers clocks and power to bring the temperature down', 'Only speeds up the fan', 'Turns off the display', 'Raises the voltage'], a: 0, why: 'Less power means less heat, at the cost of speed.' },
        { t: 'tf', q: 'Doubling the fan speed halves the junction temperature in °C.', a: false, why: 'It lowers θ somewhat; Tj never drops below the air temperature.' },
        { t: 'order', q: 'Order one pass of the management firmware’s fan loop.', items: ['Read the die temperature', 'Look up the duty on the fan curve', 'Write the fan duty register', 'Wait for the next sample'], why: 'The loop repeats a few times a second.' }
      ]
    }
  ]
});

FORGE.glossary.push(
  ['PCIe lane', 'Two differential pairs, one per direction, running a serial link.'],
  ['GT/s', 'Gigatransfers per second: symbol rate per lane before line coding.'],
  ['8b/10b', 'Line code that sends each byte as 10 bits (PCIe Gen 1–2, HDMI TMDS).'],
  ['128b/130b', 'Line code with 2 sync bits per 128 data bits and scrambling (PCIe Gen 3–5).'],
  ['PAM4', 'Four-level signalling: 2 bits per symbol (PCIe Gen 6 and 7).'],
  ['FLIT', 'Fixed-size unit of PCIe Gen 6/7 transfers, protected by forward error correction.'],
  ['TLP', 'Transaction layer packet: a PCIe request or completion with header and optional data.'],
  ['posted write', 'A PCIe write that needs no completion from its destination.'],
  ['completion', 'The TLP that answers a non-posted request such as a read, carrying its data.'],
  ['configuration space', 'Each PCIe function’s registers: IDs, class code, command, BARs and capabilities.'],
  ['ECAM', 'Enhanced Configuration Access Mechanism: memory-mapped configuration space, 4 KiB per function.'],
  ['class code', 'Three bytes identifying a device type; 0x030000 = VGA-compatible display controller.'],
  ['BAR', 'Base Address Register: where one of a device’s memory or I/O windows is mapped.'],
  ['Resizable BAR', 'A PCIe capability letting the OS map a larger window, such as all of VRAM.'],
  ['bus mastering', 'A device issuing its own memory reads and writes (DMA); enabled in the Command register.'],
  ['DMA', 'Direct memory access: a device moving data without the CPU copying it.'],
  ['IOMMU', 'Translates and restricts the addresses a device may access.'],
  ['PCB', 'Printed circuit board: layers of copper and dielectric carrying the card’s circuits.'],
  ['stack-up', 'The order and thickness of a PCB’s copper and dielectric layers.'],
  ['microstrip', 'A trace on an outer layer above a reference plane.'],
  ['stripline', 'A trace between two reference planes inside the board.'],
  ['characteristic impedance', 'The ratio of voltage to current of a wave on a trace, set by its geometry.'],
  ['differential pair', 'Two traces carrying opposite signals; the receiver looks at their difference.'],
  ['skew', 'Difference in arrival time between signals that should arrive together.'],
  ['eye diagram', 'Many bit periods overlaid; its opening shows how reliably bits can be read.'],
  ['equalisation', 'Pre-emphasis, CTLE and DFE circuits that undo channel loss.'],
  ['via', 'A plated hole connecting PCB layers.'],

        { t: 'learn', h: 'Divergence costs time', body: 'All 8 lanes of a warp issue together. When a branch sends some lanes one way and some the other, the warp runs **both** paths, with part of the lanes idle each time.\n\nA branch-free version avoids that, and ARM makes it easy: set the flags once, then let **conditional instructions** (`ldrne`, `ldreq`, `vmovne`…) choose the values. Every lane runs every instruction; lanes whose condition fails do nothing, and the warp never splits.', viz: { k: 'simt', preset: 'checker', cap: 'The branchy checkerboard: warps straddling two squares run both paths.' } },
        code(DIY.sh_branchless, 'Rewrite the checkerboard’s colour choice **without branches**: same picture, no divergent warps.', 'Compilers do this automatically for short branches ("if-conversion"); in GPU hardware the equivalent is a predicate register per lane.'),
        { t: 'mcq', q: 'After `tst r3, #1` on a light square (bit 0 of r3 is 1), which conditional instructions take effect?', opts: ['The …ne ones: Z = 0', 'The …eq ones: Z = 1', 'Both', 'Neither'], a: 0, why: 'tst sets Z when the AND result is zero. Bit 0 is set, so Z = 0 and ne passes.' },
        { t: 'tf', q: 'A loop whose trip count differs between lanes also causes divergence.', a: true, why: 'Lanes that finish early wait while the others keep looping: the fractal preset shows it.' },
        { t: 'num', q: 'A warp of 8 lanes splits 5/3 at a branch, each side 4 instructions long. How many issue slots do those 8 instructions take?', a: 8, why: 'Both sides issue one after the other: 4 + 4 = 8 slots instead of 4.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u22', n: 22, track: 'diy', tone: 'rs1', title: 'Write the card firmware',
  blurb: 'The ARMv7 command processor on the card is yours to program: light up the display, drive the raster unit, run the command ring and keep the chip cool.',
  lessons: [
    {
      id: 'u22l1', title: 'First light',
      ref: 'Forge card emulator: display controller at 0x1000_0000 (BASE +4, PITCH +0x10, FORMAT +0x14, CTRL +0, FRAME +0x18); scanout and pitch in any display engine (e.g. Linux DRM framebuffer pitches).',
      items: [
        { t: 'learn', h: 'Scanout', body: 'The display engine reads a framebuffer from VRAM, row by row, many times a second. It needs to know:\n\n- **BASE**: where the first pixel is\n- **PITCH**: how many bytes from one row to the next (≥ width × bytes per pixel)\n- **FORMAT**: how to read a pixel (XRGB8888: 4 bytes)\n- **CTRL**: on or off', viz: { k: 'scanout' } },
        code(DIY.cd_light, 'The image is already in VRAM. Program the display controller so it appears on the monitor.', 'A wrong pitch shears the picture diagonally; a wrong base shows another part of memory. Drivers set exactly these registers in their modeset code.'),
        { t: 'num', q: 'A 1920-pixel-wide XRGB8888 framebuffer is padded so each row starts on a 256-byte boundary. What is the pitch in bytes?', a: 7680, why: '1920 × 4 = 7680, already a multiple of 256 (30 × 256).' },
        { t: 'mcq', q: 'Why might the pitch be larger than width × bytes per pixel?', opts: ['Rows are padded for alignment the memory or display engine prefers', 'To store the alpha channel', 'For the cursor', 'It never is'], a: 0, why: 'Hardware often wants row starts on 64- or 256-byte boundaries, so drivers pad each row.' },
        { t: 'tf', q: 'The display controller can show a buffer while the CPU draws the next one somewhere else in VRAM.', a: true, why: 'Point BASE at another buffer and flip at vblank: double buffering.' }
      ]
    },
    {
      id: 'u22l2', title: 'Drive the raster unit',
      ref: 'Forge card emulator: raster unit at 0x1000_1000 (X0…Y2 in 12.4 fixed point, COLOR, TARGET, PITCH, CMD, STATUS busy bit); fixed-point vertex coordinates (Direct3D rasterization rules, 8-bit subpixel precision).',
      items: [
        { t: 'learn', h: 'Fixed-function help', body: 'Rasterizing in software costs about ten instructions per pixel. The **raster unit** does it in hardware: firmware writes three vertices, a colour and a command, then polls **STATUS** until the unit is idle.\n\nVertices are **12.4 fixed point**: the pixel position × 16, so 4 bits of sub-pixel precision.', viz: { k: 'table', head: ['Register', 'Offset', 'Meaning'], rows: [['X0 Y0 X1 Y1 X2 Y2', '0x00–0x14', 'vertices, pixels × 16'], ['COLOR', '0x18', '0x00RRGGBB'], ['TARGET, PITCH', '0x28, 0x2C', 'where to draw'], ['CMD', '0x30', '1 flat, 2 Gouraud, 3 clear'], ['STATUS', '0x34', 'bit 0 busy']], mono: [1] } },
        code(DIY.cd_raster, 'Write the three vertices (20, 10), (140, 30), (60, 110) into the raster unit in **12.4 fixed point**.', 'The assembler computes `20 * 16` for you in `ldr r0, =20 * 16`; with stm you could even write all six registers in one instruction. Sub-pixel bits let triangles move smoothly instead of snapping to whole pixels.'),
        { t: 'num', q: 'A vertex sits at x = 20.5 pixels. What is X in 12.4 fixed point?', a: 328, why: '20.5 × 16 = 328 (0x148).' },
        { t: 'tf', q: 'Writing CMD while STATUS says busy queues the command for later.', a: false, why: 'This unit drops it and flags an overrun, so firmware must poll first. Real GPUs use FIFOs, which can still fill up.' },
        { t: 'mcq', q: 'Drawing the same triangle in software took over 100,000 instructions. Why so few here?', opts: ['The raster unit tests pixels in hardware; firmware only writes a few registers', 'The triangle is smaller', 'The CPU is faster', 'Software drawing was wrong'], a: 0, why: 'Fixed-function units exist because the same work, every frame, is cheaper in silicon.' }
      ]
    },
    {
      id: 'u22l3', title: 'The command processor',
      ref: 'Linux kernel docs: Circular Buffers (CIRC_CNT/CIRC_SPACE); DRM GPU scheduler and dma_fence; AMD PM4 and similar packet-based command formats.',
      items: [
        { t: 'learn', h: 'Packets in a ring', body: 'The driver writes **packets** into a ring in memory and advances the write pointer (the doorbell). The command processor reads each packet, executes it, advances its **read pointer** and writes it back, so the driver knows which space it may reuse.\n\nA **fence** packet writes a value the driver waits on and raises an interrupt: “everything before this is done.”', viz: { k: 'ring', slots: 8, rptr: 2, wptr: 6 } },
        code(DIY.cd_fence, 'Finish the **fence** packet: signal its value to the host and step past it.', 'Fences are how the whole stack synchronises: the kernel turns them into dma_fence objects that user space and other drivers wait on.'),
        { t: 'order', q: 'Order one trip around the command processor’s loop.', items: ['Compare the read pointer with the write pointer', 'Read the packet’s opcode', 'Execute it', 'Advance the read pointer by the packet’s size', 'Publish the read pointer to the host'], why: 'If the read pointer catches up with the write pointer, the ring is empty and the processor idles.' },
        { t: 'mcq', q: 'What would happen if the firmware never published its read pointer?', opts: ['The driver would think the ring is full and stop submitting', 'Nothing', 'The GPU would draw twice as fast', 'Fences would fire twice'], a: 0, why: 'The driver only reuses space it knows has been consumed.' },
        { t: 'num', q: 'A ring holds 4096 bytes. The read pointer is at 3800 and the write pointer at 200 (it wrapped). How many bytes are queued?', a: 496, why: '(200 − 3800 + 4096) mod 4096 = 496.' }
      ]
    },
    {
      id: 'u22l4', title: 'Keep it cool',
      ref: 'Forge card emulator: management block at 0x1000_3000 (TEMP, FAN duty, RPM, POWER); fan curves and thermal throttling as in GPU management firmware.',
      items: [
        { t: 'learn', h: 'A control loop', body: 'Management firmware reads the die temperature and sets the fan: quiet when cool, full speed when hot, smoothly in between. If it gets this wrong, the hardware protects itself by **throttling** clocks at 95 °C, and the game stutters.', viz: { k: 'line', series: [{ name: 'duty', pts: [[30, 60], [50, 60], [85, 255], [100, 255]], color: 'var(--brand)' }], xlab: 'die temperature (°C)', ylab: 'fan duty (0–255)', xmin: 30, xmax: 100, ymin: 0, ymax: 270 } },
        code(DIY.cd_fan, 'Replace the fixed fan duty with a **control loop** that follows the curve, so the card never throttles.', 'Real firmware adds hysteresis (so the fan does not hunt up and down), ramp limits, and reports temperatures to the driver.'),
        { t: 'num', q: 'With duty = 60 + (T − 50) × 89 ÷ 16, what duty does 71 °C give? (integer division)', a: 176, why: '(71 − 50) × 89 = 1,869; 1,869 ÷ 16 = 116 (a shift right by 4); 60 + 116 = 176. The curve approximates × 195 ÷ 35 without a divide instruction.' },
        { t: 'mcq', q: 'Why poll the temperature every ~50 ms rather than once per second?', opts: ['A heavy load heats the chip within a fraction of a second', 'Sensors need constant reading', 'To save power', 'The fan needs commands to spin'], a: 0, why: 'A slow loop reacts too late to sudden load.' },
        { t: 'tf', q: 'Throttling is the hardware protecting itself when firmware keeps the chip too hot.', a: true, why: 'It saves the chip, but the drop in clocks shows up as stutter.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u23', n: 23, track: 'diy', tone: 'rd', title: 'Write the driver',
  blurb: 'The host side: the command stream your driver queues, and the Linux DRM driver that probes the card, manages its memory, waits on fences and drives displays.',
  lessons: [
    {
      id: 'u23l1', title: 'The command stream',
      ref: 'Linux DRM: job submission ioctls and the GPU scheduler (drm_sched); command packet formats such as AMD PM4.',
      items: [
        { t: 'learn', h: 'What a driver really sends', body: 'However high-level the API, everything a driver does ends as **packets in a ring** plus a doorbell write. A draw call becomes state packets and a draw packet; a frame ends with a fence so the driver knows when the buffer is free again.', viz: { k: 'chain', items: [['vkCmdDraw / glDrawArrays', 'application', 'op'], ['user-space driver', 'builds packets in a command buffer', 'rs2'], ['submit ioctl', 'kernel validates and queues the job', 'rs1'], ['ring + doorbell', 'command processor starts', 'f3'], ['fence interrupt', 'job done', 'rd']] } },
        code(DIY.cd_driver, 'Be the driver: write the packets that clear the screen, draw the red triangle and signal **fence 7**.', 'Packet streams like this are a GPU’s real interface; documenting them (as AMD does for PM4) is what makes open drivers possible.'),
        { t: 'match', q: 'Match each packet to its effect on the card.', pairs: [['[1, colour]', 'clear the render target'], ['[2, x0 … y2, colour]', 'draw a flat triangle'], ['[3, x0, y0, c0 …]', 'draw a Gouraud-shaded triangle'], ['[4, value]', 'signal a fence to the host']], why: 'Opcode first, then a fixed number of arguments: the firmware knows how far to advance.' },
        { t: 'mcq', q: 'Why does the driver wait for a fence before reusing a vertex buffer?', opts: ['The GPU may still be reading it', 'Fences clear memory', 'To slow the CPU down', 'The kernel requires one fence per frame'], a: 0, why: 'CPU and GPU run asynchronously; the fence says the GPU has finished with it.' },
        { t: 'tf', q: 'The doorbell write tells the command processor that new packets are waiting.', a: true, why: 'It updates the write pointer the firmware compares against.' }
      ]
    },
    {
      id: 'u23l2', title: 'A Linux DRM driver, step by step',
      ref: 'Linux kernel docs: How To Write Linux PCI Drivers; DRM Internals (drm_dev_register, devm_drm_dev_alloc); DMA API (dma_set_mask_and_coherent); Firmware API (request_firmware).',
      items: [
        { t: 'learn', h: 'Probe', body: 'A kernel driver registers a table of PCI IDs. When the bus finds a matching card, the kernel calls **probe**: enable the device, allow DMA, map the register BAR, load firmware, then register a DRM device so user space gets /dev/dri/card0.', viz: { k: 'code', text: 'static const struct pci_device_id forge_ids[] = {\n    { PCI_DEVICE(0x1F00, 0x0001) },   /* your vendor/device ID */\n    { }\n};\nstatic int forge_probe(struct pci_dev *pdev,\n                       const struct pci_device_id *id)\n{\n    pcim_enable_device(pdev);\n    pci_set_master(pdev);\n    dma_set_mask_and_coherent(&pdev->dev, DMA_BIT_MASK(40));\n    /* map BAR 0, request_firmware(), start the CP */\n    return drm_dev_register(drm, 0);\n}', hl: [2, 8, 9, 10, 12] } },
        { t: 'order', q: 'Order the probe steps.', items: ['Enable the PCI device', 'Allow bus mastering (DMA)', 'Set the DMA mask', 'Map the register BAR', 'Load and start the firmware', 'Register the DRM device'], why: 'Registering last means user space never sees a half-initialised device.' },
        { t: 'fill', q: 'Complete the ID table entry for vendor 0x1F00, device 0x0001.', text: '{ ___(0x1F00, 0x0001) }', blanks: ['PCI_DEVICE'], extra: ['PCI_VDEVICE', 'MODULE_DEVICE_TABLE'], why: 'PCI_DEVICE fills vendor and device and matches any subsystem.' },
        { t: 'mcq', q: 'Your card has no PCI vendor ID yet. What do you need?', opts: ['A vendor ID assigned by PCI-SIG (membership), or a sub-allocated device ID from another vendor', 'Nothing: pick any number', 'A USB ID', 'A device tree node'], a: 0, why: 'IDs must be unique so drivers bind to the right hardware.' },
        { t: 'tf', q: 'A DRM driver must be part of the kernel source tree to work.', a: false, why: 'Out-of-tree modules work, but upstream drivers get maintained across kernel changes, which is why you should upstream yours.' }
      ]
    },
    {
      id: 'u23l3', title: 'Memory, fences and interrupts',
      ref: 'Linux DRM: GEM (drm_gem_object), TTM for discrete VRAM, GPU VA management (drm_gpuvm), dma_fence and the DRM GPU scheduler.',
      items: [
        { t: 'learn', h: 'Buffers and their lifetime', body: 'User space allocates GPU buffers through **GEM** objects (handles, mmap). Cards with their own VRAM add **TTM**, which moves buffers between VRAM and system memory. Each process gets its own GPU page tables.\n\nWhen the command processor writes a fence, the card raises an **interrupt**; the driver signals the matching **dma_fence**, and the **GPU scheduler** feeds the next job.', viz: { k: 'chain', items: [['GEM buffer', 'create, mmap, bind to GPU VA', 'op'], ['job with fences', 'submit ioctl', 'rs1'], ['drm_sched', 'queues jobs per ring', 'rs2'], ['interrupt handler', 'reads the fence value', 'f3'], ['dma_fence_signal', 'waiters wake up', 'rd']] } },
        { t: 'match', q: 'Match each kernel piece to its job.', pairs: [['GEM', 'buffer objects and handles'], ['TTM', 'moving buffers in and out of VRAM'], ['drm_sched', 'queueing jobs to the hardware'], ['dma_fence', 'signalling that work finished']], why: 'Reusing these shared pieces is most of what makes a new DRM driver small.' },
        { t: 'mcq', q: 'The fence interrupt arrives. What must the handler do quickly?', opts: ['Read the fence value and signal the finished jobs’ dma_fences', 'Recompile shaders', 'Allocate VRAM', 'Reset the GPU'], a: 0, why: 'Interrupt handlers stay short; heavier work moves to threads or workqueues.' },
        { t: 'tf', q: 'Each process should get its own GPU virtual address space.', a: true, why: 'Otherwise one program’s shaders could read another’s buffers.' },
        { t: 'num', q: 'A card has 16 GiB of VRAM and a 256 MiB BAR. How many 256 MiB windows would the CPU need to reach all of VRAM without Resizable BAR?', a: 64, why: '16 GiB ÷ 256 MiB = 64. TTM moves buffers so the CPU rarely needs direct access to all of it.' }
      ]
    },
    {
      id: 'u23l4', title: 'Displays (KMS)',
      ref: 'Linux DRM KMS: planes, CRTCs, encoders, connectors, atomic modesetting helpers and vblank events (Documentation/gpu/drm-kms.rst).',
      items: [
        { t: 'learn', h: 'The KMS pipeline', body: 'Kernel modesetting describes the display path as objects: **planes** (framebuffers to show) feed a **CRTC** (timing, scanout), which drives an **encoder** (HDMI, DisplayPort) and a **connector** (the port). An **atomic commit** changes them all at once or not at all; page flips complete at **vblank**.', viz: { k: 'chain', items: [['framebuffer', 'in VRAM', 'op'], ['plane', 'primary, cursor, overlays', 'rs2'], ['CRTC', 'timing + scanout', 'f3'], ['encoder', 'HDMI / DP', 'rs1'], ['connector', 'the port and its EDID', 'rd']] } },
        { t: 'order', q: 'Order the objects from pixels to cable.', items: ['framebuffer', 'plane', 'CRTC', 'encoder', 'connector'], why: 'Your display controller registers (BASE, PITCH, FORMAT, CTRL) are what a plane and CRTC program.' },
        { t: 'mcq', q: 'Why are page flips completed at vblank?', opts: ['Switching buffers mid-frame would show half of each (tearing)', 'The GPU is idle then', 'To save power', 'HDMI requires it every frame'], a: 0, why: 'Your firmware’s FLIP register latched at vblank for the same reason.' },
        { t: 'mcq', q: 'An atomic commit fails a check. What has changed on screen?', opts: ['Nothing: atomic commits apply completely or not at all', 'Half of the planes', 'The connector only', 'The mode but not the framebuffer'], a: 0, why: 'That all-or-nothing rule is what “atomic” means here.' },
        { t: 'tf', q: 'The CRTC generates the video timing.', a: true, why: 'It is the part your display controller’s timing generator plays.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u24', n: 24, track: 'diy', tone: 'rs2', title: 'Write the user-space driver and compiler',
  blurb: 'Vulkan programs talk to a user-space driver that builds command buffers and compiles shaders for your ARM shader lanes. Write the pieces, starting from Mesa’s shared code instead of from zero.',
  lessons: [
    {
      id: 'u24l1', title: 'A Vulkan driver (ICD)',
      ref: 'Khronos Vulkan Loader: Driver Interface (ICD JSON manifest, vk_icdNegotiateLoaderICDInterfaceVersion, vk_icdGetInstanceProcAddr); Mesa src/vulkan/runtime.',
      items: [
        { t: 'learn', h: 'How the loader finds you', body: 'Applications link against the **Vulkan loader**, not your driver. The loader reads JSON **manifests** (on Linux in /usr/share/vulkan/icd.d/), loads each driver library and asks it for its entry points.\n\nMesa’s **common Vulkan runtime** (src/vulkan/runtime) already implements instances, devices, command-buffer bookkeeping and dispatch, so a new driver writes mostly the hardware-specific parts.', viz: { k: 'code', text: '{\n  "file_format_version": "1.0.1",\n  "ICD": {\n    "library_path": "libvulkan_forge.so",\n    "api_version": "1.3.0"\n  }\n}' } },
        { t: 'fill', q: 'Complete the manifest’s driver entry.', text: '"ICD": { "___": "libvulkan_forge.so", "___": "1.3.0" }', blanks: ['library_path', 'api_version'], extra: ['driver_name', 'device_id'], why: 'The loader dlopens library_path and checks api_version against what the application wants.' },
        { t: 'order', q: 'Order a minimal Vulkan program’s calls.', items: ['vkCreateInstance', 'vkEnumeratePhysicalDevices', 'vkCreateDevice', 'vkAllocateCommandBuffers', 'vkCmdDraw (while recording)', 'vkQueueSubmit'], why: 'Your driver implements each one; the loader routes calls on your devices to you.' },
        { t: 'mcq', q: 'Why start from Mesa rather than an empty library?', opts: ['Shared code covers the API bookkeeping, window-system integration and compiler infrastructure', 'Mesa is required by Linux', 'The loader only loads Mesa drivers', 'It is faster at run time'], a: 0, why: 'Drivers like RADV, ANV, Turnip, PanVK and NVK all build on the same runtime.' },
        { t: 'tf', q: 'An application links directly against your driver’s library.', a: false, why: 'It links against the loader, which loads your library from its manifest.' }
      ]
    },
    {
      id: 'u24l2', title: 'From vkCmdDraw to packets',
      ref: 'Vulkan specification: command buffers and queue submission; Mesa drivers’ command-stream emitters (e.g. RADV radv_cmd_buffer.c).',
      items: [
        { t: 'learn', h: 'Recording is cheap, submitting is real', body: 'While the application records a command buffer, your driver writes **packets** into a buffer in GPU-visible memory: state (pipeline, viewport, vertex buffers), then draws. `vkQueueSubmit` hands that buffer to the kernel, which puts a pointer to it into the ring.\n\nBecause recording is just memory writes, apps can record on many threads at once.' },
        { t: 'match', q: 'Match each Vulkan call to what your driver does.', pairs: [['vkCmdBindPipeline', 'emit packets loading the shader and its state'], ['vkCmdDraw', 'emit a draw packet'], ['vkQueueSubmit', 'pass the command buffer to the kernel'], ['vkWaitForFences', 'wait for the kernel to signal the fence']], why: 'The packets you wrote by hand in the ring exercise are what this code generates.' },
        { t: 'tf', q: 'vkCmdDraw immediately starts drawing on the GPU.', a: false, why: 'It only records a packet; nothing runs until the buffer is submitted.' },
        { t: 'mcq', q: 'Why can command buffers be recorded on many CPU threads at once?', opts: ['Recording only writes packets into each buffer’s own memory', 'The GPU records them', 'Vulkan forbids threads', 'The kernel serialises them'], a: 0, why: 'Only submission touches shared state, and it is cheap.' },
        { t: 'num', q: 'Each draw packet is 8 words of 4 bytes. How many bytes do 1,000 draws need?', a: 32000, why: '1,000 × 8 × 4 = 32,000 bytes.' }
      ]
    },
    {
      id: 'u24l3', title: 'Compile a shader by hand',
      ref: 'Khronos SPIR-V specification; Mesa NIR (src/compiler/nir) and spirv_to_nir; register allocation and instruction scheduling in GPU compilers.',
      items: [
        { t: 'learn', h: 'The pipeline', body: 'Applications ship shaders as **SPIR-V**. Your compiler turns it into **NIR** (Mesa’s shared shader IR), runs generic optimisations, then does the parts only you can do: **instruction selection** (NIR operations → A32 + VFP), **register allocation** (fit values into 16 core and 32 single-precision registers) and **scheduling** (hide texture latency).', viz: { k: 'chain', items: [['GLSL / HLSL', 'source', 'op'], ['SPIR-V', 'what the app ships', 'rs2'], ['NIR', 'shared optimisations', 'f7'], ['your backend', 'select, allocate, schedule', 'f3'], ['A32 + VFP shader binary', 'runs on every lane', 'rd']] } },
        code(DIY.sh_compile, 'Be the compiler: translate the GLSL in the comment into A32 + VFP, one output component at a time.', 'Constants 1.0 and 0.5 fit vmov.f32 immediates; uv.x and uv.y map straight to s3 and s4. A real backend would also notice shared constants and reuse registers.'),
        { t: 'mcq', q: 'A shader needs 40 live float values at once, but there are 32 single-precision registers. What does the register allocator do?', opts: ['Spills some values to memory and reloads them', 'Fails to compile', 'Uses integer registers for everything', 'Runs two lanes per pixel'], a: 0, why: 'Spilling costs loads and stores; on GPUs it also costs occupancy, so allocators work hard to avoid it.' },
        { t: 'tf', q: 'Moving a texture sample earlier in the program can hide its latency.', a: true, why: 'Scheduling starts slow operations early and fills the wait with independent work.' },
        { t: 'order', q: 'Order the compiler stages.', items: ['SPIR-V from the application', 'spirv_to_nir', 'NIR optimisation passes', 'Instruction selection', 'Register allocation', 'Scheduling and encoding'], why: 'Everything before instruction selection is shared Mesa code.' }
      ]
    },
    {
      id: 'u24l4', title: 'Mesa: start from what exists',
      ref: 'Mesa source tree: src/compiler/nir, src/compiler/spirv, src/vulkan/runtime, src/vulkan/wsi, src/gallium/frontends/lavapipe; Panfrost and PanVK (Mesa drivers for Arm Mali GPUs). Mesa is MIT-licensed.',
      items: [
        { t: 'learn', h: 'Where your code goes', body: 'A new Vulkan driver in Mesa lives in its own directory (like src/amd/vulkan or src/freedreno/vulkan) and reuses the rest:\n\n- **src/compiler/spirv** and **nir**: SPIR-V parsing and optimisation\n- **src/vulkan/runtime** and **wsi**: API plumbing and window systems\n- **lavapipe**: a complete CPU Vulkan driver to read and compare against\n\nFor Arm hardware, Mesa’s **Panfrost** and **PanVK**, open drivers for Mali GPUs, show a complete stack built in the open.' },
        { t: 'match', q: 'Match each Mesa directory to what you reuse.', pairs: [['src/compiler/spirv', 'SPIR-V → NIR'], ['src/compiler/nir', 'shader IR and optimisation passes'], ['src/vulkan/runtime', 'Vulkan object bookkeeping'], ['src/vulkan/wsi', 'presenting to X11, Wayland and displays']], why: 'Your driver adds the backend compiler and the command-stream code for your hardware.' },
        { t: 'mcq', q: 'Mesa’s code is mostly MIT-licensed. What does that mean for your driver?', opts: ['You may use and modify it freely if you keep the notices', 'You must publish your hardware design', 'It may only be used on Linux', 'You need a Khronos licence to read it'], a: 0, why: 'Permissive licensing is one reason vendors build on Mesa.' },
        { t: 'tf', q: 'lavapipe is useful for checking your driver’s output on the same Vulkan program.', a: true, why: 'A reference implementation turns “looks wrong” into “differs here”.' },
        { t: 'mcq', q: 'Your shader lanes run A32 + VFP. Which existing code could your compiler backend borrow ideas from?', opts: ['LLVM’s and GCC’s ARM backends, and Mesa’s other NIR backends', 'The x86 BIOS', 'The Vulkan loader', 'GLSL itself'], a: 0, why: 'Instruction encodings, conditional execution and register allocation for ARM already exist in open compilers.' }
      ]
    }
  ]
});

FORGE.units.push({
  id: 'u25', n: 25, track: 'diy', tone: 'imm', title: 'Ship it, test it, give it back',
  blurb: 'The boot screen your card shows before any driver loads, firmware images and their updates, conformance testing, and getting your drivers upstream.',
  lessons: [
    {
      id: 'u25l1', title: 'The boot screen',
