<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bring-Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn to design a RISC-V E-ATX motherboard: CPU socket, chipset, power, DDR5, PCIe slots for your GPU, and the firmware and OS that bring it up, with short visual exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one mobile-first column; a lesson path drawn like a PCB trace; bottom tab bar; full-screen lesson player.
   Palette: solder-mask green with silkscreen-white ink on dark boards, copper for progress and rewards,
   ATX wire colours (orange 3.3 V, red 5 V, yellow 12 V, purple standby...) for power drawings,
   and seven category colours for units and diagrams. */
:root {
  --bg: #EAF0EC;
  --surface: #F4F8F5;
  --card: #FFFFFF;
  --ink: #0F1F18;
  --ink-2: #3D5248;
  --ink-3: #6A7F75;
  --line: #C9D7CF;
  --line-2: #DDE7E1;
  --brand: #0B6B4C;
  --brand-2: #D3ECE1;
  --brand-ink: #FFFFFF;
  --gold: #B0601C;
  --gold-2: #F6E2CE;
  --gold-ink: #3A1C04;
  --ok: #2E8A3C;
  --ok-2: #DCF0DF;
  --bad: #C8372E;
  --bad-2: #F9DEDB;
  --wire: #9AAFA4;
  --hot: #E0442F;
  --f-op: #3A8F2F;
  --f-rd: #2E68D6;
  --f-f3: #D24A44;
  --f-rs1: #8448CC;
  --f-rs2: #C87510;
  --f-f7: #0F8E92;
  --f-imm: #BC3E87;
  --f-op-2: #E0F1DA;
  --f-rd-2: #DEE8FA;
  --f-f3-2: #F9E1DF;
  --f-rs1-2: #EDE3F9;
  --f-rs2-2: #F8EBD8;
  --f-f7-2: #D8F1F1;
  --f-imm-2: #F6E0EC;
  --pcb: #D7E9DE;
  --pcb-edge: #8DB09D;
  --pcb-ink: #2F5A45;
  --copper: #B87333;
  --metal: #E7ECEA;
  --slot: #26302B;
  --nylon: #F3EFE4;
  --choke: #4A5652;
  --chip: #2B3430;
  --chip-ink: #E9EFEC;
  --latch: #8E9A94;
  --post: #FF5A3C;
  --post-off: #3A2421;
  --w-33: #F28C28;
  --w-5: #D9342B;
  --w-12: #F2C230;
  --w-sb: #8E44AD;
  --w-n12: #2E6FD6;
  --w-gnd: #1E1E1E;
  --w-pson: #2EA358;
  --w-pwrok: #8D8D8D;
  --w-nc: #FFFFFF;
  --term-bg: #0F1F18;
  --term-ink: #E2EFE7;
  --shadow: 0 1px 0 rgba(15, 31, 24, .06), 0 6px 18px -10px rgba(15, 31, 24, .28);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09110D; --surface: #0E1813; --card: #13201A; --ink: #E5F0EA; --ink-2: #A2B7AC; --ink-3: #70867B;
    --line: #27402F; --line-2: #1A2B22; --brand: #4FD3A0; --brand-2: #12392B; --brand-ink: #05170F;
    --gold: #F09B4C; --gold-2: #3A2412; --gold-ink: #1C0E02; --ok: #5AD27A; --ok-2: #0F2E17; --bad: #F2706A; --bad-2: #3A1717;
    --wire: #3F5A4C; --hot: #FF6B57;
    --f-op: #7BD06A; --f-rd: #6A9DF5; --f-f3: #F07D77; --f-rs1: #B795F2; --f-rs2: #F2AC4E; --f-f7: #3DCACC; --f-imm: #EC7DBA;
    --f-op-2: #16301A; --f-rd-2: #14254A; --f-f3-2: #3A1A19; --f-rs1-2: #2B1D48; --f-rs2-2: #3A2810; --f-f7-2: #0E3233; --f-imm-2: #3A1730;
    --pcb: #0F2A1E; --pcb-edge: #2C5A44; --pcb-ink: #8FC9AA; --copper: #D9944F; --metal: #22302A; --slot: #050807; --nylon: #CFC9B8;
    --choke: #56645E; --chip: #050807; --chip-ink: #C9D6CF; --latch: #6B7A73; --post: #FF6B4A; --post-off: #2A1A17;
    --w-33: #F59A3E; --w-5: #F2655C; --w-12: #F5D04E; --w-sb: #B488D6; --w-n12: #6A9DF5; --w-gnd: #9AA7A0; --w-pson: #5AD27A; --w-pwrok: #B5B5B5; --w-nc: #F2F2F2; --term-bg: #030806; --term-ink: #D3E6DC;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09110D; --surface: #0E1813; --card: #13201A; --ink: #E5F0EA; --ink-2: #A2B7AC; --ink-3: #70867B;
  --line: #27402F; --line-2: #1A2B22; --brand: #4FD3A0; --brand-2: #12392B; --brand-ink: #05170F;
  --gold: #F09B4C; --gold-2: #3A2412; --gold-ink: #1C0E02; --ok: #5AD27A; --ok-2: #0F2E17; --bad: #F2706A; --bad-2: #3A1717;
  --wire: #3F5A4C; --hot: #FF6B57;
  --f-op: #7BD06A; --f-rd: #6A9DF5; --f-f3: #F07D77; --f-rs1: #B795F2; --f-rs2: #F2AC4E; --f-f7: #3DCACC; --f-imm: #EC7DBA;
  --f-op-2: #16301A; --f-rd-2: #14254A; --f-f3-2: #3A1A19; --f-rs1-2: #2B1D48; --f-rs2-2: #3A2810; --f-f7-2: #0E3233; --f-imm-2: #3A1730;
  --pcb: #0F2A1E; --pcb-edge: #2C5A44; --pcb-ink: #8FC9AA; --copper: #D9944F; --metal: #22302A; --slot: #050807; --nylon: #CFC9B8;
  --choke: #56645E; --chip: #050807; --chip-ink: #C9D6CF; --latch: #6B7A73; --post: #FF6B4A; --post-off: #2A1A17;
  --w-33: #F59A3E; --w-5: #F2655C; --w-12: #F5D04E; --w-sb: #B488D6; --w-n12: #6A9DF5; --w-gnd: #9AA7A0; --w-pson: #5AD27A; --w-pwrok: #B5B5B5; --w-nc: #F2F2F2; --term-bg: #030806; --term-ink: #D3E6DC;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: 62vh; overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }

.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

}

}

  box-shadow: 0 3px 0 var(--line); text-align: left; line-height: 1.3;
}

.chip.placed { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.chip.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }

.slot-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-size: 11px; margin-right: 6px; font-family: var(--font-mono); }

.fill { font-size: 17px; line-height: 2.3; font-weight: 600; }
.blank { display: inline-flex; min-width: 70px; height: 36px; padding: 0 10px; align-items: center; justify-content: center; border-radius: 9px; border: 2px dashed var(--brand); background: var(--brand-2); color: var(--brand); font-family: var(--font-mono); font-size: 15px; vertical-align: middle; margin: 0 2px; }

.svg-hot { cursor: pointer; }

}

.lab-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.lab-head h2 { font-size: 24px; }
.panel { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

select.sel, input.txt {
  height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); padding: 0 10px; font-weight: 700; font-size: 14px; min-width: 0;
}

.stat.good .v { color: var(--ok); } .stat.warnc .v { color: var(--f-rs2); } .stat.badc .v { color: var(--bad); }
.notes { display: flex; flex-direction: column; gap: 8px; }

.scrub { width: 100%; accent-color: var(--brand); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s; z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }

}

  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.part-head { margin: 28px 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.part-head .eyebrow { color: var(--brand); font-size: 13px; }
.node-stars svg.off { color: var(--line); }
.console { background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; overflow-x: auto; min-height: 64px; max-height: 280px; overflow-y: auto; }
.console .cursor { display: inline-block; width: 8px; height: 15px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; max-height: 320px; tab-size: 4; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }

.evlist { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); }
.ev .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); min-width: 44px; }
.ev .m { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.mode-M { background: var(--f-f3-2); color: var(--f-f3); } .mode-S { background: var(--f-rs1-2); color: var(--f-rs1); } .mode-U { background: var(--f-rd-2); color: var(--f-rd); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); color: var(--brand); }
.tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }

.btn svg { width: 18px; height: 18px; flex: none; }

.bits { padding-top: 16px; }
.fig pre.code { max-height: none; }
.hl-line { display: block; background: var(--gold-2); margin: 0 -12px; padding: 0 12px; }

/* program source under a firmware run */

/* ---------- lab widgets ---------- */

@media (max-width: 440px) { .brand small { display: none; } .brand { font-size: 18px; } }

/* ---------- Bring-Up widgets ---------- */
.post-row { display: flex; gap: 12px; align-items: center; }

.fig-box.center { display: flex; justify-content: center; }

.pci-tree { display: flex; flex-direction: column; font-size: 13px; }
.pci-row { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px 6px 6px; border-bottom: 1px solid var(--line-2); min-width: 0; }
.pci-row:last-child { border-bottom: 0; }

    slli t1, s0, 20
    add  t0, t0, t1

        { t: 'num', q: 'An E-ATX board is 305 × 330 mm. What is its area in cm²? (1 decimal)', a: 1006.5, tol: 0.06, unit: 'cm²', why: '305 × 330 = 100,650 mm² = 1,006.5 cm².' },
        { t: 'num', q: 'How many times the area of ATX (305 × 244 mm) is E-ATX (305 × 330 mm)? (2 decimals)', a: 1.35, tol: 0.006, unit: '×', why: 'Both are 305 mm on the rear edge, so the ratio is 330 ÷ 244 = 1.35.' },

        { t: 'tf', q: 'E-ATX keeps ATX’s rear edge, so the seven slot positions stay the same.', a: true, why: 'The extra 86 mm extends toward the front of the case; the rear edge, I/O panel and slots line up exactly as on ATX.' },
        { t: 'mcq', q: 'A case lists ATX and Micro-ATX support only. Will our E-ATX board fit?', opts: ['Probably not: it is 86 mm deeper than ATX', 'Yes: every ATX case takes E-ATX', 'Yes, if you leave out the I/O shield', 'Only with a PCIe riser'], a: 0, why: '330 − 244 = 86 mm more depth. It may hit drive cages or cover cable holes, and it needs standoffs where its extra holes are.' },

        { t: 'learn', h: 'Why each one matters', body: '**Svpbmt** lets page tables mark memory as non-cacheable or I/O, which GPU drivers need for VRAM. **Zicbom** flushes cache lines around DMA. **Sstc** lets the kernel set its own timer. **H** runs virtual machines. **V** is required by RVA23, so distributions may use it everywhere. Labs → Board Studio checks any ISA string you type.' },

FORGE.units.push({
  id: 'u12', n: 12, track: 'bus', tone: 'f3', title: 'Signal integrity and the PCB',
  blurb: 'Fast signals as waves on copper: the layer stack-up, controlled impedance and differential pairs, loss budgets and retimers, and reading an eye diagram.',
  lessons: [
    {
      id: 'u12l1', title: 'The stack-up',

      items: [
        { t: 'learn', h: 'Layers of copper', body: 'A workstation board is a sandwich of copper and glass-epoxy, often 10 to 14 layers. Fast signals run on layers right beside a solid **ground plane**, their return path and shield; power uses whole planes so hundreds of amps can spread out. Traces inside the board between two planes (**stripline**) are well shielded; traces on the outer layers (**microstrip**) are a little faster but pick up and radiate more noise.', viz: { k: 'stackup', cap: 'A 10-layer stack-up: every signal layer sits next to a ground plane.' } },

        { t: 'match', q: 'Match each term to its meaning.', pairs: [['Stripline', 'an inner trace between two planes'], ['Microstrip', 'an outer trace over one plane'], ['Via', 'a plated hole joining layers'], ['Ground plane', 'return path and shield']], why: 'The vocabulary of every PCB layout review.' }

      items: [
        { t: 'learn', h: 'Controlled impedance', body: 'At these speeds a trace is a **transmission line**: its width, its height above the plane and the dielectric set its **impedance**. Where impedance changes along the route, part of the signal reflects back. Fast links use **differential pairs**: two traces carrying opposite signals, read as their difference, so noise that hits both cancels.', viz: { k: 'diffpair', z: 85 } },
        { t: 'learn', h: 'The targets', body: 'Each interface has its own target, met by choosing trace width and spacing for the stack-up. The PCB maker tunes them and tests sample coupons.', viz: { k: 'table', head: ['Signal', 'Target'], rows: PCB.TARGETS.map(r => r.slice()) } },
        { t: 'mcq', q: 'Our PCIe 5.0 pairs are designed for which impedance?', opts: ['85 Ω differential', '50 Ω single-ended', '120 Ω differential', '40 Ω differential'], a: 0, why: 'PCIe boards commonly use 85 Ω to match the connector and package.' },
        { t: 'tf', q: 'Noise that couples equally onto both traces of a differential pair cancels at the receiver.', a: true, why: 'The receiver subtracts one from the other; common-mode noise drops out.' },
        { t: 'mcq', q: 'Why must the two traces of a pair be the same length?', opts: ['Skew between them turns the difference signal into noise and closes the eye', 'To look neat', 'Because of the PSU', 'So the vias line up'], a: 0, why: 'Designers add small serpentines to match lengths within a fraction of a millimetre.' },
        { t: 'num', q: 'One trace of a pair is 2 mm longer. At 6.8 ps per mm, how much skew is that? (ps, 1 decimal)', a: 13.6, tol: 0.06, unit: 'ps', why: '2 × 6.8 = 13.6 ps: almost half a bit at PCIe 5.0 (31.25 ps).' },
        { t: 'match', q: 'Match each interface to its impedance target.', pairs: [['USB 3.x', '90 Ω differential'], ['SATA', '100 Ω differential'], ['DDR5 data', '40 Ω single-ended'], ['PCIe 5.0', '85 Ω differential']], why: 'From the targets table.' }

    {
      id: 'u12l3', title: 'Loss budgets and retimers',

      items: [
        { t: 'learn', h: 'Every inch costs decibels', body: 'Copper and glass absorb high frequencies, so a fast signal shrinks as it travels: **insertion loss**, in dB. PCIe 5.0 allows **36 dB** end to end at 16 GHz, shared by the CPU package (9 dB), the board (16 dB), the slot connector (1.5 dB) and the card (9.5 dB). Standard FR-4 loses about **2.2 dB per inch** at 16 GHz; mid-loss laminate about 1.4; low-loss under 1.', viz: { k: 'loss', gen: 5, used: 11, cap: 'The PCIe 5.0 budget, and a board route that uses 11 of its 16 dB.' } },
        { t: 'learn', h: 'Retimers', body: 'When a route is too long, a **retimer** sits partway: it recovers the data and the clock and transmits a fresh signal, so each half gets its own budget. A **redriver** only amplifies, noise and all. Our slots 5 and 7 are far from the CPU, so they get retimers.' },
        { t: 'num', q: '12 dB of the board budget is left for the trace. On standard FR-4 (2.2 dB/in), how long can it be? (in, 1 decimal)', a: 5.5, tol: 0.06, unit: 'in', why: '12 ÷ 2.2 = 5.45 in: about 140 mm.' },
        { t: 'num', q: 'An 8-inch route on mid-loss laminate (1.36 dB/in) with 4 vias at 0.25 dB each. Total loss? (dB, 2 decimals)', a: 11.88, tol: 0.02, unit: 'dB', why: '8 × 1.36 + 4 × 0.25 = 10.88 + 1 = 11.88 dB.' },
        { t: 'mcq', q: 'A 10-inch route on standard FR-4 runs to slot 5. What do you do?', opts: ['Add a retimer or use a better laminate: 22 dB is far over the 16 dB board share', 'Nothing: it fits', 'Run the slot at ×8', 'Raise the PSU voltage'], a: 0, why: '10 × 2.2 = 22 dB before vias; even mid-loss laminate (13.6 dB) leaves almost no margin.' },
        { t: 'tf', q: 'A retimer resets the loss budget; a redriver does not.', a: true, why: 'Only a retimer regenerates the signal from recovered data.' },
        { t: 'hotspot', q: 'Tap the retimers on our board.', viz: { k: 'board', layer: 'pcie' }, a: 'retimer', aText: 'PCIe retimers', why: 'They sit beside the lower slots, partway along the long routes from ports C and D.' }

    },
    {
      id: 'u12l4', title: 'Eyes and equalisation',
      ref: REF.sig + ' ' + REF.pcie,
      items: [
        { t: 'learn', h: 'Reading an eye diagram', body: 'Overlay thousands of bits and you get an **eye diagram**. Loss smears each bit into its neighbours (**inter-symbol interference**), jitter blurs the edges and noise blurs the levels. An open eye means the receiver can tell 0 from 1; a closed eye means bit errors. **Equalisation** fights loss: the transmitter emphasises edges (**FFE**), and the receiver boosts high frequencies (**CTLE**) and subtracts echoes of earlier bits (**DFE**). PCIe tunes these during link training.', viz: { k: 'eye' } },
        { t: 'mcq', q: 'This eye is closed. What most likely closed it?', viz: { k: 'eye', loss: 0.8 }, opts: ['More channel loss than the equalisers can undo', 'A wrong vendor ID', 'Too many DIMMs', 'A slow fan'], a: 0, why: 'Heavy loss smears every bit into the next: classic inter-symbol interference.' },
        { t: 'tf', q: 'PCIe 3.0 and later tune each link’s equaliser settings automatically during training.', a: true, why: 'The equalisation phases of link training try presets and keep the best.' },
        { t: 'match', q: 'Match each term to its meaning.', pairs: [['FFE', 'transmitter emphasises edges'], ['CTLE', 'receiver boosts high frequencies'], ['DFE', 'subtracts echoes of earlier bits'], ['Jitter', 'uncertainty in edge timing']], why: 'Three equalisers and the impairment that narrows the eye sideways.' },
        { t: 'num', q: 'At PCIe 5.0 (32 GT/s, two levels) how long is one unit interval? (ps, 1 decimal)', a: 31.3, tol: 0.06, unit: 'ps', why: '1 ÷ 32 GT/s = 31.25 ps.' },
        { t: 'mcq', q: 'Why does PCIe 6.0 use PAM4 signalling?', opts: ['Two bits per symbol double the rate without doubling the frequency', 'It needs no equalisation', 'It uses fewer lanes', 'It is cheaper to route'], a: 0, why: 'Four voltage levels carry two bits per UI, so 64 GT/s needs the same 16 GHz Nyquist frequency as PCIe 5.0.' }

  ['stripline', 'A trace inside the board between two reference planes.'],
  ['microstrip', 'A trace on an outer layer above one reference plane.'],

        { t: 'hotspot', q: 'Tap where DRAM starts.', viz: { k: 'addrmap' }, a: 'dram', aText: 'DRAM at 0x8000_0000', why: 'The first 2 GiB hold the boot ROM, device registers, ECAM and the 32-bit PCIe window.' },

FORGE.glossary.push(
  ['boot ROM', 'Code fixed in the CPU that runs first after reset and loads the first-stage loader.'],
  ['FSBL', 'First-stage boot loader: runs from on-chip SRAM, trains DRAM, loads the next stages.'],
  ['U-Boot SPL', 'U-Boot’s small secondary program loader, commonly the FSBL on RISC-V boards.'],
  ['partition table', 'A table at the start of the boot flash listing each region’s offset and size.'],
  ['NVRAM', 'Non-volatile storage for UEFI variables, kept in a region of the boot flash.'],
  ['A/B copies', 'Two copies of firmware so the board still boots if one is damaged or mid-update.'],
  ['SBI', 'Supervisor Binary Interface: the ecall interface between an S-mode kernel and M-mode firmware.'],
  ['OpenSBI', 'The reference SBI implementation: M-mode firmware that stays resident as a runtime.'],
  ['ecall', 'The RISC-V instruction that traps to a higher privilege mode, used for SBI calls.'],
  ['PMP', 'Physical memory protection: M-mode rules that limit what S- and U-mode may access.'],
  ['UEFI', 'Unified Extensible Firmware Interface: the standard firmware interface boot loaders use.'],
  ['EDK2', 'TianoCore’s open-source UEFI implementation.'],
  ['ExitBootServices', 'The UEFI call with which the OS loader takes over; only runtime services remain.'],
  ['BRS', 'RISC-V Boot and Runtime Services: BRS-I (UEFI + ACPI + SMBIOS) and BRS-B (EBBR + device tree).'],
  ['EBBR', 'Embedded Base Boot Requirements: a UEFI subset for embedded boards, often via U-Boot.'],
  ['ACPI', 'Tables (and bytecode) describing hardware and power control to the OS.'],
  ['SMBIOS', 'Tables describing the system’s inventory: board, CPU, memory modules.'],
  ['RHCT', 'RISC-V Hart Capabilities Table: ISA string, timebase frequency and MMU type for ACPI.'],
  ['MADT', 'ACPI table listing interrupt controllers; RISC-V adds RINTC, IMSIC, APLIC and PLIC entries.'],
  ['MCFG', 'ACPI table giving the ECAM base address for each PCIe segment.'],
  ['device tree', 'A tree of nodes and properties describing hardware; compiled into a DTB.'],
  ['compatible', 'The device-tree property that names the device so the right driver binds.']
);

        { t: 'mcq', q: 'What does THERMTRIP do?', opts: ['Powers the board off immediately at a critical temperature', 'Speeds the fans up a little', 'Lowers the PCIe speed', 'Only logs a warning'], a: 0, why: 'It is the last line of defence, handled in hardware so it works even if firmware has crashed.' },

    {

      items: [
        { t: 'learn', h: 'Capsules and A/B', body: 'Firmware updates arrive as signed UEFI **capsules**. The OS (for example **fwupd**, with files from the **LVFS**) stages the capsule in flash and reboots; firmware checks its signature, writes the **inactive** copy, and switches over only once the new copy has booted. A **rollback counter** in fuses stops anyone reinstalling an older version with known holes.', viz: { k: 'flashmap', hl: ['fwA', 'fwB', 'capsule'], cap: 'The two firmware copies and the capsule staging area.' } },
        { t: 'order', q: 'Order a safe firmware update.', items: ['The OS stages a signed capsule in flash', 'Reboot', 'Firmware checks the capsule’s signature', 'Firmware writes the inactive copy', 'Switch to the new copy once it has booted'], why: 'At every step one good copy remains bootable.' },

        { t: 'tf', q: 'A rollback counter blocks a downgrade to older signed firmware with known holes.', a: true, why: 'Older images carry a lower security version, which the fused counter rejects.' },

        { t: 'match', q: 'Match each term to its meaning.', pairs: [['Capsule', 'a signed update package'], ['fwupd', 'Linux tool that applies updates'], ['LVFS', 'firmware download service'], ['Rollback counter', 'blocks downgrades']], why: 'Together they let a distribution update board firmware like any other package.' }

FORGE.units.push({
  id: 'u20', n: 20, track: 'os', tone: 'rs1', title: 'Linux boots',
  blurb: 'From firmware to a login prompt: the handoff to the kernel, how Linux finds the hardware, a kernel configuration for our board, and user space on an RVA23 distribution.',

      ref: REF.linux + ' ' + REF.uefi,

        { t: 'learn', h: 'What the kernel expects', body: 'The RISC-V Linux boot protocol is short: the kernel starts in **supervisor mode** with the **MMU off**, **a0 = its hart ID** and **a1 = the physical address of the device tree**. On a UEFI system the kernel is also a UEFI application (the **EFI stub**): UEFI loads it, it learns the boot hart through RISCV_EFI_BOOT_PROTOCOL, takes the memory map and ACPI tables, then calls ExitBootServices.', viz: { k: 'chain', items: [['UEFI boot manager', 'follows BootOrder', 'imm'], ['OS loader', 'GRUB or systemd-boot', 'f3'], ['Kernel EFI stub', 'memory map, ACPI, boot hart ID', 'rs1'], ['ExitBootServices', 'firmware steps back', 'f7'], ['Kernel proper', 'MMU on, other harts started via SBI HSM', 'op']] } },
        { t: 'signals', q: 'A device-tree boot on hart 0: set the state at the kernel’s first instruction.', signals: [{ name: 'a0', opts: ['hart ID', 'DTB address', 'zero'] }, { name: 'a1', opts: ['hart ID', 'DTB address', 'zero'] }, { name: 'MMU (satp)', opts: ['off', 'on'] }, { name: 'mode', opts: ['M', 'S', 'U'] }], a: { 'a0': 'hart ID', 'a1': 'DTB address', 'MMU (satp)': 'off', 'mode': 'S' }, why: 'Exactly what our emulator’s SBI firmware set up before its mret in unit 18.' },
        { t: 'mcq', q: 'How do the other harts start?', opts: ['The kernel asks OpenSBI to start each one with SBI HSM calls', 'They start themselves at random', 'The PSU starts them', 'UEFI starts them after the OS is up'], a: 0, why: 'Hart State Management: hart_start(hartid, start_addr, opaque).' },

        { t: 'order', q: 'Order the steps from the boot manager to a running kernel.', items: ['The boot manager picks an entry from BootOrder', 'The OS loader loads the kernel and initramfs', 'The EFI stub collects the memory map and tables', 'ExitBootServices', 'The kernel turns on the MMU and starts the other harts'], why: 'The firmware steps back only after the kernel has everything it needs.' }

      id: 'u20l2', title: 'Finding the hardware',

      items: [
        { t: 'learn', h: 'Probe and bind', body: 'The kernel learns the platform from ACPI or the device tree: harts and their extensions, memory, the **IMSIC** and **APLIC** interrupt controllers, timers, the console UART, and the PCIe host bridge with its ECAM window. It then scans PCIe itself, reads every function’s IDs and class code, and **binds** each to the driver whose ID table matches.', viz: { k: 'code', text: LSPCI, label: 'lspci output', cap: 'What lspci shows on our default board.' } },
        { t: 'mcq', q: 'How does Linux pick a driver for a PCIe device?', opts: ['It matches the device’s vendor/device IDs or class code against each driver’s table', 'The firmware loads the driver', 'The user picks it at boot', 'The driver is stored on the device'], a: 0, why: 'Standard devices (NVMe, xHCI, AHCI) match by class code, so one driver serves every vendor.' },
        { t: 'tf', q: 'Linux scans the PCIe buses itself to find every device, even though firmware already did.', a: true, why: 'It usually keeps firmware’s bus numbers and BARs, but discovers devices on its own.' },
        { t: 'match', q: 'Match each driver to what it drives.', pairs: [['riscv-imsic', 'the IMSIC interrupt files'], ['pci-host-ecam-generic', 'the PCIe host bridge'], ['nvme', 'NVMe SSDs'], ['xhci_hcd', 'the USB controller']], why: 'All of them are standard; none is specific to our board.' },
        { t: 'mcq', q: 'Which class code does a USB xHCI controller report?', opts: ['0x0C0330', '0x030000', '0x010802', '0x020000'], a: 0, why: '0x0C = serial bus, 0x03 = USB, 0x30 = xHCI. 0x030000 is VGA, 0x010802 NVMe, 0x020000 Ethernet.' }

      id: 'u20l3', title: 'Configuring the kernel',

      items: [
        { t: 'learn', h: 'A config fragment for our board', body: 'A distribution ships one riscv64 kernel for many boards, so everything ours needs must be switched on: ACPI and EFI, the generic ECAM PCIe host, MSI, the RISC-V IOMMU, the 16550 UART, NVMe, AHCI, xHCI, HD Audio, the TPM and the GPU drivers. **=y** builds a feature into the kernel; **=m** builds a module loaded when needed. Board Studio writes this fragment for your design.', viz: { k: 'code', text: studio.kconf, label: 'kernel config fragment' } },
        { t: 'mcq', q: 'Which option is needed for our ECAM PCIe host bridge?', opts: ['CONFIG_PCI_HOST_GENERIC', 'CONFIG_DRM_AMDGPU', 'CONFIG_SATA_AHCI', 'CONFIG_TCG_TPM'], a: 0, why: 'The generic host driver handles any ECAM-compliant root complex described by ACPI or the device tree.' },
        { t: 'tf', q: 'A feature set to =m is built as a module and loaded only when needed.', a: true, why: 'Modules keep the kernel image small; udev loads them when a matching device appears.' },
        { t: 'match', q: 'Match each option to what it enables.', pairs: [['CONFIG_ACPI', 'reading the ACPI tables'], ['CONFIG_BLK_DEV_NVME', 'NVMe SSDs'], ['CONFIG_DRM_AMDGPU', 'AMD graphics'], ['CONFIG_RISCV_IOMMU', 'the RISC-V IOMMU']], why: 'Each names the subsystem or driver it turns on.' },
        { t: 'mcq', q: 'Which line enables AMD’s display code?', opts: ['CONFIG_DRM_AMD_DC=y', 'CONFIG_SMP=y', 'CONFIG_TCG_TPM=y', 'CONFIG_PCI_MSI=y'], a: 0, why: 'DC is amdgpu’s display core, the part that needs kernel-mode FPU on RISC-V.' }

    },
    {
      id: 'u20l4', title: 'User space',
      ref: 'Ubuntu for RISC-V (RVA23 required from 25.10); Debian riscv64 port; systemd documentation.',
      items: [
        { t: 'learn', h: 'From init to a desktop', body: 'The kernel unpacks the **initramfs**, loads the modules it needs to find the root filesystem, mounts it and starts **init**: PID 1, systemd on most distributions. systemd starts services; a display manager starts a **Wayland compositor**, which drives the screen through **KMS** and draws with Mesa’s GPU drivers. Every program is a riscv64 binary built for the distribution’s target profile: Ubuntu 25.10 and later need RVA23.', viz: { k: 'chain', items: [['initramfs', 'early drivers, find the root disk', 'f3'], ['systemd (PID 1)', 'starts services', 'rs1'], ['Display manager', 'the login screen', 'f7'], ['Wayland compositor', 'KMS + Mesa', 'op'], ['Your apps', 'riscv64 binaries', 'rd']] } },
        { t: 'order', q: 'Order the start of user space.', items: ['The kernel unpacks the initramfs', 'Early modules find the root filesystem', 'The kernel starts init (PID 1)', 'systemd starts services', 'The display manager shows the login screen'], why: 'The initramfs exists so the kernel can load drivers before it has a root filesystem.' },
        { t: 'mcq', q: 'Why would a board with an RVA20 CPU fail to run Ubuntu 25.10?', opts: ['Its binaries use RVA23 instructions, such as vectors, that the CPU lacks', 'Its PCIe slots are too old', 'Ubuntu needs DDR4', 'Its firmware is too new'], a: 0, why: 'The first unsupported instruction raises an illegal-instruction fault.' },
        { t: 'tf', q: 'The initramfs holds drivers needed before the root filesystem can be mounted.', a: true, why: 'NVMe, a filesystem, perhaps disk-encryption tools: whatever it takes to reach the root disk.' },
        { t: 'mcq', q: 'What is PID 1?', opts: ['The init process: systemd on most distributions', 'The kernel itself', 'The boot loader', 'The display server'], a: 0, why: 'The first user-space process; every other process descends from it.' }

FORGE.units.push({

      items: [
        { t: 'learn', h: 'What a driver does at probe', body: 'When the kernel finds a device that matches, it calls the driver’s **probe** function. A typical probe enables the device, maps its **BARs** into kernel virtual memory, turns on **bus mastering** so it may DMA, sets the **DMA mask** (how many address bits it can drive), allocates **MSI-X** vectors, and hands over to its subsystem. Buffers come from the **DMA API**, which programs the IOMMU and handles cache maintenance.', viz: { k: 'code', text: PROBE, label: 'PCI driver probe function' } },
        { t: 'order', q: 'Order a typical probe.', items: ['Enable the device', 'Map BAR0', 'Enable bus mastering', 'Set the DMA mask', 'Allocate MSI-X vectors', 'Register with the subsystem'], why: 'Interrupts and DMA come only after the device is mapped and enabled.' },
        { t: 'mcq', q: 'What does pci_set_master() allow?', opts: ['The device may start DMA on the bus', 'The CPU may read the BAR', 'The device may draw 75 W', 'Interrupts are disabled'], a: 0, why: 'It sets Bus Master Enable in the command register; without it the device’s DMA is blocked.' },
        { t: 'tf', q: 'Drivers get DMA buffers from the DMA API rather than using raw physical addresses, so the IOMMU and cache maintenance are handled for them.', a: true, why: 'The same driver then works with or without an IOMMU and with coherent or non-coherent DMA.' },

        { t: 'mcq', q: 'On a platform without cache-coherent DMA, what must the DMA API do?', opts: ['Clean or invalidate cache lines around each transfer (with Zicbom on RISC-V)', 'Nothing', 'Turn the caches off', 'Use INTx'], a: 0, why: 'Otherwise the CPU reads stale cache lines, or the device misses data still in the cache.' }

      ref: 'Linux kernel documentation: DRM, KMS and GEM; Mesa documentation; Vulkan specification.',
      items: [
        { t: 'learn', h: 'The graphics stack', body: 'The kernel’s **DRM** subsystem gives each GPU device nodes: a **primary node** (/dev/dri/card0) for display control through **KMS** (modes, planes, CRTCs, connectors) and a **render node** (/dev/dri/renderD128) for drawing. GPU buffers are **GEM** objects. In user space, **Mesa** turns OpenGL and Vulkan calls into command buffers for each GPU.', viz: { k: 'layers', items: [{ label: 'Apps and games', sub: 'Vulkan, OpenGL', tone: 'op' }, { label: 'Mesa drivers', sub: 'RADV · NVK · forge-vk', tone: 'rs1' }, { label: 'libdrm', sub: 'ioctls', tone: 'f7' }, { label: 'Kernel DRM + KMS', sub: 'amdgpu · nouveau · forge-drm', tone: 'imm' }, { label: 'GPU', sub: 'BARs, DMA, MSI-X', tone: 'rd' }] } },
        { t: 'match', q: 'Match each piece to its job.', pairs: [['KMS', 'sets display modes'], ['Render node', 'unprivileged drawing'], ['GEM', 'GPU buffer objects'], ['Mesa', 'user-space GL and Vulkan drivers']], why: 'Split between kernel (modes, memory, scheduling) and user space (APIs, shader compilers).' },
        { t: 'mcq', q: 'Which part turns a Vulkan draw call into GPU commands?', opts: ['The Mesa Vulkan driver in user space', 'The kernel’s KMS code', 'The firmware’s GOP driver', 'The PSU'], a: 0, why: 'User space builds command buffers; the kernel only checks and submits them.' },

        { t: 'order', q: 'Order a frame’s trip from an app to the screen.', items: ['The app records Vulkan commands', 'Mesa builds GPU command buffers', 'The kernel driver submits them to the GPU', 'The GPU renders into a buffer', 'The compositor scans it out with KMS'], why: 'The same path for our Forge card, AMD and NVIDIA.' }

      ref: REF.gpu + ' linux-firmware (amdgpu firmware files); Mesa RADV and radeonsi.',
      items: [
        { t: 'learn', h: 'What it takes', body: 'An AMD card on our board needs: a kernel with **amdgpu** and **DRM_AMD_DC**, kernel-mode FPU (RISC-V Linux 6.10 or later), the card’s firmware files from **linux-firmware**, cache-coherent DMA, room in the 64-bit window for Resizable BAR, and Mesa’s RADV and radeonsi built for riscv64. For a boot screen the firmware needs an x64 emulator for the card’s GOP driver; otherwise use the serial console until amdgpu loads.', viz: { k: 'compat', card: 'amd' } },
        { t: 'mcq', q: 'amdgpu loads, but the screen stays dark and the log complains about missing files. What is missing?', opts: ['The GPU’s firmware files from linux-firmware', 'The PSU cable', 'The DIMMs', 'The RTC battery'], a: 0, why: 'Modern GPUs run several microcontrollers whose firmware the driver uploads at probe.' },
        { t: 'tf', q: 'ROCm compute is the easy path for an AMD card on RISC-V.', a: false, why: 'ROCm targets x86-64; on RISC-V, use Vulkan compute through RADV.' },
        { t: 'mcq', q: 'Kernel-mode FPU support for RISC-V, which amdgpu’s display code needs, arrived in which Linux version?', opts: ['6.10', '2.6', '4.0', '5.0'], a: 0, why: 'With it, amdgpu’s DC can be built for riscv64.' },
        { t: 'order', q: 'Order an AMD card’s bring-up.', items: ['Firmware assigns BARs with Above 4G and ReBAR', 'The kernel binds amdgpu', 'amdgpu uploads the card’s firmware files', 'DC lights up the display', 'Mesa RADV draws with Vulkan'], why: 'Each layer needs the one before it.' }
      ]
    },
    {
      id: 'u21l4', title: 'NVIDIA on RISC-V',

      items: [
        { t: 'learn', h: 'Open drivers and the GSP', body: 'Modern NVIDIA GPUs carry a RISC-V core, the **GSP**, which runs NVIDIA’s firmware; drivers mostly exchange messages with it. On our board **nouveau** loads that firmware and handles display and memory, **NVK** provides Vulkan and **Zink** provides OpenGL on top of Vulkan. **Nova**, a new kernel driver written in Rust, is being built for the same GSP-based GPUs. NVIDIA’s own driver and CUDA ship for x86-64 and Arm64; NVIDIA has announced CUDA for RISC-V hosts that meet RVA23, BRS and ACPI 6.6 with coherent I/O.', viz: { k: 'compat', card: 'nvidia' } },

        { t: 'tf', q: 'nouveau and NVK are open source, so distributions can build them for riscv64.', a: true, why: 'Open drivers go wherever Linux and Mesa go.' },
        { t: 'mcq', q: 'What does Zink provide?', opts: ['OpenGL implemented on top of Vulkan', 'A kernel driver', 'GPU firmware', 'Power management'], a: 0, why: 'One good Vulkan driver (NVK) then gives OpenGL too.' },
        { t: 'match', q: 'Match each project to what it is.', pairs: [['nouveau', 'open kernel driver for NVIDIA'], ['NVK', 'open Vulkan driver for NVIDIA'], ['Zink', 'OpenGL on Vulkan'], ['Nova', 'new Rust kernel driver']], why: 'Together they form an all-open NVIDIA stack.' },
        { t: 'num', q: 'An RTX 4090 draws 450 W and our default build adds about 500 W for everything else. With 10 % headroom, what is the smallest PSU that passes our check? (W)', a: 1045, tol: 1, unit: 'W', why: '(450 + 500) × 1.1 = 1,045 W; our board’s 1,300 W default supply passes.' }

        { t: 'order', q: 'Order the first steps with a new board.', items: ['Inspect it, with X-ray for BGA parts', 'Measure every rail’s resistance to ground', 'Power the standby rail from a current-limited supply', 'Watch the management core boot on its console', 'Press the power button and watch the sequence'], why: 'Each step risks a little more, only once the previous one is clean.' },
        { t: 'mcq', q: 'With no CPU fitted, a rail reads 0.1 Ω to ground; on a good board it reads several kilohms. What do you suspect?', opts: ['A short: a solder bridge or a failed capacitor', 'That is normal', 'A missing DIMM', 'Too much airflow'], a: 0, why: 'Find it before powering up, often with a thermal camera and a little current.' },

        { t: 'hotspot', q: 'Tap the chip that boots first, from standby power alone.', viz: { k: 'board' }, a: 'chipset', aText: 'South Hub (its management core)', why: 'The always-on domain lives in the South Hub, powered by +5 VSB.' }

  /* ---------------- progress / me ---------------- */
  function viewMe() {
    const S = Store.state;
    const wrap = h('div');
    const lv = Store.level();
    const doneN = App.order.filter(l => isDone(l.id)).length;
    const accs = App.order.map(l => lessonState(l.id)).filter(x => x && x.done && x.best !== undefined).map(x => x.best);
    const avg = accs.length ? accs.reduce((a, b) => a + b, 0) / accs.length : 0;
    wrap.appendChild(h('div', { class: 'section-title' }, h('h2', null, 'Progress'), h('span', { class: 'tag brand' }, 'Level ' + lv.lvl)));
    wrap.appendChild(h('div', { class: 'panel' },
      h('div', { class: 'row' }, h('div', { class: 'grow' }, h('div', { class: 'eyebrow' }, 'Level ' + lv.lvl + ' → ' + (lv.lvl + 1)), h('div', { class: 'meter', style: { marginTop: '8px' } }, h('i', { style: { width: (lv.into / lv.need * 100) + '%' } }))), h('span', { class: 'mono small' }, lv.into + '/' + lv.need + ' XP')),
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('div', { class: 'v' }, U.fmtNum(S.xp, 0)), h('div', { class: 'l' }, 'Total XP')),
        h('div', { class: 'stat' }, h('div', { class: 'v' }, String(Store.streakNow())), h('div', { class: 'l' }, 'Day streak')),
        h('div', { class: 'stat' }, h('div', { class: 'v' }, doneN + '/' + App.order.length), h('div', { class: 'l' }, 'Lessons')),
        h('div', { class: 'stat good' }, h('div', { class: 'v' }, Math.round(avg * 100) + '%'), h('div', { class: 'l' }, 'Avg accuracy')),
        h('div', { class: 'stat' }, h('div', { class: 'v' }, Store.todayXP() + '/' + U.DAILY_GOAL), h('div', { class: 'l' }, 'Today XP')))));
    wrap.appendChild(h('h3', { style: { margin: '22px 0 10px', fontSize: '17px' } }, 'Badges'));
    const ids = ['first', 'perfect', 'streak3', 'streak7', 'xp1000', 'xp5000', 'plat', 'power', 'bus', 'sys', 'fw', 'os', 'booted'].concat(App.units.map(u => 'unit:' + u.id));
    wrap.appendChild(h('div', { class: 'badges' }, ids.map(id => badgeEl(id, !!S.badges[id]))));
    wrap.appendChild(h('h3', { style: { margin: '22px 0 10px', fontSize: '17px' } }, 'Units'));
    const ul = h('div', { class: 'panel' });
    App.units.forEach(u => {
      const d = u.lessons.filter(l => isDone(l.id)).length;
      const row = h('button', { class: 'setting', type: 'button', style: { width: '100%', background: 'none', border: '0', borderBottom: '1px solid var(--line-2)', textAlign: 'left', padding: '10px 0' } },
        h('span', { class: 'mono small', style: { width: '28px', color: 'var(--f-' + u.tone + ')' } }, String(u.n).padStart(2, '0')),
        h('span', { class: 'grow' }, h('div', { style: { fontWeight: '700' } }, u.title), h('div', { class: 'meter', style: { marginTop: '6px' } }, h('i', { style: { width: (d / u.lessons.length * 100) + '%' } }))),
        h('span', { class: 'mono small' }, d + '/' + u.lessons.length));
      row.addEventListener('click', () => { go('learn'); setTimeout(() => { const el = document.getElementById('unit-' + u.id); if (el) el.scrollIntoView({ block: 'start' }); }, 30); });
      ul.appendChild(row);
    });
    wrap.appendChild(ul);
    // settings
    wrap.appendChild(h('h3', { style: { margin: '22px 0 10px', fontSize: '17px' } }, 'Settings'));
    const setting = (id, label, sub, key) => {
      const inp = h('input', { type: 'checkbox', id, checked: !!S.settings[key] });
      inp.addEventListener('change', () => { S.settings[key] = inp.checked; Store.save(); if (key === 'unlockAll') U.toast(inp.checked ? 'Every lesson is unlocked.' : 'Lessons unlock in order again.'); });
      return h('label', { class: 'setting', for: id }, h('span', { class: 'grow' }, h('div', { style: { fontWeight: '700' } }, label), h('div', { class: 'muted small' }, sub)), h('span', { class: 'toggle' }, inp, h('i')));
    };
    const panel = h('div', { class: 'panel', style: { gap: '0' } },
      setting('set-sound', 'Sound effects', 'Short tones for right and wrong answers.', 'sound'),
      setting('set-unlock', 'Unlock all lessons', 'Jump anywhere in the course.', 'unlockAll'));
    const resetZone = h('div', { style: { paddingTop: '12px' } });
    const resetBtn = h('button', { class: 'btn small ghost', type: 'button' }, 'Reset all progress');
    resetBtn.addEventListener('click', () => {
      U.clear(resetZone);
      const yes = h('button', { class: 'btn small bad', type: 'button' }, 'Yes, erase everything');
      const no = h('button', { class: 'btn small', type: 'button' }, 'Cancel');
      yes.addEventListener('click', () => { const keep = S.settings; Store.state = Store.defaults(); Store.state.settings = keep; Store.save(); U.toast('Progress reset.'); render(); });
      no.addEventListener('click', () => render());
      resetZone.appendChild(h('div', { class: 'confirm' }, h('div', null, 'This erases XP, lessons, badges and streaks.'), h('div', { class: 'row' }, yes, no)));
    });
    resetZone.appendChild(resetBtn);
    panel.appendChild(resetZone);
    wrap.appendChild(panel);
    wrap.appendChild(h('p', { class: 'faint small', style: { marginTop: '12px' } }, Store.remote.ok ? 'Progress is saved to your account, so it follows you across devices.' : 'Progress is saved in this browser.'));
    return wrap;
  }

  /* ---------------- boot ---------------- */
  function start(data) {
    Store.load();
    indexCourse();
    buildShell(document.getElementById('app'));
    let tab = (data && data.tab) || 'learn';
    const hash = (location.hash || '').slice(1);
    if (['learn', 'lab', 'practice', 'ref', 'me'].includes(hash)) tab = hash;
    else if (T.labs[hash]) { tab = 'lab'; App.labId = hash; }
    if (data && data.lab) App.labId = data.lab;
    go(tab, App.labId);
    Store.on(() => { renderTop(); if (!App.player && (App.tab === 'learn' || App.tab === 'me' || App.tab === 'practice')) render(); });
    Store.initRemote();
    if (data && data.lesson && App.lessons[data.lesson]) openLesson(data.lesson);
  }
  const boot = () => start({});
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>
