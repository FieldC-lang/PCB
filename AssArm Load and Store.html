<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AssArm Load and Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* ===== tokens ===== */
:root {
  --bg: #f6f3ec; --surface: #ffffff; --surface2: #eee9de; --line: #ddd6c6; --line2: #c9c1ae;
  --fg: #1b2430; --muted: #5f6878; --faint: #8b93a1;
  --ld: #0a7f7a; --ld-bg: #d6f0ed; --ld-fg: #06524f;
  --st: #c4560a; --st-bg: #fde4cf; --st-fg: #7d3504;
  --br: #5b4bdb; --br-bg: #e7e3fb; --br-fg: #3a2db0;
  --ok: #2c9a45; --ok-bg: #dcf2e1; --ok-fg: #17622b;
  --bad: #d23a3a; --bad-bg: #fbdfdf; --bad-fg: #8e1f1f;
  --pri: #5b4bdb; --pri-sh: #3a2db0; --pri-fg: #ffffff;
  --code-bg: #fbf9f4; --code-fg: #1b2430;
  --t-rg: #1d63b8; --t-nu: #a3306f; --t-dr: #6a4fb3; --t-sy: #8a5b00; --t-cm: #6c7788;
  --bar: #f6f3ec; --scr-on: #0a7f7a; --scr-off: #0e1822;
  --f-head: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --utm: 100%; /* how much of the unit colour stays in unit-coloured text (lightened on dark) */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161d; --surface: #18202a; --surface2: #212b37; --line: #2a3644; --line2: #3b4a5c;
    --fg: #e9eef4; --muted: #a2adbc; --faint: #78859a;
    --ld: #3fcfc6; --ld-bg: #0f3a3a; --ld-fg: #8eeee7;
    --st: #ff9a4d; --st-bg: #452611; --st-fg: #ffc59a;
    --br: #a698ff; --br-bg: #2a2554; --br-fg: #cbc2ff;
    --ok: #4cc46a; --ok-bg: #173a22; --ok-fg: #9be5ae;
    --bad: #ff6b6b; --bad-bg: #43191b; --bad-fg: #ffb3b3;
    --pri: #6b58f0; --pri-sh: #4333b8; --pri-fg: #ffffff;
    --code-bg: #131a23; --code-fg: #e9eef4;
    --t-rg: #7db4f7; --t-nu: #f29bcb; --t-dr: #b9a8ff; --t-sy: #e6b86a; --t-cm: #8793a5;
    --bar: #10161d; --scr-on: #3fcfc6; --scr-off: #070d13; --utm: 50%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161d; --surface: #18202a; --surface2: #212b37; --line: #2a3644; --line2: #3b4a5c;
  --fg: #e9eef4; --muted: #a2adbc; --faint: #78859a;
  --ld: #3fcfc6; --ld-bg: #0f3a3a; --ld-fg: #8eeee7;
  --st: #ff9a4d; --st-bg: #452611; --st-fg: #ffc59a;
  --br: #a698ff; --br-bg: #2a2554; --br-fg: #cbc2ff;
  --ok: #4cc46a; --ok-bg: #173a22; --ok-fg: #9be5ae;
  --bad: #ff6b6b; --bad-bg: #43191b; --bad-fg: #ffb3b3;
  --pri: #6b58f0; --pri-sh: #4333b8; --pri-fg: #ffffff;
  --code-bg: #131a23; --code-fg: #e9eef4;
  --t-rg: #7db4f7; --t-nu: #f29bcb; --t-dr: #b9a8ff; --t-sy: #e6b86a; --t-cm: #8793a5;
  --bar: #10161d; --scr-on: #3fcfc6; --scr-off: #070d13; --utm: 50%;
  color-scheme: dark;
}

/* ===== base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 70; background: var(--bar); }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0 0 .75em; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--f-mono); }
code.ic { font-size: .88em; background: var(--surface2); border-radius: 6px; padding: .1em .35em; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.app { min-height: 100vh; padding-inline: 0; overflow-x: clip; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding-inline: var(--gut-l) var(--gut-r); }
.wrap.wide { max-width: 1120px; }
.main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* ===== top bar + nav ===== */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); border-bottom: 1.5px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 9px; font: 800 19px var(--f-head); letter-spacing: -.01em; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand b { color: var(--ld); } .brand i { color: var(--st); font-style: normal; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 700 14px var(--f-head); padding: 5px 10px; border-radius: 99px; background: var(--surface2); }
.pill svg { width: 17px; height: 17px; }
.pill.fire svg { color: var(--st); } .pill.bolt svg { color: var(--br); }
.nav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 2px; background: var(--bar); border-top: 1.5px solid var(--line); padding: 6px var(--gut-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut-l); }
.nav button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 6px 4px; border-radius: 12px; font: 700 11px var(--f-head); letter-spacing: .03em; color: var(--muted); cursor: pointer; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--br); background: var(--br-bg); }
@media (min-width: 900px) {
  .nav { top: 0; right: auto; width: 92px; flex-direction: column; justify-content: flex-start; padding: calc(70px + env(safe-area-inset-top, 0px)) 8px 8px var(--gut-l); border-top: 0; border-right: 1.5px solid var(--line); }
  .nav button { flex: none; max-width: none; padding: 10px 4px; }
  .main, .top .wrap { padding-left: 92px; } .main .wrap, .top .wrap { max-width: 1120px; }
  .main { padding-bottom: 48px; }
  .main > .wrap { padding-left: 24px; }
  .top { z-index: 31; }
}

/* ===== buttons, chips, cards ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 15px/1.1 var(--f-head); letter-spacing: .02em; border: 0; border-radius: 14px; padding: 12px 18px; min-height: 48px; cursor: pointer; background: var(--surface); color: var(--fg); box-shadow: 0 3px 0 var(--line2), inset 0 0 0 1.5px var(--line2); transition: transform .06s, box-shadow .06s; user-select: none; }
.btn:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line2), inset 0 0 0 1.5px var(--line2); }
.btn.pri { background: var(--pri); color: var(--pri-fg); box-shadow: 0 4px 0 var(--pri-sh); }
.btn.pri:active:not([disabled]) { box-shadow: 0 2px 0 var(--pri-sh); }
.btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 var(--ok-fg); }
.btn.bad { background: var(--bad); color: #fff; box-shadow: 0 4px 0 var(--bad-fg); }
.btn.ld { background: var(--ld); color: var(--bg); box-shadow: 0 4px 0 var(--ld-fg); }
.btn.st { background: var(--st); color: var(--bg); box-shadow: 0 4px 0 var(--st-fg); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line2); }
.btn.sm { padding: 8px 12px; min-height: 38px; font-size: 13px; border-radius: 11px; box-shadow: 0 2px 0 var(--line2), inset 0 0 0 1.5px var(--line2); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:focus-visible, .chip:focus-visible, .node:focus-visible, .opt:focus-visible, .nav button:focus-visible { outline: 3px solid var(--br); outline-offset: 2px; }
.chip { font: 600 13px/1 var(--f-mono); border: 1.5px solid var(--line2); border-radius: 99px; padding: 8px 12px; min-height: 36px; background: var(--surface); color: var(--fg); cursor: pointer; white-space: nowrap; }
.chip.on { border-color: var(--br); background: var(--br-bg); color: var(--br-fg); }
.chip.ld.on { border-color: var(--ld); background: var(--ld-bg); color: var(--ld-fg); }
.chip.st.on { border-color: var(--st); background: var(--st-bg); color: var(--st-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.h-page { font: 800 28px var(--f-head); margin: 22px 0 6px; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 0 0 16px; }

/* ===== sheets + toast ===== */
.scrim { position: fixed; inset: 0; z-index: 90; background: rgba(8, 14, 22, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { width: min(560px, 100%); max-height: 88vh; overflow: auto; background: var(--surface); color: var(--fg); border-radius: 22px 22px 0 0; padding: 20px var(--gut-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gut-l); animation: up .22s ease-out; }
.sheet h3 { font-size: 22px; margin-bottom: 4px; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 22px; padding: 22px; } }
.toast { position: fixed; z-index: 120; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font: 600 14px var(--f-body); max-width: 90vw; animation: up .2s; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes flash { from { background: var(--br-bg); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; } }

/* ===== learn path ===== */
.unit { margin: 30px 0 8px; }
.ubanner { display: flex; align-items: center; gap: 14px; background: var(--uc); color: #fff; border-radius: 18px; padding: 14px 16px; box-shadow: 0 5px 0 var(--us); }
.ubanner .un { font: 700 12px var(--f-mono); opacity: .85; letter-spacing: .06em; text-transform: uppercase; }
.ubanner h2 { font-size: 20px; color: #fff; }
.ubanner p { margin: 2px 0 0; font-size: 13.5px; opacity: .93; }
.ubanner .ring { margin-left: auto; flex: none; font: 800 13px var(--f-head); background: rgba(255, 255, 255, .2); border-radius: 99px; padding: 6px 10px; }
.nrow { display: flex; justify-content: center; margin: 14px 0 22px; }
.nrow.cur { margin-top: 46px; }
.ubanner + .nrow { margin-top: 50px; }
.node { position: relative; width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--uc); color: #fff; font: 700 13px var(--f-mono); box-shadow: 0 6px 0 var(--us); cursor: pointer; display: grid; place-items: center; padding: 0; transition: transform .08s, box-shadow .08s; }
.node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--us); }
.node.grad { width: 88px; height: 88px; border-radius: 28px; }
.node.locked { background: var(--surface2); color: var(--faint); box-shadow: 0 6px 0 var(--line2); }
.node.done::after { content: "\2713"; position: absolute; right: -4px; top: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--ok); color: #fff; font: 800 15px/26px var(--f-head); text-align: center; box-shadow: 0 0 0 3px var(--bg); }
.node .go { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--uc); color: color-mix(in srgb, var(--uc) var(--utm), var(--fg)); border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 12px var(--f-head); letter-spacing: .06em; animation: bob 1.4s infinite; }
.node .go::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.lname { text-align: center; font: 700 13px var(--f-head); color: var(--muted); margin-top: 0; max-width: 160px; }
.ncol { display: flex; flex-direction: column; align-items: center; }

/* ===== syntax colours ===== */
.t-ld { color: var(--ld); font-weight: 700; } .t-st { color: var(--st); font-weight: 700; } .t-br { color: var(--br); font-weight: 700; }
.t-cp, .t-op { font-weight: 700; } .t-rg { color: var(--t-rg); } .t-nu { color: var(--t-nu); } .t-dr { color: var(--t-dr); }
.t-lb { font-weight: 800; color: var(--fg); } .t-sy { color: var(--t-sy); } .t-cm { color: var(--t-cm); font-style: italic; } .t-pu { color: var(--muted); } .t-str { color: var(--t-nu); }
.code { background: var(--code-bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font: 500 14px/1.65 var(--f-mono); overflow: auto; white-space: pre; color: var(--code-fg); tab-size: 4; margin: 0 0 14px; max-width: 100%; }
.codebox { position: relative; margin-bottom: 14px; } .codebox .code { margin: 0; }
.codebox .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.blank { display: inline-block; min-width: 4.5ch; text-align: center; border-bottom: 3px solid var(--br); background: var(--br-bg); color: var(--br-fg); border-radius: 6px 6px 0 0; padding: 0 6px; margin: 0 2px; font-weight: 800; }
.blank.empty { color: transparent; }

/* ===== byte strips ===== */
.strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; align-items: flex-end; }
.cell { display: flex; flex-direction: column; align-items: center; min-width: 46px; padding: 14px 4px 4px; border: 1.5px solid var(--line2); border-radius: 10px; background: var(--surface); position: relative; font-family: var(--f-mono); }
.cell .nm { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font: 700 10px var(--f-mono); background: var(--br); color: #fff; border-radius: 6px; padding: 1px 6px; white-space: nowrap; max-width: 140%; overflow: hidden; text-overflow: ellipsis; }
.cell .v { font: 700 15px/1.3 var(--f-mono); }
.cell .ch { font: 500 11px var(--f-mono); color: var(--muted); min-height: 14px; }
.cell .ad { font: 500 10px var(--f-mono); color: var(--faint); }
.cell.hl, .cell.rd { border-color: var(--ld); background: var(--ld-bg); color: var(--ld-fg); }
.cell.wr { border-color: var(--st); background: var(--st-bg); color: var(--st-fg); }
.cell.fx { border-style: dashed; color: var(--muted); background: transparent; }
.cell.dim { opacity: .45; }
.bitsq { display: grid; grid-template-columns: repeat(8, 9px); gap: 2px; margin: 2px 0 4px; }
.bitsq i { width: 9px; height: 9px; border-radius: 2px; background: var(--surface2); border: 1px solid var(--line2); }
.bitsq i.on { background: var(--fg); border-color: var(--fg); }
.cell.hl .bitsq i.on, .cell.rd .bitsq i.on { background: var(--ld); border-color: var(--ld); }
.cell.wr .bitsq i.on { background: var(--st); border-color: var(--st); }

/* ===== lesson player ===== */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; animation: fade .15s; }
.phead { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gut-r) 10px var(--gut-l); }
.phead .x { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.phead .x:hover { background: var(--surface2); } .phead .x svg { width: 24px; height: 24px; }
.pbar { flex: 1; height: 14px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12); }
.ptag { flex: none; font: 700 12px var(--f-mono); color: var(--uc, var(--br)); color: color-mix(in srgb, var(--uc, var(--br)) var(--utm), var(--fg)); border: 1.5px solid currentColor; border-radius: 99px; padding: 3px 9px; }
.pbody { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 6px var(--gut-r) 28px var(--gut-l); }
.pbody > .in { max-width: 740px; margin: 0 auto; }
.pbody > .in.wide { max-width: 1120px; }
.pfoot { border-top: 1.5px solid var(--line); background: var(--bg); padding: 12px var(--gut-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gut-l); }
.pfoot > .in { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.pfoot > .in.wide { max-width: 1120px; }
.pfoot .btn { width: 100%; }
.pfoot .two { display: flex; gap: 10px; } .pfoot .two .btn { flex: 1; }
.fb { border-radius: 16px; padding: 12px 14px; animation: up .2s; }
.fb.ok { background: var(--ok-bg); color: var(--ok-fg); } .fb.bad { background: var(--bad-bg); color: var(--bad-fg); }
.fb h3 { font: 800 20px var(--f-head); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.fb p { margin: 0 0 6px; font-size: 15px; color: inherit; } .fb .ic { background: rgba(255, 255, 255, .5); color: inherit; }
.fb pre { margin: 6px 0 8px; font: 500 13px/1.5 var(--f-mono); background: rgba(255, 255, 255, .45); border-radius: 10px; padding: 8px 10px; overflow: auto; color: var(--fg); }
.fb .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.fb .acts .btn { width: auto; }

/* ===== step content ===== */
.step { padding-top: 6px; animation: up .22s ease-out; }
.kicker { font: 700 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--br); margin: 6px 0 6px; }
.step h2.ttl { font: 800 26px var(--f-head); margin: 0 0 12px; letter-spacing: -.01em; }
.step .q { font: 700 21px/1.3 var(--f-head); margin: 4px 0 16px; text-wrap: pretty; }
.prose p { margin: 0 0 .85em; font-size: 16.5px; line-height: 1.6; }
.prose ul { margin: 0 0 .85em; padding-left: 1.2em; } .prose li { margin-bottom: .35em; font-size: 16.5px; line-height: 1.55; }
.prose b { font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface); font: 500 16px/1.35 var(--f-body); color: var(--fg); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.opt .k { flex: none; width: 28px; height: 28px; border: 2px solid var(--line2); border-radius: 8px; display: grid; place-items: center; font: 700 13px var(--f-mono); color: var(--muted); }
.opt code { font-size: .92em; }
.opt.sel { border-color: var(--br); background: var(--br-bg); box-shadow: 0 3px 0 var(--br); } .opt.sel .k { border-color: var(--br); color: var(--br); }
.opt.good { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 3px 0 var(--ok); } .opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 3px 0 var(--bad); }
.opt[disabled] { cursor: default; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 4px; }
.bank .chip { font-size: 15px; padding: 11px 16px; border-width: 2px; box-shadow: 0 3px 0 var(--line2); }
.bank .chip.on { box-shadow: 0 3px 0 var(--br); }

  else { base = m.asm.symbols[mm[1]]; if (base === undefined) throw new Error('Your code needs a label called "' + mm[1] + '". Keep the labels from the starter code.'); }
  return (base + (mm[2] ? parseInt(mm[2].replace(/\s+/g, ''), 10) : 0)) >>> 0;
}

      else {

  F('Load only the top byte (offset 3) of the word.', "    ____ r0, [r1, #3]", ['ldr', 'ldrb', 'ldrh', 'strb'], 'ldrb', "One byte means ldrb. ldr would read 4 bytes starting at offset 3."),
  C('Read the two bytes of `pair`: r0 = first byte, r2 = second byte.', D + "pair: .byte 7, 9\n" + X + "    ldr r1, =pair\n    @ r0 = first byte, r2 = second byte\n    b .",
    [{ name: '7 and 9', expect: { r0: 7, r2: 9 } }, { name: '200 and 3', poke: { pair: { b: [200, 3] } }, expect: { r0: 200, r2: 3 } }],
    "    ldr r1, =pair\n    ldrb r0, [r1]\n    ldrb r2, [r1, #1]", { must: ['ldrb'], hints: ["ldrb r0, [r1] reads the first byte.", "The second byte is at offset 1: [r1, #1]."] }),
  C('Overwrite the middle dot of `dots` with the letter A (0x41), leaving its neighbours alone.', D + "dots: .byte 0x2E, 0x2E, 0x2E\n" + X + "    @ store one byte\n    b .",
    [{ name: 'middle becomes A', mem: { dots: { b: [0x2E, 0x41, 0x2E] } } }],
    "    ldr r1, =dots\n    mov r0, #0x41\n    strb r0, [r1, #1]", { must: ['strb'], hints: ["Put 0x41 in a register with mov r0, #0x41.", "strb r0, [r1, #1] writes exactly one byte, at offset 1."] }),
]);

lesson(U1, 'u1g', 'grad', 'Graduation: swap', 'Swap two variables in memory.', [
  C('Swap the words `a` and `b` in memory.', D + "a: .word 1\nb: .word 2\n" + X + "    @ load both, store them crossed\n    b .",
    [{ name: '1 and 2', mem: { a: { w: [2] }, b: { w: [1] } } }, { name: '100 and 7', poke: { a: { w: [100] }, b: { w: [7] } }, mem: { a: { w: [7] }, b: { w: [100] } } }, { name: 'equal', poke: { a: { w: [5] }, b: { w: [5] } }, mem: { a: { w: [5] }, b: { w: [5] } } }],
    "    ldr r1, =a\n    ldr r2, =b\n    ldr r3, [r1]\n    ldr r4, [r2]\n    str r4, [r1]\n    str r3, [r2]", { must: ['str'], hints: ["You need two pointers and two values: four registers.", "Load both first, then store each one into the other's place."] }),
], { grad: true });

// ===== UNIT 2 =====
const U2 = unit('u2', 'Size and Sign', 'Bytes and halfwords in 32-bit registers: zero-extend, sign-extend, truncate.');

lesson(U2, 'u2l1', 'ldrb', 'Small values, big registers', 'ldrb and ldrh fill the rest with zeros.', [
  T('Zero-extension', ["Registers are 32 bits wide. When `ldrb` loads one byte it goes into the **low 8 bits** and the other 24 bits are filled with **zeros**. `ldrh` does the same with 16 bits.", "So after `ldrb` the register always holds 0 to 255, and after `ldrh` 0 to 65535. Try it in the lab: pick a byte, choose ldrb, and watch the register."], { lab: 'ls' }),
  P('What is r0?', D + "b: .byte 0xFF\n" + X + "    ldr r1, =b\n    ldrb r0, [r1]\n    b .", { reg: 'r0' }, "0xFF is 255. The top 24 bits of r0 are zero, so r0 is exactly 255, not -1."),
  P('What is r0?', D + "h: .hword 0xABCD\n" + X + "    ldr r1, =h\n    ldrh r0, [r1]\n    b .", { reg: 'r0' }, "A halfword is 2 bytes. 0xABCD is 43981 and the upper 16 bits of r0 are zero."),
  Q('After `ldrb`, which values can the register hold?', ['-128 to 127', '0 to 255', '0 to 65535', 'Any 32-bit value'], 1, "One byte, zero-extended: 0 to 255."),
  T('Why this is useful', ["Adding bytes together in a register does not overflow at 255. You can sum hundreds of byte values and the register simply grows. Zero-extension is the right choice for **unsigned** data: pixels, characters, flags, counts."]),
  F('Which instruction loads an unsigned 16-bit value?', "    ____ r0, [r1]", ['ldr', 'ldrb', 'ldrh', 'ldrsh'], 'ldrh', "ldrh zero-extends a halfword. ldrsh would sign-extend it."),
  C('Add up the three bytes of `vals` into r0.', D + "vals: .byte 200, 100, 50\n" + X + "    ldr r1, =vals\n    @ r0 = sum of the three bytes\n    b .",
    [{ name: '200+100+50', expect: { r0: 350 } }, { name: '255 x3', poke: { vals: { b: [255, 255, 255] } }, expect: { r0: 765 } }, { name: '0,0,1', poke: { vals: { b: [0, 0, 1] } }, expect: { r0: 1 } }],
    "    ldr r1, =vals\n    ldrb r0, [r1]\n    ldrb r2, [r1, #1]\n    add r0, r0, r2\n    ldrb r2, [r1, #2]\n    add r0, r0, r2", { must: ['ldrb'], hints: ["Load each byte with ldrb into a spare register.", "Offsets 0, 1 and 2 reach the three bytes."] }),
]);

lesson(U2, 'u2l2', 'ldrsb', 'Signed loads', 'ldrsb and ldrsh copy the sign bit upward.', [
  T('Negative numbers', ["Signed numbers use **two's complement**: the top bit is the sign. As a byte, 0xFF means -1 and 0x80 means -128. If you load 0xFF with `ldrb` you get 255, not -1.", "`ldrsb` loads a byte and **copies its top bit into all 24 upper bits** (sign extension). 0xFF becomes 0xFFFFFFFF, which is -1 in 32 bits. `ldrsh` does the same for halfwords."],
    { lab: 'ls', strip: { base: 0x8000, bytes: [0xFF], names: { 0: 'b' } } }),
  P('What is r0? Negative numbers are fine, for example -5.', D + "b: .byte 0x80\n" + X + "    ldr r1, =b\n    ldrsb r0, [r1]\n    b .", { reg: 'r0' }, "0x80 has its top bit set, so it is negative. Sign extension fills the top with ones: 0xFFFFFF80, which is -128."),
  P('What is r0?', D + "h: .hword 0x7FFF\n" + X + "    ldr r1, =h\n    ldrsh r0, [r1]\n    b .", { reg: 'r0' }, "0x7FFF has a top bit of 0, so it stays positive: 32767. Sign extension only changes values whose top bit is 1."),
  Q('A sensor stores temperatures as signed 16-bit values (-5 is 0xFFFB). Which load gives you -5 in the register?', ['ldr', 'ldrh', 'ldrsh', 'ldrsb'], 2, "ldrh would give 65531. ldrsh sign-extends 0xFFFB to 0xFFFFFFFB, which is -5."),
  T('There is no signed store', ["You will never see `strsb` or `strsh`. When you **store**, the CPU just keeps the low byte or halfword of the register and drops the rest. The bits written are the same whether the number is signed or not.", "The `s` only matters when you widen a small value into a big register, so it exists only for loads."]),
  Q('Why is there no strsb?', ['Signed bytes cannot be stored', 'Storing only keeps low bits, so there is nothing to extend', 'It was removed to save space in ARMv7', 'strb already extends the sign'], 1, "Extension happens when a small value goes into a bigger register. A store goes the other way."),
  C('Load the signed byte `temp` and double it. r0 = temp x 2.', D + "temp: .byte -5\n" + X + "    ldr r1, =temp\n    @ r0 = temp * 2 (signed)\n    b .",
    [{ name: '-5', expect: { r0: -10 } }, { name: '10', poke: { temp: { b: [10] } }, expect: { r0: 20 } }, { name: '-128', poke: { temp: { b: [0x80] } }, expect: { r0: -256 } }],
    "    ldr r1, =temp\n    ldrsb r0, [r1]\n    add r0, r0, r0", { must: ['ldrsb'], hints: ["Use ldrsb, not ldrb, so -5 stays -5.", "Doubling is add r0, r0, r0."] }),
  C('Sum the three signed halfwords of `vals` into r0.', D + "vals: .hword 100, -50, -300\n" + X + "    ldr r1, =vals\n    @ r0 = sum of the three halfwords\n    b .",
    [{ name: '100-50-300', expect: { r0: -250 } }, { name: '1,2,3', poke: { vals: { h: [1, 2, 3] } }, expect: { r0: 6 } }, { name: 'two -32768', poke: { vals: { h: [0x8000, 0x8000, 0] } }, expect: { r0: -65536 } }],
    "    ldr r1, =vals\n    ldrsh r0, [r1]\n    ldrsh r2, [r1, #2]\n    add r0, r0, r2\n    ldrsh r2, [r1, #4]\n    add r0, r0, r2", { must: ['ldrsh'], hints: ["Halfwords are 2 bytes apart: offsets 0, 2 and 4.", "ldrsh keeps negative numbers negative."] }),
]);

lesson(U2, 'u2l3', 'strb', 'Stores chop', 'strb and strh keep only the low bits. Pick the right width.', [
  T('Stores truncate', ["`strb` writes only the **low byte** of the register. `strh` writes the low 16 bits. The rest of the register is ignored, and the neighbouring bytes in memory are left alone.", "If r0 is 0x12345678, then `strb r0, [r1]` writes just 0x78. This is perfect for writing a single character or pixel byte."],
    { strip: { base: 0x8000, bytes: [0x78, 0x56, 0x34, 0x12], names: { 0: 'r0 as bytes' }, hl: [0] } }),
  P('What is r2? The word starts as 0xFFFFFFFF.', D + "w: .word 0xFFFFFFFF\n" + X + "    ldr r1, =w\n    ldr r0, =0x12345678\n    strb r0, [r1]\n    ldr r2, [r1]\n    b .", { reg: 'r2' }, "Only the lowest byte 0x78 was written, so the word is 0xFFFFFF78."),
  P('What is r2?', D + "w: .word 0xAAAAAAAA\n" + X + "    ldr r1, =w\n    ldr r0, =0x1234\n    strh r0, [r1, #2]\n    ldr r2, [r1]\n    b .", { reg: 'r2' }, "strh at offset 2 rewrites the upper two bytes: 0x1234AAAA."),
  T('Choosing the width', ["Match the instruction to the C type of the data:", "- `char`, `uint8_t`: ldrb / strb\n- `int8_t`, `signed char`: ldrsb / strb\n- `uint16_t`: ldrh / strh\n- `int16_t`, `short`: ldrsh / strh\n- `int`, pointers: ldr / str", "Loads depend on signedness. Stores never do."]),
  Q('You read an `int8_t` array element. Which load?', ['ldr', 'ldrb', 'ldrsb', 'ldrsh'], 2, "int8_t is a signed byte, so ldrsb."),
  Q('You write a `uint16_t` result. Which store?', ['str', 'strb', 'strh', 'strsh'], 2, "A 16-bit value is a halfword: strh."),
  C('Split the halfword `h` into bytes: store its low byte in `lo` and its high byte in `hi`.', D + "h:  .hword 0xABCD\nlo: .byte 0\nhi: .byte 0\n" + X + "    @ lo = low byte, hi = high byte\n    b .",
    [{ name: '0xABCD', mem: { lo: { b: [0xCD] }, hi: { b: [0xAB] } } }, { name: '0x1234', poke: { h: { h: [0x1234] } }, mem: { lo: { b: [0x34] }, hi: { b: [0x12] } } }],
    "    ldr r1, =h\n    ldrh r0, [r1]\n    ldr r2, =lo\n    strb r0, [r2]\n    mov r0, r0, lsr #8\n    ldr r2, =hi\n    strb r0, [r2]", { must: ['strb', 'ldrh'], hints: ["Load with ldrh, then strb stores the low byte straight away.", "Shift right by 8 with mov r0, r0, lsr #8 to bring the high byte down, then strb again."] }),
]);

lesson(U2, 'u2g', 'grad', 'Graduation: widen and narrow', 'Sign-extend bytes into halfwords.', [
  C('Copy the 4 signed bytes in `src` into the 4 halfwords of `dst`, keeping their signs.', D + "src: .byte -1, 2, -3, 4\ndst: .hword 0, 0, 0, 0\n" + X + "    ldr r1, =src\n    ldr r2, =dst\n    @ widen each byte to a halfword\n    b .",
    [{ name: 'mixed signs', mem: { dst: { h: [0xFFFF, 2, 0xFFFD, 4] } } }, { name: 'extremes', poke: { src: { b: [0x80, 0x7F, 0, 1] } }, mem: { dst: { h: [0xFF80, 0x7F, 0, 1] } } }],
    "    ldr r1, =src\n    ldr r2, =dst\n    ldrsb r0, [r1]\n    strh r0, [r2]\n    ldrsb r0, [r1, #1]\n    strh r0, [r2, #2]\n    ldrsb r0, [r1, #2]\n    strh r0, [r2, #4]\n    ldrsb r0, [r1, #3]\n    strh r0, [r2, #6]", { must: ['ldrsb', 'strh'], hints: ["ldrsb widens the byte with its sign, strh keeps the low 16 bits of that.", "Source offsets go 0,1,2,3 and destination offsets 0,2,4,6."] }),
], { grad: true });

// ===== UNIT 3 =====
const U3 = unit('u3', 'Addressing Modes', 'Offsets, indexes and the pointer that walks by itself.');

lesson(U3, 'u3l1', '[r,#n]', 'Offsets', 'Reach nearby memory with [r1, #n].', [
  T('Base plus offset', ["`[r1, #8]` means the address r1 + 8. The offset is a constant written into the instruction. **r1 does not change.** Use it for struct fields and small tables.", "Reach: `ldr`, `ldrb`, `str`, `strb` allow -4095 to +4095. `ldrh`, `ldrsb`, `ldrsh`, `strh` allow only -255 to +255. Negative offsets reach backwards."], { lab: 'addr' }),
  P('What is r0?', D + "arr: .word 10, 20, 30, 40\n" + X + "    ldr r1, =arr\n    ldr r0, [r1, #8]\n    b .", { reg: 'r0' }, "Each word is 4 bytes, so offset 8 is the third element: 30."),
  P('What is r0?', D + "arr: .word 10, 20, 30, 40\n" + X + "    ldr r1, =arr\n    add r1, r1, #12\n    ldr r0, [r1, #-4]\n    b .", { reg: 'r0' }, "r1 points at the fourth element (offset 12). Minus 4 reaches the third: 30."),
  Q('What does `ldr r0, [r1, #8]` do to r1?', ['Adds 8 to it', 'Subtracts 8 from it', 'Nothing', 'Sets it to 8'], 2, "A plain offset is used for the address calculation only. r1 keeps its value."),
  T('Fields of a record', ["A record (struct) is several values next to each other. Name the offsets with `.equ` and your code reads like the data layout.", "This is exactly how C compiles `player->gold`."],
    { code: ".equ HP,   0\n.equ LEVEL, 4\n.equ GOLD, 8\n.data\nplayer: .word 100, 5, 250\n.text\n    ldr r1, =player\n    ldr r0, [r1, #GOLD]   @ r0 = player.gold" }),
  C('Give the player 50 more gold. Change only the gold field.', ".equ HP, 0\n.equ LEVEL, 4\n.equ GOLD, 8\n.data\nplayer: .word 100, 5, 250\n.text\n_start:\n    ldr r1, =player\n    @ gold += 50\n    b .",
    [{ name: 'default', mem: { player: { w: [100, 5, 300] } } }, { name: 'rich player', poke: { player: { w: [80, 9, 1000] } }, mem: { player: { w: [80, 9, 1050] } } }],
    "    ldr r1, =player\n    ldr r0, [r1, #GOLD]\n    add r0, r0, #50\n    str r0, [r1, #GOLD]", { must: ['str'], hints: ["Load the gold with ldr r0, [r1, #GOLD].", "Add 50, then store it back to the same place."] }),
  Q('Which offset is out of range for `ldrh`?', ['#254', '#-255', '#300', '#0'], 2, "Halfword loads have an 8-bit offset field: -255 to +255. For farther, add to the pointer first."),
]);

lesson(U3, 'u3l2', '[r,r]', 'Register and scaled index', 'Arrays: base + index x size.', [
  T('Index in a register', ["`[r1, r2]` adds a register to the base. For a **byte** array that is the element address. For **words** each element is 4 bytes, so the index must be multiplied by 4. ARM does that for free: `[r1, r2, lsl #2]` means r1 + (r2 shifted left by 2).", "Element size 1 = no shift, 2 = lsl #1, 4 = lsl #2. Try the index calculator below."], { lab: 'idx' }),
  P('What is r0?', D + "nums: .word 5, 10, 15, 20, 25\n" + X + "    ldr r1, =nums\n    mov r2, #3\n    ldr r0, [r1, r2, lsl #2]\n    b .", { reg: 'r0' }, "Index 3 x 4 bytes = offset 12: the fourth element, 20."),
  P('What is r0?', D + "b: .byte 1, 2, 3, 4, 5, 6\n" + X + "    ldr r1, =b\n    mov r2, #4\n    ldrb r0, [r1, r2]\n    b .", { reg: 'r0' }, "Bytes need no scaling: index 4 is the fifth byte, 5."),
  Q('Why does a word array use `lsl #2`?', ['Words are 2 bytes', 'Shifting left by 2 multiplies the index by 4, the word size', 'It makes the loop faster', 'It is required for all loads'], 1, "Each word is 4 bytes. Index x 4 = index shifted left by 2."),
  Q('Which instruction is NOT valid in ARM state?', ['ldr r0, [r1, r2, lsl #2]', 'ldrb r0, [r1, r2]', 'ldrh r0, [r1, r2, lsl #1]', 'ldrsh r0, [r1, r2]'], 2, "Halfword loads (ldrh, ldrsh) and signed byte loads cannot shift the index. Use a separate add: add r3, r1, r2, lsl #1 then ldrh r0, [r3]."),
  F('Finish the helper that makes a halfword element address.', "    add r3, r1, r2, ____ #1\n    ldrh r0, [r3]", ['lsl', 'lsr', 'asr', 'ror'], 'lsl', "Shift left by 1 doubles the index (2 bytes per halfword)."),
  C('Read element number r2 of the word array: r0 = nums[r2].', D + "nums: .word 11, 22, 33, 44, 55, 66\n" + X + "    ldr r1, =nums\n    @ r0 = nums[r2]\n    b .",
    [{ name: 'index 0', regs: { r2: 0 }, expect: { r0: 11 } }, { name: 'index 3', regs: { r2: 3 }, expect: { r0: 44 } }, { name: 'index 5', regs: { r2: 5 }, expect: { r0: 66 } }],
    "    ldr r1, =nums\n    ldr r0, [r1, r2, lsl #2]", { needText: [['lsl\\s*#2', 'Use a scaled index: [r1, r2, lsl #2]']], hints: ["One instruction is enough.", "ldr r0, [r1, r2, lsl #2]"] }),
  C('Read the signed halfword number r2 of `vals` into r0.', D + "vals: .hword -5, 100, -200, 300\n" + X + "    ldr r1, =vals\n    @ r0 = vals[r2], signed\n    b .",
    [{ name: 'index 0', regs: { r2: 0 }, expect: { r0: -5 } }, { name: 'index 2', regs: { r2: 2 }, expect: { r0: -200 } }, { name: 'index 3', regs: { r2: 3 }, expect: { r0: 300 } }],
    "    ldr r1, =vals\n    add r3, r1, r2, lsl #1\n    ldrsh r0, [r3]", { must: ['ldrsh'], hints: ["ldrsh cannot scale, so compute the address first.", "add r3, r1, r2, lsl #1, then ldrsh r0, [r3]."] }),
]);

lesson(U3, 'u3l3', '[r],#n', 'Pre- and post-index', 'Let the load or store move the pointer for you.', [
  T('Three timings', ["Where does the pointer change?", "- `[r1, #4]` **offset**: use r1 + 4, r1 unchanged\n- `[r1, #4]!` **pre-index**: r1 = r1 + 4 first, then access r1\n- `[r1], #4` **post-index**: access r1 first, then r1 = r1 + 4", "Post-index is the star: one instruction reads an element *and* moves on to the next. Step through each form in the lab."], { lab: 'addr' }),
  P('What is r2?', D + "b: .byte 10, 20, 30, 40\n" + X + "    ldr r1, =b\n    ldrb r0, [r1], #1\n    ldrb r2, [r1], #1\n    b .", { reg: 'r2' }, "The first load reads 10 then moves r1 on by 1. The second reads the next byte, 20."),
  P('How far did r1 move? (r3 = r1 - start)', D + "b: .byte 10, 20, 30, 40\n" + X + "    ldr r1, =b\n    ldr r4, =b\n    ldrb r0, [r1], #1\n    ldrb r2, [r1], #1\n    sub r3, r1, r4\n    b .", { reg: 'r3' }, "Two post-indexed loads, one byte each: r1 advanced by 2."),
  Q('Which instruction loads a byte and then adds 1 to r1?', ['ldrb r0, [r1, #1]', 'ldrb r0, [r1, #1]!', 'ldrb r0, [r1], #1', 'ldrb r0, [r1, r2]'], 2, "The offset after the closing bracket means post-index."),
  Q('Which updates r1 BEFORE reading?', ['ldrb r0, [r1, #1]', 'ldrb r0, [r1, #1]!', 'ldrb r0, [r1], #1', 'ldr r0, =r1'], 1, "The ! (writeback) after a pre-indexed address saves the new address into r1."),
  T('Stores walk too', ["`str r0, [r2], #4` writes a word and advances to the next slot: perfect for filling an output array. A negative step walks backwards: `ldr r0, [r1], #-4`.", "How did r1 get its address? `ldr r1, =label` loads it from a nearby table of constants (the literal pool). `adr r1, label` computes it from pc. `movw`/`movt` build it from two halves with no pool."],
    { code: "ldr   r1, =table                @ literal pool\nmovw  r1, #:lower16:table       @ or build it\nmovt  r1, #:upper16:table       @ in two steps" }),
  C('Read three bytes in a row into r0, r2 and r3 using only post-indexed loads.', D + "bytes: .byte 5, 6, 7\n" + X + "    ldr r1, =bytes\n    @ r0, r2, r3 = the three bytes\n    b .",
    [{ name: '5 6 7', expect: { r0: 5, r2: 6, r3: 7 }, addr: { r1: 'bytes+3' } }, { name: '1 2 3', poke: { bytes: { b: [1, 2, 3] } }, expect: { r0: 1, r2: 2, r3: 3 } }],
    "    ldr r1, =bytes\n    ldrb r0, [r1], #1\n    ldrb r2, [r1], #1\n    ldrb r3, [r1], #1", { needText: [['\\]\\s*,\\s*#1', 'Use the post-index form: ldrb r0, [r1], #1']], hints: ["Same instruction three times: ldrb rX, [r1], #1.", "r1 should end up just past the last byte."] }),
  C('Write the words 1, 2, 3 into `out` using str with post-index.', D + "out: .space 12\n" + X + "    ldr r1, =out\n    @ store 1, 2, 3\n    b .",
    [{ name: '1,2,3', mem: { out: { w: [1, 2, 3] } }, addr: { r1: 'out+12' } }],
    "    ldr r1, =out\n    mov r0, #1\n    str r0, [r1], #4\n    mov r0, #2\n    str r0, [r1], #4\n    mov r0, #3\n    str r0, [r1], #4", { needText: [['\\]\\s*,\\s*#4', 'Use post-index: str r0, [r1], #4']], hints: ["mov r0, #1 then str r0, [r1], #4.", "Words are 4 bytes, so the step is #4."] }),
]);

lesson(U3, 'u3g', 'grad', 'Graduation: mirror four bytes', 'Offsets in both directions.', [
  C('Copy the 4 bytes of `src` into `dst` in reverse order.', D + "src: .ascii \"ABCD\"\ndst: .space 4\n" + X + "    ldr r1, =src\n    ldr r2, =dst\n    @ dst = \"DCBA\"\n    b .",
    [{ name: 'ABCD', mem: { dst: { b: [68, 67, 66, 65] } } }, { name: 'WXYZ', poke: { src: { b: [87, 88, 89, 90] } }, mem: { dst: { b: [90, 89, 88, 87] } } }],
    "    ldr r1, =src\n    ldr r2, =dst\n    ldrb r0, [r1, #3]\n    strb r0, [r2]\n    ldrb r0, [r1, #2]\n    strb r0, [r2, #1]\n    ldrb r0, [r1, #1]\n    strb r0, [r2, #2]\n    ldrb r0, [r1]\n    strb r0, [r2, #3]", { must: ['ldrb', 'strb'], hints: ["Source offset 3 goes to destination offset 0.", "Four ldrb/strb pairs, with offsets counting down on one side and up on the other."] }),
], { grad: true });

// ===== UNIT 4 =====
const U4 = unit('u4', 'Arrays and Loops', 'Walk, fill, copy and transform arrays.');

lesson(U4, 'u4l1', 'i++', 'Index loops', 'A counter, a scaled index, and cmp/blt.', [
  T('The shape of a loop', ["Every array loop has four parts: **set up** (pointer, counter, result), **body** (load, work, store), **step** (add 1 to the index) and **test** (compare and branch back).", "Here `r2` is the index i. `ldr r3, [r1, r2, lsl #2]` reads nums[i] and `blt` loops while i < 5."],
    { code: "    ldr  r1, =nums\n    mov  r2, #0          @ i = 0\n    mov  r0, #0          @ sum = 0\nloop:\n    ldr  r3, [r1, r2, lsl #2]   @ nums[i]\n    add  r0, r0, r3\n    add  r2, r2, #1\n    cmp  r2, #5\n    blt  loop            @ while i < 5" }),
  P('What is r0?', D + "nums: .word 3, 1, 4, 1, 5\n" + X + "    ldr r1, =nums\n    mov r2, #0\n    mov r0, #0\nloop:\n    ldr r3, [r1, r2, lsl #2]\n    add r0, r0, r3\n    add r2, r2, #1\n    cmp r2, #5\n    blt loop\n    b .", { reg: 'r0' }, "3 + 1 + 4 + 1 + 5 = 14."),
  Q('Which branch keeps looping while i < 5?', ['beq loop', 'bne loop', 'blt loop', 'bgt loop'], 2, "blt means branch if less than (signed). bne would also work here, but blt reads as the intent."),
  O('Put the loop in order. It adds nums[0..3].', ['loop:', 'ldr r3, [r1, r2, lsl #2]', 'add r0, r0, r3', 'add r2, r2, #1', 'cmp r2, #4', 'blt loop'], { pre: D + "nums: .word 1, 2, 3, 4\n" + X + "    ldr r1, =nums\n    mov r2, #0\n    mov r0, #0\n", post: "\n    b .", test: { expect: { r0: 10 } } }),
  C('Add the first n words of `nums`, where n is stored in memory. Careful: n can be 0.', D + "n:    .word 5\nnums: .word 1, 2, 3, 4, 5, 6, 7, 8\n" + X + "    ldr r1, =nums\n    ldr r2, =n\n    ldr r2, [r2]        @ r2 = how many to add\n    @ r0 = sum of the first n words\n    b .",
    [{ name: 'n = 5', expect: { r0: 15 } }, { name: 'n = 8', poke: { n: { w: [8] } }, expect: { r0: 36 } }, { name: 'n = 1', poke: { n: { w: [1] } }, expect: { r0: 1 } }, { name: 'n = 0 (empty)', poke: { n: { w: [0] } }, expect: { r0: 0 } }, { name: 'other data', poke: { n: { w: [3] }, nums: { w: [100, 200, 300] } }, expect: { r0: 600 } }],
    `    ldr r1, =nums
    ldr r2, =n
    ldr r2, [r2]
    mov r0, #0
    mov r4, #0
1:  cmp r4, r2
    bge 2f
    ldr r3, [r1, r4, lsl #2]
    add r0, r0, r3
    add r4, r4, #1
    b 1b
2:`, { hints: ["Test the counter BEFORE the first load, so n = 0 adds nothing.", "cmp r4, r2 then bge to a label after the loop."] }),
  C('Double every word of `nums` in place with a scaled-index store.', ".equ N, 4\n.data\nnums: .word 1, 2, 3, 4\n" + X + "    ldr r1, =nums\n    @ nums[i] = nums[i] * 2\n    b .",
    [{ name: '1 2 3 4', mem: { nums: { w: [2, 4, 6, 8] } } }, { name: '10 20 30 40', poke: { nums: { w: [10, 20, 30, 40] } }, mem: { nums: { w: [20, 40, 60, 80] } } }],
    `    ldr r1, =nums
    mov r2, #0
1:  ldr r3, [r1, r2, lsl #2]
    add r3, r3, r3
    str r3, [r1, r2, lsl #2]
    add r2, r2, #1
    cmp r2, #N
    blt 1b`, { needText: [['str\\s+\\w+\\s*,\\s*\\[\\s*\\w+\\s*,\\s*\\w+\\s*,\\s*lsl\\s*#2', 'Use a scaled store: str r3, [r1, r2, lsl #2]']], hints: ["Load nums[i], double it, store it back to the SAME address.", "The same scaled address works for both ldr and str."] }),
]);

lesson(U4, 'u4l2', '[r]+', 'Pointer loops', 'Post-index plus an end pointer.', [
  T('Walk with the pointer itself', ["Instead of an index, move the **pointer**: `ldr r3, [r1], #4` reads an element and steps to the next one. Put a label after the data (`nums_end:`) and stop when the pointer reaches it: `cmp r1, r2` then `bne`.", "That loop is only four instructions, and the pointer is both the position and the counter. Tip: `movhi r0, r3` copies r3 into r0 only if the last cmp said unsigned-higher. You will use that below."],
    { code: "    ldr  r1, =nums\n    ldr  r2, =nums_end   @ one past the last element\n    mov  r0, #0\nloop:\n    ldr  r3, [r1], #4    @ read, then step\n    add  r0, r0, r3\n    cmp  r1, r2\n    bne  loop" }),
  P('What is r0?', D + "nums: .word 2, 4, 6\nnums_end:\n" + X + "    ldr r1, =nums\n    ldr r2, =nums_end\n    mov r0, #0\nloop:\n    ldr r3, [r1], #4\n    add r0, r0, r3\n    cmp r1, r2\n    bne loop\n    b .", { reg: 'r0' }, "2 + 4 + 6 = 12. The loop ends when r1 has stepped from nums to nums_end."),
  Q('Why compare the pointer with an end address instead of counting?', ['It is required by ARM', 'The pointer is already the position, so no separate counter is needed', 'cmp only works on pointers', 'It makes the array bigger'], 1, "One register does both jobs, which saves an instruction and a register in every iteration."),
  C('Find the largest value in `nums` (unsigned) and put it in r0.', D + "nums: .word 12, 99, 7, 45, 3\nnums_end:\n" + X + "    ldr r1, =nums\n    ldr r2, =nums_end\n    @ r0 = the maximum\n    b .",
    [{ name: 'max in the middle', expect: { r0: 99 } }, { name: 'all equal', poke: { nums: { w: [5, 5, 5, 5, 5] } }, expect: { r0: 5 } }, { name: 'max last', poke: { nums: { w: [1, 2, 3, 4, 500] } }, expect: { r0: 500 } }, { name: 'max first', poke: { nums: { w: [300, 2, 3, 4, 5] } }, expect: { r0: 300 } }],
    `    ldr r1, =nums
    ldr r2, =nums_end
    mov r0, #0
1:  ldr r3, [r1], #4
    cmp r3, r0
    movhi r0, r3
    cmp r1, r2
    bne 1b`, { hints: ["Start with r0 = 0 so any value is at least as big.", "cmp r3, r0 then movhi r0, r3 keeps the larger one."] }),
  C('Count the spaces (0x20) in the byte string `text`. r0 = how many.', D + "text: .ascii \"a b  c d\"\ntext_end:\n" + X + "    ldr r1, =text\n    ldr r2, =text_end\n    @ r0 = number of spaces\n    b .",
    [{ name: 'a b  c d', expect: { r0: 4 } }, { name: 'all spaces', poke: { text: { b: [32, 32, 32, 32, 32, 32, 32, 32] } }, expect: { r0: 8 } }, { name: 'no spaces', poke: { text: { b: [97, 98, 99, 100, 101, 102, 103, 104] } }, expect: { r0: 0 } }],
    `    ldr r1, =text
    ldr r2, =text_end
    mov r0, #0
1:  ldrb r3, [r1], #1
    cmp r3, #0x20
    addeq r0, r0, #1
    cmp r1, r2
    bne 1b`, { must: ['ldrb'], hints: ["ldrb r3, [r1], #1 walks bytes.", "addeq adds only when the cmp found equal."] }),
  C('Sum the words of `nums` walking BACKWARDS with a pre-decrement load.', D + "nums: .word 1, 2, 3, 4\nnums_end:\n" + X + "    ldr r1, =nums_end\n    ldr r2, =nums\n    @ r0 = sum, starting from the end\n    b .",
    [{ name: '1..4', expect: { r0: 10 } }, { name: '5..8', poke: { nums: { w: [5, 6, 7, 8] } }, expect: { r0: 26 } }],
    `    ldr r1, =nums_end
    ldr r2, =nums
    mov r0, #0
1:  ldr r3, [r1, #-4]!
    add r0, r0, r3
    cmp r1, r2
    bne 1b`, { needText: [['\\]!', 'Use the pre-index form: ldr r3, [r1, #-4]!']], hints: ["Move first, then read: ldr r3, [r1, #-4]!", "Stop when r1 reaches the start address."] }),
]);

lesson(U4, 'u4l3', 'fill', 'Fill, copy, reverse', 'Writing arrays: memset, memcpy and in-place edits.', [
  T('Three classic loops', ["- **fill** (memset): `strb r0, [r1], #1` repeated\n- **copy** (memcpy): `ldrb r3, [r0], #1` then `strb r3, [r1], #1`\n- **reverse**: two pointers walking towards each other", "A byte copy handles any size and alignment. Copying a word at a time is 4 times fewer iterations, but needs word-aligned addresses and a size that is a multiple of 4."]),
  P('What is r0 at the end?', D + "buf: .space 4\n" + X + "    ldr r1, =buf\n    mov r2, #4\n    mov r0, #0xAA\n1:  strb r0, [r1], #1\n    subs r2, r2, #1\n    bne 1b\n    ldr r1, =buf\n    ldr r0, [r1]\n    b .", { reg: 'r0' }, "Four bytes of 0xAA read back as one word: 0xAAAAAAAA."),
  C('Fill all 8 bytes of `buf` with the byte value in r0.', D + "buf: .space 8\n" + X + "    ldr r1, =buf\n    @ fill 8 bytes with r0\n    b .",
    [{ name: 'fill 0x55', regs: { r0: 0x55 }, mem: { buf: { b: [0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55] } } }, { name: 'clear to 0', regs: { r0: 0 }, poke: { buf: { b: [1, 2, 3, 4, 5, 6, 7, 8] } }, mem: { buf: { b: [0, 0, 0, 0, 0, 0, 0, 0] } } }],
    `    ldr r1, =buf
    mov r2, #8
1:  strb r0, [r1], #1
    subs r2, r2, #1
    bne 1b`, { must: ['strb'], hints: ["Use a counter register for 8 rounds.", "strb r0, [r1], #1 stores and steps."] }),
  C('Copy n bytes from `src` to `dst`. Bytes after n must stay untouched.', D + "n:   .word 6\nsrc: .ascii \"ARMv7!\"\n     .space 2\ndst: .space 8\n" + X + "    ldr r0, =src\n    ldr r1, =dst\n    ldr r2, =n\n    ldr r2, [r2]\n    @ copy n bytes\n    b .",
    [{ name: 'n = 6', mem: { dst: { b: [65, 82, 77, 118, 55, 33, 0, 0] } } }, { name: 'n = 3 keeps the rest', poke: { n: { w: [3] }, dst: { b: [0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE] } }, mem: { dst: { b: [65, 82, 77, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE] } } }, { name: 'n = 0', poke: { n: { w: [0] }, dst: { b: [0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE] } }, mem: { dst: { b: [0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE] } } }],
    `    ldr r0, =src
    ldr r1, =dst
    ldr r2, =n
    ldr r2, [r2]
    cmp r2, #0
    beq 2f
1:  ldrb r3, [r0], #1
    strb r3, [r1], #1
    subs r2, r2, #1
    bne 1b
2:`, { must: ['ldrb', 'strb'], hints: ["Load with a post-indexed ldrb, store with a post-indexed strb.", "Skip the loop when n is 0."] }),
  C('Copy 4 words from `src` to `dst`, a whole word per ldr/str.', D + "src: .word 0x11111111, 0x22222222, 0x33333333, 0x44444444\ndst: .space 16\n" + X + "    ldr r0, =src\n    ldr r1, =dst\n    @ 4 words, 4 bytes at a time\n    b .",
    [{ name: 'copied', mem: { dst: { w: [0x11111111, 0x22222222, 0x33333333, 0x44444444] } } }, { name: 'other data', poke: { src: { w: [1, 2, 3, 4] } }, mem: { dst: { w: [1, 2, 3, 4] } } }],
    `    ldr r0, =src
    ldr r1, =dst
    mov r2, #4
1:  ldr r3, [r0], #4
    str r3, [r1], #4
    subs r2, r2, #1
    bne 1b`, { needText: [['\\]\\s*,\\s*#4', 'Step by 4: ldr r3, [r0], #4']], hints: ["Each step moves 4 bytes, so the post-index is #4.", "Four rounds copy 16 bytes."] }),
  C('Reverse the first n bytes of `buf` in place using two pointers.', D + "n:   .word 6\nbuf: .ascii \"ABCDEF\"\n" + X + "    ldr r1, =buf\n    ldr r2, =n\n    ldr r2, [r2]\n    @ reverse buf[0..n-1]\n    b .",
    [{ name: 'ABCDEF', mem: { buf: { b: [70, 69, 68, 67, 66, 65] } } }, { name: 'n = 5 HELLO', poke: { n: { w: [5] }, buf: { b: [72, 69, 76, 76, 79] } }, mem: { buf: { b: [79, 76, 76, 69, 72, 70] } } }, { name: 'n = 2', poke: { n: { w: [2] } }, mem: { buf: { b: [66, 65, 67, 68, 69, 70] } } }, { name: 'n = 1', poke: { n: { w: [1] } }, mem: { buf: { b: [65, 66, 67, 68, 69, 70] } } }],
    `    ldr r1, =buf
    ldr r2, =n
    ldr r2, [r2]
    add r2, r1, r2
    sub r2, r2, #1
1:  cmp r1, r2
    bhs 2f
    ldrb r3, [r1]
    ldrb r4, [r2]
    strb r4, [r1], #1
    strb r3, [r2], #-1
    b 1b
2:`, { must: ['ldrb', 'strb'], hints: ["One pointer at the start, one at the last byte (start + n - 1).", "Swap the two bytes, step one pointer up and the other down, stop when they meet."] }),
]);

lesson(U4, 'u4g', 'grad', 'Graduation: histogram', 'A table of counters driven by the data itself.', [
  C('Count how many times each value 0, 1, 2 and 3 appears in `values`. Add 1 to counts[v] for every byte v (n bytes).', D + "n:      .word 10\nvalues: .byte 0, 1, 1, 3, 2, 1, 0, 3, 3, 3\n.align 2             @ words must start on a multiple of 4\ncounts: .word 0, 0, 0, 0\n" + X + "    @ counts[values[i]]++\n    b .",
    [{ name: 'default', mem: { counts: { w: [2, 3, 1, 4] } } }, { name: 'all twos', poke: { values: { b: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2] } }, mem: { counts: { w: [0, 0, 10, 0] } } }, { name: 'only 4 values', poke: { n: { w: [4] } }, mem: { counts: { w: [1, 2, 0, 1] } } }],
    `    ldr r1, =values
    ldr r2, =n
    ldr r2, [r2]
    ldr r5, =counts
    cmp r2, #0
    beq 2f
1:  ldrb r3, [r1], #1
    ldr r4, [r5, r3, lsl #2]
    add r4, r4, #1
    str r4, [r5, r3, lsl #2]
    subs r2, r2, #1
    bne 1b
2:`, { needText: [['\\[\\s*r\\d+\\s*,\\s*r\\d+\\s*,\\s*lsl\\s*#2\\s*\\]', 'Use the scaled index [r5, r3, lsl #2] to reach counts[v]']], hints: ["The byte you just loaded IS the index into counts.", "Load counts[v], add 1, store it back to the same scaled address."] }),
], { grad: true });

// ===== UNIT 5 =====
const U5 = unit('u5', 'Branches Meet Memory', 'Conditions, strings, searching and sorting.');

lesson(U5, 'u5l1', 'ldrne', 'Conditional loads and stores', 'Skip a load or store without branching.', [
  T('Every instruction can be conditional', ["Add a **condition** to the end of the mnemonic and it runs only if the flags allow it: `ldrne`, `strgt`, `ldrbeq`. The flags come from an earlier `cmp`, `subs` or `tst`.", "With a size letter, the condition goes **after** it: `ldrbeq`, `strhne`, `ldrsbgt`.", "- eq / ne: equal / not equal\n- hi / ls: unsigned higher / lower or same\n- gt / lt / ge / le: signed comparisons"]),
  P('What is r1? (The ldrne is skipped.)', D + "v: .word 7\n" + X + "    ldr r2, =v\n    mov r0, #5\n    cmp r0, #5\n    mov r1, #99\n    ldrne r1, [r2]\n    b .", { reg: 'r1' }, "cmp 5, 5 sets the Z flag (equal), so ldrne does nothing and r1 stays 99."),
  P('What is r3? (The ldreq runs.)', D + "v: .word 7\n" + X + "    ldr r2, =v\n    mov r0, #5\n    cmp r0, #5\n    mov r3, #99\n    ldreq r3, [r2]\n    b .", { reg: 'r3' }, "Equal, so ldreq loads 7 into r3."),
  Q('Which instruction stores a byte only when r0 is greater than r1 (signed)?', ['strbgt r0, [r2]', 'strbhi r0, [r2]', 'strgtb r0, [r2]', 'bgt strb r0, [r2]'], 0, "gt is the signed greater-than. The condition goes last: strbgt."),
  T('When to use it', ["A conditional instruction avoids a branch. It is great for 1 to 3 instructions. For bigger blocks a normal `b` is clearer. Skipped instructions cost a cycle but never fault, so a skipped load of a bad address is harmless."]),
  C('Clamp: if the word `val` is above 100, store 100 back. Otherwise leave it.', D + "val: .word 150\n" + X + "    ldr r1, =val\n    @ val = min(val, 100)\n    b .",
    [{ name: '150', mem: { val: { w: [100] } } }, { name: '50', poke: { val: { w: [50] } }, mem: { val: { w: [50] } } }, { name: '100', poke: { val: { w: [100] } }, mem: { val: { w: [100] } } }, { name: '101', poke: { val: { w: [101] } }, mem: { val: { w: [100] } } }],
    "    ldr r1, =val\n    ldr r0, [r1]\n    cmp r0, #100\n    movhi r0, #100\n    str r0, [r1]", { hints: ["Load, cmp r0, #100, then movhi r0, #100.", "Store r0 back at the end."] }),
  C('Store the absolute value of `val` into `result`.', D + "val:    .word -7\nresult: .word 0\n" + X + "    ldr r1, =val\n    @ result = abs(val)\n    b .",
    [{ name: '-7', mem: { result: { w: [7] } } }, { name: '7', poke: { val: { w: [7] } }, mem: { result: { w: [7] } } }, { name: '0', poke: { val: { w: [0] } }, mem: { result: { w: [0] } } }, { name: 'big negative', poke: { val: { w: [-2147483647] } }, mem: { result: { w: [2147483647] } } }],
    "    ldr r1, =val\n    ldr r0, [r1]\n    cmp r0, #0\n    rsblt r0, r0, #0\n    ldr r1, =result\n    str r0, [r1]", { hints: ["rsb r0, r0, #0 means 0 - r0.", "Make it conditional with rsblt so it only runs for negative values."] }),
  C('Set the byte `flag` to 1 only if r0 is odd. Use a conditional store.', D + "flag: .byte 0\n" + X + "    ldr r1, =flag\n    mov r2, #1\n    @ if r0 is odd: flag = 1\n    b .",
    [{ name: 'r0 = 5', regs: { r0: 5 }, mem: { flag: { b: [1] } } }, { name: 'r0 = 4', regs: { r0: 4 }, mem: { flag: { b: [0] } } }, { name: 'r0 = 255', regs: { r0: 255 }, mem: { flag: { b: [1] } } }],
    "    ldr r1, =flag\n    mov r2, #1\n    tst r0, #1\n    strbne r2, [r1]", { needText: [['strbne', 'Use a conditional store: strbne r2, [r1]']], hints: ["tst r0, #1 tests the lowest bit.", "A 1 in that bit means not-equal to zero: strbne."] }),
]);

lesson(U5, 'u5l2', 'asciz', 'Strings and searching', 'Walk to the zero, copy, search, edit.', [
  T('Sentinels', ["A C string is a run of bytes that ends with a **0**. You do not need a length: just walk until you hit the zero. `.asciz \"Hi\"` stores 'H', 'i', 0.", "The idiom: load a byte with post-index, `cmp` it with 0, and branch back while it is not zero. `ldrb` does not set flags, so the `cmp` is needed."],
    { code: "loop:\n    ldrb r3, [r1], #1   @ read, step\n    cmp  r3, #0         @ the sentinel?\n    bne  loop" }),
  P('What is r0 (the length)?', D + "msg: .asciz \"Hello\"\n" + X + "    ldr r1, =msg\n    mov r0, #0\nloop:\n    ldrb r3, [r1], #1\n    cmp r3, #0\n    addne r0, r0, #1\n    bne loop\n    b .", { reg: 'r0' }, "Five letters are counted. The zero is read but not counted, because addne is skipped."),
  C('strlen: put the length of `msg` in r0.', D + "msg: .asciz \"Hello, ARM!\"\n" + X + "    ldr r1, =msg\n    @ r0 = length (without the 0)\n    b .",
    [{ name: 'Hello, ARM!', expect: { r0: 11 } }, { name: 'empty', poke: { msg: S('') }, expect: { r0: 0 } }, { name: 'ARM', poke: { msg: S('ARM') }, expect: { r0: 3 } }],
    "    ldr r1, =msg\n    mov r0, #0\n1:  ldrb r3, [r1], #1\n    cmp r3, #0\n    addne r0, r0, #1\n    bne 1b", { must: ['ldrb'], hints: ["Count in r0 while the byte is not 0.", "addne then bne reuses one cmp."] }),
  C('Find the first space: r0 = its index, or -1 if there is none.', D + "msg: .asciz \"Hello, ARM!\"\n" + X + "    ldr r1, =msg\n    @ r0 = index of the first space, or -1\n    b .",
    [{ name: 'space at 6', expect: { r0: 6 } }, { name: 'no space', poke: { msg: S('ARM') }, expect: { r0: -1 } }, { name: 'space first', poke: { msg: S(' x') }, expect: { r0: 0 } }, { name: 'a b', poke: { msg: S('a b') }, expect: { r0: 1 } }],
    "    ldr r1, =msg\n    mov r0, #0\n1:  ldrb r3, [r1], #1\n    cmp r3, #0\n    beq 2f\n    cmp r3, #0x20\n    beq 3f\n    add r0, r0, #1\n    b 1b\n2:  mvn r0, #0\n3:", { must: ['ldrb'], hints: ["There are two exits: the zero (not found) and the space (found).", "mvn r0, #0 makes -1."] }),
  C('Uppercase `msg` in place: a to z become A to Z (subtract 32). Leave other bytes alone.', D + "msg: .asciz \"Hello, World!\"\n" + X + "    ldr r1, =msg\n    @ uppercase the letters\n    b .",
    [{ name: 'Hello, World!', mem: { msg: S('HELLO, WORLD!') } }, { name: 'boundaries', poke: { msg: S('a`z{@A') }, mem: { msg: S('A`Z{@A') } }, { name: 'no letters', poke: { msg: S('ARM 123') }, mem: { msg: S('ARM 123') } }],
    `    ldr r1, =msg
1:  ldrb r3, [r1]
    cmp r3, #0
    beq 2f
    cmp r3, #'a'
    blo 3f
    cmp r3, #'z'
    bhi 3f
    sub r3, r3, #32
    strb r3, [r1]
3:  add r1, r1, #1
    b 1b
2:`, { must: ['ldrb', 'strb'], hints: ["Only touch bytes between 'a' (0x61) and 'z' (0x7A).", "Load with ldrb [r1], edit, store back with strb to the same address, then step r1."] }),
  C('strcpy: copy the zero-terminated string `src` to `dst`, including the zero.', D + "src: .asciz \"ARM\"\n     .space 12\ndst: .space 16\n" + X + "    ldr r1, =src\n    ldr r2, =dst\n    @ copy until the 0 has been copied\n    b .",
    [{ name: 'ARM', mem: { dst: S('ARM') } }, { name: 'longer', poke: { src: S('Load/Store') }, mem: { dst: S('Load/Store') } }, { name: 'empty', poke: { src: S(''), dst: { b: [0xEE, 0xEE] } }, mem: { dst: { b: [0] } } }],
    "    ldr r1, =src\n    ldr r2, =dst\n1:  ldrb r3, [r1], #1\n    strb r3, [r2], #1\n    cmp r3, #0\n    bne 1b", { must: ['ldrb', 'strb'], hints: ["Copy first, compare after, so the 0 is copied too.", "ldrb r3, [r1], #1 then strb r3, [r2], #1."] }),
]);

lesson(U5, 'u5l3', 'swap', 'Swapping and sorting', 'Compare neighbours, swap with stores, repeat.', [
  T('The swap', ["Sorting is built from one move: compare two neighbours and swap them if they are out of order. A swap loads both values first, then stores each into the other's place.", "A conditional store keeps it short: `cmp r3, r4` then `strhi r4, [r1]` and `strhi r3, [r1, #4]` swap only when r3 is higher."]),
  O('Put the swap in order.', ['ldr r3, [r1]', 'ldr r4, [r1, #4]', 'str r4, [r1]', 'str r3, [r1, #4]'], { pre: D + "arr: .word 5, 2\n" + X + "    ldr r1, =arr\n", post: "\n    b .", test: { mem: { arr: { w: [2, 5] } } } }),
  C('Compare-and-swap: if the first word of `pair` is bigger than the second (unsigned), swap them.', D + "pair: .word 9, 3\n" + X + "    ldr r1, =pair\n    @ order the pair\n    b .",
    [{ name: '9, 3', mem: { pair: { w: [3, 9] } } }, { name: 'already ordered', poke: { pair: { w: [1, 2] } }, mem: { pair: { w: [1, 2] } } }, { name: 'equal', poke: { pair: { w: [4, 4] } }, mem: { pair: { w: [4, 4] } } }],
    "    ldr r1, =pair\n    ldr r3, [r1]\n    ldr r4, [r1, #4]\n    cmp r3, r4\n    strhi r4, [r1]\n    strhi r3, [r1, #4]", { hints: ["Load both, cmp, then conditionally store.", "strhi runs only when the first is higher."] }),
  C('One bubble pass: compare every neighbouring pair of the 5 words and swap when out of order. The largest ends up last.', D + "arr: .word 5, 1, 4, 2, 3\n" + X + "    ldr r1, =arr\n    @ 4 comparisons, swapping as needed\n    b .",
    [{ name: '5 1 4 2 3', mem: { arr: { w: [1, 4, 2, 3, 5] } } }, { name: 'sorted', poke: { arr: { w: [1, 2, 3, 4, 5] } }, mem: { arr: { w: [1, 2, 3, 4, 5] } } }, { name: 'reversed', poke: { arr: { w: [5, 4, 3, 2, 1] } }, mem: { arr: { w: [4, 3, 2, 1, 5] } } }],
    "    ldr r1, =arr\n    mov r2, #4\n1:  ldr r3, [r1]\n    ldr r4, [r1, #4]\n    cmp r3, r4\n    strhi r4, [r1]\n    strhi r3, [r1, #4]\n    add r1, r1, #4\n    subs r2, r2, #1\n    bne 1b", { hints: ["Four comparisons: a counter from 4 down to 0.", "After each compare, step the pointer by 4."] }),
  Q('After one full bubble pass, which element is certain to be in its final place?', ['The smallest, at the start', 'The largest, at the end', 'The middle one', 'None of them'], 1, "The big value is carried along by each swap until it reaches the end. The next pass can skip it."),
]);

lesson(U5, 'u5g', 'grad', 'Graduation: bubble sort', 'Two nested loops and a swap.', [
  C('Sort the first n words of `arr` into ascending order (unsigned).', D + "n:   .word 6\narr: .word 5, 2, 9, 1, 7, 3\n" + X + "    @ bubble sort arr[0..n-1]\n    b .",
    [{ name: 'default', mem: { arr: { w: [1, 2, 3, 5, 7, 9] } } }, { name: 'sorted', poke: { arr: { w: [1, 2, 3, 4, 5, 6] } }, mem: { arr: { w: [1, 2, 3, 4, 5, 6] } } }, { name: 'reversed', poke: { arr: { w: [6, 5, 4, 3, 2, 1] } }, mem: { arr: { w: [1, 2, 3, 4, 5, 6] } } }, { name: 'duplicates', poke: { arr: { w: [3, 3, 1, 1, 2, 2] } }, mem: { arr: { w: [1, 1, 2, 2, 3, 3] } } }, { name: 'only first 3', poke: { n: { w: [3] }, arr: { w: [9, 8, 7, 6, 5, 4] } }, mem: { arr: { w: [7, 8, 9, 6, 5, 4] } } }],

1:  cmp r5, #1

2:  ldr r3, [r1]

    cmp r3, r4

9:`, { must: ['str'], hints: ["Outer loop: how many elements are still unsorted (starts at n, drops by 1 each pass).", "Inner loop: the one-pass code from the last lesson, with a comparison count of (unsorted - 1)."] }),
], { grad: true });

// ===== UNIT 6 =====
const U6 = unit('u6', 'Tables, Records and Jumps', 'Lookup tables, linked lists, computed branches and the stack.');

lesson(U6, 'u6l1', 'table', 'Lookup tables', 'Trade a few bytes of memory for a lot of thinking.', [
  T('Answers in memory', ["A **lookup table** stores precomputed answers. `result = table[input]` is one `ldrb` instead of a pile of compares and branches. Digit to character, bit counts, sine values, colour palettes: all tables.", "Here the 16 characters of `hexd` map a number 0 to 15 to its hex digit."],
    { code: "hexd: .ascii \"0123456789ABCDEF\"\n...\n    ldr  r1, =hexd\n    mov  r2, #11\n    ldrb r0, [r1, r2]   @ 'B'" }),
  P('What is r0? (ASCII for the letter is shown by its number)', D + "hexd: .ascii \"0123456789ABCDEF\"\n" + X + "    ldr r1, =hexd\n    mov r2, #11\n    ldrb r0, [r1, r2]\n    b .", { reg: 'r0' }, "Entry 11 is the letter B, ASCII 66 (0x42)."),
  C('Turn the byte `val` into two hex characters in `out` (high nibble first).', D + "val:  .byte 0x3C\nhexd: .ascii \"0123456789ABCDEF\"\nout:  .space 2\n" + X + "    @ out[0] = hex digit of the high 4 bits\n    @ out[1] = hex digit of the low 4 bits\n    b .",
    [{ name: '0x3C', mem: { out: { b: [0x33, 0x43] } } }, { name: '0xA5', poke: { val: { b: [0xA5] } }, mem: { out: { b: [0x41, 0x35] } } }, { name: '0x07', poke: { val: { b: [0x07] } }, mem: { out: { b: [0x30, 0x37] } } }, { name: '0xFF', poke: { val: { b: [0xFF] } }, mem: { out: { b: [0x46, 0x46] } } }],
    "    ldr r1, =val\n    ldrb r0, [r1]\n    ldr r4, =hexd\n    ldr r5, =out\n    mov r2, r0, lsr #4\n    ldrb r3, [r4, r2]\n    strb r3, [r5]\n    and r2, r0, #15\n    ldrb r3, [r4, r2]\n    strb r3, [r5, #1]", { must: ['ldrb', 'strb'], hints: ["High nibble: shift right by 4. Low nibble: and with 15.", "Use each nibble as the index into hexd, then strb the character."] }),
  C('Count the 1 bits in the byte `val` using the 16-entry nibble table `pop`.', D + "val: .byte 0xA5\npop: .byte 0, 1, 1, 2, 1, 2, 2, 3, 1, 2, 2, 3, 2, 3, 3, 4\n" + X + "    @ r0 = number of 1 bits in val\n    b .",
    [{ name: '0xA5', expect: { r0: 4 } }, { name: '0xFF', poke: { val: { b: [0xFF] } }, expect: { r0: 8 } }, { name: '0x00', poke: { val: { b: [0] } }, expect: { r0: 0 } }, { name: '0x80', poke: { val: { b: [0x80] } }, expect: { r0: 1 } }, { name: '0x0F', poke: { val: { b: [0x0F] } }, expect: { r0: 4 } }],
    "    ldr r1, =val\n    ldrb r2, [r1]\n    ldr r4, =pop\n    and r3, r2, #15\n    ldrb r0, [r4, r3]\n    mov r3, r2, lsr #4\n    ldrb r3, [r4, r3]\n    add r0, r0, r3", { must: ['ldrb'], hints: ["pop[n] already holds the bit count of the 4-bit number n.", "Look up the low nibble and the high nibble, then add the two answers."] }),
  Q('A table holds steering offsets from -100 to +100, one byte each. Which load reads an entry correctly?', ['ldr', 'ldrb', 'ldrsb', 'ldrh'], 2, "Signed bytes need ldrsb so that -100 stays -100 in the register."),
]);

lesson(U6, 'u6l2', 'node', 'Records and linked lists', 'A load whose result is the next address.', [
  T('Pointers inside data', ["A **linked list** node is a small record: a value and a **pointer to the next node**. The last node holds 0 (null). To move on, you load the pointer: `ldr r1, [r1, #4]`. This is a load whose result is the *next address to load from*.", "In the data section, `.word 20, n3` stores the value 20 and the address of node n3."],
    { code: "n3: .word 30, 0       @ value, next (0 = end)\nn2: .word 20, n3\nn1: .word 10, n2\n...\n    ldr r1, =n1\n    ldr r0, [r1]        @ value 10\n    ldr r1, [r1, #4]    @ now r1 = n2" }),
  P('What is r0 after following the pointer twice?', D + "n3: .word 30, 0\nn2: .word 20, n3\nn1: .word 10, n2\n" + X + "    ldr r1, =n1\n    ldr r1, [r1, #4]\n    ldr r1, [r1, #4]\n    ldr r0, [r1]\n    b .", { reg: 'r0' }, "n1 leads to n2, n2 leads to n3, and n3 holds the value 30."),
  Q('Which instruction moves r1 from one node to the next? (value at +0, next at +4)', ['ldr r1, [r1]', 'ldr r1, [r1, #4]', 'add r1, r1, #4', 'str r1, [r1, #4]'], 1, "The next pointer lives at offset 4. Loading it into r1 steps to the next node."),
  C('Add up the values of all nodes in the list. head holds the first node (0 means an empty list).', D + "head: .word n1\nn1: .word 5, n2\nn2: .word 7, n3\nn3: .word 9, 0\n" + X + "    ldr r1, =head\n    ldr r1, [r1]          @ first node, or 0\n    @ r0 = sum of every node's value\n    b .",
    [{ name: '5 + 7 + 9', expect: { r0: 21 } }, { name: 'new first value', poke: { n1: { w: [100] } }, expect: { r0: 116 } }, { name: 'empty list', poke: { head: { w: [0] } }, expect: { r0: 0 } }],
    "    ldr r1, =head\n    ldr r1, [r1]\n    mov r0, #0\n1:  cmp r1, #0\n    beq 2f\n    ldr r3, [r1]\n    add r0, r0, r3\n    ldr r1, [r1, #4]\n    b 1b\n2:", { hints: ["Stop when the pointer is 0, before loading from it.", "Inside the loop: load the value, add it, then follow the next pointer."] }),
  Q('Why must you test the pointer for 0 before loading from it?', ['ldr cannot load zero', 'Address 0 is unmapped, so loading from it faults', 'The list would be empty', 'It makes the loop faster'], 1, "In this emulator and on most systems, a load from address 0 is a null pointer fault."),
]);

lesson(U6, 'u6l3', 'bx', 'Jump tables', 'Branch to an address you loaded from a table.', [
  T('A table of destinations', ["A `switch` with many cases can be a table of **code addresses**. Put the labels in a `.word` list, load the entry for the case number, and jump with `bx`:", "`ldr r2, [r1, r0, lsl #2]` then `bx r2`. There is also the one-instruction form `ldr pc, [pc, r0, lsl #2]`: loading straight into pc is a jump. Because pc reads **8 bytes ahead**, the table must start two instructions after the `ldr`, with one filler instruction between."],
    { code: ".data\ntable: .word h0, h1, h2\n.text\n    ldr  r1, =table\n    ldr  r2, [r1, r0, lsl #2]   @ entry for case r0\n    bx   r2                     @ jump to it" }),
  P('What is r5 when the program parks?', D + "table: .word h0, h1, h2\n" + X + "    mov r0, #2\n    ldr r1, =table\n    ldr r2, [r1, r0, lsl #2]\n    bx r2\nh0: mov r5, #10\n    b done\nh1: mov r5, #20\n    b done\nh2: mov r5, #30\ndone: b .", { reg: 'r5' }, "Case 2 picks the third address in the table, h2, so r5 = 30."),
  Q('With `ldr pc, [pc, r0, lsl #2]`, where does entry 0 of the table sit?', ['Right after the ldr', 'Two instructions after the ldr (8 bytes on)', 'At address 0', 'At the label start'], 1, "pc reads 8 bytes ahead of the instruction, so the table starts 8 bytes after the ldr and one filler instruction sits in between."),
  C('Command dispatcher: r0 holds a command number 0 to 3. Jump through the table `handlers` so that r5 ends as 11, 22, 33 or 44.', D + "handlers: .word cmd0, cmd1, cmd2, cmd3\n" + X + "    @ jump to handlers[r0]\n    b .\ncmd0: mov r5, #11\n      b done\ncmd1: mov r5, #22\n      b done\ncmd2: mov r5, #33\n      b done\ncmd3: mov r5, #44\ndone: b .",
    [{ name: 'command 0', regs: { r0: 0 }, expect: { r5: 11 } }, { name: 'command 1', regs: { r0: 1 }, expect: { r5: 22 } }, { name: 'command 2', regs: { r0: 2 }, expect: { r5: 33 } }, { name: 'command 3', regs: { r0: 3 }, expect: { r5: 44 } }],
    "    ldr r1, =handlers\n    ldr r2, [r1, r0, lsl #2]\n    bx r2", { needText: [['\\bbx\\b|\\bldr\\s+pc', 'Jump with bx r2 (or load straight into pc)']], hints: ["Load handlers[r0] with a scaled index, like any word array.", "Then bx to the address you loaded."] }),
  C('State machine: follow the byte table `next` for 5 steps. state = next[state]. r0 = the final state.', D + "next: .byte 1, 2, 0\n" + X + "    mov r0, #0          @ state\n    mov r2, #5          @ steps left\n    @ r0 = state after 5 transitions\n    b .",
    [{ name: 'cycle of 3', expect: { r0: 2 } }, { name: 'other table', poke: { next: { b: [2, 0, 1] } }, expect: { r0: 1 } }, { name: 'stuck at 0', poke: { next: { b: [0, 0, 0] } }, expect: { r0: 0 } }, { name: 'sticks at 1', poke: { next: { b: [1, 1, 2] } }, expect: { r0: 1 } }],
    "    mov r0, #0\n    mov r2, #5\n    ldr r1, =next\n1:  ldrb r0, [r1, r0]\n    subs r2, r2, #1\n    bne 1b", { must: ['ldrb'], hints: ["The current state is the index into the table.", "ldrb r0, [r1, r0] replaces the state with its successor."] }),
]);

lesson(U6, 'u6l4', 'push', 'The stack and bulk moves', 'push, pop, ldm, stm and ldrd/strd.', [
  T('The stack is memory with a pointer', ["`sp` points at the top of a block of memory used as scratch space. `push {r4, lr}` is `stmdb sp!, {r4, lr}`: store multiple, decrement sp *before* each store. `pop {r4, lr}` is `ldmia sp!, {r4, lr}`: load multiple, increment *after*.", "A function pushes the registers it wants to reuse and pops them before returning, so the caller never notices. The register list is always stored in numeric order: the lowest register goes at the lowest address."],
    { code: "func:\n    push {r4, lr}    @ save what we will change\n    ...\n    pop  {r4, lr}    @ put it all back\n    bx   lr" }),
  P('What is r6?', "_start:\n    mov r4, #1\n    mov r5, #2\n    push {r4, r5}\n    pop {r6, r7}\n    b .", { reg: 'r6' }, "push stores r4 at the lower address and r5 above it. pop loads the lower address into the first register of its list, so r6 = 1 and r7 = 2.", { noData: true }),
  Q('In `push {r1, r0}`, which register ends up at the lowest address?', ['r1, because it is listed first', 'r0, because lists are stored in numeric order', 'Whichever was changed last', 'It depends on sp'], 1, "The assembler sorts the list. Lowest register number, lowest address."),
  T('Moving many words at once', ["`ldmia r0!, {r2-r5}` loads 4 words and advances r0 by 16. `stmia r1!, {r2-r5}` stores them. Two instructions copy 16 bytes. `ldrd r2, r3, [r0]` and `strd` move 8 bytes with a register pair (r2/r3, r4/r5...); the address must be word-aligned here."],
    { code: "ldmia r0!, {r2-r5}   @ load 4 words, r0 += 16\nstmia r1!, {r2-r5}   @ store 4 words, r1 += 16" }),
  C('Copy 8 words from `src` to `dst` in two batches of four with ldm and stm.', D + "src: .word 1, 2, 3, 4, 5, 6, 7, 8\ndst: .space 32\n" + X + "    ldr r0, =src\n    ldr r1, =dst\n    @ ldm/stm, 4 words each time\n    b .",
    [{ name: '1 to 8', mem: { dst: { w: [1, 2, 3, 4, 5, 6, 7, 8] } } }, { name: 'tens', poke: { src: { w: [10, 20, 30, 40, 50, 60, 70, 80] } }, mem: { dst: { w: [10, 20, 30, 40, 50, 60, 70, 80] } } }],
    "    ldr r0, =src\n    ldr r1, =dst\n    ldmia r0!, {r2-r5}\n    stmia r1!, {r2-r5}\n    ldmia r0!, {r2-r5}\n    stmia r1!, {r2-r5}", { must: ['ldm', 'stm'], hints: ["ldmia r0!, {r2-r5} loads four and advances r0.", "Do it twice: once for words 1-4, once for 5-8."] }),
  C('Swap r0 and r1 using the stack as the only scratch space.', ".text\n_start:\n    @ swap r0 and r1 with push and pop (no other register)\n    b .",
    [{ name: '3 and 4', regs: { r0: 3, r1: 4 }, expect: { r0: 4, r1: 3 } }, { name: '0 and 99', regs: { r0: 0, r1: 99 }, expect: { r0: 99, r1: 0 } }],
    "    push {r0}\n    mov r0, r1\n    pop {r1}", { needText: [['push', 'Use the stack: push {r0} ... pop {r1}']], hints: ["Save r0 on the stack, copy r1 into r0, then pop the old r0 into r1."] }),
  C('Write the function `double` (r0 = r0 x 2) that uses r4 as scratch but leaves the caller\'s r4 unchanged.', ".text\n_start:\n    mov r4, #123       @ the caller's value\n    mov r0, #21\n    bl double\n    b .\ndouble:\n    @ r0 = r0 * 2 using r4 as scratch\n    @ r4 must be 123 again when you return\n    bx lr",
    [{ name: 'doubles and preserves', expect: { r0: 42, r4: 123 } }],
    ".text\n_start:\n    mov r4, #123\n    mov r0, #21\n    bl double\n    b .\ndouble:\n    push {r4}\n    mov r4, r0\n    add r0, r4, r4\n    pop {r4}\n    bx lr", { needText: [['push[^\\n]*r4', 'Save r4 with push {r4} first'], ['pop[^\\n]*r4', 'Restore it with pop {r4} before bx lr']], hints: ["push {r4} at the start of double, pop {r4} just before bx lr.", "Between them you may use r4 freely."] }),
]);

lesson(U6, 'u6g', 'grad', 'Graduation: run-length decode', 'A loop inside a loop, reading pairs and writing runs.', [
  C('Expand the (count, value) byte pairs in `rle` into `out`. A pair with count 0 ends the data.', D + "rle: .byte 3, 'A', 2, 'B', 4, 'C', 0, 0\nout: .space 32\n" + X + "    ldr r1, =rle\n    ldr r2, =out\n    @ write each value 'count' times\n    b .",

    "    ldr r1, =rle\n    ldr r2, =out\n1:  ldrb r3, [r1], #1\n    cmp r3, #0\n    beq 9f\n    ldrb r4, [r1], #1\n2:  strb r4, [r2], #1\n    subs r3, r3, #1\n    bne 2b\n    b 1b\n9:", { must: ['ldrb', 'strb'], hints: ["Outer loop: read the count (stop at 0), then the value.", "Inner loop: strb the value 'count' times with post-index."] }),
], { grad: true });

// ===== UNIT 7 =====
const SPR = [0x66, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C, 0x18, 0x00];
const ARR8 = [0x01, 0x03, 0x07, 0x0F, 0x1F, 0x3F, 0x7F, 0xFF];
const rowsFb = (arr, x, y) => arr.map((v, i) => ({ off: (y + i) * 40 + x, bytes: [v] }));
const rev8 = v => { let r = 0; for (let i = 0; i < 8; i++) if (v & (1 << i)) r |= 1 << (7 - i); return r; };
const barsFb = (hs, n) => { const s = []; hs.forEach((h, i) => { const e = i < n ? h : 0; for (let k = 0; k < e; k++) s.push({ off: (239 - k) * 40 + i, bytes: [0xFF] }); s.push({ off: (239 - e) * 40 + i, bytes: [0] }); }); return s; };
const U7 = unit('u7', 'Pixels, Text and Charts', 'The screen is memory too. Paint with stores.');

lesson(U7, 'u7l1', 'pixel', 'Painting with stores', 'strb paints 8 pixels, strh 16, str 32.', [
  T('The screen is just memory', ["The 320 x 240 screen lives at 0x20000000. It is **1 bit per pixel**: each bit is a pixel, and the leftmost pixel of a byte is its top bit. A row is 40 bytes, so the byte for column x in row y is at 0x20000000 + y x 40 + x / 8.", "That means the store size is your brush size: **strb paints 8 pixels, strh 16, str 32**, in one instruction."],
    { strip: { base: 0x20000000, bytes: [0xF0, 0x0F, 0xAA, 0x55], bits: true } }),
  Q('How many pixels does `str r0, [r1]` turn on when r0 = 0xFFFFFFFF?', ['8', '16', '32', '4'], 2, "A word is 4 bytes, 8 pixels each: 32 pixels in one store."),
  Q('`mov r0, #0x81` then `strb r0, [r1]`. Which of the 8 pixels light up?', ['Only the leftmost', 'Only the rightmost', 'The leftmost and the rightmost', 'The middle two'], 2, "0x81 is 1000 0001: the top bit (leftmost pixel) and the bottom bit (rightmost pixel)."),
