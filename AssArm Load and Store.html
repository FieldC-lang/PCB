// ===== ui_s: Studio examples and the cheat sheet =====
const SAMPLES = [
  { tag: 'Aa', name: 'Hello, text page', blurb: 'Copy strings to the text screen with ldrb and strb.', code:
`@ Copy a string to the text page one byte at a time.
@ ldrb reads a letter, strb writes it to the screen.
.data
msg:    .asciz "Hello, ARM!"
msg2:   .asciz "Loads and stores"

.text
_start:
    ldr   r0, =msg            @ r0 points at the source
    ldr   r1, =0x20010000     @ r1 points at text row 0
next:
    ldrb  r2, [r0], #1        @ load a letter, then move r0 on by 1
    cmp   r2, #0              @ a zero byte ends the string
    beq   line2
    strb  r2, [r1], #1        @ store it on screen, move r1 on
    b     next
line2:
    ldr   r0, =msg2
    ldr   r1, =0x20010000 + 40   @ text row 1 (40 characters per row)
again:
    ldrb  r2, [r0], #1
    cmp   r2, #0
    strbne r2, [r1], #1       @ a conditional store: only if r2 is not 0
    bne   again
    b     .
` },
  { tag: 'str', name: 'Checkerboard', blurb: 'One str paints 32 pixels. Fill the whole screen in 2400 stores.', code:
`@ The screen is 40 bytes wide and 240 rows tall (1 bit per pixel).
@ A word store paints 4 bytes = 32 pixels at once.
.text
_start:
    ldr   r0, =0x20000000     @ r0 -> first screen byte
    ldr   r1, =0xF0F0F0F0     @ 4 pixels on, 4 off ...
    ldr   r2, =0x0F0F0F0F     @ ... and the opposite
    mov   r3, #0              @ row number
row:
    mov   r4, #10             @ 10 words = 40 bytes = one row
    tst   r3, #8              @ bit 3 of the row flips every 8 rows
    moveq r5, r1
    movne r5, r2
col:
    str   r5, [r0], #4        @ store 4 bytes, move on 4
    subs  r4, r4, #1
    bne   col
    add   r3, r3, #1
    cmp   r3, #240
    bne   row
    b     .
` },
  { tag: ':)', name: 'Sprite parade', blurb: 'An 8x8 picture from a byte table, drawn six times.', code:
`@ A sprite is 8 bytes: one byte per row, one bit per pixel.
@ ldrb fetches a row, strb drops it on the screen, then we step
@ down one screen row (40 bytes) with a post-index of #40.
.data
smile:  .byte 0x3C, 0x42, 0xA5, 0x81, 0xA5, 0x99, 0x42, 0x3C

.text
_start:
    ldr   r6, =0x20000000 + 40*20   @ where the first sprite goes (row 20)
    mov   r7, #6                    @ how many sprites
parade:
    ldr   r1, =smile                @ r1 walks through the sprite rows
    mov   r2, r6                    @ r2 walks down the screen
    mov   r3, #8                    @ 8 rows
draw:
    ldrb  r4, [r1], #1              @ one row of 8 pixels
    strb  r4, [r2], #40             @ store it, then go down a screen row
    subs  r3, r3, #1
    bne   draw
    add   r6, r6, #400              @ 10 rows lower ...
    add   r6, r6, #3                @ ... and 24 pixels to the right
    subs  r7, r7, #1
    bne   parade
    b     .
` },
  { tag: 'srt', name: 'Sorted bars', blurb: 'Bubble sort with conditional stores, then draw the array as bars.', code:
`@ Sort ten bytes in memory, then draw each one as a bar.
.data
vals:   .byte 12, 3, 9, 20, 5, 17, 1, 14, 8, 11
.equ N, 10

.text
_start:
    ldr   r0, =vals
sweep:
    mov   r2, #0                @ i = 0
    mov   r6, #0                @ swapped = 0
inner:
    add   r3, r0, r2
    ldrb  r4, [r3]              @ a[i]
    ldrb  r5, [r3, #1]          @ a[i+1]
    cmp   r4, r5
    strbhi r5, [r3]             @ out of order? swap with two conditional stores
    strbhi r4, [r3, #1]
    movhi r6, #1
    add   r2, r2, #1
    cmp   r2, #N-1
    blt   inner
    cmp   r6, #0
    bne   sweep                 @ keep sweeping until nothing moved

    ldr   r8, =0x20000000 + 40*200   @ bottom row of the chart
    mov   r2, #0                @ bar number
bar:
    ldrb  r4, [r0, r2]          @ bar height
    add   r3, r8, r2, lsl #1    @ every bar sits 2 bytes to the right of the last
    add   r3, r3, #6
    mov   r5, #0xFF
    mov   r6, r4, lsl #3        @ 8 pixel rows per unit
up:
    strb  r5, [r3], #-40        @ paint a row, then climb one row (negative post-index)
    subs  r6, r6, #1
    bne   up
    add   r2, r2, #1
    cmp   r2, #N
    blt   bar
    b     .
` },
  { tag: 'LED', name: 'LED chaser', blurb: 'A pattern table read with ldrb and written to the LEDs.', code:
`@ The LEDs are a byte of GPIO output at 0x20020000.
@ Press Play and open the Screen tab to watch them, or Run and read the history.
.data
pattern: .byte 0x01, 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80, 0x40, 0x20, 0x10, 0x08, 0x04, 0x02
.equ LEN, 14

.text
_start:
    ldr   r0, =pattern
    ldr   r1, =0x20020000       @ GPIO output register
    mov   r2, #0                @ index into the table
    mov   r3, #42               @ 42 frames = 3 sweeps
frame:
    ldrb  r4, [r0, r2]          @ r4 = pattern[index]
    str   r4, [r1]              @ show it on the LEDs
    add   r2, r2, #1
    cmp   r2, #LEN              @ wrap round at the end of the table
    moveq r2, #0
    subs  r3, r3, #1
    bne   frame
    b     .
` },
  { tag: 'sin', name: 'Sine wave', blurb: 'Signed bytes with ldrsb, plotted pixel by pixel.', code:
`@ ldrsb keeps the sign of each sample, so the wave can go below the axis.
@ plot() draws a 2x2 dot with read-modify-write: ldrb, orr, strb (twice).
.data
wave:   .byte 0, 20, 38, 56, 71, 83, 92, 98, 100, 98, 92, 83, 71, 56, 38, 20
        .byte 0, -20, -38, -56, -71, -83, -92, -98, -100, -98, -92, -83, -71, -56, -38, -20

.text
_start:
    ldr   r0, =0x20000000 + 40*120   @ dotted axis along row 120
    mov   r1, #40
    mov   r2, #0x55
axis:
    strb  r2, [r0], #1
    subs  r1, r1, #1
    bne   axis

    ldr   r5, =wave
    mov   r6, #0                @ k = sample number
loop:
    ldrsb r1, [r5, r6]          @ signed load: -100 .. +100
    rsb   r1, r1, #120          @ y = 120 - value
    add   r0, r6, r6, lsl #2    @ x = 5k + 5k = 10k
    mov   r0, r0, lsl #1
    bl    plot
    add   r6, r6, #1
    cmp   r6, #32
    blt   loop
    b     .

plot:                           @ in: r0 = x, r1 = y
    ldr   r2, =0x20000000
    mov   r3, #40
    mla   r2, r1, r3, r2        @ r2 = screen + y*40
    add   r2, r2, r0, lsr #3    @ + x/8 = the byte holding our pixel
    and   r3, r0, #7            @ which bit in that byte (0 = leftmost; x is always even here)
    mov   r4, #0xC0
    mov   r4, r4, lsr r3        @ mask = two pixels: 0xC0 >> bit
    ldrb  r3, [r2]              @ read the byte,
    orr   r3, r3, r4            @ switch our pixels on,
    strb  r3, [r2], #40         @ write it back, then drop down one row
    ldrb  r3, [r2]
    orr   r3, r3, r4
    strb  r3, [r2]
    bx    lr
` },
  { tag: 'vm', name: 'Byte-code machine', blurb: 'A jump table of handlers runs a tiny program stored as bytes.', code:
`@ The table holds the ADDRESSES of four handlers. Each opcode byte
@ picks one: ldr from [table, opcode*4], then bx to it.
.data
.align 2
table:  .word op_end, op_inc, op_dbl, op_show
code:   .byte 1, 1, 1, 3, 2, 3, 2, 3, 2, 3, 0   @ inc inc inc show dbl show dbl show dbl show end

.text
_start:
    ldr   r4, =table
    ldr   r5, =code             @ r5 = the byte-code program counter
    ldr   r8, =0x20010000       @ r8 = start of the current text row
    mov   r7, #0                @ r7 = accumulator
fetch:
    ldrb  r0, [r5], #1          @ fetch an opcode, advance
    ldr   r1, [r4, r0, lsl #2]  @ look up its handler
    bx    r1                    @ jump to it
op_inc:
    add   r7, r7, #1
    b     fetch
op_dbl:
    mov   r7, r7, lsl #1
    b     fetch
op_show:                        @ draw the accumulator as a row of # characters
    mov   r6, r8
    mov   r2, r7
    mov   r3, #35               @ '#'
put:
    strb  r3, [r6], #1
    subs  r2, r2, #1
    bne   put
    add   r8, r8, #40           @ next text row
    b     fetch
op_end:
    b     .
` },
  { tag: 'abc', name: 'Caesar cipher', blurb: 'Edit a string in place with ldrb, a conditional wrap, and strb.', code:
`@ Shift every capital letter by 3, wrapping Z round to A.
@ The letters are rewritten in the same bytes they came from.
.data
msg:    .asciz "HELLO, WORLD"

.text
_start:
    ldr   r0, =msg
    ldr   r1, =0x20010000
    bl    puts                  @ row 0: the original
    ldr   r0, =msg
    mov   r1, #3                @ the shift
    bl    rot
    ldr   r0, =msg
    ldr   r1, =0x20010000 + 40
    bl    puts                  @ row 1: the secret
    b     .

rot:                            @ in: r0 -> string, r1 = shift
    ldrb  r2, [r0]
    cmp   r2, #0
    bxeq  lr                    @ end of string: return
    cmp   r2, #65               @ 'A'
    blo   skip                  @ below A: leave it
    cmp   r2, #90               @ 'Z'
    bhi   skip
    add   r2, r2, r1
    cmp   r2, #90
    subhi r2, r2, #26           @ ran past Z: wrap round
    strb  r2, [r0]              @ write the new letter back
skip:
    add   r0, r0, #1
    b     rot

puts:                           @ in: r0 -> string, r1 -> destination
    ldrb  r2, [r0], #1
    strb  r2, [r1], #1
    cmp   r2, #0
    bne   puts
    bx    lr
` },
  { tag: 'ldm', name: 'Block moves', blurb: 'ldm and stm move eight registers at once to tile the screen.', code:
`@ ldm loads eight words into eight registers with ONE instruction;
@ stm! stores them and advances the pointer, so 300 blocks fill the screen.
@ A block is 32 bytes but a screen row is 40, so the pattern shifts.
.data
.align 2
tile:   .word 0x18181818, 0x3C3C3C3C, 0x7E7E7E7E, 0xFFFFFFFF
        .word 0xFFFFFFFF, 0x7E7E7E7E, 0x3C3C3C3C, 0x18181818

.text
_start:
    ldr   r0, =tile
    ldm   r0, {r2-r9}           @ eight words in one go
    ldr   r1, =0x20000000
    ldr   r10, =300             @ 300 x 32 bytes = 9600 bytes = the whole screen
fill:
    stm   r1!, {r2-r9}          @ store all eight, advance r1 by 32
    subs  r10, r10, #1
    bne   fill
    b     .
` },
];

const REF = [
  { title: 'The instructions', intro: 'Loads copy memory into a register. Stores copy a register out to memory. Neither one does arithmetic.', table: { head: ['Instruction', 'Moves', 'Register / memory effect', 'Example'], rows: [
    ['`ldr`', '4 bytes (word)', 'Fills all 32 bits', '`ldr r0, [r1]`'],
    ['`ldrh`', '2 bytes', 'Zero-extends: top 16 bits become 0', '`ldrh r0, [r1]`'],
    ['`ldrsh`', '2 bytes', 'Sign-extends: top 16 bits copy bit 15', '`ldrsh r0, [r1]`'],
    ['`ldrb`', '1 byte', 'Zero-extends: top 24 bits become 0', '`ldrb r0, [r1]`'],
    ['`ldrsb`', '1 byte', 'Sign-extends: top 24 bits copy bit 7', '`ldrsb r0, [r1]`'],
    ['`ldrd`', '8 bytes', 'Two registers: an even one and the next', '`ldrd r2, r3, [r1]`'],
    ['`str`', '4 bytes', 'Writes all 4 bytes of the register', '`str r0, [r1]`'],
    ['`strh`', '2 bytes', 'Writes the low 16 bits only', '`strh r0, [r1]`'],
    ['`strb`', '1 byte', 'Writes the low 8 bits only', '`strb r0, [r1]`'],
    ['`strd`', '8 bytes', 'Writes an even/odd register pair', '`strd r2, r3, [r1]`'],
    ['`ldm` / `stm`', 'several words', 'Lowest register at the lowest address', '`ldm r0!, {r2-r5}`'],
    ['`push` / `pop`', 'several words', 'stm / ldm on sp with writeback', '`push {r4, lr}`']] } },
  { title: 'Addressing modes', intro: ['The part in square brackets decides which address is used and whether the base register changes.', 'Add a condition after the name to make any load or store conditional: `ldrbne`, `strhi`, `ldrsbeq`.'], table: { head: ['Form', 'Address used', 'Base afterwards', 'Offset'], rows: [
    ['`[r1]`', 'r1', 'unchanged', '-'],
    ['`[r1, #n]`', 'r1 + n', 'unchanged', '+-4095 (ldr, ldrb, str, strb), +-255 (ldrh, ldrsb, ldrsh, ldrd, strh)'],
    ['`[r1, #n]!`', 'r1 + n', 'r1 + n', 'same ranges'],
    ['`[r1], #n`', 'r1', 'r1 + n', 'same ranges'],
    ['`[r1, r2]`', 'r1 + r2', 'unchanged', 'r2 can be subtracted: `[r1, -r2]`'],
    ['`[r1, r2, lsl #k]`', 'r1 + (r2 << k)', 'unchanged', 'ldr, ldrb, str, strb only. Not ldrh, ldrsb, ldrsh, ldrd.'],
    ['`ldr r0, =label`', 'a constant from the literal pool', '-', 'gives the ADDRESS of label, or any 32-bit constant']] } },
  { title: 'Handy facts', intro: ['- Memory is little-endian: the lowest byte sits at the lowest address.', '- A word access needs an address divisible by 4, a halfword by 2. Use `.align 2` before words in the data section.', '- `ldrb` and `ldrh` zero-fill. Pick `ldrsb` or `ldrsh` when the value can be negative.', '- A store never extends anything: a byte store keeps only the low 8 bits.', '- Reading `pc` gives the address of the current instruction + 8, so in `ldr pc, [pc, r0, lsl #2]` the table starts two words after the ldr (leave one spare word, such as a `nop`, in between).', '- `bx lr` ends the program at the top level. `b .` parks on the spot, which also counts as finished.'] },
  { title: 'Machine map', table: { head: ['Address', 'What lives there'], rows: [
    ['`0x00008000`', 'Your code and data (text first, then .data)'],
    ['`0x00001000` - `0x000FFFFF`', 'RAM. Anything below 0x1000 is unmapped (a null pointer).'],
    ['`0x00100000`', 'Where `sp` starts. The stack grows down.'],
    ['`0x20000000`', 'Screen: 320 x 240, 1 bit per pixel, 40 bytes per row, bit 7 is the leftmost pixel'],
    ['`0x20010000`', 'Text page: 40 x 16 ASCII characters'],
    ['`0x20020000`', 'GPIO: +0 LEDs (output), +4 cycle counter, +8 inputs, +0x14 write to halt']] } },
  { title: 'Patterns to steal', pats: [
    { name: 'Index loop: sum an array', note: 'Scale the index by the element size with `lsl`.', code:
`.data
nums:   .word 4, 8, 15, 16, 23, 42
.text
_start:
    ldr   r1, =nums
    mov   r2, #0              @ i
    mov   r0, #0              @ sum
loop:
    ldr   r3, [r1, r2, lsl #2]   @ nums[i]

` },

nums:   .word 4, 8, 15, 16, 23, 42
end:

loop:

    { name: 'Reverse in place', note: 'Two pointers walk towards each other, swapping with two loads and two stores.', code:
`.data
buf:    .ascii "stressed"
.text
_start:
    ldr   r0, =buf            @ first byte
    add   r1, r0, #7          @ last byte
loop:
    ldrb  r2, [r0]
    ldrb  r3, [r1]
    strb  r3, [r0], #1        @ r0 moves up
    strb  r2, [r1], #-1       @ r1 moves down
    cmp   r0, r1
    blo   loop
    b     .
` },
    { name: 'Conditional store: keep the maximum', note: 'No branch needed: the store only happens when the condition holds.', code:
`.data
best:   .byte 0
vals:   .byte 7, 19, 3, 25, 11
.text
_start:
    ldr   r0, =vals
    ldr   r1, =best
    mov   r2, #5
loop:
    ldrb  r3, [r0], #1
    ldrb  r4, [r1]
    cmp   r3, r4
    strbhi r3, [r1]           @ only if r3 > best
    subs  r2, r2, #1
    bne   loop
    b     .

one:    mov   r1, #10
        b     .
two:    mov   r1, #20
        b     .

    { name: 'Plot a pixel', note: 'Read the byte, set one bit, write it back, so neighbouring pixels survive.', code:

_start:

    add   r2, r2, r0, lsr #3  @ + x/8
    and   r3, r0, #7

    mov   r4, r4, lsr r3      @ mask for bit (x mod 8)
