<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RISC-V Tapeout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn to design a RISC-V processor and its firmware stack with short, visual exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one mobile-first column; a die-trace lesson path; bottom tab bar; full-screen lesson player.
   Palette: silicon greys with deep-navy ink, indigo actions, bond-wire gold for progress,
   and one mask-layer colour per instruction field (opcode, rd, funct3, rs1, rs2, funct7, imm). */
:root {
  --bg: #ECEEF4;
  --surface: #F6F7FB;
  --card: #FFFFFF;
  --ink: #131830;
  --ink-2: #474E6C;
  --ink-3: #767D99;
  --line: #CFD4E2;
  --line-2: #E2E5EE;
  --brand: #2A3FA8;
  --brand-2: #DCE1F7;
  --brand-ink: #FFFFFF;
  --gold: #C98D0A;
  --gold-2: #F5E4B5;
  --gold-ink: #3A2A00;
  --ok: #1D8A55;
  --ok-2: #DAF1E5;
  --bad: #C43C35;
  --bad-2: #F8DFDC;
  --wire: #A3ABC4;
  --hot: #D28A00;
  --f-op: #23925A;
  --f-rd: #2E68D6;
  --f-f3: #D24A44;
  --f-rs1: #8448CC;
  --f-rs2: #CC7A12;
  --f-f7: #0F8E92;
  --f-imm: #BC3E87;
  --f-op-2: #DDF2E6;
  --f-rd-2: #DEE8FA;
  --f-f3-2: #F9E1DF;
  --f-rs1-2: #EDE3F9;
  --f-rs2-2: #F8EBD8;
  --f-f7-2: #D8F1F1;
  --f-imm-2: #F6E0EC;
  --shadow: 0 1px 0 rgba(19, 24, 48, .06), 0 6px 18px -10px rgba(19, 24, 48, .25);
  --font-display: "Chakra Petch", "Bahnschrift", "DIN Alternate", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D19; --surface: #10142A; --card: #151A33; --ink: #E7EAF6; --ink-2: #A6ACC6; --ink-3: #737A98;
    --line: #2B3254; --line-2: #1E2440; --brand: #8494FF; --brand-2: #232C5C; --brand-ink: #0A0D19;
    --gold: #F2B82A; --gold-2: #3A2F12; --gold-ink: #1A1300; --ok: #43C985; --ok-2: #10301F; --bad: #F2706A; --bad-2: #3A1717;
    --wire: #4A5378; --hot: #F2B82A;
    --f-op: #4CC584; --f-rd: #6A9DF5; --f-f3: #F07D77; --f-rs1: #B28CF0; --f-rs2: #F2AC4E; --f-f7: #3DCACC; --f-imm: #EC7DBA;
    --f-op-2: #10301F; --f-rd-2: #14254A; --f-f3-2: #3A1A19; --f-rs1-2: #2A1C45; --f-rs2-2: #3A2810; --f-f7-2: #0E3233; --f-imm-2: #3A1730;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D19; --surface: #10142A; --card: #151A33; --ink: #E7EAF6; --ink-2: #A6ACC6; --ink-3: #737A98;
  --line: #2B3254; --line-2: #1E2440; --brand: #8494FF; --brand-2: #232C5C; --brand-ink: #0A0D19;
  --gold: #F2B82A; --gold-2: #3A2F12; --gold-ink: #1A1300; --ok: #43C985; --ok-2: #10301F; --bad: #F2706A; --bad-2: #3A1717;
  --wire: #4A5378; --hot: #F2B82A;
  --f-op: #4CC584; --f-rd: #6A9DF5; --f-f3: #F07D77; --f-rs1: #B28CF0; --f-rs2: #F2AC4E; --f-f7: #3DCACC; --f-imm: #EC7DBA;
  --f-op-2: #10301F; --f-rd-2: #14254A; --f-f3-2: #3A1A19; --f-rs1-2: #2A1C45; --f-rs2-2: #3A2810; --f-f7-2: #0E3233; --f-imm-2: #3A1730;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .02em; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: 62vh; overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.opt[aria-pressed="true"] .k { border-color: var(--brand); color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt code { white-space: normal; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 64px; }
.numwrap { display: flex; gap: 10px; align-items: center; }
.num {
  flex: 1; min-width: 0; height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px;
  font-family: var(--font-mono); font-size: 20px; font-weight: 500;
}
.num:focus { border-color: var(--brand); outline: none; }
.num.right { border-color: var(--ok); background: var(--ok-2); } .num.wrong { border-color: var(--bad); background: var(--bad-2); }
.unit-label { font-weight: 700; color: var(--ink-2); }
.bits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bitgrp { display: flex; gap: 3px; }
.bit {
  width: 34px; height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; display: grid; place-items: center; color: var(--ink-3); box-shadow: 0 3px 0 var(--line); position: relative;
}
.bit.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.bit small { position: absolute; top: -17px; font-size: 10px; color: var(--ink-3); font-weight: 500; }
.bit.locked { opacity: .5; cursor: default; }
.bits.dense .bit { width: 22px; height: 34px; font-size: 14px; border-radius: 6px; }
.bits.dense .bit small { font-size: 9px; top: -15px; }
.bitval { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.chipbank, .slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slots { min-height: 56px; padding: 10px; border-radius: 12px; border: 2px dashed var(--line); background: var(--surface); }
.slots.vertical { flex-direction: column; }
.chip {

      const v = SIM.datapathValues(d, 0x100, regs, mem);

      U.clear(vals);

      if (c.ALUSel !== '–') rows.push(['ALU: ' + (c.ALUSel === 'B' ? 'pass B' : c.ALUSel), (c.ASel !== '–' ? (c.ASel === 'pc' ? 'pc' : 'A=' + v.A) + ' , ' : '') + 'B=' + v.B + ' → ' + (Math.abs(v.alu) > 4096 ? hx(v.alu) : v.alu)]);
      if (d.cls === 'branch') rows.push(['branch comparator', v.taken ? 'condition true → taken' : 'condition false → not taken']);
      if (c.MemRW === 'read') rows.push(['memory read', hx(v.alu) + ' → ' + hx(v.memOut)]);
      if (c.MemRW === 'write') rows.push(['memory write', hx(v.alu) + ' ← ' + v.rs2v]);
      if (c.RegWEn === '1' && d.rd !== 0) rows.push(['write back ' + rn(d.rd), String(v.wb) + (Math.abs(v.wb) > 4096 ? ' (' + hx(v.wb) + ')' : '')]);

  lab('cache', 'Cache simulator', 'cache', 'Configure size, block, associativity and policies, feed it addresses, and see each lookup split into tag, index and offset.', root => {

  lab('predictor', 'Branch predictors', 'branch', 'Feed outcome patterns to static, 1-bit, 2-bit and gshare predictors and compare their accuracy.', root => {

            : [{ from: 0, to: 1, label: 'T', bend: -22 }, { from: 1, to: 2, label: 'T', bend: -22 }, { from: 2, to: 3, label: 'T', bend: -22 }, { from: 3, to: 2, label: 'N', bend: -22 }, { from: 2, to: 1, label: 'N', bend: -22 }, { from: 1, to: 0, label: 'N', bend: -22 }];

          stat('Power', r.powerMW >= 1000 ? (r.powerMW / 1000).toFixed(2) + ' W' : r.powerMW.toFixed(0) + ' mW'), stat('Energy', r.pj.toFixed(0) + ' pJ/inst')),
        h('p', { class: 'faint small' }, 'Teaching model: trends are meaningful, absolute numbers are rough (area at a 28 nm-class node).')));
      const P = r.parts;
      out.appendChild(V.figure(V.stackBars({ bars: [{ label: 'CPI', parts: [{ v: P.core, color: 'var(--f-rd)' }, { v: P.dep, color: 'var(--f-rs1)' }, { v: P.branch, color: 'var(--f-f3)' }, { v: P.mem, color: 'var(--f-rs2)' }, { v: P.tlb, color: 'var(--f-f7)' }] }], legend: [['issue', 'var(--f-rd)'], ['data stalls', 'var(--f-rs1)'], ['branches', 'var(--f-f3)'], ['memory', 'var(--f-rs2)'], ['TLB', 'var(--f-f7)']], lw: 40 }), 'Where the cycles go: base issue rate plus stall cycles per instruction. Mispredict penalty ≈ ' + r.penalty + ' cycles; an L1 miss costs ≈ ' + Math.round(r.penMiss) + ' cycles.'));
      out.appendChild(panel('Design review', h('div', { class: 'notes' }, r.notes.map(n => h('div', { class: 'note ' + n.lvl }, n.msg)))));
      out.appendChild(V.figure(V.coreDiagram(r), 'Block diagram generated from your choices.'));
      const sw = r.sw;
      out.appendChild(h('div', { class: 'lab-head', style: { marginTop: '10px' } }, h('div', { class: 'eyebrow' }, 'Software stack'), h('h2', { style: { fontSize: '20px' } }, { linux: 'Linux-class: firmware, bootloader, kernel', rtos: 'RTOS-class: kernel in M-mode, tasks in U-mode', bare: 'Bare metal: crt0 and main()' }[sw.tier])));
      out.appendChild(codePanel('Compiler flags', sw.flags));
      out.appendChild(V.figure(V.chain(sw.chain, { bh: 34 }), 'Boot chain: each stage sets up the machine for the next, then hands over.'));
      out.appendChild(codePanel('Device tree (DTS)', sw.dts));
      out.appendChild(codePanel(sw.linuxClass ? 'Firmware linker script' : 'Linker script', sw.ld));
      if (!sw.linuxClass) out.appendChild(codePanel('crt0.S (startup code)', sw.crt0));
      else out.appendChild(panel('Bring-up checklist', h('div', { class: 'notes' }, ['Port OpenSBI: a platform file with your UART, CLINT/ACLINT and PLIC addresses; build fw_dynamic.', 'Boot ROM: load SPL, which trains DRAM and loads OpenSBI + U-Boot.', 'U-Boot in S-mode: load the kernel Image, the DTB and an initramfs; boot with a0 = hartid, a1 = DTB.', 'Kernel: CONFIG for your ISA (' + sw.march + '), SBI console early, then the ns16550 driver.', 'Userland: build with ' + sw.flags.replace(' -mcmodel=medany', '') + ' and run init.'].map(t => h('div', { class: 'note info' }, t)))));
    }
    root.appendChild(ctrls);
    root.appendChild(out);
    buildCtrls();
    update();
  });
})(window);

/* ---- content/u01-u02.js ---- */
(function () {
/* Unit 1 — Bits & logic. Unit 2 — The ISA contract. */
TAPEOUT.units.push({
  id: 'u1', n: 1, track: 'hw', tone: 'op', title: 'Bits & logic',
  blurb: 'Binary, two’s complement, gates, multiplexers, adders and flip-flops: every part a processor is built from.',
  lessons: [
    {
      id: 'u1l1', title: 'Bits, bytes and hex', items: [
        { t: 'learn', h: 'Everything is bits', body: 'A **bit** is 0 or 1. Eight bits make a **byte**.\n\nEach position is worth double the one to its right: 1, 2, 4, 8 … 128. Tap the bits to see the number change.', viz: { k: 'bits', n: 8, value: 0x2D, cap: 'Bit 7 is on the left. The readout shows the value in decimal and hex.' } },
        { t: 'learn', h: 'Hex is shorthand', body: 'Four bits make one **hex digit** (0–9, then A–F for 10–15).\n\nA RISC-V instruction is 32 bits, so it fits in exactly **8 hex digits**, like `0x00A30293`.', viz: { k: 'table', head: ['Binary', 'Hex', 'Decimal'], rows: [['0000', '0', '0'], ['0101', '5', '5'], ['1001', '9', '9'], ['1010', 'A', '10'], ['1100', 'C', '12'], ['1111', 'F', '15']], mono: [0, 1, 2] } },
        { t: 'bits', q: 'Set the bits to make **13**.', n: 8, a: 13, readout: 'udec', why: '13 = 8 + 4 + 1, so bits 3, 2 and 0 are on: `00001101`.' },
        { t: 'mcq', q: 'What is `0xAF` in binary?', opts: ['`1010 1111`', '`1111 1010`', '`1010 1110`', '`1011 1111`'], a: 0, why: 'Translate digit by digit: A = `1010`, F = `1111`.' },
        { t: 'num', q: 'Write `1011 0110` in hex.', a: 0xB6, base: 'hex', why: '`1011` = B and `0110` = 6, so `0xB6`.' },
        { t: 'num', q: 'How many different values can 8 bits hold?', a: 256, why: 'Each bit doubles the count: 2⁸ = 256 (0 to 255).' },
        { t: 'match', q: 'Match each hex digit to its bits.', pairs: [['`A`', '`1010`'], ['`7`', '`0111`'], ['`F`', '`1111`'], ['`3`', '`0011`']], why: 'Hex digits map one-to-one onto 4-bit groups. That is why hardware people love hex.' },
        { t: 'mcq', q: 'How many hex digits does one 32-bit RISC-V instruction take?', opts: ['8', '4', '16', '32'], a: 0, why: '32 bits ÷ 4 bits per hex digit = 8 digits.' }
      ]
    },
    {
      id: 'u1l2', title: 'Signed numbers', items: [
        { t: 'learn', h: 'Two’s complement', body: 'Hardware stores negative numbers in **two’s complement**: the top bit counts as **negative**.\n\nIn 4 bits, `1000` = −8 and `1111` = −1. Adding 1 walks clockwise round the wheel, and the same adder works for signed and unsigned numbers.', viz: { k: 'wheel', n: 4, cap: 'Outside: the signed value. Inside: the bit pattern. Crossing the red seam is signed overflow.' } },
        { t: 'learn', h: 'Negate and extend', body: 'To negate: **invert every bit, then add 1**. 12 = `00001100` → `11110011` + 1 = `11110100` = −12.\n\nTo widen a signed number, **copy the sign bit** into the new upper bits. RISC-V does this to every immediate.', viz: { k: 'bits', n: 8, value: 0xF4, signed: true, cap: 'The top bit weighs −128: −128 + 64 + 32 + 16 + 4 = −12.' } },
        { t: 'bits', q: 'Make **−1** as an 8-bit two’s complement number.', n: 8, a: 0xFF, signed: true, readout: 'sdec', why: '−1 is all ones: −128 + 127 = −1. The same pattern means 255 unsigned.' },
        { t: 'num', q: '`1111 1010` is a signed byte. What number is it?', a: -6, why: '−128 + 64 + 32 + 16 + 8 + 2 = −6. Or invert (`00000101`) and add 1 → 6, so it is −6.' },
        { t: 'mcq', q: 'What range can an 8-bit signed number hold?', opts: ['−128 to 127', '−127 to 127', '−128 to 128', '0 to 255'], a: 0, why: 'n bits hold −2ⁿ⁻¹ to 2ⁿ⁻¹ − 1. There is one more negative value than positive.' },
        { t: 'tf', q: 'Sign-extending the 4-bit value `1010` to 8 bits gives `1111 1010`.', a: true, why: 'The sign bit is 1, so the new top four bits are ones. Both mean −6.' },
        { t: 'mcq', q: 'Which signed 8-bit addition overflows?', opts: ['100 + 50', '−100 + 50', '60 + 60', '−64 + −64'], a: 0, why: '150 is above 127. −64 + −64 = −128 still fits exactly.' },
        { t: 'num', q: 'RISC-V immediates are 12-bit signed fields. What is the largest positive value?', a: 2047, why: '2¹¹ − 1 = 2047. The range is −2048 to 2047.' }
      ]
    },
    {
      id: 'u1l3', title: 'Logic gates', items: [
        { t: 'learn', h: 'Gates compute with bits', body: '- **AND** is 1 only if both inputs are 1.\n- **OR** is 1 if either is 1.\n- **XOR** is 1 if they differ.\n- **NOT** flips its input.\n\nTry the AND gate: the truth table highlights the current row.', viz: { k: 'gate', type: 'AND', cap: 'Tap A and B. Gold wires carry a 1.' } },
        { t: 'learn', h: 'NAND builds everything', body: 'In CMOS chips, transistors act as switches, and the cheapest gates are **NAND** and **NOR**. Any logic function can be built from NAND alone: a NOT is a NAND with its inputs tied together.\n\nA modern core uses billions of these switches.', viz: { k: 'gate', type: 'NAND' } },
        { t: 'goal', q: 'Make the **XOR** gate output 1.', viz: { k: 'gate', type: 'XOR', table: false }, goal: w => w.out === 1, aText: 'A ≠ B, e.g. A=1, B=0', why: 'XOR outputs 1 exactly when the inputs differ.' },
        { t: 'mcq', q: 'A gate’s outputs for inputs 00, 01, 10, 11 are 0, 1, 1, 0. Which gate is it?', opts: ['XOR', 'OR', 'NAND', 'AND'], a: 0, why: 'Only XOR is 1 for the two mixed inputs and 0 for the equal ones.' },
        { t: 'tf', q: 'A NOT gate can be built from one NAND gate.', a: true, why: 'NAND(A, A) = NOT(A AND A) = NOT A.' },
        { t: 'mcq', q: 'Which gate outputs 1 only when both inputs are 0?', opts: ['NOR', 'NAND', 'XOR', 'AND'], a: 0, why: 'NOR = NOT(A OR B), which is 1 only for 0, 0.' },
        { t: 'num', q: 'How many rows does the truth table of a 3-input gate have?', a: 8, why: 'Each input doubles the combinations: 2³ = 8.' }
      ]
    },
    {
      id: 'u1l4', title: 'Muxes and decoders', items: [
        { t: 'learn', h: 'The multiplexer picks', body: 'A **mux** forwards one of its inputs, chosen by **select** bits. A processor is full of them: one picks whether the ALU gets a register or a constant.\n\nTap the select box.', viz: { k: 'mux', n: 2, inputs: ['rs2', 'imm'] } },
        { t: 'learn', h: 'The decoder points', body: 'A **decoder** turns an n-bit number into 2ⁿ wires with exactly one lit (**one-hot**). A 5-to-32 decoder picks which of 32 registers gets written.', viz: { k: 'decoder' } },
        { t: 'mcq', q: 'How many select bits does a 32-to-1 mux need?', opts: ['5', '32', '4', '6'], a: 0, why: '2⁵ = 32, so 5 bits can name any one of 32 inputs.' },
        { t: 'goal', q: 'Make this 4-to-1 mux pass **pc+4** through.', viz: { k: 'mux', n: 4, inputs: ['rs2', 'imm', 'pc+4', 'mem'] }, goal: w => w.sel === 2, aText: 'sel = 10', why: 'pc+4 is input 2, so the select bits must read `10`.' },
        { t: 'tf', q: 'A 5-to-32 decoder can choose which register to write.', a: true, why: 'The rd field (5 bits) drives a decoder whose one-hot output enables a single register’s write.' },
        { t: 'num', q: 'How many outputs does a 3-bit decoder have?', a: 8, why: '2³ = 8 one-hot outputs.' },
        { t: 'mcq', q: 'Which block chooses between a register value and an immediate as the ALU’s second operand?', opts: ['A multiplexer', 'A decoder', 'A flip-flop', 'An adder'], a: 0, why: 'Choosing one of several values is exactly what a mux does.' }
      ]
    },
    {
      id: 'u1l5', title: 'Adders and the ALU', items: [
        { t: 'learn', h: 'Adding bit by bit', body: 'A **full adder** adds three bits (a, b, carry-in) and outputs a sum bit and a carry. Chain them and the carry **ripples** from bit 0 upward.\n\nTap the bits and watch the carries light up.', viz: { k: 'ripple', n: 4, a: 5, b: 3 } },
        { t: 'learn', h: 'Faster carries, and the ALU', body: 'A 32-bit ripple adder waits for 32 carries. **Carry-lookahead** adders compute carries in parallel from *generate* (a AND b) and *propagate* (a XOR b) signals.\n\nSubtraction reuses the adder: **A − B = A + NOT(B) + 1**. An **ALU** puts an adder, logic and a shifter side by side and muxes out the result.', viz: { k: 'blocks', w: 352, h: 190, label: 'ALU structure', nodes: [{ id: 'a', x: 8, y: 8, w: 70, h: 26, label: 'A', tone: 'rs1' }, { id: 'b', x: 274, y: 8, w: 70, h: 26, label: 'B', tone: 'rs2' }, { id: 'add', x: 8, y: 60, w: 76, h: 34, label: 'add/sub', size: 10.5 }, { id: 'log', x: 92, y: 60, w: 76, h: 34, label: 'and/or/xor', size: 10 }, { id: 'sh', x: 176, y: 60, w: 76, h: 34, label: 'shifter', size: 10.5 }, { id: 'cmp', x: 260, y: 60, w: 84, h: 34, label: 'compare', size: 10.5 }, { id: 'mux', kind: 'mux', x: 70, y: 120, w: 212, h: 26, label: 'result mux', size: 10 }, { id: 'out', x: 136, y: 160, w: 80, h: 24, label: 'result', tone: 'op' }], edges: [{ id: 'e1', pts: [[43, 34], [43, 60]] }, { id: 'e2', pts: [[309, 34], [309, 60]] }, { id: 'e3', pts: [[46, 94], [100, 120]] }, { id: 'e4', pts: [[130, 94], [150, 120]] }, { id: 'e5', pts: [[214, 94], [200, 120]] }, { id: 'e6', pts: [[302, 94], [252, 120]] }, { id: 'e7', pts: [[176, 146], [176, 160]] }, { id: 'sel', pts: [[300, 133], [282, 133]], kind: 'ctrl', label: 'ALUSel', lx: 322, ly: 133, size: 8.5 }] } },
        { t: 'goal', q: 'Make the 4-bit adder output sum **0** with **carry out 1**.', viz: { k: 'ripple', n: 4, a: 0, b: 0 }, goal: w => w.sum === 0 && w.cout === 1, aText: 'any a + b = 16, e.g. 8 + 8', why: 'A 4-bit result wraps at 16: a + b = 16 leaves sum 0 and pushes a 1 out of the top.' },
        { t: 'mcq', q: 'A full adder gets a=1, b=1, carry-in=0. What does it output?', opts: ['sum 0, carry 1', 'sum 1, carry 0', 'sum 1, carry 1', 'sum 0, carry 0'], a: 0, why: '1 + 1 = 2 = `10` in binary: sum bit 0, carry 1.' },
        { t: 'mcq', q: 'How does an ALU usually compute A − B?', opts: ['A + NOT(B) + 1', 'A + B − 1', 'NOT(A + B)', 'A XOR B'], a: 0, why: 'NOT(B) + 1 is −B in two’s complement, so the adder does the work with carry-in set to 1.' },
        { t: 'num', q: 'In the worst case, through how many full adders can a carry ripple in a 32-bit ripple-carry adder?', a: 32, why: 'A carry born in bit 0 may travel through every stage up to bit 31.' },
        { t: 'tf', q: 'Carry-lookahead adders are faster because they compute carries in parallel instead of waiting for each one.', a: true, why: 'Generate and propagate signals let each carry be computed in a few gate levels.' }
      ]
    },
    {
      id: 'u1l6', title: 'Clocks, registers, state', items: [
        { t: 'learn', h: 'Flip-flops remember', body: 'A **D flip-flop** copies its input D to output Q only at the **rising clock edge**, then holds it. Stack 32 of them and you have a 32-bit **register**.\n\nTap the D wave and see Q change only at the dashed edges.', viz: { k: 'dff' } },
        { t: 'learn', h: 'How fast can the clock go?', body: 'Each cycle, values leave registers, pass through logic and must arrive before the next edge (plus a little **setup** time).\n\n**Clock period ≥ clock-to-Q + slowest logic path + setup.** The **register file** is many registers with 2 read ports and 1 write port, so one instruction can read two operands and write one result.', viz: { k: 'blocks', w: 352, h: 116, label: 'one clock cycle', nodes: [{ id: 'r1', kind: 'reg', x: 8, y: 34, w: 60, h: 40, label: 'reg' }, { id: 'lg', x: 110, y: 26, w: 132, h: 56, label: 'combinational\nlogic', size: 10.5, tone: 'rd' }, { id: 'r2', kind: 'reg', x: 284, y: 34, w: 60, h: 40, label: 'reg' }], edges: [{ id: 'a', pts: [[68, 54], [110, 54]] }, { id: 'b', pts: [[242, 54], [284, 54]] }], texts: [[88, 96, 'clk→Q', { size: 9.5, mono: true }], [176, 98, 'logic delay', { size: 9.5, mono: true }], [263, 96, 'setup', { size: 9.5, mono: true }]] } },
        { t: 'learn', h: 'State machines', body: 'A **finite-state machine** is a state register plus logic that computes the next state from the current state and inputs. Control units, cache controllers and branch predictors are all state machines.', viz: { k: 'fsm', w: 352, h: 150, label: 'a memory request FSM', states: [{ id: 'I', x: 60, y: 75, label: 'IDLE', r: 30, size: 10 }, { id: 'R', x: 176, y: 75, label: 'REQ', r: 30, size: 10 }, { id: 'W', x: 292, y: 75, label: 'WAIT', r: 30, size: 10 }], edges: [{ from: 'I', to: 'R', label: 'load', bend: -20 }, { from: 'R', to: 'W', label: 'sent', bend: -20 }, { from: 'W', to: 'I', label: 'ready', bend: 40 }, { from: 'W', to: 'W', label: 'busy', loop: 'top' }], cur: 'R' } },
        { t: 'mcq', q: 'When does a D flip-flop change its output?', opts: ['At the rising clock edge', 'Whenever D changes', 'When the clock is low', 'Every nanosecond'], a: 0, why: 'Edge-triggered flip-flops sample D only at the edge and hold Q the rest of the cycle.' },
        { t: 'num', q: 'Clock-to-Q is 50 ps, the slowest logic path is 700 ps and setup is 50 ps. What is the highest clock frequency in GHz?', a: 1.25, tol: 0.01, unit: 'GHz', why: 'Period = 50 + 700 + 50 = 800 ps, and 1 ÷ 800 ps = 1.25 GHz.' },
        { t: 'num', q: 'How many register-file read ports does `add x3, x1, x2` need in a single cycle?', a: 2, why: 'It reads x1 and x2 at the same time, so two read ports (plus one write port for x3).' },
        { t: 'tf', q: 'An FSM’s next state can depend on both its current state and its inputs.', a: true, why: 'That is the definition: next = f(state, inputs).' },
        { t: 'order', q: 'Put one clock cycle in order.', items: ['Clock edge: registers capture new values', 'Values flow through combinational logic', 'Results settle before the setup deadline', 'Next edge captures the results'], why: 'Every synchronous design repeats this loop each cycle.' }
      ]
    }
  ]
});

TAPEOUT.units.push({
  id: 'u2', n: 2, track: 'hw', tone: 'rd', title: 'The ISA contract',
  blurb: 'What an instruction set promises software, how RISC-V stays modular, its registers, its memory model and its instruction families.',
  lessons: [
    {
      id: 'u2l1', title: 'What an ISA is', items: [
        { t: 'learn', h: 'A contract', body: 'The **instruction set architecture (ISA)** is the contract between software and hardware: the instructions, registers, memory behaviour and privilege rules a program can rely on.\n\nThe **microarchitecture** is how one chip keeps that promise: pipeline, caches, predictors. Many microarchitectures, one ISA.', viz: { k: 'layers', hl: 1, items: [{ label: 'Software', sub: 'apps · OS · compilers' }, { label: 'ISA: the contract', sub: 'RISC-V', tone: 'rd' }, { label: 'Microarchitecture', sub: 'pipeline · caches' }, { label: 'Logic', sub: 'gates · flip-flops' }, { label: 'Circuits', sub: 'transistors' }] } },
        { t: 'learn', h: 'RISC, open and frozen', body: 'RISC-V is a **RISC** design: fixed-size simple instructions, many registers, and only loads and stores touch memory. That keeps decoding and pipelining simple.\n\nIt is an **open** standard anyone can implement without a licence, and its base ISA is **frozen**, so software keeps working on future cores.', viz: { k: 'table', head: ['', 'RISC-V', 'Typical CISC'], rows: [['Length', 'fixed 32-bit (+ optional 16-bit)', 'variable, 1–15 bytes'], ['Memory operands', 'loads/stores only', 'most instructions'], ['Registers', '32 integer', 'often 8–16'], ['Licence', 'open standard', 'proprietary']] } },
        { t: 'mcq', q: 'Which of these is part of the ISA?', opts: ['The number of integer registers', 'The pipeline depth', 'The L1 cache size', 'The branch predictor design'], a: 0, why: 'Software can name the registers, so their count is in the contract. The others are microarchitecture.' },
        { t: 'tf', q: 'Two RISC-V cores with very different pipelines can run the same binary.', a: true, why: 'That is the point of the contract: same ISA, same behaviour, different speed.' },
        { t: 'match', q: 'Match each term to its meaning.', pairs: [['ISA', 'Contract between software and hardware'], ['Microarchitecture', 'How one design implements it'], ['Extension', 'Optional group of instructions'], ['ABI', 'Calling and data-layout rules']], why: 'You will design a microarchitecture that implements the ISA, and software will follow the ABI.' },
        { t: 'mcq', q: 'Why is the RISC-V base ISA frozen?', opts: ['So today’s software keeps running on future cores', 'To make chips cheaper to fabricate', 'Because it has no room for new opcodes', 'So that cores run faster'], a: 0, why: 'New features arrive as extensions; the base never changes underneath existing programs.' }
      ]
    },
    {
      id: 'u2l2', title: 'A modular ISA', items: [
        { t: 'learn', h: 'Base plus extensions', body: 'Every core implements a **base**: **RV32I** or **RV64I** (or **RV32E**, which has only 16 registers for tiny cores). Then it adds **extensions**:\n\n- **M** multiply/divide · **A** atomics · **F/D** floating point · **C** compressed · **V** vectors\n- **Zicsr** CSR instructions · **Zifencei** instruction-fetch fence\n\n**G** is shorthand for IMAFD + Zicsr + Zifencei, so a typical Linux core is **RV64GC**.', viz: { k: 'table', head: ['Letter', 'Adds'], rows: [['I', 'base integer ISA (required)'], ['M', 'mul, div, rem'], ['A', 'lr/sc and atomic memory ops'], ['F / D', 'single / double float'], ['C', '16-bit encodings of common instructions'], ['V', 'vector registers and instructions'], ['G', 'IMAFD + Zicsr + Zifencei']], mono: [0] } },
        { t: 'learn', h: 'Profiles', body: 'A **profile** fixes a set of extensions for a class of devices so operating systems can target one baseline. **RVA23**, ratified in October 2024, is the profile for 64-bit application processors; it makes the Vector and Hypervisor extensions mandatory.\n\nThe `misa` CSR lets software read which letters a core implements.', ref: 'RISC-V International: RVA23 profile ratification (Oct 2024)' },
        { t: 'mcq', q: 'What does **G** expand to?', opts: ['IMAFD + Zicsr + Zifencei', 'IMAC', 'IMAFDCV', 'Everything ratified so far'], a: 0, why: 'G is the general-purpose set: integer, multiply, atomics, single and double float, plus CSR and fence.i.' },
        { t: 'mcq', q: 'Which base ISA has only 16 integer registers?', opts: ['RV32E', 'RV32I', 'RV64I', 'RV32C'], a: 0, why: 'E is for embedded: x0–x15 only, to save area.' },
        { t: 'match', q: 'Match each extension letter to what it adds.', pairs: [['M', 'Multiply and divide'], ['A', 'Atomic memory operations'], ['F', 'Single-precision float'], ['C', '16-bit compressed encodings'], ['V', 'Vector processing']], why: 'Pick only what your design needs: each letter costs area and verification effort.' },
        { t: 'fill', q: 'Complete the ISA string.', text: 'A 64-bit core with IMAFD, Zicsr, Zifencei and compressed instructions is RV64___', blanks: ['GC'], extra: ['IC', 'IMAC', 'EC'], why: 'G covers IMAFD + Zicsr + Zifencei, and C adds compressed: RV64GC.' },
        { t: 'tf', q: 'RISC-V reserves opcode space so a designer can add custom instructions.', a: true, why: 'The custom-0 to custom-3 opcodes are set aside for vendor extensions.' }
      ]
    },
    {
      id: 'u2l3', title: 'Registers and the ABI', items: [
        { t: 'learn', h: '32 registers', body: 'RV32I has **32 integer registers**, `x0`–`x31`, each XLEN bits wide (32 or 64).\n\n`x0` is special: it always reads **0**, and writes to it vanish. The **pc** is not one of the 32; only jumps and branches change it.', viz: { k: 'regs', cap: 'Every register has an ABI name that tells software how to use it.' } },
        { t: 'learn', h: 'Calling convention', body: 'The **ABI** gives registers jobs: `a0`–`a7` pass arguments and return values, `ra` holds the return address, `sp` is the stack pointer.\n\n**Callee-saved** registers (`s0`–`s11`, `sp`) must look untouched after a call. **Caller-saved** ones (`t0`–`t6`, `a0`–`a7`, `ra`) may be clobbered.', viz: { k: 'regs', hl: ['saved', 2], cap: 'Highlighted: the callee-saved registers a function must restore.' } },
        { t: 'mcq', q: 'What happens when an instruction writes to `x0`?', opts: ['The write is discarded', 'It traps', 'x0 changes until the next cycle', 'It writes x31 instead'], a: 0, why: 'x0 is hard-wired to zero. That is handy: `addi x0, x0, 0` is the canonical nop.' },
        { t: 'match', q: 'Match each ABI name to its register.', pairs: [['a0', 'x10'], ['ra', 'x1'], ['sp', 'x2'], ['t0', 'x5'], ['s0', 'x8']], why: 'The assembler accepts both names; the encoding only stores the number.' },

        { t: 'learn', h: 'Resolving earlier', body: 'Comparing in **ID** cuts the penalty to 1 cycle, but the comparator then needs operands earlier, which adds forwarding paths and new stalls when a branch depends on the instruction just before it.', viz: { k: 'pipeRun', src: SKIP, opt: { fwd: true, branch: 'pnt', resolve: 'ID' }, cap: 'Resolved in ID: only one wrong-path instruction.' } },
        { t: 'num', q: '20% of instructions are branches, half of them taken. Predict not-taken, 2-cycle penalty. What is the CPI?', a: 1.2, tol: 0.001, why: '1 + 0.2 × 0.5 × 2 = 1.2.' },
        { t: 'mcq', q: 'With predict not-taken, which branches cost nothing?', opts: ['Not-taken branches', 'Taken branches', 'Backward branches', 'None'], a: 0, why: 'The sequentially fetched instructions are the right ones.' },
        { t: 'num', q: 'How many instructions does a taken branch flush when it resolves in EX?', a: 2, why: 'The ones in IF and ID.' },
        { t: 'tf', q: 'A `jal` target can be computed in decode, earlier than a conditional branch decision.', a: true, why: 'pc + imm needs no register values and no comparison.' },
        { t: 'mcq', q: 'What does flushing an instruction mean?', opts: ['Turning it into a bubble before it changes any state', 'Writing its result early', 'Moving it to the front', 'Saving it for later'], a: 0, why: 'Wrong-path instructions must never write registers or memory.' }
      ]
    },
    {
      id: 'u7l7', title: 'Deeper pipelines', items: [
        { t: 'learn', h: 'More stages, diminishing returns', body: 'More stages mean less logic per stage and a faster clock. But each stage adds register overhead, and branch and load penalties grow with depth. Past an optimum, performance falls.', viz: { k: 'line', series: [{ name: 'performance', color: 'var(--brand)', area: true, pts: Array.from({ length: 24 }, (_, i) => { const n = i + 1; const t = (1000 / n + 30) * (1 + 0.03 * n); return [n, 1000 / t]; }) }], xmin: 1, xmax: 24, ymin: 0, xlab: 'pipeline stages', ylab: 'relative performance', xticks: [1, 6, 12, 18, 24], cap: 'A toy model: 1000 ps of logic, 30 ps overhead per stage, penalties growing with depth.' } },
        { t: 'learn', h: 'Balance, and real cores', body: 'The slowest stage sets the clock, so designers move logic between stages to **balance** them.\n\nSmall microcontrollers use 2–3 stages (Ibex has 2). Classic in-order cores use 5–6 (Rocket, CVA6). Big out-of-order cores use 10–15 or more.' },
        { t: 'num', q: '1000 ps of logic split into 5 balanced stages, plus 30 ps register overhead per stage. Clock period in ps?', a: 230, unit: 'ps', why: '1000 ÷ 5 + 30 = 230 ps.' },
        { t: 'mcq', q: 'Stages take 150, 300, 150, 200 and 200 ps. What sets the clock period?', opts: ['The 300 ps stage', 'The average, 200 ps', 'The sum, 1000 ps', 'The fastest stage'], a: 0, why: 'Every stage gets the same clock, so the slowest one rules.' },
        { t: 'tf', q: 'Doubling the pipeline depth doubles performance.', a: false, why: 'Overhead and bigger hazard penalties eat into the gain.' },
        { t: 'mcq', q: 'Why do deeper pipelines suffer more from branches?', opts: ['A misprediction flushes more stages of work', 'Branches become illegal', 'The BTB gets smaller', 'Forwarding stops working'], a: 0, why: 'The branch resolves further from fetch, so more wrong-path instructions are thrown away.' }
      ]
    }

TAPEOUT.units.push({
  id: 'u8', n: 8, track: 'hw', tone: 'op', title: 'Branch prediction',
  blurb: 'Guess the future to keep the pipeline full: static rules, saturating counters, branch target buffers, return stacks and history-based predictors.',
  lessons: [
    {
      id: 'u8l1', title: 'Why predict?', items: [
        { t: 'learn', h: 'The cost of guessing wrong', body: 'Roughly one instruction in five or six is a branch. Each misprediction wastes the cycles between fetch and resolve:\n\n**CPI = base + branch rate × mispredict rate × penalty**\n\nStatic rules need no tables. **BTFN**: predict backward branches taken (loops) and forward ones not taken.', viz: { k: 'flow', from: 3, to: 1, label: 'back', lines: [{ addr: 0x100, text: 'li   t0, 100' }, { addr: 0x104, text: 'add  a0, a0, t0', note: 'loop body' }, { addr: 0x108, text: 'addi t0, t0, -1' }, { addr: 0x10C, text: 'bnez t0, loop', note: 'backward: predict taken' }, { addr: 0x110, text: 'ret' }] } },
        { t: 'num', q: '20% branches, 10% of them mispredicted, 10-cycle penalty, base CPI 1. What is the CPI?', a: 1.2, tol: 0.001, why: '1 + 0.2 × 0.1 × 10 = 1.2.' },
        { t: 'mcq', q: 'BTFN predicts a backward branch as…', opts: ['Taken', 'Not taken', 'Random', 'Whatever it did last time'], a: 0, why: 'Backward branches usually close loops, which are mostly taken.' },
        { t: 'tf', q: 'Static prediction needs no prediction tables.', a: true, why: 'The rule uses only the branch itself, such as its direction.' },
        { t: 'mcq', q: 'A loop runs 100 iterations. How often is “always taken” wrong for its closing branch?', opts: ['Once, at the exit', 'Never', '50 times', 'Every iteration'], a: 0, why: 'Taken 99 times, then falls through once.' }
      ]
    },
    {
      id: 'u8l2', title: '1-bit and 2-bit counters', items: [
        { t: 'learn', h: 'Remember the last outcome', body: 'A **1-bit predictor** predicts whatever the branch did last time. On a loop it misses twice per run: at the exit, and again on the first iteration of the next run.', viz: { k: 'counter', bits: 1, cap: 'Feed T and N outcomes. Green = predicted right.' } },
        { t: 'learn', h: 'Saturating counters', body: 'A **2-bit counter** counts up on taken and down on not taken, stopping at 00 and 11. It predicts taken in 10 and 11. One odd outcome cannot flip a strong state, so a loop costs only **one** miss per run.', viz: { k: 'counter', bits: 2, state: 1 } },
        { t: 'goal', q: 'Drive the 2-bit counter into **strongly taken** (11).', viz: { k: 'counter', bits: 2, state: 0 }, goal: w => w.state === 3, aText: 'feed T until it reaches 11', why: 'Each T moves one step right: 00 → 01 → 10 → 11.' },
        { t: 'bits', q: 'A 2-bit counter starts at `01`. The branch goes T, T, N. Set its final state.', n: 2, a: 2, labels: 'index', readout: 'udec', why: '01 → 10 → 11 → 10.' },
        { t: 'num', q: 'A loop of 8 iterations repeats forever. In steady state, what accuracy does a 2-bit counter reach on its branch? (%)', a: 87.5, tol: 0.1, unit: '%', why: 'One miss (the exit) per 8 executions: 7 ÷ 8 = 87.5%. A 1-bit predictor gets 6 ÷ 8.' },
        { t: 'mcq', q: 'Why does the 2-bit counter beat the 1-bit predictor on loops?', opts: ['A single loop exit does not flip its prediction', 'It uses more history bits', 'It knows the trip count', 'It predicts the target too'], a: 0, why: 'Hysteresis: it takes two wrong outcomes to change its mind.' }
      ]
    },
    {
      id: 'u8l3', title: 'BTB and return stack', items: [
        { t: 'learn', h: 'Predicting in fetch', body: 'To fetch the right instruction next cycle, the core must guess **during IF**, before it has even decoded the branch. A **branch target buffer (BTB)** maps a pc to a predicted target; counters give the direction.', viz: { k: 'blocks', w: 352, h: 170, label: 'fetch-stage prediction', nodes: [{ id: 'pc', kind: 'reg', x: 136, y: 6, w: 80, h: 26, label: 'PC' }, { id: 'ic', kind: 'mem', x: 8, y: 60, w: 100, h: 40, label: 'I-cache', size: 10.5 }, { id: 'btb', kind: 'mem', x: 126, y: 60, w: 100, h: 40, label: 'BTB', sub: 'pc → target', size: 10.5 }, { id: 'pht', kind: 'mem', x: 244, y: 60, w: 100, h: 40, label: 'counters', sub: 'pc → T/N', size: 10.5 }, { id: 'mux', kind: 'mux', x: 120, y: 126, w: 112, h: 24, label: 'next pc', size: 10 }], edges: [{ id: 'a', pts: [[156, 32], [156, 46], [58, 46], [58, 60]] }, { id: 'b', pts: [[176, 32], [176, 60]] }, { id: 'c', pts: [[196, 32], [196, 46], [294, 46], [294, 60]] }, { id: 'd', pts: [[176, 100], [176, 126]], label: 'target', lx: 196, ly: 113, size: 8.5 }, { id: 'e', pts: [[294, 100], [294, 138], [232, 138]], label: 'taken?', lx: 300, ly: 120, anchor: 'start', size: 8.5 }, { id: 'f', pts: [[100, 138], [120, 138]], label: 'pc+4', lx: 78, ly: 138, size: 8.5 }] } },
        { t: 'learn', h: 'Returns need a stack', body: 'One `ret` instruction returns to many different callers, so a BTB keeps guessing the last caller. A **return address stack (RAS)** pushes pc + 4 on every call and pops on every return.\n\nRISC-V defines the hints: a `jal`/`jalr` writing `ra` (or `t0`) pushes; a `jalr` reading `ra` (or `t0`) with rd = x0 pops.', ref: 'Unprivileged ISA manual · JALR return-address stack hints' },
        { t: 'mcq', q: 'What does a BTB store?', opts: ['Predicted target addresses, indexed by pc', 'Recently loaded data', 'Decoded instructions only', 'The register file'], a: 0, why: 'It lets fetch redirect before decode even knows it holds a branch.' },
        { t: 'mcq', q: 'Why do returns need a RAS?', opts: ['One ret jumps to many different callers', 'Returns are rare', 'The BTB cannot store jalr', 'Returns are always mispredicted'], a: 0, why: 'A stack mirrors the call nesting, so it gets the right caller every time.' },
        { t: 'tf', q: '`jal ra, f` hints the predictor to push the return address.', a: true, why: 'rd = x1 (or x5) marks a call.' },
        { t: 'num', q: 'A direct-mapped BTB has 512 entries indexed by pc bits. How many index bits does it use?', a: 9, why: '2⁹ = 512.' }
      ]
    },
    {
      id: 'u8l4', title: 'History-based predictors', items: [
        { t: 'learn', h: 'Branches correlate', body: 'Branch outcomes follow patterns and depend on other branches. A **global history register** (GHR) records the last few outcomes. **gshare** indexes its counter table with **pc bits XOR history**, so the same branch gets different counters in different contexts.', viz: { k: 'blocks', w: 352, h: 150, label: 'gshare', nodes: [{ id: 'pc', x: 8, y: 8, w: 120, h: 30, label: 'pc bits', tone: 'rd' }, { id: 'ghr', x: 224, y: 8, w: 120, h: 30, label: 'global history', tone: 'rs1', size: 10.5 }, { id: 'x', kind: 'circle', x: 156, y: 50, w: 40, h: 40, label: '⊕' }, { id: 't', kind: 'mem', x: 106, y: 104, w: 140, h: 40, label: '2-bit counters', size: 10.5 }], edges: [{ id: 'a', pts: [[68, 38], [68, 70], [156, 70]] }, { id: 'b', pts: [[284, 38], [284, 70], [196, 70]] }, { id: 'c', pts: [[176, 90], [176, 104]], label: 'index', lx: 196, ly: 97, size: 8.5 }] } },
        { t: 'learn', h: 'Tournaments and TAGE', body: '**Tournament** predictors run two predictors and learn which one to trust per branch. **TAGE** keeps several tagged tables indexed with geometrically longer histories and uses the longest one that matches; it is the basis of most high-end predictors today. Perceptron predictors learn weights for each history bit.' },
        { t: 'bits', q: 'gshare: pc index bits are `0110` and the history is `1011`. Set the table index.', n: 4, a: 13, labels: 'index', readout: 'udec', why: '0110 XOR 1011 = 1101 (13).' },
        { t: 'mcq', q: 'Which pattern does a single 2-bit counter handle badly but gshare learns?', opts: ['Alternating T N T N', 'Always taken', 'Always not taken', 'Taken 99 times then not taken'], a: 0, why: 'With history, each position of the pattern gets its own counter. Try it in the Branch predictors lab.' },
        { t: 'tf', q: 'TAGE looks up several tables that use different history lengths.', a: true, why: 'Short histories learn fast; long ones catch distant correlations.' },
        { t: 'mcq', q: 'What does the global history register record?', opts: ['Recent branch outcomes', 'Recent branch addresses only', 'Cache misses', 'Return addresses'], a: 0, why: 'One bit per recent branch: taken or not.' }
      ]
    },
    {
      id: 'u8l5', title: 'Recovering from mispredictions', items: [
        { t: 'learn', h: 'Undo, redirect, learn', body: 'When a branch resolves the other way: **flush** younger instructions, **redirect** fetch to the right pc, **repair** predictor history, and update the counters.\n\nOut-of-order cores also restore their register rename map from a checkpoint. Here a 2-bit predictor learns a loop but still misses its exit.', viz: { k: 'pipeRun', src: 'li   x5, 3\nloop: addi x5, x5, -1\nbnez x5, loop\necall', opt: { fwd: true, branch: 'bht' }, cap: '2-bit + BTB: first iterations train the predictor; the exit mispredicts.' } },
        { t: 'num', q: 'A 4-wide core has a 15-cycle misprediction penalty. How many instruction slots does one misprediction waste?', a: 60, why: '4 slots per cycle × 15 cycles.' },
        { t: 'mcq', q: 'What must be repaired after a misprediction?', opts: ['Speculative state like rename maps and branch history', 'Main memory', 'The instruction cache contents', 'The page tables'], a: 0, why: 'Wrong-path instructions never committed, so architectural state and memory are untouched.' },
        { t: 'tf', q: 'Stores on the wrong path must never reach memory.', a: true, why: 'They wait in a store buffer until their instruction commits.' },
        { t: 'mcq', q: 'Why does predictor accuracy matter more for wide, deep cores?', opts: ['Each miss throws away penalty × width slots', 'They run fewer branches', 'Their branches are always taken', 'They cannot flush'], a: 0, why: 'A 1% accuracy gain can be worth several percent of performance on a big core.' }
      ]
    }
  ]
});

  ['BTB', 'Branch target buffer: pc → predicted target.'], ['RAS', 'Return address stack for predicting returns.'],

TAPEOUT.units.push({
  id: 'u9', n: 9, track: 'hw', tone: 'rd', title: 'Caches',
  blurb: 'Hide slow memory behind small fast SRAMs: locality, address splitting, associativity, write policies and cache performance.',
  lessons: [
    {
      id: 'u9l1', title: 'The memory wall', items: [
        { t: 'learn', h: 'Memory is far away', body: 'A DRAM access costs hundreds of core cycles. **Caches** keep recently used data in small, fast **SRAM** next to the core, so most accesses never leave the chip.', viz: { k: 'pyramid', cap: 'Typical latencies and sizes. Each level catches most of the misses of the one above.' } },
        { t: 'learn', h: 'Locality makes it work', body: '**Temporal locality**: data used now is likely used again soon. **Spatial locality**: neighbours of used data are likely used next.\n\nCaches move whole **blocks** (lines), often 64 bytes, so one miss fetches the neighbours too.', viz: { k: 'cache', cfg: { size: 64, block: 16, assoc: 1 }, seq: [0x100, 0x104, 0x108, 0x10C, 0x110], cap: 'Walking an array: 0x100 misses and brings the whole 16-byte block, so the next three accesses hit.' } },
        { t: 'match', q: 'Match each access pattern to its locality.', pairs: [['A loop counter reused every iteration', 'Temporal'], ['Walking through an array', 'Spatial'], ['Chasing pointers through a huge random list', 'Little locality']], why: 'Caches love the first two and struggle with the third.' },
        { t: 'mcq', q: 'Compared with DRAM, SRAM is…', opts: ['Faster but larger and costlier per bit', 'Slower but denser', 'The same speed but non-volatile', 'Only used for registers'], a: 0, why: 'An SRAM cell uses about 6 transistors; a DRAM cell is one transistor and a capacitor.' },
        { t: 'tf', q: 'A cache hit is served without going to main memory.', a: true, why: 'That is the whole point.' },
        { t: 'num', q: 'With a 95% hit rate, how many of 200 accesses go to main memory?', a: 10, why: '5% of 200 = 10 misses.' }
      ]
    },
    {
      id: 'u9l2', title: 'Direct-mapped caches', items: [
        { t: 'learn', h: 'Tag · index · offset', body: 'Split the address into three fields:\n\n- **offset**: which byte inside the block (log₂ block size bits)\n- **index**: which line (log₂ number of sets)\n- **tag**: the rest, stored to identify the block\n\nThis 1 KiB cache has 64 lines of 16 bytes.', viz: { k: 'split', tag: 22, index: 6, offset: 4, addr: 0x1234ABCD } },
        { t: 'learn', h: 'Lookup', body: 'The index selects one line. If its **valid** bit is set and its stored **tag** matches, it is a **hit**. Otherwise the block is fetched and replaces whatever was there.', viz: { k: 'cache', cfg: { size: 1024, block: 16, assoc: 1 }, seq: [0x1000, 0x1010, 0x2000, 0x1004], cap: '0x1004 hits in set 0: same tag as 0x1000.' } },
        { t: 'split', q: 'Split a 32-bit address for a **1 KiB** direct-mapped cache with **16-byte** blocks.', a: [22, 6, 4], start: [20, 8, 4], why: 'offset = log₂16 = 4; lines = 1024 ÷ 16 = 64 → index 6; tag = 32 − 6 − 4 = 22.' },
        { t: 'num', q: 'A 4 KiB direct-mapped cache has 32-byte blocks. How many index bits?', a: 7, why: '4096 ÷ 32 = 128 lines = 2⁷.' },
        { t: 'num', q: 'In that 1 KiB cache (16-byte blocks, 64 sets), which set does address `0x1234` use?', a: 35, viz: { k: 'split', tag: 22, index: 6, offset: 4, addr: 0x1234 }, why: '0x1234 >> 4 = 0x123 = 291, and 291 mod 64 = 35.' },
        { t: 'tf', q: 'In a direct-mapped cache, two addresses exactly one cache-size apart always map to the same set.', a: true, why: 'They share the index bits and differ only in the tag, so they evict each other.' },
        { t: 'mcq', q: 'What does a line’s valid bit tell you?', opts: ['The line holds a real block, not leftover reset garbage', 'The data was modified', 'The block is read-only', 'The line is locked'], a: 0, why: 'After reset every line is invalid, so nothing can falsely hit.' }
      ]
    },
    {
      id: 'u9l3', title: 'Associativity and replacement', items: [
        { t: 'learn', h: 'More places to go', body: 'In an **N-way set-associative** cache each set holds N lines, and a block may sit in any of them. Two hot blocks that collide in a direct-mapped cache can now coexist.\n\nThe cost: N tag comparators and a way mux. A **fully associative** cache has one set.', viz: { k: 'cache', cfg: { size: 1024, block: 16, assoc: 2 }, seq: [0x1000, 0x1400, 0x1000, 0x1400], cap: 'Ping-pong between 0x1000 and 0x1400 now hits: both live in set 0, in different ways.' } },
        { t: 'learn', h: 'Who gets evicted?', body: 'When a set is full, a **replacement policy** picks the victim.', viz: { k: 'table', head: ['Policy', 'Idea', 'Cost'], rows: [['LRU', 'evict the least recently used', 'exact order bits; costly beyond 4–8 ways'], ['Pseudo-LRU', 'a tree of bits approximates LRU', 'N−1 bits per set'], ['Random', 'evict any way', 'almost free'], ['FIFO', 'evict the oldest fill', 'a counter per set']] } },
        { t: 'num', q: 'A 32 KiB, 8-way cache has 64-byte lines. How many index bits?', a: 6, why: 'Sets = 32768 ÷ (64 × 8) = 64 = 2⁶.' },
        { t: 'mcq', q: 'A 2-way set holds A (last used at time 5) and B (used at time 9). Block C arrives. LRU evicts…', opts: ['A', 'B', 'C', 'Both'], a: 0, why: 'A was used longest ago.' },
        { t: 'tf', q: 'A fully associative cache has no index bits.', a: true, why: 'There is only one set, so every tag is compared.' },
        { t: 'mcq', q: 'Higher associativity mainly reduces…', opts: ['Conflict misses', 'Compulsory misses', 'Hit time', 'Tag size'], a: 0, why: 'Blocks that share an index no longer evict each other.' },
        { t: 'split', q: 'Split the address for a **16 KiB, 4-way** cache with **32-byte** lines.', a: [20, 7, 5], start: [22, 6, 4], why: 'Sets = 16384 ÷ (32 × 4) = 128 → index 7; offset 5; tag 20.' }
      ]
    },
    {
      id: 'u9l4', title: 'Writes', items: [
        { t: 'learn', h: 'Through or back?', body: '- **Write-through**: every store also updates memory (usually via a write buffer).\n- **Write-back**: stores update only the cache and set a **dirty** bit; memory is updated when the line is evicted.\n\nOn a write miss, **write-allocate** fetches the block first; **no-write-allocate** sends the write straight on.', viz: { k: 'cache', cfg: { size: 1024, block: 16, assoc: 1, write: 'WB' }, seq: [{ addr: 0x1000, write: true }, { addr: 0x1400, write: false }], cap: 'The dirty line at set 0 is written back when 0x1400 evicts it.' } },
        { t: 'mcq', q: 'In a write-back cache, when does a modified line reach memory?', opts: ['When it is evicted', 'On every store', 'Every 100 cycles', 'Never'], a: 0, why: 'The dirty bit marks lines that must be written out before being replaced.' },
        { t: 'tf', q: 'A write-through cache needs a dirty bit.', a: false, why: 'Memory is always up to date, so there is nothing to track.' },
        { t: 'mcq', q: 'Why pair a write-through cache with a write buffer?', opts: ['So the core need not wait for each memory write', 'To make reads faster', 'To store dirty bits', 'To translate addresses'], a: 0, why: 'Stores drain to memory in the background.' },
        { t: 'match', q: 'Match each term to its meaning.', pairs: [['Dirty bit', 'Line differs from memory'], ['Write-allocate', 'Fetch the block on a write miss'], ['Write-through', 'Every store also goes to memory'], ['Write-back', 'Memory updated on eviction']], why: 'Write-back + write-allocate is the usual choice for L1 data caches.' }
      ]
    },
    {
      id: 'u9l5', title: 'Cache performance', items: [
        { t: 'learn', h: 'Average memory access time', body: '**AMAT = hit time + miss rate × miss penalty**\n\nWith two levels: AMAT = HT₁ + MR₁ × (HT₂ + MR₂ × MP₂).\n\nMisses come in three kinds, the **3 Cs**:', viz: { k: 'table', head: ['Miss', 'Cause', 'Cure'], rows: [['Compulsory', 'first touch of a block', 'bigger blocks, prefetching'], ['Capacity', 'working set larger than the cache', 'bigger cache'], ['Conflict', 'blocks fighting over one set', 'more associativity']] } },
        { t: 'num', q: 'Hit time 1 cycle, miss rate 5%, miss penalty 100 cycles. What is the AMAT?', a: 6, tol: 0.001, unit: 'cycles', why: '1 + 0.05 × 100 = 6.' },
        { t: 'num', q: 'L1: hit 1 cycle, 10% misses. L2: hit 10 cycles, 20% of its accesses miss. Memory: 100 cycles. What is the AMAT?', a: 4, tol: 0.001, unit: 'cycles', why: '1 + 0.1 × (10 + 0.2 × 100) = 1 + 0.1 × 30 = 4.' },
        { t: 'match', q: 'Match each miss to its type.', pairs: [['First ever access to a block', 'Compulsory'], ['Working set twice the cache size', 'Capacity'], ['Two hot blocks share one set', 'Conflict']], why: 'Naming the miss tells you which knob to turn.' },
        { t: 'num', q: 'Each instruction makes 1.3 memory accesses (fetch + data), 2% miss, penalty 50 cycles. How many stall cycles does that add per instruction?', a: 1.3, tol: 0.001, why: '1.3 × 0.02 × 50 = 1.3, doubling CPI for a simple core.' },
        { t: 'tf', q: 'Making the cache bigger cannot remove compulsory misses.', a: true, why: 'The first touch always misses (unless something prefetches it).' }
      ]
    },
    {
      id: 'u9l6', title: 'Designing your L1s', items: [
        { t: 'learn', h: 'Choices for a real core', body: '- **Split I and D caches**: fetch and load in the same cycle.\n- **Block size**: bigger blocks exploit spatial locality but hold fewer distinct blocks and take longer to fill.\n- **Non-blocking** caches track misses in **MSHRs** and keep serving hits.\n- **Critical word first** returns the needed word before the rest of the block.\n- **Prefetchers** (next-line, stride) fetch before the core asks.' },
        { t: 'learn', h: 'VIPT and the 4 KiB limit', body: 'L1 caches often index with **virtual** address bits while the TLB translates in parallel (**VIPT**). That is only safe if the index and offset bits fit inside the **page offset**, so **way size ≤ page size**.\n\nWith 4 KiB pages, a 32 KiB L1 is often 8-way: 32 ÷ 8 = 4 KiB per way.', viz: { k: 'split', tag: 20, index: 6, offset: 6, labels: ['tag (from TLB)', 'index', 'offset'], cap: '32 KiB, 8-way, 64 B lines: index + offset = 12 bits = the 4 KiB page offset, which translation never changes.' } },
        { t: 'mcq', q: 'Why split the L1 into instruction and data caches?', opts: ['Fetch and data access can happen in the same cycle', 'Instructions are larger than data', 'Data caches cannot hold code', 'It halves the miss rate'], a: 0, why: 'It removes the structural hazard of one shared port.' },
        { t: 'num', q: 'A VIPT L1D of 64 KiB with 4 KiB pages. What is the minimum associativity that avoids aliasing?', a: 16, unit: 'ways', why: 'Way size must be ≤ 4 KiB: 64 ÷ 4 = 16 ways.' },
        { t: 'tf', q: 'A non-blocking cache can serve hits while a miss is outstanding.', a: true, why: 'Miss status holding registers (MSHRs) track the pending misses.' },
        { t: 'mcq', q: 'What does a stride prefetcher do?', opts: ['Detects a constant address step and fetches ahead', 'Fetches random blocks', 'Doubles the block size', 'Predicts branches'], a: 0, why: 'Array walks with a fixed step are easy to anticipate.' },
        { t: 'mcq', q: 'What is a downside of very large blocks?', opts: ['Fewer blocks fit and each miss moves more data', 'Tags get longer', 'Hits become slower than misses', 'Writes are impossible'], a: 0, why: 'Past a point, pollution and longer fills outweigh spatial reuse.' }

TAPEOUT.units.push({
  id: 'u10', n: 10, track: 'hw', tone: 'f3', title: 'Virtual memory',
  blurb: 'Give every process its own address space: pages, Sv32 and Sv39 page tables, PTE permission bits, page faults and TLBs.',
  lessons: [
    {
      id: 'u10l1', title: 'Why virtual memory?', items: [
        { t: 'learn', h: 'Every program gets its own map', body: 'With **virtual memory**, each process uses its own addresses. Hardware translates them, page by page, to physical memory.\n\nThat gives **isolation** (a process cannot touch another’s memory), **relocation** (load anywhere), and **demand paging** (only used pages need RAM).', viz: { k: 'blocks', w: 352, h: 190, label: 'two address spaces sharing physical memory', nodes: [{ id: 'p1', x: 8, y: 6, w: 96, h: 24, label: 'process A', tone: 'rd', size: 10.5 }, { id: 'a0', x: 8, y: 36, w: 96, h: 26, label: 'VA 0x1000', mono: true, size: 9.5 }, { id: 'a1', x: 8, y: 66, w: 96, h: 26, label: 'VA 0x2000', mono: true, size: 9.5 }, { id: 'p2', x: 8, y: 104, w: 96, h: 24, label: 'process B', tone: 'rs1', size: 10.5 }, { id: 'b0', x: 8, y: 134, w: 96, h: 26, label: 'VA 0x1000', mono: true, size: 9.5 }, { id: 'ph', x: 230, y: 6, w: 114, h: 24, label: 'physical', tone: 'rs2', size: 10.5 }, { id: 'f0', x: 230, y: 36, w: 114, h: 26, label: 'frame 0x80042', mono: true, size: 9.5 }, { id: 'f1', x: 230, y: 66, w: 114, h: 26, label: 'frame 0x80010', mono: true, size: 9.5 }, { id: 'f2', x: 230, y: 96, w: 114, h: 26, label: 'frame 0x80777', mono: true, size: 9.5 }], edges: [{ id: 'e0', pts: [[104, 49], [230, 79]] }, { id: 'e1', pts: [[104, 79], [230, 109]] }, { id: 'e2', pts: [[104, 147], [230, 49]] }] } },
        { t: 'learn', h: 'Only the page number changes', body: 'Memory is split into **pages**, usually 4 KiB. Translation replaces the **virtual page number** with a **physical page number** and keeps the **page offset**.', viz: { k: 'split', tag: 20, index: 0, offset: 12, labels: ['virtual page number', '', 'page offset'], addr: 0x00012ABC } },
        { t: 'num', q: 'Pages are 4 KiB. How many offset bits does an address have?', a: 12, why: '2¹² = 4096.' },
        { t: 'mcq', q: 'Which part of an address does translation change?', opts: ['The page number', 'The page offset', 'Both', 'Neither'], a: 0, why: 'Bytes keep their position inside the page.' },
        { t: 'tf', q: 'Two processes can use the same virtual address for different data.', a: true, why: 'Each has its own page table mapping it to different frames.' },
        { t: 'mcq', q: 'A program touches a page marked invalid in its page table. What happens?', opts: ['A page fault traps to the OS, which may load the page', 'The core reads zero', 'The program ends silently', 'The cache supplies stale data'], a: 0, why: 'The OS fixes the mapping (or kills the process) and re-runs the instruction.' }

    {
      id: 'u10l2', title: 'Sv32 page tables', items: [
        { t: 'learn', h: 'A two-level walk', body: 'RV32’s **Sv32** splits a virtual address into **VPN[1]** (10 bits), **VPN[0]** (10 bits) and a 12-bit offset. The `satp` CSR points at the root table.\n\nThe walker reads the level-1 entry, follows it to a level-0 table, and reads the leaf entry that holds the physical page number.', viz: { k: 'walk', va: 0x12345678, step: 3 }, ref: 'Privileged ISA manual · Sv32: page-based 32-bit virtual-memory system' },
        { t: 'learn', h: 'Page table entries', body: 'Each 4-byte PTE holds a physical page number and permission bits. If **R, W and X are all 0**, the entry points to the next level; otherwise it is a **leaf**. A leaf at level 1 maps a 4 MiB **megapage**.', viz: { k: 'pte', word: 0x268AD0CF, cap: 'A leaf PTE: PPN 0x9A2B4, D A X W R V set.' } },
        { t: 'split', q: 'Split an Sv32 virtual address.', names: ['VPN[1]', 'VPN[0]', 'offset'], a: [10, 10, 12], start: [12, 8, 12], why: '10 + 10 + 12 = 32: two 1024-entry table levels and a 4 KiB page.' },
        { t: 'num', q: 'Virtual address `0x12345678`. What is VPN[1]? (hex)', a: 0x48, base: 'hex', why: 'The top 10 bits: 0x12345678 >> 22 = 0x48.' },
        { t: 'num', q: 'Same address. What is VPN[0]? (hex)', a: 0x345, base: 'hex', why: '(0x12345678 >> 12) & 0x3FF = 0x345.' },
        { t: 'mcq', q: 'On a TLB miss, how many memory reads does an Sv32 walk need for a 4 KiB page?', opts: ['2', '1', '3', '4'], a: 0, why: 'One PTE per level, two levels.' },
        { t: 'tf', q: 'A valid PTE with R = W = X = 0 points to the next level of the table.', a: true, why: 'That is how the walker distinguishes pointers from leaves.' },

    {
      id: 'u10l3', title: 'PTE bits and page faults', items: [
        { t: 'learn', h: 'Permissions in every entry', body: '- **V** valid · **R** W **X** read/write/execute\n- **U** user pages (U-mode may access)\n- **G** global (present in every address space)\n- **A** accessed · **D** dirty\n\nViolations raise **page faults**: cause 12 (fetch), 13 (load), 15 (store). The faulting virtual address goes into `stval`.', viz: { k: 'pte', hl: ['d', 'a', 'u', 'x', 'w', 'r', 'v'] }, more: 'When A or D needs setting, hardware may update the PTE itself (the Svadu extension) or raise a page fault so the OS sets it.' },
        { t: 'match', q: 'Match each PTE bit to its meaning.', pairs: [['V', 'Entry is valid'], ['U', 'U-mode may access'], ['D', 'Page has been written'], ['A', 'Page has been used'], ['X', 'Instructions may run from it']], why: 'The OS uses A and D to choose pages to evict and to know which must be written back.' },
        { t: 'mcq', q: 'A store hits a page whose PTE has R = 1, W = 0. What happens?', opts: ['Store page fault (cause 15)', 'Load page fault (cause 13)', 'The store succeeds', 'Illegal instruction'], a: 0, why: 'Copy-on-write in Linux relies on exactly this fault.' },
        { t: 'tf', q: 'S-mode can read and write U pages only while the SUM bit in sstatus is set.', a: true, why: 'SUM = permit Supervisor User Memory access; kernels set it only around copies to and from user space.' },
        { t: 'mcq', q: 'What does a PTE with W = 1 but R = 0 mean?', opts: ['Reserved: accessing it causes a page fault', 'Write-only page', 'Execute-only page', 'Pointer to the next level'], a: 0, why: 'That combination is reserved for future use.' },
        { t: 'hotspot', q: 'Tap the **dirty** bit.', viz: { k: 'pte' }, a: 'd', aText: 'D, bit 7', why: 'D sits at bit 7, just above A.' }
      ]
    },
    {
      id: 'u10l4', title: 'TLBs and sfence.vma', items: [
        { t: 'learn', h: 'Cache the translations', body: 'Walking page tables on every access would be ruinous. A **TLB** caches recent translations. On a miss, a hardware **page-table walker** reads the PTEs (the privileged spec defines the walk) and refills the TLB.\n\n**ASIDs** tag entries by address space, so a context switch need not flush everything.', viz: { k: 'blocks', w: 352, h: 150, label: 'translation path', nodes: [{ id: 'core', x: 8, y: 20, w: 80, h: 34, label: 'core', tone: 'rd' }, { id: 'tlb', kind: 'mem', x: 120, y: 14, w: 100, h: 46, label: 'TLB', sub: 'VPN → PPN', size: 11 }, { id: 'l1', kind: 'mem', x: 252, y: 14, w: 92, h: 46, label: 'L1 cache', size: 10.5 }, { id: 'ptw', x: 120, y: 92, w: 100, h: 40, label: 'page walker', size: 10.5, tone: 'f3' }, { id: 'mem', kind: 'mem', x: 252, y: 92, w: 92, h: 40, label: 'memory', size: 10.5 }], edges: [{ id: 'a', pts: [[88, 37], [120, 37]], label: 'VA', lx: 104, ly: 29, size: 8.5 }, { id: 'b', pts: [[220, 37], [252, 37]], label: 'PA', lx: 236, ly: 29, size: 8.5 }, { id: 'c', pts: [[170, 60], [170, 92]], label: 'miss', lx: 176, ly: 76, anchor: 'start', size: 8.5 }, { id: 'd', pts: [[220, 112], [252, 112]], label: 'PTEs', lx: 236, ly: 104, size: 8.5 }] } },
        { t: 'num', q: 'A 64-entry TLB maps 4 KiB pages. How much memory can it cover at once (KiB)?', a: 256, unit: 'KiB', why: '64 × 4 KiB = 256 KiB, the TLB reach.' },
        { t: 'mcq', q: 'After the OS changes a PTE, which instruction makes the hardware forget stale translations?', opts: ['`sfence.vma`', '`fence.i`', '`fence`', '`wfi`'], a: 0, why: 'sfence.vma orders page-table updates and flushes matching TLB entries.' },
        { t: 'tf', q: 'ASIDs let the TLB hold entries from several processes at once.', a: true, why: 'Entries only match when the current ASID (from satp) agrees.' },
        { t: 'mcq', q: 'Why do megapages help performance?', opts: ['One TLB entry covers far more memory', 'They make walks longer', 'They remove page faults', 'They disable caching'], a: 0, why: 'A 4 MiB page replaces 1024 entries’ worth of 4 KiB pages.' }
      ]
    },
    {
      id: 'u10l5', title: 'Sv39 and RV64', items: [
        { t: 'learn', h: 'Bigger address spaces', body: 'RV64 cores use 8-byte PTEs and more levels. Linux needs one of these modes, selected in `satp.MODE`.', viz: { k: 'table', head: ['Mode', 'satp.MODE', 'Levels', 'VA bits', 'Page sizes'], rows: [['Sv39', '8', '3', '39 (512 GiB)', '4 KiB · 2 MiB · 1 GiB'], ['Sv48', '9', '4', '48 (256 TiB)', '+ 512 GiB'], ['Sv57', '10', '5', '57', '+ 256 TiB']], mono: [1, 2] } },
        { t: 'num', q: 'How many levels does an Sv39 walk have?', a: 3, why: 'Three 9-bit VPN fields: 9 + 9 + 9 + 12 = 39.' },
        { t: 'num', q: 'How many 8-byte PTEs fit in one 4 KiB Sv39 table page?', a: 512, why: '4096 ÷ 8 = 512 = 2⁹, matching the 9-bit VPN fields.' },
        { t: 'mcq', q: 'Under Sv39, what must bits 63:39 of a valid virtual address be?', opts: ['Copies of bit 38', 'All zero', 'All one', 'Anything'], a: 0, why: 'Addresses are sign-extended from bit 38; others raise a page fault.' },
        { t: 'tf', q: 'Linux on RV64 typically runs with Sv39 or Sv48.', a: true, why: 'Sv39 is the common baseline; Sv48/Sv57 serve very large memories.' },
        { t: 'mcq', q: 'On RV64, writing `satp.MODE = 8` selects…', opts: ['Sv39', 'Sv32', 'Bare (no translation)', 'Sv48'], a: 0, why: '0 = Bare, 8 = Sv39, 9 = Sv48, 10 = Sv57.' }
