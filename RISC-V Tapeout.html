TAPEOUT.units.push({
  id: 'u11', n: 11, track: 'hw', tone: 'rs1', title: 'Privilege, CSRs and traps',
  blurb: 'Machine, supervisor and user modes; control and status registers; the exact trap sequence; interrupts; precise exceptions; delegation and PMP.',
  lessons: [
    {
      id: 'u11l1', title: 'Privilege modes', items: [
        { t: 'learn', h: 'Three levels of trust', body: '- **M-mode** (machine): full control; every core has it. Firmware lives here.\n- **S-mode** (supervisor): the OS kernel, with virtual memory.\n- **U-mode** (user): applications.\n\nLower modes ask higher ones for help with `ecall`; higher ones return with `sret`/`mret`. The Hypervisor extension adds virtualised modes on top.', viz: { k: 'priv' } },
        { t: 'learn', h: 'Pick what your system needs', body: 'Modes cost area and verification time, so cores implement only what their software needs.', viz: { k: 'table', head: ['System', 'Modes', 'Why'], rows: [['Tiny controller', 'M', 'one program, no protection needed'], ['Secure embedded / RTOS', 'M + U', 'PMP isolates tasks from the kernel'], ['Linux-class', 'M + S + U', 'kernel manages page tables in S-mode']] } },
        { t: 'hotspot', q: 'Tap the level where an operating-system kernel normally runs.', viz: { k: 'priv' }, a: 'S', aText: 'S-mode', why: 'The kernel runs in supervisor mode, above apps and below firmware.' },
        { t: 'mcq', q: 'Which privilege mode must every RISC-V core implement?', opts: ['M-mode', 'S-mode', 'U-mode', 'H-mode'], a: 0, why: 'M-mode is mandatory; S and U are optional.' },
        { t: 'tf', q: 'U-mode code can read `mstatus` directly.', a: false, why: 'mstatus is an M-mode CSR. Trying it from U-mode raises an illegal-instruction exception.' },
        { t: 'match', q: 'Match each mode to its typical software.', pairs: [['M-mode', 'Firmware such as OpenSBI'], ['S-mode', 'OS kernel'], ['U-mode', 'Applications']], why: 'You will write code for all three in Part 2.' },
        { t: 'mcq', q: 'A small microcontroller running one bare-metal program typically implements…', opts: ['M-mode only', 'M + S + U', 'S + U', 'U only'], a: 0, why: 'With no OS and no untrusted code, M-mode alone is enough.' }
      ]
    },
    {
      id: 'u11l2', title: 'CSRs', items: [
        { t: 'learn', h: '4096 control registers', body: 'Control and status registers (**CSRs**) hold machine state: trap vectors, causes, interrupt enables, counters, page-table roots.\n\nThe 12-bit address encodes access rules: bits [11:10] = `11` means **read-only**; bits [9:8] give the **lowest privilege** allowed.', viz: { k: 'csraddr', addr: 0x341, cap: '0x341 = mepc: read/write, M-mode only.' } },
        { t: 'learn', h: 'Atomic read-modify-write', body: 'CSR instructions read the old value into rd and update the CSR in one step.', viz: { k: 'table', head: ['Instruction', 'Effect', 'Common alias'], rows: [['`csrrw rd, csr, rs1`', 'rd ← csr; csr ← rs1', '`csrw csr, rs` (rd = x0: no read)'], ['`csrrs rd, csr, rs1`', 'rd ← csr; csr ← csr | rs1', '`csrr rd, csr` (rs1 = x0: no write)'], ['`csrrc rd, csr, rs1`', 'rd ← csr; csr ← csr & ~rs1', '`csrc csr, rs`'], ['`csrrwi / csrrsi / csrrci`', 'same, with a 5-bit immediate', '`csrsi mstatus, 8`']] }, ref: 'Unprivileged ISA manual · “Zicsr” Control and Status Register instructions' },
        { t: 'mcq', q: 'Can S-mode write the `cycle` CSR at address `0xC00`?', opts: ['No: bits [11:10] = 11 make it read-only', 'Yes, always', 'Only with interrupts off', 'Only in vectored mode'], a: 0, why: '0xC00 = 1100 0000 0000: read-only, user-level.' },
        { t: 'mcq', q: 'Which of these CSRs can only be accessed in M-mode?', opts: ['`0x341` (mepc)', '`0x141` (sepc)', '`0xC01` (time)', '`0x100` (sstatus)'], a: 0, why: 'Bits [9:8] of 0x341 are `11`: machine level.' },
        { t: 'mcq', q: 'What does `csrr a0, mstatus` assemble to?', opts: ['`csrrs a0, mstatus, x0`', '`csrrw a0, mstatus, x0`', '`csrrc x0, mstatus, a0`', '`lw a0, mstatus`'], a: 0, why: 'Setting no bits (rs1 = x0) reads without writing.' },
        { t: 'tf', q: '`csrrs` with rs1 = x0 does not write the CSR at all.', a: true, why: 'This matters for read-only CSRs and CSRs with write side effects.' },
        { t: 'num', q: '`csrrs t0, mie, t1` runs with mie = 0x008 and t1 = 0x080. What is mie afterwards? (hex)', a: 0x088, base: 'hex', why: 'csrrs ORs in rs1: 0x008 | 0x080 = 0x088. t0 gets the old value 0x008.' }
      ]
    },
    {
      id: 'u11l3', title: 'Trap entry and mret', items: [
        { t: 'learn', h: 'What hardware does on a trap', body: 'A **trap** is an **exception** (caused by an instruction: ecall, illegal instruction, page fault) or an **interrupt** (an outside event).\n\nEntering M-mode, the hardware in one step: saves the pc in `mepc`, the reason in `mcause`, extra info in `mtval`, stacks the interrupt enable (MPIE ← MIE, MIE ← 0), remembers the old mode in MPP, and jumps to `mtvec`.', viz: { k: 'trap', step: 3 } },
        { t: 'learn', h: 'mret undoes it', body: '`mret` sets the mode to MPP, restores MIE from MPIE, sets MPIE to 1 and MPP to U, and jumps to `mepc`.\n\nFor `ecall`, mepc points **at** the ecall, so handlers add 4 before returning.', viz: { k: 'mstatus', hl: ['mie', 'mpie', 'mpp'], cap: 'The trap stack lives in mstatus: MIE, MPIE and MPP (and SIE, SPIE, SPP for S-mode).' } },
        { t: 'order', q: 'Order what happens when a trap enters M-mode.', items: ['The pc is saved in mepc', 'mcause and mtval record why', 'MPIE ← MIE, then MIE ← 0', 'MPP records the previous mode', 'The pc jumps to mtvec'], why: 'In hardware these happen together in one cycle; this is the logical order.' },
        { t: 'mcq', q: 'After an `ecall`, what does mepc point to?', opts: ['The ecall itself', 'The instruction after it', 'mtvec', 'The stack'], a: 0, why: 'Exceptions report the instruction that caused them; the handler skips it by adding 4.' },
        { t: 'num', q: 'What is mcause for an ecall from U-mode?', a: 8, why: '8 = U-mode, 9 = S-mode, 11 = M-mode.' },
        { t: 'mcq', q: 'What does mstatus.MPIE hold during a trap?', opts: ['The interrupt-enable bit from before the trap', 'The pending interrupts', 'The previous pc', 'The trap cause'], a: 0, why: 'mret copies it back into MIE.' },
        { t: 'tf', q: 'Taking a trap disables interrupts automatically.', a: true, why: 'MIE (or SIE) is cleared so the handler is not interrupted before it saves state.' },
        { t: 'num', q: 'mtvec = `0x80000101` (vectored mode). A machine timer interrupt (cause 7) arrives. Where does the core jump? (hex)', a: 0x8000011C, base: 'hex', why: 'Vectored: BASE + 4 × cause = 0x80000100 + 28. Exceptions would go to BASE itself.' }
      ]
    },
    {
      id: 'u11l4', title: 'Interrupts', items: [
        { t: 'learn', h: 'Pending and enabled', body: 'Each privilege level has three interrupt sources: **software**, **timer** and **external**. An interrupt is taken when its bit is set in both **mip** (pending) and **mie** (enabled) and the mode allows it: in M-mode only if `mstatus.MIE` = 1, in lower modes always.', viz: { k: 'table', head: ['Source', 'mip/mie bit', 'Raised by'], rows: [['M software (MSI)', '3', 'CLINT msip register (inter-hart messages)'], ['M timer (MTI)', '7', 'mtime ≥ mtimecmp'], ['M external (MEI)', '11', 'PLIC: devices'], ['S software / timer / external', '1 / 5 / 9', 'M-mode firmware or the Sstc/AIA extensions']], mono: [1] } },
        { t: 'learn', h: 'A timer interrupt, running', body: 'This firmware runs on the in-app SoC emulator: main sleeps in `wfi`, the timer fires, the handler prints a dot and re-arms `mtimecmp`.', viz: { k: 'socrun', src: FW_PRESETS.timer.src, expect: 'six ticks', cap: 'Tap “Show the code” to read it, or edit and re-run it in the Firmware lab.' } },
        { t: 'num', q: 'Which bit of `mie` enables the machine timer interrupt?', a: 7, why: 'MTIE is bit 7, matching MTIP in mip.' },
        { t: 'mcq', q: 'How does firmware clear a pending machine timer interrupt?', opts: ['Write a later deadline to mtimecmp', 'Clear mip.MTIP with csrc', 'Execute mret', 'Write 0 to mtime'], a: 0, why: 'MTIP simply reflects mtime ≥ mtimecmp; moving the deadline clears it.' },
        { t: 'mcq', q: 'Machine external and machine timer interrupts are both pending. Which is taken first?', opts: ['External', 'Timer', 'Whichever came first', 'Neither'], a: 0, why: 'Fixed priority: MEI > MSI > MTI > SEI > SSI > STI.' },
        { t: 'tf', q: 'While running in U-mode, an enabled M-mode interrupt is taken even if mstatus.MIE = 0.', a: true, why: 'Interrupts for a higher privilege level are always enabled when running below it.' },
        { t: 'mcq', q: 'What does `wfi` do?', opts: ['Hints the core to sleep until an interrupt is pending', 'Disables interrupts', 'Waits for a fence', 'Halts forever'], a: 0, why: 'It saves power in idle loops; a core may also treat it as a nop.' }
      ]
    },
    {
      id: 'u11l5', title: 'Precise exceptions', items: [
        { t: 'learn', h: 'As if one at a time', body: 'An exception is **precise** when every older instruction has completed, and the faulting one and all younger ones have had no effect. Then the OS can fix the problem (say, load a page) and simply re-run the instruction.\n\nPipelines achieve this by recording the exception and acting on it only at a **commit point**.', viz: { k: 'table', head: ['Instruction', 'Stage when lw faults in MEM', 'Fate'], rows: [['older `add`', 'WB', 'completes normally'], ['`lw` (page fault)', 'MEM', 'trap: mepc = its pc, no write-back'], ['younger `sub`', 'EX', 'flushed'], ['younger `or`', 'ID', 'flushed'], ['younger `and`', 'IF', 'flushed']] } },
        { t: 'mcq', q: 'A `lw` faults in MEM while an older `add` is in WB. What happens to the add?', opts: ['It completes', 'It is flushed', 'It is re-executed later', 'It traps too'], a: 0, why: 'Older instructions must finish so the state matches program order.' },
        { t: 'mcq', q: 'What happens to instructions younger than the faulting one?', opts: ['They are flushed', 'They complete', 'They are saved in mepc', 'They wait in the pipeline'], a: 0, why: 'Their results must not appear, because in program order they never ran.' },
        { t: 'tf', q: 'Precise exceptions let the OS fix a page fault and restart the faulting instruction.', a: true, why: 'Nothing after it has changed state, so restarting is safe.' },

        { t: 'learn', h: 'Physical memory protection', body: '**PMP** lets M-mode grant S and U access to physical regions with R/W/X permissions (up to 64 entries; modes TOR, NA4, NAPOT). If PMP is implemented, an S/U access that matches no entry **fails**. The **L** bit locks an entry until reset and enforces it on M-mode too.', viz: { k: 'socrun', src: FW_PRESETS.pmp.src, expect: 'blocked by PMP', cap: 'PMP gives U-mode only RAM; poking the UART faults.' } },

TAPEOUT.units.push({
  id: 'u12', n: 12, track: 'hw', tone: 'rs2', title: 'Extensions',

        { t: 'learn', h: 'Multiplier hardware', body: '`mul` returns the low 32 bits of the product; `mulh`, `mulhsu` and `mulhu` return the high 32 bits (signed × signed, signed × unsigned, unsigned × unsigned).\n\nA small core shifts and adds one bit per cycle (~32 cycles). Big cores use Booth encoding and Wallace trees to finish in a few pipelined cycles.', viz: { k: 'mult', a: 13, b: 11, n: 4, cap: '13 × 11 by shift and add: one partial product per multiplier bit.' } },
        { t: 'learn', h: 'Division never traps', body: 'Dividers are usually iterative (one or two quotient bits per cycle). RISC-V defines every corner case instead of trapping:', viz: { k: 'table', head: ['Case', 'Quotient', 'Remainder'], rows: [['divide by zero', '−1 (all ones)', 'the dividend'], ['−2³¹ ÷ −1 (overflow)', '−2³¹', '0'], ['normal signed', 'rounds toward zero', 'sign of the dividend']] } },
        { t: 'num', q: '`div a0, a1, a2` with a1 = 7 and a2 = 0. What is a0?', a: -1, why: 'Division by zero returns all ones.' },

        { t: 'tf', q: 'RISC-V integer division by zero raises an exception.', a: false, why: 'It returns defined values; software checks if it cares.' },

        { t: 'mcq', q: 'Why is the 64-bit product split across `mulh` and `mul`?', opts: ['Each instruction writes only one register', 'To save opcodes', 'Because mul is slow', 'For compatibility with x86'], a: 0, why: 'Hardware can fuse an adjacent mulh + mul pair into one multiply.' }

      id: 'u12l2', title: 'A: atomics', items: [
        { t: 'learn', h: 'LR/SC and AMOs', body: '**Load-reserved / store-conditional**: `lr.w` reads and sets a reservation; `sc.w` writes only if no other hart wrote that location meanwhile, and returns **0 on success**.\n\n**AMOs** (`amoadd`, `amoswap`, `amoor`, `amomax`…) do a whole read-modify-write atomically, often at the cache or memory.', viz: { k: 'lrsc', cap: 'Another hart’s store breaks the reservation, so sc fails and the loop retries.' } },
        { t: 'learn', h: 'A spinlock', body: 'The `.aq` (acquire) and `.rl` (release) bits stop memory accesses moving across the lock operations.', viz: { k: 'code', text: 'lock:   li    t0, 1\n        amoswap.w.aq t0, t0, (a0)   # take the lock, get the old value\n        bnez  t0, lock               # it was already held: retry\n        # ... critical section ...\n        amoswap.w.rl x0, x0, (a0)   # release: store 0', hl: [2, 5] } },
        { t: 'mcq', q: 'What does `sc.w` write to rd when it succeeds?', opts: ['0', '1', 'The stored value', 'The address'], a: 0, why: 'Zero means success; nonzero means retry.' },
        { t: 'mcq', q: 'What is the best way to increment a shared counter?', opts: ['`amoadd.w`', 'lw, add, sw', 'Disable interrupts', '`fence.i`'], a: 0, why: 'One AMO does the read-modify-write atomically, with no retry loop.' },
        { t: 'tf', q: 'Linux on RISC-V requires the A extension.', a: true, why: 'The kernel relies on atomics for locks and reference counts.' },
        { t: 'mcq', q: 'What does the `.aq` bit on an AMO guarantee?', opts: ['Later memory accesses cannot appear before it', 'Earlier accesses cannot appear after it', 'It never fails', 'It bypasses the cache'], a: 0, why: 'Acquire semantics keep the critical section after the lock is taken.' },
        { t: 'order', q: 'Order the spinlock steps.', items: ['Atomically swap 1 into the lock', 'If the old value was 1, try again', 'Run the critical section', 'Release with a .rl store of 0'], why: 'Acquire, work, release.' }

        { t: 'learn', h: 'Examples', body: 'Three-bit register fields name only **x8–x15** (s0, s1, a0–a5), the most used registers.', viz: { k: 'table', head: ['16-bit', 'Assembly', 'Expands to'], rows: [['`0x4501`', '`c.li a0, 0`', '`addi a0, x0, 0`'], ['`0x852E`', '`c.mv a0, a1`', '`add a0, x0, a1`'], ['`0x0505`', '`c.addi a0, 1`', '`addi a0, a0, 1`'], ['`0x4188`', '`c.lw a0, 0(a1)`', '`lw a0, 0(a1)`'], ['`0x8082`', '`c.jr ra` (ret)', '`jalr x0, 0(ra)`']], mono: [0, 1, 2] } },
        { t: 'mcq', q: 'How does hardware know a parcel is a 16-bit instruction?', opts: ['Its low two bits are not 11', 'Its high bit is set', 'A mode bit in mstatus', 'It always is, after a jump'], a: 0, why: '00, 01 and 10 are the compressed quadrants; 11 marks 32-bit.' },
        { t: 'num', q: 'A compressed 3-bit register field holds `010`. Which register number is that?', a: 10, why: 'Compressed registers are x8 + field: x8 + 2 = x10 (a0).' },

        { t: 'mcq', q: 'What is the main benefit of C?', opts: ['Smaller code: fewer I-cache misses, less fetch energy and flash', 'Faster ALU', 'More registers', 'Simpler decoding'], a: 0, why: 'Code density is a big deal for microcontrollers with small flash.' }

    {
      id: 'u12l4', title: 'F and D: floating point', items: [
        { t: 'learn', h: 'IEEE 754', body: 'A single-precision float is **sign · exponent (8 bits, bias 127) · fraction (23 bits)**: value = (−1)ˢ × 1.f × 2^(e−127). Double precision (D) uses 1 · 11 · 52.\n\nTap the bits below.', viz: { k: 'float', value: -2.5 } },
        { t: 'learn', h: 'The F/D extensions', body: '- 32 separate **f registers** (`f0`–`f31`) and their own load/store instructions.\n- `fcsr` holds the rounding mode (**frm**) and sticky exception flags (**fflags**: NV DZ OF UF NX). RISC-V never traps on FP exceptions; it sets flags.\n- **Fused multiply-add** (`fmadd`) rounds once.\n- With D, single values stored in 64-bit registers are **NaN-boxed** (upper bits all ones).' },
        { t: 'num', q: 'Which value does the single-precision word `0xC0200000` hold?', a: -2.5, tol: 1e-9, why: 'sign 1, exponent 128 − 127 = 1, mantissa 1.25: −1.25 × 2 = −2.5.' },
        { t: 'num', q: 'What is the exponent bias for single precision?', a: 127, why: 'Stored exponent = true exponent + 127.' },
        { t: 'mcq', q: 'What happens when a RISC-V floating-point divide divides by zero?', opts: ['It sets the DZ flag in fflags; no trap', 'It raises an exception', 'It returns 0', 'It halts the core'], a: 0, why: 'Software checks the sticky flags when it cares.' },
        { t: 'tf', q: '`fmadd.s` computes a × b + c with a single rounding.', a: true, why: 'That is what “fused” means, and it improves accuracy.' },
        { t: 'mcq', q: 'Why does floating point get its own register file?', opts: ['More registers and ports; FP and integer work can overlap', 'Floats are always 64-bit', 'Integer registers cannot hold floats', 'Tradition only'], a: 0, why: 'Separate files avoid port pressure and simplify FP pipelines.' }

        { t: 'learn', h: 'Bit manipulation', body: '**B** = Zba + Zbb + Zbs. Cheap to build, and big wins in compiled code.', viz: { k: 'table', head: ['Group', 'Instructions', 'Used for'], rows: [['Zba', '`sh1add` `sh2add` `sh3add`', 'array indexing: (i << 2) + base in one step'], ['Zbb', '`clz` `ctz` `cpop` `min` `max` `rev8` `rol` `ror` `andn`', 'bit counting, byte swaps, rotates'], ['Zbs', '`bset` `bclr` `binv` `bext`', 'single-bit operations'], ['Zicond', '`czero.eqz` `czero.nez`', 'branch-free conditional selects']] } },
        { t: 'num', q: '`sh2add a0, a1, a2` with a1 = 5 and a2 = 100. What is a0?', a: 120, why: '(5 << 2) + 100 = 120: the address of element 5 in an int array at 100.' },
        { t: 'mcq', q: 'Which instruction counts leading zeros?', opts: ['`clz`', '`ctz`', '`cpop`', '`rev8`'], a: 0, why: 'clz counts leading zeros, ctz counts trailing zeros and cpop counts ones.' },
        { t: 'mcq', q: 'What is Zicond for?', opts: ['Branch-free conditional selects', 'Cache control', 'Conditional traps', 'Vector masking'], a: 0, why: 'czero.eqz rd, rs1, rs2 writes 0 if rs2 == 0, else rs1; two of them plus an or make a select.' },
        { t: 'tf', q: 'The RVA23 profile includes the bit-manipulation extensions Zba, Zbb and Zbs.', a: true, why: 'They were already part of RVA22 and remain mandatory.' },
        { t: 'num', q: 'What does `cpop` return for `0xF0F0`?', a: 8, why: 'cpop counts set bits: four in each 0xF0 byte.' }

      id: 'u12l6', title: 'V: vectors', items: [
        { t: 'learn', h: 'Length-agnostic vectors', body: 'RVV has 32 vector registers of **VLEN** bits (chosen by the hardware designer). Software picks the element width **SEW** and a register-group size **LMUL**, then asks `vsetvli` how many elements it may process: **vl = min(remaining, VLMAX)** where VLMAX = LMUL × VLEN ÷ SEW.', viz: { k: 'vector', vlen: 128, sew: 32, lmul: 2 } },
        { t: 'learn', h: 'Strip-mining', body: 'Code loops in chunks of whatever vl the hardware grants, so **one binary runs on any VLEN**.', viz: { k: 'code', text: 'loop: vsetvli t0, a0, e32, m1, ta, ma  # t0 = elements this pass\n      vle32.v  v1, (a1)               # load t0 elements\n      vadd.vx  v1, v1, a2             # add a scalar to each\n      vse32.v  v1, (a1)               # store them back\n      sub   a0, a0, t0                # elements left\n      slli  t1, t0, 2\n      add   a1, a1, t1                # advance the pointer\n      bnez  a0, loop', hl: [1] } },
        { t: 'num', q: 'VLEN = 256, SEW = 32, LMUL = 2. What is VLMAX?', a: 16, why: '2 × 256 ÷ 32 = 16 elements.' },

TAPEOUT.units.push({
  id: 'u13', n: 13, track: 'hw', tone: 'f7', title: 'Superscalar & out-of-order',
  blurb: 'Run several instructions per cycle and let them overtake each other: dependencies, register renaming, issue queues, the reorder buffer and speculation.',
  lessons: [
    {
      id: 'u13l1', title: 'Superscalar issue', items: [
        { t: 'learn', h: 'More than one per cycle', body: 'A **superscalar** core fetches, decodes and issues several instructions per cycle when they are independent, so IPC can exceed 1.\n\nThe costs grow fast: 2 register read ports and 1 write port **per instruction**, more decoders, and a bypass network that grows roughly with the **square** of the width.', viz: { k: 'pipe', rows: [{ text: 'add x1, x2, x3', start: 1 }, { text: 'lw  x4, 0(x5)', start: 1 }, { text: 'sub x6, x7, x8', start: 2 }, { text: 'or  x9, x10, x11', start: 2 }, { text: 'and x12, x13, x14', start: 3 }, { text: 'xor x15, x16, x17', start: 3 }], cap: 'A 2-wide in-order pipeline: pairs move together.' } },
        { t: 'learn', h: 'In-order pairing rules', body: 'A simple dual-issue core issues the second instruction of a pair only if it does not depend on the first and a suitable unit is free. When the oldest instruction stalls, everything behind it stalls too, which caps in-order IPC well below the width.' },
        { t: 'num', q: 'How many register-file read ports does a 4-wide core need (2 sources per instruction)?', a: 8, why: '4 × 2 = 8 read ports, plus 4 write ports.' },
        { t: 'mcq', q: 'What most limits a wide in-order core?', opts: ['Dependencies between nearby instructions block issue', 'The opcode map', 'Register names', 'The program counter width'], a: 0, why: 'Independent work exists further down the stream, but in-order issue cannot reach it.' },
        { t: 'tf', q: 'Bypass network complexity grows roughly with the square of the issue width.', a: true, why: 'Every result must be able to reach every ALU input.' },
        { t: 'num', q: 'A 2-wide core issues 10 fully independent instructions. How many issue cycles does it need?', a: 5, why: 'Two per cycle: 10 ÷ 2.' }
      ]
    },
    {
      id: 'u13l2', title: 'Dependencies', items: [
        { t: 'learn', h: 'Three kinds', body: '- **RAW** (read after write): a **true** dependency; the value flows.\n- **WAR** (write after read) and **WAW** (write after write): **name** dependencies, caused only by reusing a register name.\n\nOnly RAW is fundamental. WAR and WAW disappear if each write gets a fresh register.', viz: { k: 'deps', lines: ['mul t0, a0, a1', 'add t1, t0, a2', 'li  t0, 5', 'add t2, t0, t0'], deps: [{ from: 0, to: 1, type: 'RAW', reg: 't0' }, { from: 1, to: 2, type: 'WAR', reg: 't0' }, { from: 0, to: 2, type: 'WAW', reg: 't0' }, { from: 2, to: 3, type: 'RAW', reg: 't0' }] } },
        { t: 'mcq', q: 'Which dependencies can register renaming remove?', opts: ['WAR and WAW', 'RAW only', 'All three', 'None'], a: 0, why: 'They exist only because two values share one register name.' },
        { t: 'tf', q: 'Renaming can remove RAW dependencies.', a: false, why: 'A true dependency means the value itself is needed; renaming cannot invent it early.' },
        { t: 'mcq', q: 'In the code above, what links I1 (`mul t0`) and I3 (`li t0, 5`)?', opts: ['WAW', 'RAW', 'WAR', 'Nothing'], a: 0, why: 'Both write t0.' },
        { t: 'mcq', q: 'And I2 (`add t1, t0, a2`) and I3 (`li t0, 5`)?', opts: ['WAR', 'RAW', 'WAW', 'Nothing'], a: 0, why: 'I3 writes t0 after I2 reads it.' }
      ]
    },
    {
      id: 'u13l3', title: 'Register renaming', items: [
        { t: 'learn', h: 'Fresh registers for every write', body: 'The core keeps many more **physical** registers than the 32 architectural ones. Each instruction that writes a register gets a free physical register; a **rename table (RAT)** records the current mapping, and sources are translated through it.', viz: { k: 'table', head: ['Instruction', 'After renaming'], rows: [['`mul t0, a0, a1`', '`mul p10, p1, p2`'], ['`add t1, t0, a2`', '`add p11, p10, p3`'], ['`li  t0, 5`', '`li  p12, 5`'], ['`add t2, t0, t0`', '`add p13, p12, p12`']], mono: [0, 1] }, more: 'The second pair now has nothing to do with the first: it can run while the slow multiply is still busy.' },
        { t: 'num', q: '32 architectural registers; up to 64 in-flight instructions may write registers. How many physical registers do you need?', a: 96, why: '32 committed values + 64 speculative ones.' },
        { t: 'mcq', q: 'What does the rename table hold?', opts: ['The current architectural → physical mapping', 'Decoded instructions', 'Branch targets', 'Cache tags'], a: 0, why: 'Every source operand is looked up there at rename time.' },
        { t: 'mcq', q: 'When can a physical register return to the free list?', opts: ['When a later instruction that overwrites the same architectural register commits', 'As soon as it is read', 'At every branch', 'When the program ends'], a: 0, why: 'Until then, an exception might need the old value.' },
        { t: 'tf', q: 'After renaming, `li t0, 5` (I3) may execute before `mul t0, a0, a1` (I1) finishes.', a: true, why: 'They now write different physical registers.' }
      ]
    },
    {
      id: 'u13l4', title: 'Issue queue and reorder buffer', items: [
        { t: 'learn', h: 'Out of order, in between', body: 'Instructions **dispatch in order** into an **issue queue** and the **reorder buffer (ROB)**. Each waits until its operands are ready (producers broadcast their tags: **wakeup**), then **select** logic issues the oldest ready ones. They **execute out of order**, and the ROB **commits in order**.\n\nThe ideas date to Tomasulo’s algorithm in the IBM System/360 Model 91.', viz: { k: 'ooo', src: 'li   a0, 100\nli   a1, 7\ndiv  a2, a0, a1\nadd  a3, a2, a2\naddi t0, a0, 1\nxor  t1, a1, a0\nadd  t2, t0, t1\necall', cfg: { width: 2, rob: 16 }, cap: 'The last four instructions do not need the divide, so they execute while it runs, yet they still retire (R) in order after it.' } },
        { t: 'order', q: 'Order the life of an instruction in an out-of-order core.', items: ['Fetch and decode', 'Rename its registers', 'Dispatch into the issue queue and ROB', 'Wait until operands are ready', 'Issue and execute', 'Write back the result', 'Commit in program order'], why: 'Only the middle part runs out of order.' },
        { t: 'mcq', q: 'Why does the ROB commit in program order?', opts: ['For precise exceptions and correct architectural state', 'To save power', 'Because execution units are in order', 'To simplify fetch'], a: 0, why: 'A fault or misprediction can discard everything younger, cleanly.' },
        { t: 'mcq', q: 'What does the wakeup logic do?', opts: ['Marks waiting instructions ready when a producer broadcasts its tag', 'Restarts a sleeping core', 'Wakes the branch predictor', 'Refills the TLB'], a: 0, why: 'Wakeup + select is the critical loop of an OoO core.' },
        { t: 'num', q: 'A 4-wide core with a 128-entry ROB keeps dispatching while the oldest instruction waits on a long cache miss. About how many cycles until the ROB fills and dispatch stops?', a: 32, unit: 'cycles', why: '128 entries ÷ 4 per cycle = 32 cycles; a bigger ROB hides longer misses.' },
        { t: 'tf', q: 'An instruction may execute before an older one but never commit before it.', a: true, why: 'Execution order is free; commit order is program order.' }
      ]
    },
    {
      id: 'u13l5', title: 'Memory in an OoO core', items: [
        { t: 'learn', h: 'Loads and stores need care', body: '- Stores wait in a **store buffer** and write the cache only **after they commit**.\n- A younger load checks older stores: if the address matches, **store-to-load forwarding** hands it the data.\n- Loads may run ahead of older stores whose addresses are still unknown (**memory disambiguation**); if a conflict shows up later, the load and its dependants are **replayed**.', viz: { k: 'ooo', src: 'li   a0, 0x2000\nlw   a2, 0(a0)\nadd  a3, a2, a2\nlw   a4, 64(a0)\nadd  a5, a4, a4\nlw   a6, 128(a0)\nadd  a7, a6, a6\necall', cfg: { width: 2, rob: 16 }, cap: 'Three cold misses overlap (memory-level parallelism). In-order issue would pay them one after another.' } },
        { t: 'mcq', q: 'When does a store write the data cache?', opts: ['After it commits', 'As soon as it executes', 'At dispatch', 'When the next load arrives'], a: 0, why: 'A wrong-path store must never become visible.' },
        { t: 'mcq', q: 'A load reads address X while an older store to X still sits in the store buffer. What happens?', opts: ['Store-to-load forwarding supplies the store’s data', 'The load reads the old value from cache', 'The core traps', 'The store is discarded'], a: 0, why: 'The load must see the value its program order implies.' },
        { t: 'tf', q: 'A load may execute before an older store whose address is unknown, if the core can detect a conflict and replay.', a: true, why: 'Most loads do not alias, so speculating pays off.' },
        { t: 'mcq', q: 'What is the risk of running loads ahead of stores?', opts: ['A memory-ordering violation that forces a replay', 'Losing the store', 'Corrupting the TLB', 'None'], a: 0, why: 'Predictors learn which loads tend to conflict and hold them back.' }
      ]
    },
    {
      id: 'u13l6', title: 'Speculation and side channels', items: [
        { t: 'learn', h: 'Undone, but not invisible', body: 'Big cores run hundreds of instructions ahead on predicted paths. On a misprediction, registers and memory are restored, but **microarchitectural traces** (which cache lines were loaded, predictor state) can remain. Measuring them is a **side channel**; the Spectre family of attacks exploits it.\n\nDesigners respond with speculation barriers, limits on what speculative loads may change, partitioning, and support for constant-time software.' },
        { t: 'mcq', q: 'Why can wrong-path execution leak information?', opts: ['It can change cache state that survives the squash', 'It writes registers permanently', 'It corrupts memory', 'It disables PMP'], a: 0, why: 'Timing a later access reveals whether a line was loaded speculatively.' },
        { t: 'tf', q: 'A squash restores registers and memory but not necessarily cache contents.', a: true, why: 'Caches are not architectural state, so classic designs never rolled them back.' },
        { t: 'mcq', q: 'Which software practice avoids leaking secrets through timing?', opts: ['Constant-time code that never branches or indexes on secrets', 'Using more registers', 'Compiling with -O0', 'Disabling the FPU'], a: 0, why: 'If timing does not depend on the secret, there is nothing to measure.' },
        { t: 'mcq', q: 'Which hardware idea mitigates speculative cache leaks?', opts: ['Hide speculative cache fills until the load is no longer speculative', 'Bigger caches', 'Higher clock speed', 'More registers'], a: 0, why: 'Research designs such as InvisiSpec keep speculative fills invisible until the load can no longer be squashed.' }

    }

TAPEOUT.units.push({
  id: 'u14', n: 14, track: 'hw', tone: 'imm', title: 'Multicore & SoC',
  blurb: 'Several harts sharing memory: cache coherence, the RISC-V memory model, and the interconnects, interrupt controllers and devices around a core.',
  lessons: [
    {
      id: 'u14l1', title: 'Cache coherence', items: [
        { t: 'learn', h: 'One value per address', body: 'With private caches, two harts could hold different copies of the same line. A **coherence protocol** prevents that. In **MSI** each line is Modified (only copy, dirty), Shared (read-only copies) or Invalid. MESI adds Exclusive (only copy, clean).\n\n**Snooping** broadcasts requests on a shared bus; **directories** track sharers and scale to many cores.', viz: { k: 'msi', cur: 'S' } },
        { t: 'match', q: 'Match each state to its meaning.', pairs: [['M', 'Only copy, modified'], ['S', 'Clean copy, others may share'], ['I', 'Not valid here'], ['E', 'Only copy, clean (MESI)']], why: 'Writes require M; reads are fine in S or E.' },
        { t: 'mcq', q: 'Hart 0 holds a line in M. Hart 1 reads it. What happens?', opts: ['Hart 0 supplies or writes back the data; both end in S', 'Hart 1 reads stale memory', 'Hart 0 keeps M', 'Hart 1 traps'], a: 0, why: 'The dirty data must reach the reader, and neither may write without upgrading again.' },
        { t: 'tf', q: 'In MSI, a line may be Modified in two caches at once.', a: false, why: 'Modified means sole owner; a second writer invalidates the first.' },
        { t: 'mcq', q: 'Why do directory protocols scale better than snooping?', opts: ['Requests go only to the caches that hold the line', 'They need no memory', 'They have fewer states', 'They skip invalidations'], a: 0, why: 'Broadcasting to every core becomes the bottleneck as core counts grow.' },
        { t: 'mcq', q: 'What is false sharing?', opts: ['Different variables in one cache line bounce between cores', 'Two harts sharing a register', 'A cache returning wrong data', 'Sharing a TLB'], a: 0, why: 'Each write invalidates the other core’s copy even though the data is unrelated.' }
      ]
    },
    {
      id: 'u14l2', title: 'The memory model', items: [
        { t: 'learn', h: 'RVWMO', body: 'RISC-V’s default memory model, **RVWMO** (weak memory ordering), lets accesses to different addresses appear reordered to other harts. Programs that communicate must order them with **fences** or **aq/rl** atomics.\n\nThe optional **Ztso** extension gives the stronger total store order that x86 uses.', viz: { k: 'litmus' } },
        { t: 'learn', h: 'Fixing message passing', body: 'Order the producer’s writes and the consumer’s reads.', viz: { k: 'code', text: '# hart 0: producer\nsw    t0, 0(a0)     # data\nfence w, w          # data before flag\nsw    t2, 0(a1)     # flag = 1\n\n# hart 1: consumer\nwait:\nlw    t1, 0(a1)     # flag\nbeqz  t1, wait\nfence r, r          # flag before data\nlw    t3, 0(a0)     # data', hl: [3, 10] } },
        { t: 'mcq', q: 'Without fences, can the consumer see flag = 1 but stale data under RVWMO?', opts: ['Yes', 'No', 'Only on one hart', 'Only with caches off'], a: 0, why: 'Either side may reorder its two accesses.' },
        { t: 'mcq', q: 'Which fence goes between the producer’s two stores?', opts: ['`fence w, w`', '`fence r, r`', '`fence.i`', '`sfence.vma`'], a: 0, why: 'It keeps the data store ahead of the flag store.' },
        { t: 'tf', q: 'Ztso gives RISC-V the total store ordering model used by x86.', a: true, why: 'Useful for porting software written for stronger models.' },
        { t: 'mcq', q: 'How else can the producer publish the flag safely?', opts: ['Store it with a release AMO, e.g. `amoswap.w.rl`', 'Use `lb` instead of `lw`', 'Add a nop', 'Write it twice'], a: 0, why: 'Release semantics order all earlier accesses before the store.' }
      ]
    },
    {
      id: 'u14l3', title: 'SoC building blocks', items: [
        { t: 'learn', h: 'Around the core', body: 'A system-on-chip connects harts and caches through an **interconnect** (TileLink and AXI are common) to memory controllers, a **boot ROM**, interrupt controllers (**CLINT/ACLINT** for timers and software interrupts, **PLIC** or **AIA** for devices), peripherals and a **debug module**.\n\nSoftware reaches devices through **memory-mapped I/O**: plain loads and stores to device addresses.', viz: { k: 'soc' } },
        { t: 'hotspot', q: 'Tap the block that raises machine timer interrupts.', viz: { k: 'soc' }, a: 'clint', aText: 'CLINT', why: 'The CLINT holds mtime and each hart’s mtimecmp.' },
        { t: 'hotspot', q: 'Tap the block that routes device interrupts to harts.', viz: { k: 'soc' }, a: 'plic', aText: 'PLIC', why: 'The platform-level interrupt controller prioritises external interrupts.' },
        { t: 'mcq', q: 'How does software talk to the UART?', opts: ['Loads and stores to its memory-mapped registers', 'Special I/O instructions', 'Through CSRs only', 'Via ecall in M-mode only'], a: 0, why: 'RISC-V has no separate I/O instructions; devices live in the physical address space.' },
        { t: 'tf', q: 'Device registers should not be cached like normal RAM.', a: true, why: 'Reads can have side effects and values change on their own.' },
        { t: 'mcq', q: 'What are PMAs?', opts: ['Physical memory attributes: cacheable, idempotent, atomics support…', 'Page mapping addresses', 'Privilege mode aliases', 'Prefetch markers'], a: 0, why: 'The platform fixes them per region; firmware and drivers must respect them.' }
      ]
    },
    {
      id: 'u14l4', title: 'Interrupt controllers', items: [
        { t: 'learn', h: 'PLIC: claim and complete', body: 'The **PLIC** gives each source a priority, and each context (a hart in a mode) its own enable bits and **threshold**. When a source fires, the PLIC raises MEIP (or SEIP); the handler **claims** the interrupt by reading the claim register, services the device, and **completes** by writing the ID back.', viz: { k: 'chain', items: [['Device asserts its interrupt line', '', 'op'], ['PLIC marks it pending, raises MEIP', 'if priority > threshold and enabled', 'f3'], ['Hart traps to its handler', 'mcause = 0x8000000B', 'rs1'], ['Handler reads claim → source ID', 'highest-priority pending source', 'rd'], ['Driver services the device', '', 'rs2'], ['Handler writes the ID to complete', 'the source may fire again', 'f7']] } },
        { t: 'learn', h: 'AIA', body: 'The **Advanced Interrupt Architecture** replaces the PLIC for larger systems: an **APLIC** handles wired interrupts and per-hart **IMSIC** files accept **message-signalled interrupts** (writes to memory), which suits many-core and virtualised systems.' },
        { t: 'order', q: 'Order external-interrupt handling with a PLIC.', items: ['Device raises its interrupt', 'PLIC sets pending and asserts MEIP', 'Hart traps to the handler', 'Handler reads the claim register', 'Driver services the device', 'Handler writes complete'], why: 'Claim/complete keeps two harts from handling the same interrupt.' },
        { t: 'mcq', q: 'What does reading the PLIC claim register return?', opts: ['The ID of the highest-priority pending interrupt', 'The number of pending interrupts', 'The hart ID', 'The current threshold'], a: 0, why: 'It also clears that pending bit, so another hart does not claim it too.' },
        { t: 'mcq', q: 'A PLIC source has priority 0. What happens when it fires?', opts: ['It never interrupts', 'It always interrupts', 'It is routed to hart 0', 'It becomes an NMI'], a: 0, why: 'Priority 0 means disabled.' },
        { t: 'tf', q: 'The AIA supports message-signalled interrupts.', a: true, why: 'IMSICs receive interrupts as memory writes, like PCIe MSIs.' }
      ]
    }
  ]
});

TAPEOUT.units.push({
  id: 'u15', n: 15, track: 'sw', tone: 'op', title: 'Bare-metal software',
  blurb: 'The first software for your core: compiler flags, the calling convention, sections and linker scripts, the startup code that runs before main(), and device drivers.',
  lessons: [
    {
      id: 'u15l1', title: 'The toolchain', items: [
        { t: 'learn', h: 'From C to bits', body: 'A cross-toolchain (GCC or LLVM) turns source into an image your core can run. Each step has a job, and the **linker script** decides where everything lands in memory.', viz: { k: 'chain', items: [['main.c', 'your program', 'op'], ['Compiler: gcc -march=… -mabi=…', 'C → assembly', 'f3'], ['Assembler', 'assembly → object file (.o) with relocations', 'rs1'], ['Linker + linker script', 'objects → firmware.elf at final addresses', 'rs2'], ['objcopy', 'ELF → raw .bin or .hex', 'imm'], ['Flash or load into RAM', 'the core fetches from the reset vector', 'rd']] } },
        { t: 'learn', h: 'Two flags describe your core', body: '- `-march` lists the extensions the compiler **may use**: `rv32imac_zicsr`, `rv64gc`…\n- `-mabi` picks the **calling convention**: how wide `long` and pointers are, and whether float arguments travel in FP registers.\n\nThe ABI may not need more than the ISA provides: `ilp32d` passes doubles in FP registers, so it needs the D extension.', viz: { k: 'table', head: ['-mabi', 'int / long / pointer', 'FP arguments in'], rows: [['ilp32', '32 / 32 / 32 bits', 'integer registers'], ['ilp32f', '32 / 32 / 32 bits', 'f-regs (float)'], ['ilp32d', '32 / 32 / 32 bits', 'f-regs (float, double)'], ['ilp32e', 'as ilp32, for RV32E', 'integer registers'], ['lp64', '32 / 64 / 64 bits', 'integer registers'], ['lp64d', '32 / 64 / 64 bits', 'f-regs: the Linux default']], mono: [0] } },
        { t: 'mcq', q: 'Your core is RV32IMC with Zicsr and no FPU. Which flags fit?', opts: ['`-march=rv32imc_zicsr -mabi=ilp32`', '`-march=rv32gc -mabi=ilp32d`', '`-march=rv32imc_zicsr -mabi=ilp32f`', '`-march=rv64imc -mabi=lp64`'], a: 0, why: 'No F or D, so floats are done in software and passed in integer registers.' },
        { t: 'mcq', q: 'You compile with `-march=rv32imac`, but your core has no A extension. What happens?', opts: ['Atomic instructions the compiler emits trap as illegal instructions', 'The linker refuses', 'The code runs slower but works', 'Nothing: A is optional'], a: 0, why: '-march promises the compiler those instructions exist. Lie, and the first `amoswap` or `lr.w` traps.' },
        { t: 'match', q: 'Match each tool to its job.', pairs: [['gcc -S', 'C → assembly'], ['as', 'assembly → object file'], ['ld', 'objects → linked ELF'], ['objcopy -O binary', 'ELF → raw image'], ['objdump -d', 'disassemble to check the result']], why: 'Reading `objdump -d` output is the fastest way to see what the compiler really emitted.' },
        { t: 'tf', q: '`-mabi=ilp32d` works on a core without the D extension.', a: false, why: 'Doubles would be passed in FP registers that do not exist.' },
        { t: 'mcq', q: 'RV64 firmware is linked at 0x80000000. Why does it need `-mcmodel=medany`?', opts: ['The default medlow model reaches only ±2 GiB around address 0, and 0x80000000 is just outside', 'medany makes code smaller', 'medlow is only for RV32', 'To enable compressed instructions'], a: 0, why: 'On RV64, `lui` sign-extends bit 31, so absolute addressing cannot reach 0x0000000080000000. medany addresses symbols pc-relative with `auipc`.' }
      ]
    },
    {
      id: 'u15l2', title: 'The calling convention', items: [
        { t: 'learn', h: 'Who saves what', body: 'Every function follows the same contract, so code from different compilers and libraries can call each other.\n\n- **a0–a7**: arguments; **a0–a1**: return values.\n- **t0–t6** and a-registers: **caller-saved**. Any call may overwrite them.\n- **s0–s11**: **callee-saved**. A function that uses them must restore them.\n- **ra**: return address. **sp**: stack pointer, always 16-byte aligned.', viz: { k: 'regs' } },
        { t: 'learn', h: 'A stack frame', body: 'A function that calls others, or needs saved registers, opens a **frame** in its prologue and closes it in its epilogue. The stack grows **down**.', viz: { k: 'frame', size: 16, slots: [['ra', 12, 'f3'], ['s0 (caller’s)', 8, 'rs1'], ['s1 (caller’s)', 4, 'rs1']] }, more: '```\nfib:  addi sp, sp, -16    # prologue\n      sw   ra, 12(sp)\n      sw   s0, 8(sp)\n      sw   s1, 4(sp)\n      ...                 # body\n      lw   s1, 4(sp)      # epilogue\n      lw   s0, 8(sp)\n      lw   ra, 12(sp)\n      addi sp, sp, 16\n      ret\n```' },
        { t: 'learn', h: 'Recursion on the emulator', body: 'This program follows the convention exactly: `n` survives each call in s0, `fib(n-1)` survives the second call in s1, and every frame is restored before `ret`.', viz: { k: 'socrun', src: FW_PRESETS.calls.src, expect: '144', cap: 'fib(0) to fib(12), computed recursively.' } },
        { t: 'mcq', q: 'Which registers must a function restore before it returns?', opts: ['s0–s11 and sp', 't0–t6', 'a0–a7', 'All 32'], a: 0, why: 'Callee-saved registers and the stack pointer must look untouched to the caller.' },
        { t: 'mcq', q: 'You set t0 and s1, then `call foo`. Which value can you rely on afterwards?', opts: ['s1', 't0', 'Both', 'Neither'], a: 0, why: 'foo may freely overwrite t0. It must restore s1 if it uses it.' },
        { t: 'num', q: 'An RV32 function saves ra, s0, s1 and s2 and needs 8 bytes of local variables. How big is its frame?', a: 32, unit: 'bytes', why: '4 × 4 + 8 = 24 bytes, rounded up to the 16-byte stack alignment = 32.' },
        { t: 'tf', q: 'A leaf function that only uses a- and t-registers needs no stack frame.', a: true, why: 'It calls nothing, so ra survives, and it touches no callee-saved register. fib’s base case returns without one.' },
        { t: 'mcq', q: 'How does a function receive its 9th integer argument?', opts: ['On the stack', 'In a8', 'In t0', 'Through gp'], a: 0, why: 'Only a0–a7 carry arguments; the rest go in memory at the caller’s sp.' },
        { t: 'mcq', q: 'An RV32 function returns a 64-bit `long long`. Where is it?', opts: ['a0 (low half) and a1 (high half)', 'a0 only', 'On the stack', 'In s0 and s1'], a: 0, why: 'Values up to two registers wide come back in a0 and a1.' }
      ]
    },
    {
      id: 'u15l3', title: 'Sections and linker scripts', items: [
        { t: 'learn', h: 'Where things live', body: 'The compiler sorts everything into **sections**. On a microcontroller, code and constants stay in flash; writable data must be in RAM.', viz: { k: 'table', head: ['Section', 'Holds', 'Lives in'], rows: [['.text', 'machine code', 'flash'], ['.rodata', 'constants and string literals', 'flash'], ['.data', 'globals with an initial value', 'RAM, initial values stored in flash'], ['.bss', 'globals that start at 0', 'RAM only: no bytes in the image'], ['stack, heap', 'run-time data', 'RAM']], mono: [0] } },
        { t: 'learn', h: 'Two addresses for .data', body: '.data **runs** at a RAM address (its VMA) but is **stored** in flash (its LMA), because RAM forgets everything at power-off. The startup code copies it across before main().', viz: { k: 'memmap', cols: [{ name: 'Flash', base: '0x2000_0000', parts: [{ label: '.text', tone: 'op', h: 2.4 }, { label: '.rodata', tone: 'imm', h: 1.2 }, { label: '.data image', sub: 'LMA', tone: 'rs2', h: 1.2, id: 'lma' }, { label: 'free', free: true, h: 2 }] }, { name: 'RAM', base: '0x8000_0000', parts: [{ label: '.data', sub: 'VMA', tone: 'rs2', h: 1.2, id: 'vma' }, { label: '.bss', sub: 'zeroed', tone: 'rd', h: 1.2 }, { label: 'heap ↑', free: true, h: 1.6 }, { label: 'stack ↓', tone: 'f3', h: 2.8 }] }], arrows: [{ from: 'lma', to: 'vma', label: 'crt0 copies' }] } },
        { t: 'learn', h: 'The linker script', body: 'The script names the memories and places each section. `> RAM AT > FLASH` is exactly the VMA/LMA split above, and the symbols it defines tell the startup code what to copy and clear.', viz: { k: 'code', text: 'MEMORY {\n    FLASH (rx)  : ORIGIN = 0x20000000, LENGTH = 512K\n    RAM   (rwx) : ORIGIN = 0x80000000, LENGTH = 64K\n}\nSECTIONS {\n    .text   : { KEEP(*(.text.init)) *(.text*) } > FLASH\n    .rodata : { *(.rodata*) } > FLASH\n    .data   : { __data_start = .; *(.data*) *(.sdata*)\n                __data_end = .; } > RAM AT > FLASH\n    __data_load = LOADADDR(.data);\n    .bss (NOLOAD) : { __bss_start = .; *(.sbss*) *(.bss*)\n                __bss_end = .; } > RAM\n    PROVIDE(__global_pointer$ = __data_start + 0x800);\n    PROVIDE(__stack_top = ORIGIN(RAM) + LENGTH(RAM));\n}', hl: [9, 13] } },
        { t: 'mcq', q: '`static char buf[4096];` with no initializer. How much does it add to the flash image?', opts: ['Nothing', '4096 bytes', '4 bytes', 'It depends on the optimisation level'], a: 0, why: 'It goes to .bss: the image only records the range; startup code zeroes it.' },
        { t: 'mcq', q: '`const char banner[] = "hi";` — which section?', opts: ['.rodata', '.data', '.bss', '.text'], a: 0, why: 'Read-only data can stay in flash.' },
        { t: 'tf', q: 'A large .bss makes the firmware image bigger.', a: false, why: 'Only .text, .rodata and the .data initial values take space in the image.' },
        { t: 'mcq', q: 'What is `__global_pointer$` for?', opts: ['gp points into small globals so they are one instruction away', 'It marks the end of the stack', 'It is the reset vector', 'It points at the device tree'], a: 0, why: 'With gp set 0x800 past the start of .sdata, a 12-bit offset reaches 4 KiB of globals; the linker then relaxes `lui`+`lw` into one `lw` off gp.' },
        { t: 'num', q: 'gp = 0x80000800. What is the lowest address that `lw a0, off(gp)` can reach? (hex)', a: 0x80000000, base: 'hex', why: 'Offsets are signed 12-bit: gp − 2048 = 0x80000000. The highest is gp + 2047.' }
      ]
    },
    {
      id: 'u15l4', title: 'crt0: before main()', items: [
        { t: 'learn', h: 'Reset is not main()', body: 'After reset, nothing is ready: no stack, no gp, garbage in RAM. A small assembly file, **crt0**, prepares the C world.', viz: { k: 'chain', items: [['Mask interrupts', 'csrw mie, zero', 'f7'], ['Park every hart but one', 'csrr t0, mhartid; bnez → wfi loop', 'f3'], ['Set gp and sp', 'la gp, __global_pointer$ (norelax); la sp, __stack_top', 'rs2'], ['Install a trap vector', 'csrw mtvec, handler', 'rs1'], ['Copy .data, zero .bss', 'flash → RAM; then fill zeros', 'imm'], ['call main', 'then exit with its return value', 'rd']] } },
        { t: 'learn', h: 'Watch it run', body: 'Here crt0 zeroes .bss, calls main(), and turns main’s return value into an exit code for the test device. main() reaches its globals through gp in one instruction each.', viz: { k: 'socrun', src: FW_PRESETS.crt0.src, expect: 'main\\(\\) ran', cap: 'Return 0 from main() and the run passes; return anything else and it fails with that code.' } },
        { t: 'order', q: 'Put crt0’s steps in order.', items: ['Mask interrupts', 'Park the other harts', 'Set gp and sp', 'Set mtvec', 'Copy .data and zero .bss', 'Call main()'], why: 'Everything main() relies on must exist before it runs.' },
        { t: 'mcq', q: 'Why is `la gp, __global_pointer$` assembled with `.option norelax`?', opts: ['Relaxation would rewrite it to use gp itself, which is not set yet', 'gp is read-only', 'To make it faster', 'Relaxation only works in .data'], a: 0, why: 'The linker turns gp-reachable addresses into gp-relative ones. For the instruction that sets gp, that would be circular.' },
        { t: 'mcq', q: 'crt0 forgets to zero .bss. What does `static int count;` hold at the start of main()?', opts: ['Whatever the RAM held at power-on', 'Always 0', 'The address of count', 'The previous run’s value, always'], a: 0, why: 'C promises 0, but only crt0 makes it true. Bugs like this appear on hardware and hide in simulators that clear memory.' },
        { t: 'tf', q: 'On a chip that executes from flash, .data must be copied to RAM before main().', a: true, why: 'Writes to flash do not work like RAM writes, and its contents are the initial values only.' },
        { t: 'mcq', q: 'Four harts leave reset together. What do the extra harts do in crt0?', opts: ['Wait in a wfi loop until released', 'Run main() too', 'Reset again', 'Clear .bss in parallel'], a: 0, why: 'One hart initialises memory; the others are woken later, for example by an inter-processor interrupt.' }
      ]
    },
    {
      id: 'u15l5', title: 'Drivers and MMIO', items: [
        { t: 'learn', h: 'Device registers', body: 'A driver is code that reads and writes a device’s registers. On the classic 16550 UART:', viz: { k: 'table', head: ['Offset', 'Register', 'Use'], rows: [['0', 'THR / RBR', 'write a byte to send / read a received byte'], ['0, 1 (DLAB = 1)', 'DLL, DLM', 'baud-rate divisor = clock ÷ (16 × baud)'], ['1', 'IER', 'which events raise an interrupt'], ['2', 'FCR', 'enable and clear the FIFOs'], ['3', 'LCR', 'framing (8N1 = 0x03); bit 7 = DLAB'], ['5', 'LSR', 'bit 5 THRE: room to send; bit 0: data ready']], mono: [0] } },
        { t: 'learn', h: 'volatile and polling', body: 'To a compiler, reading the same address twice gives the same value, so it may read once and loop forever. Device registers change by themselves, so in C every access goes through a **volatile** pointer.\n\nThis driver programs the divisor, sets 8N1 framing, enables the FIFOs, then polls LSR before every byte.', viz: { k: 'socrun', src: FW_PRESETS.uart.src, expect: 'divisor = 2', cap: 'The driver reads the divisor latch back to prove the init worked.' } },
        { t: 'num', q: 'A 16550 runs from a 1,843,200 Hz clock. What divisor gives 9600 baud?', a: 12, why: '1,843,200 ÷ (16 × 9600) = 12. That clock exists precisely because it divides evenly into standard baud rates.' },
        { t: 'mcq', q: 'Why does the driver read LSR again on every pass of its loop?', opts: ['The hardware changes it; a cached copy could wait forever', 'Reads are cheaper than branches', 'To clear the FIFO', 'LSR is write-only'], a: 0, why: 'Exactly what `volatile` guarantees in C: every access really happens.' },
        { t: 'mcq', q: 'What does setting LCR bit 7 (DLAB) do?', opts: ['Offsets 0 and 1 address the divisor latch instead of THR and IER', 'Enables loopback', 'Clears the FIFOs', 'Sends a break'], a: 0, why: 'A trick from an era of few address lines: the same two offsets reach two different registers.' },
        { t: 'mcq', q: 'A driver fills a buffer in RAM, then writes the device’s “go” register. Which fence goes between them?', opts: ['`fence w, o`', '`fence r, r`', '`fence.i`', '`sfence.vma`'], a: 0, why: 'Memory writes (W) must be visible before the device output (O) that starts the transfer. Linux’s writel() does exactly this.' },
        { t: 'tf', q: 'RISC-V `fence` distinguishes device input (I) and output (O) from memory reads (R) and writes (W).', a: true, why: 'Its predecessor and successor sets each have I, O, R and W bits.' }
      ]
    },
    {
      id: 'u15l6', title: 'Interrupt-driven drivers', items: [
        { t: 'learn', h: 'Stop polling', body: 'Polling burns cycles waiting. An interrupt-driven driver lets the device announce events. The **interrupt service routine (ISR)** does the minimum, moving bytes between the device and a buffer, and main code does the rest.', viz: { k: 'chain', items: [['Byte arrives at the UART', 'RX interrupt enabled in IER', 'op'], ['PLIC raises MEIP', 'priority above threshold', 'f3'], ['Core traps to the ISR', 'state saved, interrupts masked', 'rs1'], ['ISR: claim, copy byte to ring buffer, complete', 'a few dozen instructions', 'rd'], ['mret: main code continues', 'reads the buffer when it is ready', 'imm']] } },
        { t: 'learn', h: 'Handlers in C', body: 'GCC’s interrupt attribute saves every register the function touches and returns with `mret` instead of `ret`. Data shared with main code is `volatile`.', viz: { k: 'code', text: 'volatile uint32_t ticks;\n\nvoid __attribute__((interrupt("machine"))) timer_isr(void) {\n    ticks++;                               // shared with main()\n    *MTIMECMP = *MTIME + TICKS_PER_MS;     // next deadline\n}   // prologue saves used registers; ends in mret\n\nint main(void) {\n    write_csr(mtvec, (uintptr_t)timer_isr);\n    set_csr(mie, 1 << 7);                  // MTIE\n    set_csr(mstatus, 1 << 3);              // MIE\n    for (;;) { wfi(); if (ticks >= 1000) break; }\n}', hl: [3, 6] } },
        { t: 'learn', h: 'Ring buffers', body: 'The ISR writes at **head**, main code reads at **tail**; both wrap at the size. With one producer and one consumer on one hart, each index has a single writer, so no lock is needed.', viz: { k: 'table', head: ['', 'head', 'tail', 'bytes waiting'], rows: [['empty', '5', '5', '0'], ['3 bytes in', '8', '5', '3'], ['wrapped', '2', '13', '(2 − 13) mod 16 = 5']], mono: [1, 2] } },
        { t: 'mcq', q: 'What does `__attribute__((interrupt("machine")))` change?', opts: ['The function saves the registers it uses and returns with mret', 'It runs the function in U-mode', 'It disables the cache', 'It makes the function reentrant'], a: 0, why: 'A normal function may clobber t- and a-registers; an ISR interrupts code that did not expect that.' },
        { t: 'mcq', q: 'main() does `count++` while an ISR also increments count. What can go wrong?', opts: ['The ISR runs between main’s load and store, and one increment is lost', 'Nothing: ++ is one instruction', 'The ISR deadlocks', 'count becomes negative'], a: 0, why: '++ is a load, an add and a store. Disable interrupts around it, or use an atomic `amoadd.w`.' },
        { t: 'num', q: 'A 16-slot ring buffer has head = 3 and tail = 12. How many bytes are waiting?', a: 7, why: '(3 − 12) mod 16 = 7: four at the end of the array, three at the start.' },
        { t: 'tf', q: 'An ISR should be short and leave slow work to main code.', a: true, why: 'While it runs, other interrupts of the same level wait.' },
        { t: 'mcq', q: 'How does main code make a short critical section safe from the ISR on a single hart?', opts: ['Clear mstatus.MIE around it, then restore it', 'Use `fence`', 'Call the ISR first', 'Use a bigger buffer'], a: 0, why: '`csrrci t0, mstatus, 8` disables interrupts and returns the old state to restore afterwards.' }
      ]
    }
  ]
});

TAPEOUT.units.push({
  id: 'u16', n: 16, track: 'sw', tone: 'f3', title: 'Firmware: boot and SBI',
  blurb: 'How a chip gets from reset to an operating system: the boot chain, secure boot, M-mode firmware’s duties, the SBI interface, timers and IPIs, and the hand-off to the kernel.',
  lessons: [
    {
      id: 'u16l1', title: 'The boot chain', items: [
        { t: 'learn', h: 'From reset to Linux', body: 'Each stage is small enough to trust and sets up just enough for the next, larger one.', viz: { k: 'chain', items: [['Boot ROM (ZSBL)', 'mask ROM at the reset vector; picks the boot device', 'imm'], ['First-stage loader (SPL)', 'runs in on-chip SRAM; trains DRAM', 'rs2'], ['OpenSBI · M-mode', 'firmware services; stays resident', 'f3'], ['U-Boot · S-mode', 'loads kernel, device tree, initramfs', 'rs1'], ['Linux · S-mode', 'a0 = hartid, a1 = device tree', 'rs1'], ['init and apps · U-mode', '', 'rd']] } },
        { t: 'learn', h: 'What reset guarantees', body: 'Very little. After reset a hart is in **M-mode**, `mstatus.MIE` = 0, the pc is the implementation’s **reset vector**, and PMP entries are off. Registers, most CSRs, caches and RAM hold whatever they hold.\n\nA microcontroller’s chain is short: the reset vector points into flash, crt0 runs, then main().' },
        { t: 'order', q: 'Order the stages of a Linux-class boot.', items: ['Boot ROM', 'First-stage loader', 'OpenSBI', 'U-Boot', 'Linux kernel', 'init'], why: 'Trust and complexity grow together.' },
        { t: 'mcq', q: 'Why does a first-stage loader run before OpenSBI on many chips?', opts: ['DRAM must be initialised before larger stages can be loaded into it', 'OpenSBI cannot run in M-mode', 'To decompress the ROM', 'To set the clock to zero'], a: 0, why: 'Until DRAM is trained, only small on-chip SRAM is usable.' },
        { t: 'mcq', q: 'Which is guaranteed right after reset?', opts: ['The hart is in M-mode with interrupts disabled', 'x1–x31 are zero', 'The caches are valid', 'satp points at a page table'], a: 0, why: 'Everything else is undefined until firmware sets it.' },
        { t: 'tf', q: 'x1–x31 are zero after reset.', a: false, why: 'Their reset values are unspecified. Firmware must never assume them.' },
        { t: 'mcq', q: 'Several harts leave reset together. How does firmware pick one to boot?', opts: ['A lottery: the first to win an atomic operation boots, the rest wait', 'The hart with the highest frequency', 'They all boot', 'The debugger chooses'], a: 0, why: 'OpenSBI calls it the “hart lottery”. Losers wait for an IPI or an HSM start request.' }
      ]
    },
    {
      id: 'u16l2', title: 'Secure boot', items: [
        { t: 'learn', h: 'A chain of trust', body: 'Each stage **verifies** the next before running it. The root is code that cannot change: the boot ROM, holding or reading a key (often a hash of a public key burned into one-time-programmable fuses). A real ROM checks a cryptographic **signature**; only the holder of the private key can produce one.' },
        { t: 'learn', h: 'Try it', body: 'This boot ROM computes a digest of stage 2 and jumps to it only if it matches the recorded value. Change one character of stage 2 in the Firmware lab and it refuses to boot.', viz: { k: 'socrun', src: FW_PRESETS.secureboot.src, expect: 'digest ok', cap: 'The digest here is a toy; the flow is the real one.' } },
        { t: 'mcq', q: 'Where must the first verification step live?', opts: ['In immutable boot ROM', 'In the kernel', 'In flash, next to the image', 'In the device tree'], a: 0, why: 'If the checker can be modified, so can its verdict.' },
        { t: 'tf', q: 'A plain checksum is enough for secure boot.', a: false, why: 'Anyone can recompute a checksum for modified code. A signature needs the private key, which never leaves the vendor.' },
        { t: 'mcq', q: 'What do the fuses usually hold?', opts: ['A hash of the public key', 'The private key', 'The whole firmware', 'The boot ROM code'], a: 0, why: 'The public key can travel with the image; the fused hash proves it is the right one.' },
        { t: 'mcq', q: 'How does OpenSBI stop the S-mode kernel from overwriting the firmware?', opts: ['A PMP entry with no permissions covers firmware memory, ahead of the entry that opens the rest', 'It hides at a secret address', 'It sets satp', 'It disables S-mode stores'], a: 0, why: 'The lowest-numbered matching PMP entry decides, so the deny entry wins for that range.' }
      ]
    },
    {
      id: 'u16l3', title: 'M-mode firmware’s jobs', items: [
        { t: 'learn', h: 'Prepare, then serve', body: 'After the boot work, M-mode firmware stays resident beneath the OS.', viz: { k: 'table', head: ['Job', 'How'], rows: [['Protect itself', 'PMP entries'], ['Route traps to the OS', 'medeleg / mideleg'], ['Open counters to S and U', 'mcounteren'], ['Enable features for S-mode', 'menvcfg (for example Sstc)'], ['Provide services', 'SBI calls via ecall'], ['Fill hardware gaps', 'trap and emulate missing features'], ['Start and stop harts', 'SBI HSM extension'], ['Describe the hardware', 'pass a device tree in a1']] } },
        { t: 'learn', h: 'A mini SBI on the emulator', body: 'This firmware sets up PMP, drops to S-mode with a0 = hartid and a1 = device tree, and serves the kernel’s console and shutdown calls.', viz: { k: 'socrun', src: FW_PRESETS.sbi.src, expect: 'SBI spec v2', cap: 'Every console character is an ecall into M-mode: fine for boot logs, too slow for anything else.' } },
        { t: 'num', q: 'Delegate ecall from U-mode (8), instruction page fault (12), load page fault (13) and store page fault (15). What is medeleg? (hex)', a: 0xB100, base: 'hex', why: 'Bits 8, 12, 13 and 15: 0x100 + 0x1000 + 0x2000 + 0x8000 = 0xB100.' },
        { t: 'mcq', q: 'The kernel runs `rdtime`, but this core has no time CSR. What can firmware do?', opts: ['Catch the illegal-instruction trap and return mtime from the CLINT', 'Nothing: the kernel crashes', 'Reset the core', 'Delegate the trap to U-mode'], a: 0, why: 'Trap-and-emulate lets firmware hide hardware gaps from the OS, at a cost in speed.' },
        { t: 'mcq', q: 'Which CSR lets S-mode read `cycle`, `time` and `instret`?', opts: ['mcounteren', 'mstatus', 'medeleg', 'satp'], a: 0, why: 'One bit per counter; scounteren then decides for U-mode.' },
        { t: 'tf', q: 'An ecall made in M-mode can be delegated to S-mode.', a: false, why: 'Traps never move to a lower privilege. medeleg bit 11 is read-only zero.' }
      ]
    },
    {
      id: 'u16l4', title: 'SBI: the firmware’s API', items: [
        { t: 'learn', h: 'A system call to firmware', body: 'The **Supervisor Binary Interface** is how S-mode asks M-mode for help. The kernel puts the **extension ID** in a7, the **function ID** in a6, arguments in a0–a5, and runs `ecall`. It gets back an error code in a0 and a value in a1; every other register is preserved.', viz: { k: 'table', head: ['Extension', 'EID', 'Example function'], rows: [['Base', '0x10', 'probe_extension (FID 3)'], ['TIME', '0x54494D45 “TIME”', 'set_timer'], ['IPI', '0x735049 “sPI”', 'send_ipi'], ['RFENCE', '0x52464E43 “RFNC”', 'remote_sfence_vma'], ['HSM', '0x48534D “HSM”', 'hart_start'], ['SRST', '0x53525354 “SRST”', 'system_reset'], ['DBCN', '0x4442434E “DBCN”', 'console_write_byte']], mono: [1] } },
        { t: 'learn', h: 'Error codes', body: 'Errors are small negative numbers in a0.', viz: { k: 'table', head: ['a0', 'Meaning'], rows: [['0', 'SBI_SUCCESS'], ['−1', 'SBI_ERR_FAILED'], ['−2', 'SBI_ERR_NOT_SUPPORTED'], ['−3', 'SBI_ERR_INVALID_PARAM'], ['−4', 'SBI_ERR_DENIED'], ['−5', 'SBI_ERR_INVALID_ADDRESS']], mono: [0] } },
        { t: 'mcq', q: 'Which register holds the SBI extension ID?', opts: ['a7', 'a6', 'a0', 'sp'], a: 0, why: 'a7 = EID, a6 = FID, the same register Linux uses for system call numbers.' },
        { t: 'num', q: 'Extension IDs spell ASCII names. T = 0x54, I = 0x49, M = 0x4D, E = 0x45. What is the TIME EID? (hex)', a: 0x54494D45, base: 'hex', why: 'The bytes in order: 0x54494D45.' },
        { t: 'mcq', q: 'Before using an optional extension, what should the kernel do?', opts: ['Probe it with the Base extension’s probe_extension', 'Just call it', 'Read misa', 'Check the device tree compatible string'], a: 0, why: 'probe_extension returns non-zero in a1 if the extension is present.' },
        { t: 'tf', q: 'SBI calls and Linux system calls both use `ecall`; the mode that executes it decides who answers.', a: true, why: 'ecall from U-mode reaches the kernel (delegated); ecall from S-mode reaches M-mode firmware.' },
        { t: 'mcq', q: 'An SBI call returns a0 = −2. What does it mean?', opts: ['Not supported', 'Success', 'Denied', 'Invalid address'], a: 0, why: 'SBI_ERR_NOT_SUPPORTED: the firmware lacks that extension or function.' }
      ]
    },
    {
      id: 'u16l5', title: 'Timers and IPIs', items: [
        { t: 'learn', h: 'A tick for the kernel', body: 'Without the **Sstc** extension, S-mode cannot program a timer itself:\n\n1. The kernel calls `sbi_set_timer(deadline)`.\n2. Firmware writes mtimecmp and enables MTIE.\n3. At the deadline, firmware masks MTIE and sets **STIP**, which is delegated to S-mode.\n4. The kernel’s handler runs and sets the next deadline, which also clears STIP.', viz: { k: 'socrun', src: FW_PRESETS.stimer.src, expect: 'five timer', cap: 'Five kernel ticks, each relayed through M-mode.' } },
        { t: 'learn', h: 'Sstc and IPIs', body: 'With **Sstc**, S-mode writes its own `stimecmp` CSR and the round trip through firmware disappears (M-mode enables it once in menvcfg).\n\n**Inter-processor interrupts** wake or poke other harts: the kernel calls `sbi_send_ipi`, firmware writes the target hart’s CLINT `msip`, and the target sees a supervisor software interrupt. The AIA’s IMSIC lets S-mode send IPIs directly.' },
        { t: 'mcq', q: 'Why does the firmware clear MTIE after raising STIP?', opts: ['mtime ≥ mtimecmp stays true, so MTI would fire again immediately, forever', 'To save power', 'STIP requires it', 'To reset mtime'], a: 0, why: 'The machine timer stays pending until someone moves the deadline, and only the kernel knows the next one.' },
        { t: 'mcq', q: 'What does the Sstc extension add?', opts: ['A stimecmp CSR so S-mode programs its own timer', 'A second CLINT', 'Timer interrupts for U-mode', 'A faster mtime'], a: 0, why: 'One CSR write per tick replaces the set_timer call and the detour through M-mode.' },
        { t: 'num', q: 'timebase-frequency = 10,000,000 Hz and Linux ticks at 250 Hz. How much is added to the deadline each tick?', a: 40000, why: '10,000,000 ÷ 250 = 40,000 timer counts.' },
        { t: 'mcq', q: 'Without the AIA, how does hart 0’s kernel interrupt hart 3?', opts: ['sbi_send_ipi: firmware writes hart 3’s msip in the CLINT', 'It writes hart 3’s sip directly', 'It changes hart 3’s mtvec', 'It cannot'], a: 0, why: 'msip is an M-mode resource, so S-mode asks the firmware.' },
        { t: 'tf', q: 'Without Sstc, every kernel tick costs at least two traps into M-mode: the machine timer interrupt and the set_timer call.', a: true, why: 'That overhead is exactly what Sstc removes. (The demo adds more, because it also prints through SBI.)' }
      ]
    },
    {
      id: 'u16l6', title: 'Handing off to the kernel', items: [
        { t: 'learn', h: 'The boot protocol', body: 'Linux on RISC-V starts in **S-mode** with **a0 = the hart ID** and **a1 = the physical address of the device tree**, the MMU off (satp = 0) and interrupts disabled. Everything else it learns from the device tree.' },
        { t: 'learn', h: 'The device tree', body: 'A device tree describes the hardware so one kernel binary can run on many boards. `dtc` compiles the text form into a binary DTB, which starts with the magic number 0xd00dfeed. Drivers bind to nodes through their **compatible** strings.', viz: { k: 'code', text: '/ {\n    cpus {\n        timebase-frequency = <10000000>;\n        cpu@0 {\n            device_type = "cpu";\n            compatible = "riscv";\n            riscv,isa = "rv64imafdc_zicsr_zifencei";\n            mmu-type = "riscv,sv39";\n        };\n    };\n    memory@80000000 {\n        device_type = "memory";\n        reg = <0x0 0x80000000 0x0 0x10000000>;\n    };\n    serial@10000000 {\n        compatible = "ns16550a";\n        reg = <0x0 0x10000000 0x0 0x100>;\n        interrupts = <10>;\n    };\n};', hl: [7, 16] } },
        { t: 'mcq', q: 'What does a1 hold when Linux starts?', opts: ['The physical address of the device tree', 'The kernel’s size', 'The number of harts', 'The boot arguments as a string'], a: 0, why: 'The command line itself lives in the device tree’s /chosen node.' },
        { t: 'mcq', q: 'How does Linux find the UART?', opts: ['A device tree node whose compatible string matches a driver gives its address and interrupt', 'It scans memory', 'The address is compiled into the kernel', 'It asks the user'], a: 0, why: '`compatible = "ns16550a"` binds the 8250/16550 driver; `reg` gives the address.' },
        { t: 'tf', q: 'The MMU is already on when the kernel’s first instruction runs.', a: false, why: 'satp is 0; the kernel builds its own page tables and turns paging on itself.' },
        { t: 'num', q: 'A binary device tree starts with which magic number? (hex)', a: 0xD00DFEED, base: 'hex', why: 'Stored big-endian at the very start of the DTB.' },
        { t: 'match', q: 'Match each device tree property to what it tells the kernel.', pairs: [['compatible', 'which driver to bind'], ['reg', 'address and size of the registers'], ['interrupts', 'which interrupt line it uses'], ['timebase-frequency', 'how fast mtime counts'], ['riscv,isa', 'which extensions the hart has']], why: 'Change the hardware, change the device tree, keep the kernel.' }
      ]
    }
  ]
});
