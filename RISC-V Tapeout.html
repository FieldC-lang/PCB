TAPEOUT.units.push({
  id: 'u17', n: 17, track: 'sw', tone: 'rs1', title: 'Operating systems',
  blurb: 'What a kernel does on your core: early boot and turning on the MMU, trap entry and system calls, processes and address spaces, context switches, drivers and multicore locking.',
  lessons: [
    {
      id: 'u17l1', title: 'Kernel entry', items: [
        { t: 'learn', h: 'The first steps of a kernel', body: 'The kernel arrives in S-mode with the MMU off and only a0 and a1 to go on.', viz: { k: 'chain', items: [['Save a0 (hart ID) and a1 (device tree)', '', 'op'], ['Set sp, clear .bss', 'same jobs as crt0', 'f3'], ['Build early page tables', 'kernel image mapped at its virtual address', 'rs2'], ['Write satp, sfence.vma', 'paging is on', 'f7'], ['Parse the device tree', 'memory size, harts, devices', 'imm'], ['Set stvec, start the allocators', '', 'rs1'], ['Start the other harts', 'SBI HSM hart_start', 'f3'], ['Run the first process', 'init, in U-mode', 'rd']] } },
        { t: 'learn', h: 'Turning the MMU on', body: 'The instruction right after `csrw satp` is fetched **through the new page table**. If its address is not mapped there, the kernel faults on its very first translated fetch.\n\nKernels either identity-map that code (virtual = physical) or, like Linux, point `stvec` at the virtual address of the next instruction so the fault itself lands in the right place.' },
        { t: 'mcq', q: 'Why must the code that writes satp stay reachable after the write?', opts: ['The next fetch already uses the new translation', 'satp writes are delayed by 100 cycles', 'The TLB is disabled', 'S-mode cannot fetch'], a: 0, why: 'The pc does not change, but its meaning does: it is now a virtual address.' },
        { t: 'num', q: 'Sv32: the root page table sits at physical address 0x80400000. What PPN goes into satp? (hex)', a: 0x80400, base: 'hex', why: 'PPN = physical address ÷ 4096 = 0x80400. MODE = 1 selects Sv32.' },
        { t: 'tf', q: 'After changing page-table entries that may be cached, the kernel runs `sfence.vma`.', a: true, why: 'It orders the page-table writes before later translations and flushes stale TLB entries.' },
        { t: 'mcq', q: 'How does Linux start the other harts on an SBI system?', opts: ['SBI HSM hart_start(hartid, start address, opaque)', 'It writes their pc register', 'It resets the chip', 'They start themselves when the MMU turns on'], a: 0, why: 'Firmware releases each waiting hart at the address the kernel gives.' },
        { t: 'mcq', q: 'Which part of the address space appears in every process’s page table?', opts: ['The kernel’s mappings', 'The user stack', 'The heap', 'None'], a: 0, why: 'Then a trap can enter kernel code without switching satp.' }
      ]
    },
    {
      id: 'u17l2', title: 'Traps and system calls', items: [
        { t: 'learn', h: 'The trap frame', body: 'Every trap from user mode enters the same code. It must not trust the user’s sp, so it swaps in the kernel stack using sscratch, saves all 31 registers plus sepc and sstatus into a **trap frame**, then dispatches on scause.', viz: { k: 'code', text: 'trap_entry:\n    csrrw sp, sscratch, sp     # sp = kernel stack, sscratch = user sp\n    addi  sp, sp, -FRAME       # room for 31 registers + CSRs\n    sw    ra, 4(sp)            # save x1, x3 … x31\n    ...\n    csrr  t0, sepc\n    sw    t0, 0(sp)\n    mv    a0, sp               # handle_trap(struct pt_regs *regs)\n    call  handle_trap\n    ...                        # restore everything, swap sp back\n    sret', hl: [2] } },
        { t: 'learn', h: 'The system call ABI', body: 'Linux on RISC-V: the call number in **a7**, arguments in **a0–a5**, `ecall`. The result comes back in **a0**, negative for an error. The kernel adds 4 to sepc so `sret` resumes after the ecall.', viz: { k: 'table', head: ['Number (a7)', 'Call'], rows: [['56', 'openat'], ['57', 'close'], ['63', 'read'], ['64', 'write'], ['93', 'exit'], ['214', 'brk'], ['220', 'clone'], ['221', 'execve'], ['222', 'mmap']], mono: [0] } },
        { t: 'learn', h: 'A kernel that checks', body: 'This kernel runs a U-mode program that calls `write()`, then tries to make the kernel print **kernel** memory. The pointer check returns −EFAULT instead.', viz: { k: 'socrun', src: FW_PRESETS.kernel.src, expect: 'EFAULT', cap: 'U → S on every ecall; M-mode only at the very start and end.' } },
        { t: 'mcq', q: 'Why does trap entry swap sp with sscratch first?', opts: ['The user’s sp cannot be trusted, and the kernel needs a stack before it can save anything', 'To disable interrupts', 'To read the cause', 'sscratch is faster'], a: 0, why: 'A buggy or hostile program could set sp to anything. csrrw swaps without using a free register.' },
        { t: 'mcq', q: '`write()` returns −14 in a0. What does the C library do?', opts: ['Sets errno to 14 (EFAULT) and returns −1', 'Retries', 'Crashes the program', 'Returns −14 unchanged'], a: 0, why: 'The kernel returns −errno; libc converts it to the C convention.' },
        { t: 'num', q: 'An ecall traps with sepc = 0x00010570. Where does `sret` return to? (hex)', a: 0x10574, base: 'hex', why: 'sepc points at the ecall; the kernel adds 4.' },
        { t: 'mcq', q: 'Why must the kernel check user pointers?', opts: ['It runs with access to kernel memory, so a hostile pointer could leak or corrupt it', 'User pointers are always misaligned', 'To make syscalls faster', 'Hardware requires it'], a: 0, why: 'The demo shows exactly this: write(kernel address) would print kernel secrets.' },
        { t: 'match', q: 'Match each scause value to its trap.', pairs: [['8', 'ecall from U-mode (system call)'], ['12', 'instruction page fault'], ['13', 'load page fault'], ['15', 'store page fault'], ['interrupt bit + 5', 'supervisor timer interrupt']], why: 'The dispatch code is a switch on exactly these values.' }
      ]
    },
    {
      id: 'u17l3', title: 'Processes and address spaces', items: [
        { t: 'learn', h: 'One page table per process', body: 'Each process has its own page table, so the same virtual address means different memory in different processes. Switching processes writes **satp** (MODE, ASID, root PPN). The kernel half is identical in every table.', viz: { k: 'memmap', label: 'two address spaces', cols: [{ name: 'Process A', base: '0x0000…', parts: [{ label: 'code + data', tone: 'rd' }, { label: 'heap ↑', free: true }, { label: 'stack ↓', tone: 'f3' }, { label: 'kernel', sub: 'U = 0', tone: 'rs1', id: 'ka' }] }, { name: 'Process B', base: '0x0000…', parts: [{ label: 'code + data', tone: 'op' }, { label: 'heap ↑', free: true }, { label: 'stack ↓', tone: 'f3' }, { label: 'kernel', sub: 'U = 0', tone: 'rs1', id: 'kb' }] }], arrows: [{ from: 'ka', to: 'kb', label: 'same' }] } },
        { t: 'learn', h: 'fork and exec', body: '- **fork** copies the page tables, not the memory: both processes share every page read-only. The first write to a page faults, and the kernel copies just that page (**copy-on-write**).\n- **exec** loads an ELF file: it maps each PT_LOAD segment, builds the user stack (argc, argv, envp, auxv), sets sepc to the entry point and SPP = U, then `sret`.\n\nPages marked **U** are user pages. With `sstatus.SUM` = 0 the kernel faults if it touches one by accident; copy_from_user sets SUM briefly.' },
        { t: 'mcq', q: 'After fork, the child writes to a global variable. What happens?', opts: ['A store page fault; the kernel copies that page and retries the store', 'The parent sees the change', 'The child is killed', 'Nothing special'], a: 0, why: 'Copy-on-write makes fork cheap: only pages actually written get copied.' },
        { t: 'mcq', q: 'What do ASIDs in satp buy you?', opts: ['TLB entries tagged by address space survive a process switch', 'More physical memory', 'Faster page walks', 'Bigger pages'], a: 0, why: 'Without ASIDs, every switch needs a full TLB flush.' },
        { t: 'num', q: 'Sv39 virtual addresses have 39 bits. How many GiB can one address space span?', a: 512, unit: 'GiB', why: '2^39 bytes = 512 GiB, split into a user half and a kernel half.' },
        { t: 'order', q: 'Order what exec() does.', items: ['Read the ELF header', 'Map the PT_LOAD segments', 'Build the user stack: argc, argv, envp, auxv', 'Set sepc to the entry point and SPP to U', 'sret into the new program'], why: 'The old address space is gone; the new program starts at its entry point.' },
        { t: 'tf', q: 'With sstatus.SUM = 0, an S-mode load from a U page faults.', a: true, why: 'It stops the kernel from following user pointers by mistake.' }
      ]
    },
    {
      id: 'u17l4', title: 'Context switches', items: [
        { t: 'learn', h: 'Switching tasks', body: 'A timer interrupt enters the kernel, the scheduler picks the next task, and `switch_to` swaps kernel stacks. It saves only **ra, sp and s0–s11**: it is called like a normal function, so the caller already expects t- and a-registers to be clobbered, and the user’s registers are already in the trap frame.', viz: { k: 'code', text: '# switch_to(struct task *prev = a0, struct task *next = a1)\nswitch_to:\n    sw   ra,  0(a0)     # save prev: ra, sp, s0–s11\n    sw   sp,  4(a0)\n    sw   s0,  8(a0)\n    ...                 # s1 … s11\n    lw   ra,  0(a1)     # load next\n    lw   sp,  4(a1)\n    lw   s0,  8(a1)\n    ...\n    ret                 # returns into next, on next’s stack', hl: [11] } },
        { t: 'learn', h: 'Preemption on the emulator', body: 'A tiny round-robin scheduler. Here the switch happens inside the timer handler, so it saves the interrupted task’s registers in a task control block and `mret`s into the other task.', viz: { k: 'socrun', src: FW_PRESETS.rtos.src, expect: 'ab', cap: 'Each letter run is one time slice.' } },
        { t: 'num', q: 'How many registers does a RISC-V switch_to like the one above save?', a: 14, why: 'ra, sp and s0–s11: 1 + 1 + 12.' },
        { t: 'mcq', q: 'Why can switch_to skip t0–t6 and a0–a7?', opts: ['It is called like a function, so its caller already treats them as clobbered', 'They are always zero', 'Hardware saves them', 'They belong to M-mode'], a: 0, why: 'The calling convention does half of the work for free.' },
        { t: 'num', q: 'Round robin with 10 ms slices and 4 runnable tasks. How long can a task wait, at most, to run again?', a: 30, unit: 'ms', why: 'The other three tasks each get one 10 ms slice first.' },
        { t: 'tf', q: 'A preemptive scheduler needs a timer interrupt.', a: true, why: 'Without one, a task that never yields keeps the hart forever.' },
        { t: 'mcq', q: 'Where does Linux on RISC-V keep the pointer to the current task while in the kernel?', opts: ['In tp; while user code runs it is parked in sscratch', 'In gp', 'In mscratch', 'In a CSR called current'], a: 0, why: 'Trap entry swaps tp with sscratch, giving the kernel its task pointer back in one instruction.' }
      ]
    },
    {
      id: 'u17l5', title: 'Drivers, interrupts and DMA', items: [
        { t: 'learn', h: 'From device tree to driver', body: 'At boot the kernel walks the device tree. For each node, a driver whose **compatible** list matches is **probed**: it maps the `reg` range, requests the interrupt from `interrupts`, and registers a device such as a serial port, disk or network card.\n\nIts interrupt handler acknowledges the device (PLIC claim and complete), does the urgent part, and defers the rest to a kernel thread.' },
        { t: 'learn', h: 'DMA and caches', body: 'With **DMA**, devices read and write RAM themselves. If the device is not cache-coherent, the driver manages the caches with **Zicbom** instructions:', viz: { k: 'table', head: ['Before…', 'Do', 'Because'], rows: [['the device reads a buffer', '`cbo.clean`', 'dirty lines must reach RAM'], ['the CPU reads what the device wrote', '`cbo.inval`', 'stale lines must be dropped'], ['either, to be safe', '`cbo.flush`', 'clean and invalidate']] }, more: 'Coherent interconnects make this unnecessary. An **IOMMU** translates device addresses so a device can reach only the memory it was given.' },
        { t: 'mcq', q: 'A non-coherent device is about to read a buffer the CPU just filled. What first?', opts: ['`cbo.clean` over the buffer', '`cbo.inval` over the buffer', '`fence.i`', 'Nothing'], a: 0, why: 'The data may still sit in the cache as dirty lines; the device reads RAM.' },
        { t: 'mcq', q: 'How does a driver learn its device’s interrupt number?', opts: ['From the interrupts property of its device tree node', 'It is always 10', 'From the PLIC threshold', 'From misa'], a: 0, why: 'interrupt-parent says which controller; interrupts says which line.' },
        { t: 'tf', q: 'An interrupt handler should acknowledge the device quickly and defer slow work.', a: true, why: 'While it runs, other interrupts wait.' },
        { t: 'mcq', q: 'What does an IOMMU protect against?', opts: ['A device using DMA to read or write memory it should not touch', 'Cache misses', 'Page faults in user space', 'Timer drift'], a: 0, why: 'It is the MMU for devices, important for safety and for passing devices to virtual machines.' },
        { t: 'mcq', q: 'After a device wrote a buffer by DMA, which instruction keeps the CPU from reading stale cached data?', opts: ['`cbo.inval`', '`cbo.clean`', '`fence w, o`', '`sfence.vma`'], a: 0, why: 'Invalidate drops the old copies so the next load fetches from RAM.' }
      ]
    },
    {
      id: 'u17l6', title: 'Multicore kernels', items: [
        { t: 'learn', h: 'Spinlocks', body: 'Harts share kernel data, so they take locks. An atomic swap with **acquire** ordering takes the lock; a store with **release** ordering frees it, so the critical section cannot leak outside.', viz: { k: 'code', text: 'lock:                         # a0 = &lock\n    li   t0, 1\nretry:\n    amoswap.w.aq t1, t0, (a0) # t1 = old value, acquire\n    bnez t1, retry            # somebody holds it: spin\n    ret\n\nunlock:\n    fence rw, w               # release: earlier accesses first\n    sw   zero, 0(a0)\n    ret', hl: [4, 9] } },
        { t: 'learn', h: 'Talking between harts', body: 'Harts poke each other with **IPIs**: “reschedule”, “run this function”. When the kernel unmaps a page, other harts may still hold it in their TLBs, so it sends a **TLB shootdown**: an IPI, or the SBI RFENCE extension, asking each to run `sfence.vma`.' },
        { t: 'mcq', q: 'Why the `.aq` on the swap that takes the lock?', opts: ['Accesses in the critical section cannot move before the lock is taken', 'It makes the swap faster', 'It disables interrupts', 'It is required by all AMOs'], a: 0, why: 'Acquire stops later accesses from being performed early.' },
        { t: 'mcq', q: 'Hart 0 unmaps a page that hart 2 used recently. What must happen?', opts: ['Hart 2’s TLB entry must be flushed: an IPI or SBI remote fence', 'Nothing: TLBs are coherent', 'Hart 2 must reboot', 'Hart 0 runs sfence.vma once for everyone'], a: 0, why: 'RISC-V TLBs are not kept coherent by hardware; each hart flushes its own.' },
        { t: 'num', q: 'A counter holds 5. Two harts each execute `amoadd.w` adding 1 at the same moment. What is the final value?', a: 7, why: 'Atomics never lose updates: both increments land.' },
        { t: 'mcq', q: 'Code holds a spinlock when an interrupt arrives, and the handler on the same hart wants the same lock. What happens?', opts: ['Deadlock: the handler spins while the holder cannot run', 'The handler gets the lock', 'The lock is released automatically', 'The interrupt is lost'], a: 0, why: 'That is why such locks are taken with interrupts disabled (spin_lock_irqsave in Linux).' },
        { t: 'tf', q: 'lr.w/sc.w can implement the same lock as amoswap.', a: true, why: 'Load-reserved, then store-conditional only if nobody else wrote; retry on failure.' }
      ]
    }
  ]
});

TAPEOUT.units.push({
  id: 'u18', n: 18, track: 'cap', tone: 'rd', title: 'From RTL to silicon',
  blurb: 'Turning a design into a chip: writing RTL, verifying it against a golden model, FPGA prototypes and debug, synthesis and timing, physical design, then fabrication, test and bring-up.',
  lessons: [
    {
      id: 'u18l1', title: 'Writing RTL', items: [
        { t: 'learn', h: 'Describing hardware', body: '**Register-transfer level** code describes registers and the combinational logic between them. SystemVerilog and VHDL are the classic languages; generators such as Chisel and SpinalHDL produce Verilog from parameterised code.', viz: { k: 'code', text: 'module pc_reg (\n  input  logic        clk, rst_n, stall,\n  input  logic [31:0] next_pc,\n  output logic [31:0] pc\n);\n  always_ff @(posedge clk or negedge rst_n)\n    if (!rst_n)      pc <= 32\'h8000_0000;  // reset vector\n    else if (!stall) pc <= next_pc;\nendmodule', hl: [6] } },
        { t: 'learn', h: 'Logic between registers', body: '`always_comb` describes logic with no memory, like the PC mux. Rules that keep synthesis honest:\n\n- Assign every output on every path, or you get an unintended **latch**.\n- Delays such as `#5` are ignored by synthesis.\n- Signals from another clock domain need a **synchroniser** (two flip-flops for a single bit, an asynchronous FIFO for data).', viz: { k: 'code', text: 'always_comb begin\n  case (pc_sel)\n    2\'b00:   next_pc = pc + 4;     // sequential\n    2\'b01:   next_pc = alu_out;    // branch or jal target\n    default: next_pc = trap_vec;   // mtvec\n  endcase\nend' } },
        { t: 'mcq', q: 'What does `always_ff @(posedge clk)` describe?', opts: ['Flip-flops that update on the rising clock edge', 'Combinational logic', 'A testbench delay', 'A latch'], a: 0, why: 'Everything assigned inside becomes a register.' },
        { t: 'mcq', q: 'An `always_comb` block sets y only inside `if (sel)`. What does synthesis build?', opts: ['A latch, to hold y when sel = 0: almost always a bug', 'A flip-flop', 'A wire to 0', 'Nothing'], a: 0, why: 'Add a default assignment at the top of the block.' },
        { t: 'tf', q: 'A `#5` delay in RTL becomes a real 5 ns delay in the chip.', a: false, why: 'Synthesis ignores it. Real delays come from the cells and wires.' },
        { t: 'mcq', q: 'A one-bit signal comes from a different clock domain. What do you add?', opts: ['A two-flip-flop synchroniser', 'An inverter', 'A latch', 'Nothing'], a: 0, why: 'It gives a metastable first flop a full cycle to settle.' }
      ]
    },
    {
      id: 'u18l2', title: 'Verification', items: [
        { t: 'learn', h: 'Trust nothing', body: 'Verification takes more effort than design. The layers:\n\n- **Unit tests** per module.\n- **Directed ISA tests** and the architectural compatibility tests.\n- **Random instruction streams** run in **lockstep** with a golden model (Spike, or the Sail formal model), comparing every retired instruction.\n- **Formal** proofs of properties, for example with riscv-formal.\n- **Coverage**: proof that tests reached the interesting cases.\n- Real software: boot Linux in simulation or on an FPGA.', viz: { k: 'cosim' } },
        { t: 'mcq', q: 'In lockstep co-simulation, when do your core and the golden model compare?', opts: ['After every retired instruction: pc, instruction, register and memory writes, traps', 'Only at the end of the program', 'Every million cycles', 'Only on exceptions'], a: 0, why: 'The first mismatch points at the exact instruction that went wrong.' },
        { t: 'mcq', q: 'Which model is the formal, executable specification of RISC-V?', opts: ['The Sail model', 'QEMU', 'Your RTL', 'GCC'], a: 0, why: 'Sail is written to read like the spec and is used as a golden reference.' },
        { t: 'mcq', q: 'What do random instruction streams find that directed tests miss?', opts: ['Unusual combinations: hazards, corner-case values, traps at awkward moments', 'Syntax errors', 'Timing violations', 'Layout errors'], a: 0, why: 'Humans write the tests they can imagine; random generators do not have that limit.' },
        { t: 'tf', q: 'Passing the architectural compatibility tests proves your core is bug-free.', a: false, why: 'They check that basic behaviour matches the spec. Pipeline, cache and timing bugs need far more.' },
        { t: 'mcq', q: 'What does functional coverage measure?', opts: ['Which scenarios the tests actually exercised', 'Chip area', 'Clock speed', 'How many lines of RTL exist'], a: 0, why: 'Example: did any test take an interrupt during a load miss with a full store buffer?' }
      ]
    },
    {
      id: 'u18l3', title: 'FPGA, emulation and debug', items: [
        { t: 'learn', h: 'Before silicon', body: 'Simulation sees everything but is slow. Faster platforms let real software run before tapeout.', viz: { k: 'table', head: ['Platform', 'Speed (roughly)', 'Visibility'], rows: [['RTL simulation (big SoC)', 'thousands of cycles/s', 'every signal'], ['Hardware emulator', 'around 1 MHz', 'most signals'], ['FPGA prototype', 'tens of MHz', 'a few probes'], ['Silicon', 'GHz', 'debug port only']] } },
        { t: 'learn', h: 'The debug architecture', body: 'The RISC-V Debug specification adds a **Debug Module** reached through a transport, usually **JTAG**. It can halt a hart (which saves its pc in `dpc` and enters Debug Mode), read and write registers and memory, and resume. **Triggers** give hardware breakpoints and watchpoints. Tools like OpenOCD and GDB speak this protocol.' },
        { t: 'num', q: 'Booting Linux takes about 2 billion instructions. At IPC 1 on a 50 MHz FPGA, how many seconds?', a: 40, unit: 's', why: '2 × 10⁹ ÷ 50 × 10⁶ = 40 s. In RTL simulation at a few thousand cycles per second it would take days.' },
        { t: 'mcq', q: 'Why boot Linux on an FPGA before tapeout?', opts: ['Billions of cycles of real software reach bugs simulation is too slow to find', 'FPGAs are more accurate than simulation', 'To measure power', 'The foundry requires it'], a: 0, why: 'Bugs found after tapeout cost a new mask set.' },
        { t: 'mcq', q: 'How does a debugger halt a RISC-V hart?', opts: ['Through the Debug Module, reached over JTAG', 'By cutting the clock', 'With an ecall', 'By resetting it'], a: 0, why: 'The hart enters Debug Mode; dpc and dcsr record where and why.' },
        { t: 'tf', q: 'Hardware triggers can set breakpoints in code that lives in ROM.', a: true, why: 'A software breakpoint has to write an ebreak into memory; a trigger compares addresses in hardware.' }
      ]
    },
    {
      id: 'u18l4', title: 'Synthesis and timing', items: [
        { t: 'learn', h: 'From RTL to gates', body: '**Synthesis** maps RTL onto a foundry’s **standard-cell library** (NAND, NOR, flip-flops, muxes…), guided by constraints such as the clock period. The result is a gate-level **netlist**.' },
        { t: 'learn', h: 'Static timing analysis', body: 'For every register-to-register path, data must arrive before the next edge, with **setup time** to spare. **Slack** = required time − arrival time; negative slack is a violation. The slowest path is the **critical path** and sets the clock.', viz: { k: 'table', head: ['Part of the path', 'Delay'], rows: [['clock-to-Q of the launching flop', '50 ps'], ['logic (ALU + forwarding mux)', '700 ps'], ['setup time of the capturing flop', '40 ps'], ['minimum period', '790 ps ≈ 1.27 GHz']], hl: [3] } },
        { t: 'num', q: 'Clock period 1 ns. clock-to-Q 60 ps, logic 850 ps, setup 50 ps. What is the slack?', a: 40, unit: 'ps', why: '1000 − (60 + 850 + 50) = 40 ps: it passes, barely.' },
        { t: 'num', q: 'clock-to-Q 40 ps, logic 560 ps, setup 30 ps, no skew. What is the maximum clock frequency? (MHz)', a: 1587, tol: 2, why: 'Minimum period = 630 ps; 1 ÷ 630 ps ≈ 1587 MHz.' },
        { t: 'mcq', q: 'A path has −120 ps of slack. Which fixes apply?', opts: ['Any of: split it with a pipeline register, restructure or retime the logic, use faster cells', 'Only lowering the voltage', 'Only adding more flip-flops at the end', 'Nothing: ship it'], a: 0, why: 'Each trades something: latency, area or power.' },
        { t: 'tf', q: 'Lowering the clock frequency fixes a hold violation.', a: false, why: 'Hold checks data changing too soon after the same edge; the period does not appear. Fix it by adding delay.' },
        { t: 'mcq', q: 'What is the critical path?', opts: ['The slowest register-to-register path; it sets the maximum frequency', 'The path from reset', 'The longest wire', 'The first instruction executed'], a: 0, why: 'Speed it up and the next-slowest path becomes critical.' }
      ]
    },
    {
      id: 'u18l5', title: 'Physical design', items: [
        { t: 'learn', h: 'Netlist to layout', body: 'Physical design turns the netlist into geometry on silicon.', viz: { k: 'chain', items: [['Floorplan', 'die size, SRAM macros, I/O ring', 'imm'], ['Power grid', 'rails and straps to every cell', 'f3'], ['Placement', 'standard cells into rows', 'rs1'], ['Clock tree synthesis', 'balanced clock to every flop', 'rs2'], ['Routing', 'metal wires on many layers', 'op'], ['Sign-off', 'timing at all corners, DRC, LVS, IR drop', 'f7'], ['GDSII to the foundry', 'tapeout', 'rd']] } },
        { t: 'learn', h: 'Corners', body: 'Transistors vary with **process**, **voltage** and **temperature** (PVT). Timing must pass at every corner: setup is usually tightest at the slow corner, hold at the fast one.' },
        { t: 'order', q: 'Order the physical design steps.', items: ['Floorplan', 'Power grid', 'Placement', 'Clock tree synthesis', 'Routing', 'Sign-off'], why: 'Each step needs the previous one’s result.' },
        { t: 'mcq', q: 'What does LVS check?', opts: ['The layout’s transistors and connections match the netlist', 'The layout obeys spacing rules', 'Timing at all corners', 'Power consumption'], a: 0, why: 'Layout versus schematic.' },
        { t: 'mcq', q: 'What does DRC check?', opts: ['The geometry obeys the foundry’s manufacturing rules', 'The logic is correct', 'The clock is balanced', 'The chip boots'], a: 0, why: 'Minimum widths, spacings, densities: rules the fab needs to build it.' },
        { t: 'mcq', q: 'Why is the clock tree built after placement?', opts: ['It must reach every placed flip-flop with balanced delay', 'Clocks are not needed before routing', 'It is cheaper', 'The foundry requires it'], a: 0, why: 'Skew between flops eats into the timing budget, so the tree is built around where they ended up.' },
        { t: 'tf', q: 'Large SRAM macros are placed during floorplanning, before the standard cells.', a: true, why: 'They are big, fixed blocks, and everything else flows around them.' }
      ]
    },
    {
      id: 'u18l6', title: 'Fab, test and bring-up', items: [
        { t: 'learn', h: 'Making and testing the chip', body: 'The foundry makes masks and processes wafers for weeks to months. Each die is tested on the wafer, packaged, and tested again.\n\n**Yield** falls with die area. A simple model: Y = e^(−D₀·A), with D₀ defects per cm² and A the die area in cm².\n\n**Design for test**: in test mode the flip-flops link into **scan chains**, so a tester can shift in a state, clock once and shift out the result. **MBIST** engines test SRAMs.' },
        { t: 'learn', h: 'Power', body: 'Dynamic power is **P = α·C·V²·f**: activity, switched capacitance, voltage squared, frequency. **Clock gating** cuts α in idle blocks, **power gating** removes leakage, and **DVFS** lowers voltage and frequency together, which pays off quadratically.' },
        { t: 'num', q: 'D₀ = 0.1 defects/cm², die area 1 cm². What is the yield? (%)', a: 90.5, tol: 0.3, unit: '%', why: 'e^(−0.1) ≈ 0.905: about 90 % of dies work.' },
        { t: 'num', q: 'A core uses 2 W at 1.0 V. You lower the voltage to 0.8 V at the same frequency. How many watts now?', a: 1.28, tol: 0.01, unit: 'W', why: '2 × 0.8² = 1.28 W. Voltage is the strongest lever.' },
        { t: 'mcq', q: 'What do scan chains let a tester do?', opts: ['Shift known values into every flip-flop, clock once, and shift the results out', 'Measure the clock frequency', 'Program the boot ROM', 'Read the device tree'], a: 0, why: 'Automatic pattern generation then finds stuck wires and other manufacturing defects.' },
        { t: 'order', q: 'First silicon is back. Order the bring-up steps.', items: ['Check power, clocks and reset', 'Talk to the Debug Module over JTAG', 'Run code from the boot ROM', 'Train DRAM', 'Boot firmware', 'Boot Linux'], why: 'Each step uses the one before it as a stable foundation.' },
        { t: 'tf', q: 'A smaller die gives more dies per wafer and a higher yield.', a: true, why: 'Both effects lower the cost of each good chip.' }
      ]
    }
  ]
});

TAPEOUT.glossary.push(
  ['Trap frame', 'Saved registers of the interrupted context (Linux: struct pt_regs).'], ['System call', 'A request from U-mode to the kernel via ecall; number in a7.'],
  ['errno', 'Error number; Linux returns −errno in a0.'], ['EFAULT', 'Error: a bad address was passed to the kernel.'],
  ['Address space', 'A process’s view of memory, defined by its page table.'], ['ASID', 'Address-space ID that tags TLB entries.'],
  ['Copy-on-write', 'Pages shared read-only after fork and copied on the first write.'], ['ELF', 'Executable and Linkable Format for programs and objects.'],

    const accs = App.order.map(l => lessonState(l.id)).filter(x => x && x.done && x.best !== undefined).map(x => x.best);
    const avg = accs.length ? accs.reduce((a, b) => a + b, 0) / accs.length : 0;
    wrap.appendChild(h('div', { class: 'section-title' }, h('h2', null, 'Progress'), h('span', { class: 'tag brand' }, 'Level ' + lv.lvl)));
    wrap.appendChild(h('div', { class: 'panel' },

    wrap.appendChild(h('h3', { style: { margin: '22px 0 10px', fontSize: '17px' } }, 'Badges'));
    const ids = ['first', 'perfect', 'streak3', 'streak7', 'xp1000', 'xp5000', 'hardware', 'firmware', 'tapeout'].concat(App.units.map(u => 'unit:' + u.id));

  /* ---------------- boot ---------------- */
  function start(data) {
    Store.load();
    indexCourse();
    buildShell(document.getElementById('app'));
    let tab = (data && data.tab) || 'learn';
    const hash = (location.hash || '').slice(1);
    if (['learn', 'lab', 'practice', 'ref', 'me'].includes(hash)) tab = hash;
    else if (T.labs[hash]) { tab = 'lab'; App.labId = hash; }
    if (data && data.lab) App.labId = data.lab;
    go(tab, App.labId);
    Store.on(() => { renderTop(); if (!App.player && (App.tab === 'learn' || App.tab === 'me' || App.tab === 'practice')) render(); });
    Store.initRemote();
    if (data && data.lesson && App.lessons[data.lesson]) openLesson(data.lesson);
  }
  const hot = G.claude && G.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ tab: App.tab, lab: App.labId, lesson: App.player && App.player.cfg.kind === 'lesson' ? App.player.cfg.id : null })); } catch (e) { /* ignore */ }
  const boot = () => { if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {}); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);
