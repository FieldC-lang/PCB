#define STR(x) #x
#define XSTR(x) STR(x)
#define SHOW(e) printf(#e " = %d\n", (e))
int main(void)
{
    printf("%s %s\n", STR(N), XSTR(N));
    SHOW(N * 2);
    return 0;
}`, 'N 16\nN * 2 = 32', ['16 16 ⏎ 32 = 32', 'N N ⏎ N * 2 = 32', 'N 16 ⏎ 16 * 2 = 32'], 'STR stringises the token N before expansion; XSTR expands N to 16 first. #e uses the argument as written.'),
        { t: 'mcq', tag: 'Spot the bug', q: '`if (x) SWAP2(a, b); else y = 0;` fails to compile with this macro. Why?', viz: code(C`#define SWAP2(a, b) { int t = a; a = b; b = t; }`), opts: ['the `;` after the `}` ends the if, leaving a stray else', 'macros cannot contain braces', 't is not declared', 'a and b need brackets only'], a: 0, why: 'The expansion is `if (x) { … }; else …`. Wrapping it in `do { … } while (0)` makes the trailing ; part of one statement.' },
        { t: 'tf', q: '`static inline int sq(int x) { return x * x; }` evaluates `sq(i++)` safely, incrementing i once.', a: true, why: 'A function evaluates each argument once. At -O2 the call is inlined anyway, so there is no speed cost.' }
      ]
    },
    {
      id: 'u11l2', title: 'Conditional compilation and include guards', ref: REF.pre,
      items: [
        { t: 'learn', h: '#if, #ifdef and guards', body: '`#if`, `#ifdef`, `#ifndef`, `#elif`, `#else` and `#endif` keep or drop lines of text before compiling. Uses:\n\n- **Configuration**: `#ifdef DEBUG` … set from the command line with `gcc -DDEBUG` or `-DLEVEL=2`.\n- **Platform**: compilers predefine macros. `__arm__` is defined for 32-bit ARM, `__aarch64__` for 64-bit ARM, `__x86_64__` for x86-64. List them all with `gcc -dM -E - < /dev/null`.\n- **Include guards**: every header starts with `#ifndef UART_H` / `#define UART_H` and ends with `#endif`, so including it twice pastes it only once. `#pragma once` does the same in all major compilers.\n\n`#error` stops the build with a message, useful for unsupported configurations.', viz: code(C`#ifndef UART_H
#define UART_H

#include <stdint.h>

#if defined(__arm__)
#  define CPU "arm"
#elif defined(__x86_64__)
#  define CPU "x86-64"
#else
#  error "unsupported CPU"
#endif

void uart_putc(char c);

#endif /* UART_H */`, 'uart.h') },
        { t: 'order', q: 'Order the lines of an include-guarded header.', items: ['`#ifndef BITS_H`', '`#define BITS_H`', '`uint32_t popcount32(uint32_t x);`', '`#endif`'], why: 'On the second include BITS_H is already defined, so everything up to #endif is skipped.' },
        { t: 'mcq', q: 'How do you define DEBUG as 1 without editing the source?', opts: ['`gcc -DDEBUG ...`', '`gcc -debug ...`', '`gcc -I DEBUG ...`', '`gcc -include DEBUG ...`'], a: 0, why: '-DNAME defines it as 1; -DNAME=value sets a value; -UNAME undefines it.' },
        P('Compiled with plain `gcc` on an x86-64 PC (no -D flags), what does this print?', C`#define LEVEL 2
int main(void)
{
#if LEVEL > 1 && defined(__x86_64__)
    puts("verbose x86");
#elif LEVEL > 1
    puts("verbose");
#else
    puts("quiet");
#endif
    return 0;
}`, 'verbose x86', ['verbose', 'quiet', 'verbose x86 ⏎ verbose'], 'LEVEL is 2 and __x86_64__ is predefined, so only the first branch is kept. Built with arm-linux-gnueabihf-gcc it would print verbose.')
      ]
    },
    {
      id: 'u11l3', title: 'X-macros', ref: REF.pre,
      items: [
        { t: 'learn', h: 'One list, many tables', body: 'You often need several things generated from the same list: an enum of error codes, a table of their names and a table of messages. Keep them in separate places and they drift apart.\n\nAn **X-macro** writes the list once as calls to a macro named X that is not yet defined. Each use defines X to pick out what it needs, expands the list, and undefines X.\n\nWalk through the example: with `#define X(name, msg) name,` the list expands to `E_OK, E_RANGE, E_IO,`, the enum. With `#define X(name, msg) #name,` it expands to `"E_OK", "E_RANGE", "E_IO",`, the name table. Add a line to ERRORS and every table grows together.\n\nThe same trick builds register tables, opcode decoders and command dispatchers.', viz: code(C`#define ERRORS \
    X(E_OK,    "no error")      \
    X(E_RANGE, "out of range")  \
    X(E_IO,    "I/O failed")

#define X(name, msg) name,
enum err { ERRORS E_COUNT };
#undef X

#define X(name, msg) #name,
static const char *err_name[] = { ERRORS };
#undef X

#define X(name, msg) msg,
static const char *err_msg[] = { ERRORS };
#undef X`) },
        P('Using the definitions on the card, what does this print?', C`#define ERRORS \
    X(E_OK,    "no error")      \
    X(E_RANGE, "out of range")  \
    X(E_IO,    "I/O failed")
#define X(name, msg) name,
enum err { ERRORS E_COUNT };
#undef X
#define X(name, msg) #name,
static const char *err_name[] = { ERRORS };
#undef X
#define X(name, msg) msg,
static const char *err_msg[] = { ERRORS };
#undef X
int main(void)
{
    printf("%d %s: %s\n", E_COUNT, err_name[E_IO], err_msg[E_RANGE]);
    return 0;
}`, '3 E_IO: out of range', ['2 E_IO: out of range', '3 E_IO: I/O failed', '3 2: out of range'], 'The enum gets E_OK = 0, E_RANGE = 1, E_IO = 2 and E_COUNT = 3. err_name[2] is "E_IO" and err_msg[1] is "out of range".'),
        { t: 'fill', q: 'Define X so the list expands to a table of `{code, "name"}` pairs.', text: '#define X(name, msg) { ___, ___ },', blanks: ['name', '#name'], extra: ['msg', '##name', '"name"'], why: 'name expands to the enum constant and #name to its spelling as a string.' },
        { t: 'tf', q: 'X-macros guarantee the enum and the name table always have the same number of entries.', a: true, why: 'Both are generated from the one list. E_COUNT at the end gives the count for free.' }
      ]
    }
  ]
});

CRAFT.units.push({
  id: 'u12', n: 12, track: 'build', tone: 'f7', title: 'Multi-file programs and Makefiles',
  blurb: 'Splitting a program into .c and .h files, how the linker joins them, static libraries with ar, and Makefiles that rebuild only what changed.',
  lessons: [
    {
      id: 'u12l1', title: 'Headers, sources and the linker', ref: REF.make,
      items: [
        { t: 'learn', h: 'Declare in the .h, define in the .c', body: 'Each .c file is compiled on its own into a .o (a **translation unit**). Files share things through **declarations** in a header:\n\n- The header has prototypes, types, macros and `extern` declarations; never definitions of functions or variables (or every file that includes it would define them).\n- Exactly one .c file defines each function and global.\n- The .c that implements a header includes it too, so the compiler checks that the definitions match the declarations.\n\nBuild each file separately, then link: `gcc -c bits.c`, `gcc -c main.c`, `gcc -o app main.o bits.o`. Changing bits.c only needs bits.o rebuilt and a re-link.\n\nLinker errors read differently from compiler errors: **undefined reference** means no object defined the symbol; **multiple definition** means two did (often a variable defined in a header).', viz: files([['bits.h', C`#ifndef BITS_H
#define BITS_H
#include <stdint.h>
extern unsigned bits_calls;          /* declared here ... */
unsigned popcount32(uint32_t x);
#endif`], ['bits.c', C`#include "bits.h"
unsigned bits_calls;                 /* ... defined once, here */
unsigned popcount32(uint32_t x)
{
    unsigned n = 0;
    bits_calls++;
    while (x) { x &= x - 1; n++; }
    return n;
}`], ['main.c', C`#include <stdio.h>
#include "bits.h"
int main(void)
{
    unsigned n = popcount32(0xF0F0u);
    printf("%u %u\n", n, bits_calls);
    return 0;
}`]]) },
        { t: 'mcq', q: 'Linking the files on the card, what does the program print?', opts: ['`8 1`', '`8 0`', '`16 1`', 'a multiple-definition error'], a: 0, why: '0xF0F0 has two F nibbles: 8 set bits. The function ran once, so bits_calls (defined in bits.c, declared extern in bits.h) is 1. Calling first and printing after matters: argument evaluation order in C is unspecified.' },
        { t: 'match', q: 'Match each message to its cause.', pairs: [['undefined reference to `popcount32`', 'bits.o was not linked in'], ['multiple definition of `bits_calls`', 'the header defines the variable instead of declaring it extern'], ['implicit declaration of function', 'the header with the prototype was not included'], ['bits.h: No such file or directory', 'the include path is missing: add -I']], why: 'The first two come from the linker, the last two from the compiler (or the preprocessor).' },
        { t: 'order', q: 'Order the commands that build app from main.c and bits.c by hand.', items: ['`gcc -Wall -c bits.c`', '`gcc -Wall -c main.c`', '`gcc -o app main.o bits.o`', '`./app`'], why: 'The two -c steps can run in either order (or in parallel); linking needs both objects.' },
        { t: 'tf', q: 'Putting `static` in front of a helper function in bits.c stops main.c from calling it.', a: true, why: 'static gives it internal linkage: the symbol is not exported from bits.o, so the linker cannot resolve a reference to it from another file.' }
      ]
    },
    {
      id: 'u12l2', title: 'Static libraries', ref: REF.make,
      items: [
        { t: 'learn', h: 'An archive of object files', body: 'A **static library** (`libbits.a`) is just an archive of .o files made with `ar`:\n\n- `ar rcs libbits.a bits.o crc.o` (r: insert/replace, c: create, s: write an index).\n- `ar t libbits.a` lists the members; `nm libbits.a` shows their symbols.\n- Link with `gcc main.o -L. -lbits -o app`: `-L.` adds the current directory to the library search path and `-lbits` means libbits.a (or libbits.so).\n\nThe linker copies in only the members that resolve an undefined symbol. That is why **order matters**: the linker scans left to right, so a library must come **after** the objects that use it. `gcc -lbits main.o` fails with undefined references.\n\nA shared library (`.so`, built with `-shared -fPIC`) is instead loaded at run time and shared between programs.' },
        { t: 'order', q: 'Order the steps to build and use libbits.a.', items: ['`gcc -c bits.c crc.c`', '`ar rcs libbits.a bits.o crc.o`', '`gcc -c main.c`', '`gcc main.o -L. -lbits -o app`'], why: 'Compile the members, archive them, then link the library after the objects that need it.' },
        { t: 'mcq', q: '`gcc -L. -lbits main.o -o app` gives undefined reference to popcount32, but the library contains it. Why?', opts: ['the library was scanned before main.o needed anything from it: put -lbits after main.o', '-L. is wrong', 'ar needs the s flag', 'static libraries need -static'], a: 0, why: 'The GNU linker resolves in a single left-to-right pass over archives.' },
        { t: 'fill', q: 'Complete the command that names the library file for `-lcrc`.', text: 'ar rcs ___ crc.o', blanks: ['libcrc.a'], extra: ['crc.a', 'crc.lib', '-lcrc'], why: '-lNAME looks for libNAME.a (or libNAME.so).' }
      ]
    },
    {
      id: 'u12l3', title: 'Makefiles', ref: REF.make,
      items: [
        { t: 'learn', h: 'Targets, prerequisites and recipes', body: 'make rebuilds a **target** when any of its **prerequisites** is newer, by running the **recipe** below it. Recipe lines must start with a **tab**, not spaces (“missing separator” means spaces).\n\nThe automatic variables save typing:\n\n- `$@` is the target.\n- `$<` is the first prerequisite.\n- `$^` is all the prerequisites.\n\nA **pattern rule** `%.o: %.c` says how to make any .o from its .c. `.PHONY: clean` marks targets that are not files.\n\nWalk through it after you edit bits.c: make wants app, which needs main.o and bits.o; bits.o is older than bits.c, so it runs `gcc … -c bits.c -o bits.o`; main.o is up to date; then app is older than bits.o, so it links. Two commands instead of three.\n\nThe Makefile below cross-builds for ARM when you run `make CC=arm-linux-gnueabihf-gcc`, because command-line variables override the file.', viz: code(C`CC      ?= gcc
CFLAGS  := -Wall -Wextra -O2 -g
OBJS    := main.o bits.o start.o

app: $(OBJS)
	$(CC) $(CFLAGS) -o $@ $^

%.o: %.c bits.h
	$(CC) $(CFLAGS) -c $< -o $@

%.o: %.s
	$(CC) -c $< -o $@

.PHONY: clean
clean:
	rm -f app $(OBJS)`, 'Makefile', 'make') },
        { t: 'match', q: 'In the rule `app: main.o bits.o`, match each variable to its value.', pairs: [['`$@`', 'app'], ['`$<`', 'main.o'], ['`$^`', 'main.o bits.o']], why: '$< is only the first prerequisite. In a pattern rule %.o: %.c it is the .c file.' },
        { t: 'mcq', q: 'make says `Makefile:6: *** missing separator. Stop.` What is the usual cause?', opts: ['the recipe line is indented with spaces instead of a tab', 'a missing semicolon', 'CC is not set', 'the target name has a dot'], a: 0, why: 'Recipes must start with a literal tab character. Many editors convert tabs to spaces; turn that off for Makefiles.' },
        { t: 'tf', q: 'After `touch bits.h`, the Makefile on the card rebuilds main.o and bits.o.', a: true, why: 'Both .o files match %.o: %.c bits.h, so a newer bits.h makes both stale. Without bits.h in the rule, header changes would be missed; `-MMD -MP` can generate those dependencies automatically.' },
        { t: 'fill', q: 'Complete the pattern rule.', text: '%.o: %.c\n\t$(CC) $(CFLAGS) -c ___ -o ___', blanks: ['$<', '$@'], extra: ['$^', '$*', '$%'], why: 'Compile the source ($<) into the target ($@).' }
      ]
    }
  ]
});

const SUMSQ_S = C`        .text
        .global sum_sq
        .type   sum_sq, %function
@ int sum_sq(int n): returns square(1) + ... + square(n)
sum_sq:
        push    {r4, r5, r6, lr}     @ save callee-saved regs and the return address
        mov     r4, r0               @ r4 = n      (survives the calls)
        mov     r5, #0               @ r5 = total
        mov     r6, #1               @ r6 = i
1:      cmp     r6, r4
        bgt     2f                   @ i > n: done
        mov     r0, r6               @ argument for square()
        bl      square               @ r0 = square(i); r0-r3, r12 may change
        add     r5, r5, r0
        add     r6, r6, #1
        b       1b
2:      mov     r0, r5               @ return total in r0
        pop     {r4, r5, r6, pc}     @ restore and return in one go
        .size   sum_sq, .-sum_sq`;
const SUMSQ_C = C`#include <stdio.h>

int sum_sq(int n);                 /* defined in sumsq.s */
int square(int x) { return x * x; }  /* called from sumsq.s */

int main(void)
{
    printf("%d\n", sum_sq(4));
    return 0;
}`;
const MAX3_S = C`        .text
        .global max3
        .type   max3, %function
@ int max3(int a, int b, int c)   a in r0, b in r1, c in r2
max3:
        cmp     r0, r1
        movlt   r0, r1               @ if a < b: r0 = b
        cmp     r0, r2
        movlt   r0, r2               @ if r0 < c: r0 = c
        bx      lr
        .size   max3, .-max3

        .global sum5
        .type   sum5, %function
@ int sum5(int a, int b, int c, int d, int e)   e is on the stack at [sp]
sum5:
        add     r0, r0, r1
        add     r0, r0, r2
        add     r0, r0, r3
        ldr     r12, [sp]            @ 5th argument
        add     r0, r0, r12
        bx      lr
        .size   sum5, .-sum5`;
const MAX3_C = C`#include <stdio.h>

int max3(int a, int b, int c);
int sum5(int a, int b, int c, int d, int e);

int main(void)
{
    printf("%d %d %d\n", max3(3, 9, -2), max3(-5, -7, -6), sum5(1, 2, 3, 4, 5));
    return 0;
}`;
const INLINE_C = C`#include <stdio.h>
#include <stdint.h>

static inline uint32_t clz32(uint32_t x)
{
    uint32_t n;
    __asm__("clz %0, %1" : "=r"(n) : "r"(x));
    return n;
}

static inline uint32_t add_rot(uint32_t a, uint32_t b)
{
    uint32_t r;
    __asm__("add %0, %1, %2, ror #8" : "=r"(r) : "r"(a), "r"(b));
    return r;
}

int main(void)
{
    printf("%u %u %08X\n", clz32(1), clz32(0x00F00000u), add_rot(1, 0x000000FFu));
    return 0;
}`;
const X86_S = C`        .text
        .globl  add3
        .type   add3, @function
# long add3(long a, long b, long c)   a in rdi, b in rsi, c in rdx
add3:

CRAFT.units.push({
  id: 'u13', n: 13, track: 'asm', tone: 'rd', title: 'C with assembly',
  blurb: 'Link ARM .s files with C: the AAPCS calling convention, .global and .type, calling C back from assembly, the stack frame, inline asm, building with a cross compiler and running under qemu-arm, plus the x86-64 equivalents.',
  lessons: [
    {
      id: 'u13l1', title: 'The AAPCS contract', ref: REF.aapcs,
      items: [
        { t: 'learn', h: 'What C expects of your assembly', body: 'C and assembly can call each other because both follow the **procedure call standard** (AAPCS for 32-bit ARM). It fixes:\n\n- **Arguments**: the first four 32-bit arguments go in **r0–r3**; any more go on the stack, the 5th at [sp], the 6th at [sp, #4] on entry. A 64-bit argument takes an even/odd pair (r0:r1 or r2:r3).\n- **Result**: in **r0** (r0:r1 for 64-bit, low word in r0).\n- **Scratch (caller-saved)**: r0–r3 and r12 (ip). A function may trash them, so a caller that needs them across a call must save them.\n- **Callee-saved**: **r4–r11**, and sp. If your function uses them, push them first and pop them before returning.\n- **lr** (r14) holds the return address after `bl`. A function that calls another must save lr, because `bl` overwrites it.\n- **sp** must be **8-byte aligned** at every public call.\n\nWalk through a call to `sum5(1, 2, 3, 4, 5)`: the caller loads r0 = 1, r1 = 2, r2 = 3, r3 = 4, stores 5 at [sp] and does `bl sum5`. sum5 adds r0–r3 (10), loads [sp] (5), returns r0 = 15 with `bx lr`.', viz: { k: 'table', head: ['Register', 'Role', 'Preserved across a call?'], rows: [['r0–r3', 'arguments 1–4, result in r0 (r0:r1)', 'no'], ['r4–r11', 'variables', 'yes (callee saves)'], ['r12 (ip)', 'scratch, linker veneers', 'no'], ['r13 (sp)', 'stack pointer, 8-byte aligned', 'yes'], ['r14 (lr)', 'return address', 'no (bl overwrites it)'], ['r15 (pc)', 'program counter', '—']], cap: 'AAPCS register use for 32-bit ARM.' } },
        { t: 'match', q: 'For `int g(int a, int b, int c, int d, int e, int f)`, match each value to where it is passed.', pairs: [['a', 'r0'], ['d', 'r3'], ['e', '[sp] on entry'], ['f', '[sp, #4] on entry'], ['the return value', 'r0 again, once g returns']], why: 'Four in registers, the rest on the stack in order, the result in r0.' },
        { t: 'mcq', q: 'Your asm function uses r4 and r5 and calls printf. What must it push on entry?', opts: ['`push {r4, r5, r6, lr}` (r6 just keeps sp 8-byte aligned)', '`push {r0-r3}`', 'nothing: printf saves everything', '`push {r4, r5}`'], a: 0, why: 'r4 and r5 are callee-saved, so you must restore them for your caller; lr is overwritten by bl printf. An even number of registers keeps sp 8-byte aligned. Pop with `pop {r4, r5, r6, pc}` to return.' },
        { t: 'tf', q: 'After `bl square` returns, r4 still holds what you put there before the call.', a: true, why: 'square must preserve r4–r11. It is r0–r3 and r12 that you cannot trust after a call.' },
        { t: 'mcq', q: 'Where is a 64-bit result like `uint64_t mul64(uint32_t, uint32_t)` returned?', opts: ['r0 (low word) and r1 (high word)', 'r0 only, truncated', 'r1 (low) and r0 (high)', 'on the stack'], a: 0, why: '`umull r0, r1, r0, r1` computes exactly that pair in one instruction.' }
      ]
    },
    {
      id: 'u13l2', title: 'Calling a .s function from C', ref: REF.aapcs + ' ' + REF.gcc,
      items: [
        { t: 'learn', h: 'Three directives and a prototype', body: 'To make an assembly function callable from C:\n\n- `.global max3` exports the symbol so the linker can see it (without it, the label is local to the .s file, like a static function).\n- `.type max3, %function` marks it as code, so the linker handles ARM/Thumb interworking and debuggers show it as a function. (x86 writes `@function`; on ARM `@` starts a comment, hence `%`.)\n- `.size max3, .-max3` records its length for tools like nm and gdb.\n\nOn the C side, a **prototype** (`int max3(int, int, int);`) tells the compiler how to pass the arguments. The C file never sees the .s; the linker joins them by name.\n\nWalk through `max3(3, 9, -2)`: r0 = 3, r1 = 9, r2 = −2. `cmp r0, r1` sets flags for 3 − 9 (negative), so `movlt` copies 9 into r0. `cmp r0, r2` compares 9 with −2: not less, so r0 stays 9. Return 9.\n\nBuild and run both together:', viz: ASM([['max3.s', MAX3_S, 'asm'], ['main.c', MAX3_C, 'c']], '9 -5 15') },
        { t: 'learn', h: 'Build it, run it on your PC', body: 'You do not need an ARM board. On Debian or Ubuntu: `sudo apt install gcc-arm-linux-gnueabihf qemu-user`.\n\n- `arm-linux-gnueabihf-gcc -marm -O2 -o max3 main.c max3.s` (gcc passes .s files to the assembler; use `.S` with a capital S if you want the C preprocessor to run on it first).\n- Run it with `qemu-arm -L /usr/arm-linux-gnueabihf ./max3`. -L tells qemu where the ARM C library lives. Or link with `-static` and just run `qemu-arm ./max3` (on many systems binfmt even lets you type `./max3`).\n- Debug it: `qemu-arm -g 1234 ./max3` waits for `gdb-multiarch ./max3` and `target remote :1234`.\n\nCheck what you built with `file max3`: “ELF 32-bit LSB executable, ARM, EABI5”.', viz: term(C`$ arm-linux-gnueabihf-gcc -marm -O2 -static -o max3 main.c max3.s
$ file max3
max3: ELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), statically linked, ...
$ qemu-arm ./max3
9 -5 15`) },
        { t: 'mcq', q: 'For `max3(-5, -7, -6)`, what does max3 return?', opts: ['-5', '-6', '-7', '0'], a: 0, hint: 'movlt is a signed comparison: lt means N ≠ V.', why: 'cmp −5, −7: not less, r0 stays −5. cmp −5, −6: not less. Result −5. (With `movlo`, an unsigned condition, the answer would be wrong for negatives.)' },
        { t: 'mcq', tag: 'Spot the bug', q: 'Linking gives `undefined reference to max3`, but max3.s was assembled. What is missing from it?', viz: code(C`        .text
max3:   cmp     r0, r1
        movlt   r0, r1
        cmp     r0, r2
        movlt   r0, r2
        bx      lr`, '', 'asm'), opts: ['`.global max3`, so the symbol is exported', '`.data`', 'a `main` label', '`push {lr}`'], a: 0, why: 'Without .global the label stays local to the object file. nm max3.o would show it as lowercase t.' },
        { t: 'order', q: 'Order the lines of a minimal exported asm function returning its argument plus 1.', items: ['`.text`', '`.global inc`', '`.type inc, %function`', '`inc: add r0, r0, #1`', '`bx lr`'], why: 'Directives first, then the label and the body. bx lr returns to the caller (and switches to Thumb state if the caller was Thumb).' },

        { t: 'learn', h: 'The compiler may assume it never happens', body: 'The standard lists operations whose result is **undefined**: anything may happen, including “seems to work”. The optimiser relies on this: it assumes UB never happens and simplifies code on that basis.\n\nWalk through the classic: `int x; … if (x + 1 < x) overflow();`. Signed overflow is UB, so the compiler reasons x + 1 is always greater than x and **deletes the test**. With unsigned (which wraps) or `__builtin_add_overflow` the check works.\n\nThe usual ones:\n\n- signed overflow; shifting by ≥ the width or by a negative amount; shifting a negative value left\n- out-of-bounds array access; use after free; double free\n- dereferencing NULL or a misaligned pointer\n- reading an uninitialised local\n- modifying a variable twice between sequence points: `i = i++ + 1;`\n- breaking strict aliasing; modifying a string literal; a missing return value that is used\n\n**Implementation-defined** is different: the platform chooses and documents it (the size of long, whether char is signed, >> on negative values).' },

CRAFT.units.push({

  blurb: 'Talking to hardware from C: register addresses, volatile, struct overlays, read-modify-write of fields, write-one-to-clear bits, barriers and interrupt-shared flags.',
  lessons: [

      items: [
        { t: 'learn', h: 'Hardware that looks like memory', body: 'On a microcontroller or SoC, peripherals appear at fixed **addresses**: storing a word at the UART’s data register sends a byte; loading its status register reads live flags. In asm that is just `ldr` and `str`; in C it is a pointer, and it **must** be volatile so every access really happens, in order.\n\nTake an imaginary UART at **0x4000C000** with three 32-bit registers: DR (data) at +0, SR (status) at +4, CR (control) at +8.\n\n- One style: `#define UART_SR (*(volatile uint32_t *)0x4000C004u)` then `while (!(UART_SR & TXE)) ;`.\n- The cleaner style **overlays a struct** on the block: each member is a register, so the offsets come from the layout, which you can check with offsetof and `_Static_assert`.\n\nWalk through sending one byte: wait until SR bit 7 (TXE, transmit empty) is set, then write the byte to DR. The volatile read is repeated each loop iteration; without volatile, -O2 may read SR once and spin forever.', viz: { k: 'stackfig', items: [code(C`typedef struct {

    volatile uint32_t SR;    /* +0x4 status  */
    volatile uint32_t CR;    /* +0x8 control */
} uart_t;
_Static_assert(offsetof(uart_t, CR) == 8, "layout");

#define UART0   ((uart_t *)0x4000C000u)
#define SR_TXE  (1u << 7)

void uart_putc(char c)
{
    while (!(UART0->SR & SR_TXE)) { }
    UART0->DR = (uint8_t)c;

        P('Simulating CR with a plain variable, what does this print?', C`volatile uint32_t CR = 0x00000301u;

uint32_t a = CR;
CR |= 1u << 4;
CR &= ~1u;
printf("%03X %03X %u\n", a, CR, (CR & BAUD_MASK) >> BAUD_SHIFT);`, '201 210 2', ['301 210 2', '201 211 2', '201 210 3'], 'Field set gives 0x201. Then set bit 4 (0x211) and clear bit 0 (0x210). Reading the field back: 2.'),
        { t: 'bits', n: 16, q: 'Set CR bits 9–8 (BAUD) to 3, and set bit 4 (EN). Everything else 0. Toggle the bits.', a: 0x0310, hint: 'Build it from the field values: 3 << 8, then 1 << 4.', why: '0x300 | 0x010 = 0x310.' },
        { t: 'mcq', tag: 'Spot the bug', q: 'SR has write-1-to-clear flags RXNE (bit 5) and OVR (bit 3). What does this line really do?', viz: code(C`UART0->SR |= SR_OVR;   /* meant: clear only OVR */`), opts: ['reads every set flag and writes them all back as 1s, clearing RXNE too', 'clears only OVR', 'sets OVR', 'nothing'], a: 0, why: 'Write just the bit: `UART0->SR = SR_OVR;`.' },

        { t: 'tf', q: 'Making count volatile fixes the race on `count++`.', a: false, why: 'volatile makes each load and store happen, but they are still separate. It fixes stale reads, not lost updates.' },
        { t: 'mcq', q: 'Which C11 call increments a shared counter atomically?', opts: ['`atomic_fetch_add(&count, 1);` with `_Atomic unsigned count;`', '`count += 1;` with volatile', '`__builtin_clz(count)`', '`count = count + 1;` in a loop'], a: 0, why: 'On ARMv7 it becomes an ldrex / add / strex loop that retries if anything interrupted it.' }

  const field = (label, ctl) => h('label', { class: 'field' }, h('span', null, label), ctl);

    const nIn = input('lab-n', n, v => { const k = parseInt(v, 10); if (k >= 0 && k <= 31) n = k; }, { label: 'n' });
    const xIn = input('lab-x', '0xB4', v => { const k = Number(v.trim()); if (Number.isFinite(k)) { x = k >>> 0; draw(); } }, { label: 'value' });
    ctl.appendChild(h('div', { class: 'row', style: { gap: '10px', flexWrap: 'wrap' } }, field('x = (dec, 0x hex or 0b bin)', xIn), field('n', nIn)));
    ctl.appendChild(h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap' } },
      btn('x << n', () => apply('x << ' + n, v => v << n)),
      btn('x >> n (unsigned)', () => apply('x >> ' + n, v => v >>> n)),
      btn('(int32_t)x >> n', () => apply('(int32_t)x >> ' + n, v => v >> n)),
      btn('rotr n', () => apply('rotr(x, ' + n + ')', v => (v >>> n) | (v << ((32 - n) & 31)))),
      btn('~x', () => apply('~x', v => ~v)),
      btn('-x', () => apply('-x', v => -v)),
      btn('x & (x - 1)', () => apply('x & (x - 1)', v => v & (v - 1))),
      btn('x & -x', () => apply('x & -x', v => v & -v)),
      btn('bswap', () => apply('__builtin_bswap32(x)', v => ((v & 0xFF) << 24) | ((v & 0xFF00) << 8) | ((v >>> 8) & 0xFF00) | (v >>> 24))),
      btn('clear', () => { hist = []; x = 0; draw(); })));
    body.appendChild(ctl); body.appendChild(out); draw();
  });

  lab('bases', 'Base converter', 'num', 'Type a number in decimal, hex, binary or as a signed byte, halfword or word, and watch the other forms update, nibble by nibble.', body => {
    let v = 0x2A, w = 8;
    const out = h('div', { class: 'stack' });
    const ins = {};
    const mask = () => w === 32 ? 0xFFFFFFFF : (1 << w) - 1;
    const set = (k, from) => { v = k & mask(); v >>>= 0; Object.keys(ins).forEach(id => { if (id !== from) ins[id].value = fmt(id); }); draw(); };
    const signed = () => (w === 32 ? v | 0 : (v & (1 << (w - 1)) ? v - (1 << w) : v));
    const fmt = id => id === 'dec' ? String(v) : id === 'hex' ? v.toString(16).toUpperCase() : id === 'bin' ? v.toString(2).padStart(w, '0') : String(signed());
    const parse = { dec: s => /^\d+$/.test(s) ? Number(s) : NaN, hex: s => /^(0x)?[0-9a-f]+$/i.test(s) ? parseInt(s.replace(/^0x/i, ''), 16) : NaN, bin: s => /^(0b)?[01 ]+$/.test(s) ? parseInt(s.replace(/^0b|\s/g, ''), 2) : NaN, sgn: s => /^-?\d+$/.test(s) ? Number(s) : NaN };
    const draw = () => {
      U.clear(out);
      const nib = [];
      for (let i = w / 4 - 1; i >= 0; i--) { const d = (v >>> (4 * i)) & 15; nib.push(d.toString(16).toUpperCase() + ' = ' + d.toString(2).padStart(4, '0') + ' = ' + d); }
      out.appendChild(V.figure(V.cbits({ n: w, rows: [{ label: 'value', v }] })));
      out.appendChild(h('pre', { class: 'term' }, 'nibbles, high to low:\n' + nib.join('\n') + '\n\nC: ' + (w === 8 ? 'uint8_t' : w === 16 ? 'uint16_t' : 'uint32_t') + ' x = 0x' + fmt('hex') + ';   /* ' + v + ', as signed ' + signed() + ' */'));
    };
    const wSeg = seg([[8, '8-bit'], [16, '16-bit'], [32, '32-bit']], w, k => { w = k; set(v, null); }, 'width');
    [['dec', 'unsigned decimal'], ['hex', 'hex'], ['bin', 'binary'], ['sgn', 'signed (two’s complement)']].forEach(([id, label]) => {
      ins[id] = input('cv-' + id, '', s => { const k = parse[id](s.trim()); if (Number.isFinite(k)) set(id === 'sgn' && k < 0 ? k + (w === 32 ? 4294967296 : (1 << w)) : k, id); }, { label });
    });
    body.appendChild(h('div', { class: 'stack' }, wSeg, h('div', { class: 'sl-grid' }, ...Object.entries(ins).map(([id, el]) => field(el.getAttribute('aria-label'), el))), out));
    set(v, null);
  });

  lab('packer', 'Struct packer', 'mem', 'Build a struct from C types, see every byte of padding the ABI adds, then sort the members largest-first and watch sizeof shrink.', body => {
    const TYPES = [['char', 1], ['short', 2], ['int', 4], ['float', 4], ['double', 8], ['int64_t', 8], ['void *', 8]];
    let members = [['char', 1], ['double', 8], ['short', 2], ['int', 4], ['char', 1]];
    const out = h('div', { class: 'stack' }), list = h('div', { class: 'chips' });
    const layout = ms => {
      let off = 0, mx = 1; const fields = [];
      ms.forEach(([t, sz], i) => { off = Math.ceil(off / sz) * sz; fields.push({ name: String.fromCharCode(97 + i), off, size: sz, t }); off += sz; mx = Math.max(mx, sz); });
      return { fields, size: Math.max(1, Math.ceil(off / mx) * mx), used: ms.reduce((a, m) => a + m[1], 0) };
    };
    const draw = () => {
      U.clear(out); U.clear(list);
      members.forEach(([t], i) => { const b = h('button', { type: 'button', 'aria-label': 'remove ' + t }, t + ' ' + String.fromCharCode(97 + i) + ' ✕'); b.addEventListener('click', () => { members.splice(i, 1); draw(); }); list.appendChild(b); });
      if (!members.length) { out.appendChild(h('div', { class: 'faint' }, 'Add a member to start.')); return; }
      const L = layout(members);
      out.appendChild(h('pre', { class: 'term' }, 'struct s {\n' + L.fields.map(f => '    ' + f.t.padEnd(8) + ' ' + f.name + ';   /* offset ' + f.off + ' */').join('\n') + '\n};   /* sizeof = ' + L.size + ' */'));
      out.appendChild(V.figure(V.layout({ fields: L.fields, size: L.size, cols: 8 }), 'x86-64 / LP64 layout. Hatched bytes are padding.'));
      out.appendChild(stats(stat('sizeof', L.size), stat('data bytes', L.used), stat('padding', L.size - L.used)));
    };
    const add = h('div', { class: 'row', style: { gap: '6px', flexWrap: 'wrap' } }, ...TYPES.map(t => btn('+ ' + t[0], () => { if (members.length < 10) { members.push(t.slice()); draw(); } })),
      btn('sort largest first', () => { members.sort((a, b) => b[1] - a[1]); draw(); }));
    body.appendChild(h('div', { class: 'stack' }, add, list, out)); draw();
  });
})(CG);
