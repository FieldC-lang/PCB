<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Coursewright</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn to build a learning app like this one by hand: how people learn, HTML, CSS and JavaScript, the lesson engine, pictures from code, practice generators, testing, the one-file build, an Android app without Gradle, and publishing on the web, Google Play and F-Droid, in short, visual exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
/* base.css — layout and components shared by every course: one mobile-first column that widens on tablets
   and PCs, a lesson path, a bottom tab bar and a full-screen lesson player. Colours and display fonts come
   from each course's theme.css (tokens only); sizes scale with the Display setting (CSS zoom on body). */
:root {
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --nav-h: 62px;
  --zoom: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--line-2); padding: .05em .35em; border-radius: 5px; white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--brand); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

/* field colour chips */
.fc { font-family: var(--font-mono); font-size: .85em; padding: .05em .4em; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.fc-op { background: var(--f-op-2); color: var(--f-op); } .fc-rd { background: var(--f-rd-2); color: var(--f-rd); }
.fc-f3 { background: var(--f-f3-2); color: var(--f-f3); } .fc-rs1 { background: var(--f-rs1-2); color: var(--f-rs1); }
.fc-rs2 { background: var(--f-rs2-2); color: var(--f-rs2); } .fc-f7 { background: var(--f-f7-2); color: var(--f-f7); }
.fc-imm { background: var(--f-imm-2); color: var(--f-imm); }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.brand-mark { width: 26px; height: 26px; }
.brand small { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; margin-left: 2px; }
.top-stats { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line-2); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill.gold { color: var(--gold); }
.pill.hot { color: var(--f-f3); }
.main {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"] svg { filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--brand) 40%, transparent)); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); font-weight: 700; letter-spacing: .01em;
  box-shadow: 0 2px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, background .15s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.btn.primary:active { box-shadow: 0 0 0 transparent; }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.btn.ok { background: var(--ok); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--ok) 55%, #000); }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 55%, #000); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.iconbtn svg { width: 22px; height: 22px; }

/* ---------- learn path ---------- */
.hello { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.goal-ring { width: 54px; height: 54px; flex: none; }
.hello h1 { font-size: 22px; }
.unit { margin: 0 0 30px; }
.unit-head {
  position: relative; border-radius: 16px; padding: 16px 16px 14px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow);
}
.unit-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--uc); }
.unit-head .eyebrow { color: var(--uc); }
.unit-head h2 { font-size: 21px; margin: 4px 0 4px; }
.unit-head p { color: var(--ink-2); font-size: 14px; max-width: 60ch; }
.unit-meter { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }
.die-stamp { position: absolute; right: 12px; top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-align: right; line-height: 1.3; }
.path { position: relative; margin: 6px auto 0; width: 100%; max-width: 360px; }
.path svg.trace { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node-wrap { position: absolute; width: 136px; margin-left: -68px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.node {
  width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center;
  box-shadow: 0 4px 0 var(--line); transition: transform .1s; position: relative; color: var(--ink-3);
}
.node svg { width: 28px; height: 28px; }
.node:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.node.done { background: var(--gold); border-color: transparent; color: var(--gold-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--gold) 55%, #000); }
.node.current { background: var(--brand); border-color: transparent; color: var(--brand-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 22px; border: 3px solid var(--brand); opacity: .5; animation: ring 1.8s ease-out infinite; }
.node.locked { opacity: .55; cursor: not-allowed; }
.node.check { width: 78px; border-radius: 20px; }
.node-label { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--ink-2); max-width: 136px; text-wrap: balance; }
.node-stars { display: flex; gap: 1px; height: 12px; }
.node-stars svg { width: 12px; height: 12px; color: var(--gold); }
.start-tip { position: absolute; top: -30px; background: var(--card); border: 2px solid var(--brand); color: var(--brand); font-weight: 800; font-size: 12px; padding: 2px 10px; border-radius: 8px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.p-top {
  flex: none; display: flex; align-items: center; gap: 10px; height: 56px; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-progress { flex: 1; height: 14px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.p-progress > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08), inset 0 3px 0 rgba(255,255,255,.35); }
.combo { font-family: var(--font-display); font-weight: 700; color: var(--f-f3); font-size: 15px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.p-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.p-body-in {
  max-width: 680px; margin: 0 auto; padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.p-foot {
  flex: none; border-top: 1px solid var(--line-2); background: var(--surface); position: relative;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.p-foot-in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.p-foot-in .btn { flex: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; transform: translateY(102%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid; max-height: calc(62vh / var(--zoom, 1)); overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.sheet.ok { background: var(--ok-2); border-color: var(--ok); }
.sheet.bad { background: var(--bad-2); border-color: var(--bad); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--ok); } .sheet.bad h3 { color: var(--bad); }
.sheet .why { color: var(--ink); font-size: 14.5px; }
.sheet .answer { font-size: 14px; color: var(--ink); }
.sheet .answer b { color: var(--bad); }
.kind-tag { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.qtext { font-size: 18px; font-weight: 700; line-height: 1.38; }
.qtext code { font-size: .86em; white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.learn h2 { font-size: 23px; }
.learn .body { font-size: 15.5px; color: var(--ink); display: flex; flex-direction: column; gap: 10px; }
.learn .body ul, .learn .body ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.learn .body ol li::marker { font-weight: 700; color: var(--brand); }
.body pre.code { margin: 2px 0; }
.spec {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.spec svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* ---------- exercise widgets ---------- */
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; min-height: 50px; padding: 11px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
  box-shadow: 0 3px 0 var(--line); font-size: 15px; display: flex; gap: 10px; align-items: center; line-height: 1.35;
}
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); font-family: var(--font-mono); }
.opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.opt[aria-pressed="true"] .k { border-color: var(--brand); color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt code { white-space: normal; overflow-wrap: anywhere; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 64px; }
.numwrap { display: flex; gap: 10px; align-items: center; }
.num {
  flex: 1; min-width: 0; height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px;
  font-family: var(--font-mono); font-size: 20px; font-weight: 500;
}
.num:focus { border-color: var(--brand); outline: none; }
.num.right { border-color: var(--ok); background: var(--ok-2); } .num.wrong { border-color: var(--bad); background: var(--bad-2); }
.unit-label { font-weight: 700; color: var(--ink-2); }
.bits { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bitgrp { display: flex; gap: 3px; }
.bit {
  width: 34px; height: 44px; border-radius: 9px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; display: grid; place-items: center; color: var(--ink-3); box-shadow: 0 3px 0 var(--line); position: relative;
}
.bit.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--brand) 55%, #000); }
.bit small { position: absolute; top: -17px; font-size: 10px; color: var(--ink-3); font-weight: 500; }
.bit.locked { opacity: .5; cursor: default; }
.bits.dense .bit { width: 22px; height: 34px; font-size: 14px; border-radius: 6px; }
.bits.dense .bit small { font-size: 9px; top: -15px; }
.bitval { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.chipbank, .slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slots { min-height: 56px; padding: 10px; border-radius: 12px; border: 2px dashed var(--line); background: var(--surface); }
.slots.vertical { flex-direction: column; }
.chip {
  border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14.5px;
  box-shadow: 0 3px 0 var(--line); text-align: left; line-height: 1.3;
}
.chip.used { visibility: hidden; }
.chip.placed { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.chip.right { border-color: var(--ok); background: var(--ok-2); box-shadow: 0 3px 0 var(--ok); }
.chip.wrong { border-color: var(--bad); background: var(--bad-2); box-shadow: 0 3px 0 var(--bad); }
.chip code { white-space: normal; }
.slot-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-size: 11px; margin-right: 6px; font-family: var(--font-mono); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 8px; }
.match .chip { width: 100%; min-height: 46px; }
.match .chip.sel { border-color: var(--brand); background: var(--brand-2); box-shadow: 0 3px 0 var(--brand); }
.match .chip.done { opacity: .35; border-color: var(--ok); cursor: default; }
.fill { font-size: 17px; line-height: 2.3; font-weight: 600; }
.blank { display: inline-flex; min-width: 70px; height: 36px; padding: 0 10px; align-items: center; justify-content: center; border-radius: 9px; border: 2px dashed var(--brand); background: var(--brand-2); color: var(--brand); font-family: var(--font-mono); font-size: 15px; vertical-align: middle; margin: 0 2px; }
.blank.empty { color: transparent; }
.blank.right { border-style: solid; border-color: var(--ok); background: var(--ok-2); color: var(--ok); }
.blank.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-2); color: var(--bad); }
.sig-list { display: flex; flex-direction: column; gap: 8px; }
.sig { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sig .nm { font-family: var(--font-mono); font-weight: 700; font-size: 13.5px; width: 76px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-weight: 700; font-size: 13.5px; font-family: var(--font-mono); color: var(--ink-2); border-right: 1px solid var(--line-2); min-height: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg.text button { font-family: var(--font-body); }
.seg.right { border-color: var(--ok); } .seg.wrong { border-color: var(--bad); }
.splitter { display: flex; flex-direction: column; gap: 10px; }
.split-ctl { display: flex; align-items: center; gap: 10px; }
.split-ctl .nm { width: 64px; font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.stepper button { width: 40px; height: 38px; border: 0; background: transparent; font-size: 20px; font-weight: 700; color: var(--ink-2); }
.stepper span { min-width: 40px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
.hotspot-hint { font-size: 13px; color: var(--ink-3); text-align: center; }

/* ---------- figures ---------- */
.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.fig-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; overflow-x: auto; }
.fig-box.flush { padding: 0; }
.fig svg { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; overflow: visible; }
.fig svg.wide { min-width: 340px; }
.fig figcaption { font-size: 13px; color: var(--ink-2); padding: 0 2px; }
.fig .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
.fig .readout { text-align: center; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.svg-hot { cursor: pointer; }
/* drawings set their colours inline, so the interaction states must win with !important */
.svg-hot:hover rect, .svg-hot:hover path, .svg-hot:hover circle, .svg-hot:hover polygon { stroke: var(--brand) !important; }
.svg-hot.picked rect, .svg-hot.picked path, .svg-hot.picked polygon, .svg-hot.picked circle { stroke: var(--brand) !important; stroke-width: 3 !important; }
.svg-hot.right rect, .svg-hot.right path, .svg-hot.right polygon, .svg-hot.right circle { stroke: var(--ok) !important; stroke-width: 3 !important; }
.svg-hot.wrong rect, .svg-hot.wrong path, .svg-hot.wrong polygon, .svg-hot.wrong circle { stroke: var(--bad) !important; stroke-width: 3 !important; }
.svg-hot.picked, .svg-hot.right, .svg-hot.wrong { opacity: 1 !important; }
.flow-dash { stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -11; } }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
table.t th { font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.mono, table.t td code { font-family: var(--font-mono); font-size: 12.5px; }

/* ---------- end screen ---------- */
.done-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px 16px; }

.done-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 420px; }
.tile { border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); padding: 10px 8px; }
.tile .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.tile.gold .v { color: var(--gold); } .tile.ok .v { color: var(--ok); } .tile.brand .v { color: var(--brand); }
.big-stars { display: flex; gap: 6px; }
.big-stars svg { width: 44px; height: 44px; color: var(--line); }
.big-stars svg.on { color: var(--gold); animation: pop .4s backwards; }

/* ---------- sections, cards ---------- */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 0 12px; }
.section-title h2 { font-size: 22px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow); min-width: 0;
}
button.card { text-align: left; cursor: pointer; }
.card h3 { font-size: 17px; }
.card .ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-2); color: var(--brand); flex: none; }
.card .ic svg { width: 22px; height: 22px; }
.card-row { display: flex; gap: 12px; align-items: center; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--line-2); color: var(--ink-2); letter-spacing: .02em; }
.tag.gold { background: var(--gold-2); color: var(--gold); }
.tag.ok { background: var(--ok-2); color: var(--ok); }
.tag.brand { background: var(--brand-2); color: var(--brand); }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-2); font-weight: 700; padding: 6px 0; margin-bottom: 6px; }
.back svg { width: 18px; height: 18px; }
.lab-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.lab-head h2 { font-size: 24px; }
.panel { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.build-list { display: grid; gap: 8px; }
@media (min-width: 760px) { .build-list { grid-template-columns: 1fr 1fr; } }
.build-item { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.build-item h4 { margin: 0; font-size: 15px; }
.bl-row { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.4; min-width: 0; }
.bl-k { flex: none; width: 46px; padding-top: 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.panel h3 { font-size: 15px; letter-spacing: .02em; }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ctrl-row label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
select.sel, input.txt {
  height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); padding: 0 10px; font-weight: 700; font-size: 14px; min-width: 0;
}
input.txt { font-family: var(--font-mono); font-weight: 500; }
textarea.code {
  width: 100%; min-height: 170px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 10px 12px;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.55; resize: vertical; white-space: pre; overflow-x: auto;
}
textarea.code:focus, select.sel:focus, input.txt:focus { border-color: var(--brand); outline: none; }
.err { color: var(--bad); font-size: 13px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 10px; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat.good .v { color: var(--ok); } .stat.warnc .v { color: var(--f-rs2); } .stat.badc .v { color: var(--bad); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border-left: 4px solid var(--line); }
.note.warn { border-left-color: var(--f-rs2); } .note.good { border-left-color: var(--ok); } .note.fix { border-left-color: var(--brand); } .note.info { border-left-color: var(--ink-3); }
.scrub { width: 100%; accent-color: var(--brand); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle input:checked + i { background: var(--brand); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { outline: 2px solid var(--brand); outline-offset: 2px; }
.setting { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.setting:last-child { border-bottom: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.badge .b { width: 62px; height: 62px; }
.badge.off { opacity: .4; filter: grayscale(1); }
.search { width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 0 14px; font-size: 15px; }
.search:focus { border-color: var(--brand); outline: none; }
.gloss dt { font-weight: 700; font-family: var(--font-display); font-size: 16px; }
.gloss dd { margin: 2px 0 12px; color: var(--ink-2); font-size: 14px; }
.reg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.reg { border-radius: 9px; padding: 6px 4px; text-align: center; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--font-mono); font-size: 12px; line-height: 1.25; min-width: 0; }
.reg b { display: block; font-size: 13px; }
.reg.changed { background: var(--gold-2); border-color: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s; z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 2px solid var(--bad); border-radius: 12px; background: var(--bad-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.cyclebar { display: flex; align-items: center; gap: 8px; }
.cyclebar .btn { min-height: 36px; padding: 0 10px; }
.timeline { display: flex; flex-wrap: wrap; gap: 3px; }
.timeline i { width: 16px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; font-family: var(--font-mono); }
.timeline i.ok { background: var(--ok-2); color: var(--ok); } .timeline i.no { background: var(--bad-2); color: var(--bad); }
.timeline i.cur { outline: 2px solid var(--brand); }

@media (min-width: 900px) {
  .main { max-width: 860px; }
  .topbar-in, .nav-in { max-width: 860px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.part-head { margin: 28px 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.part-head .eyebrow { color: var(--brand); font-size: 13px; }
.node-stars svg.off { color: var(--line); }
.console { background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; overflow-x: auto; min-height: 64px; max-height: 280px; overflow-y: auto; }
.console .cursor { display: inline-block; width: 8px; height: 15px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
pre.code { margin: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; max-height: 320px; tab-size: 4; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.pass { background: var(--ok-2); color: var(--ok); } .banner.fail { background: var(--bad-2); color: var(--bad); } .banner.info { background: var(--brand-2); color: var(--brand); } .banner.warn { background: var(--gold-2); color: var(--gold); }
.evlist { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); }
.ev .n { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); min-width: 44px; }
.ev .m { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.mode-M { background: var(--f-f3-2); color: var(--f-f3); } .mode-S { background: var(--f-rs1-2); color: var(--f-rs1); } .mode-U { background: var(--f-rd-2); color: var(--f-rd); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 9px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-2); color: var(--brand); }
.tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); font-weight: 700; }
.kv dd { margin: 0; font-family: var(--font-mono); }
.btn svg { width: 18px; height: 18px; flex: none; }
.sheet h3 svg { width: 24px; height: 24px; flex: none; }
.bits { padding-top: 16px; }
.fig pre.code { max-height: none; }
.hl-line { display: block; background: var(--gold-2); margin: 0 -12px; padding: 0 12px; }
.plain-line { display: block; }
/* program source under a firmware run */
.src-details { margin-top: 8px; }
.src-details > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--brand); padding: 6px 0; list-style-position: inside; }
.fig .src-details pre.code { max-height: 420px; overflow: auto; margin-top: 6px; }

/* ---------- lab widgets ---------- */
.stats.tight { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }

.stats.tight .stat .l { letter-spacing: .04em; }
.slider { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.studio-h { font-size: 18px; margin-top: 8px; }
.ev .m.ev-thermal { background: var(--gold-2); color: var(--gold); }
.ev .m.ev-error { background: var(--bad-2); color: var(--bad); }
.ref-figure { margin-top: 4px; }

@media (max-width: 440px) { .brand small { display: none; } .brand { font-size: 18px; } .multi .brand-name { font-size: 17px; } .top-stats { gap: 4px; } .top-stats .pill { padding: 0 8px; } }

/* ---------- display: size and full screen ---------- */
.view-panel {
  position: fixed; z-index: 95; top: calc(env(safe-area-inset-top, 0px) + 56px); right: max(10px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw / var(--zoom, 1) - 20px)); background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35); padding: 14px; display: flex; flex-direction: column; gap: 12px;
}

.p-top .p-view { flex: none; }
body.playing { overflow: hidden; }

/* ---------- course switcher (several courses in one app) ---------- */
.course-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.cs-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; text-align: left; padding: 9px 10px 10px;
  border-radius: 14px; border: 2px solid var(--line-2); background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--line-2);
}

.cs-top { display: flex; align-items: center; gap: 6px; width: 100%; }

.cs-meter > i { display: block; height: 100%; background: var(--gold); }
.course-tag { color: var(--brand); }
.me-h { margin: 22px 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.me-h .brand-mark { width: 22px; height: 22px; flex: none; }
.me-badges { margin: 0 0 10px; }
.me-badges > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--brand); padding: 4px 0 10px; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }
.brand-stack { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-tag { flex: none; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .06em; line-height: 1; padding: 4px 6px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); }
@media (max-width: 440px) {
  .brand-stack { flex-direction: column; align-items: flex-start; gap: 2px; }
  .brand-stack .brand-name { max-width: 100%; line-height: 1.1; }

}
@media (max-width: 380px) { .multi .brand-stack .brand-name { font-size: 14px; } }

/* ---------- code exercises ---------- */
.goal-line { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--gold-2); color: var(--ink); }
.goal-line svg { width: 18px; height: 18px; flex: none; color: var(--gold); margin-top: 1px; }

.code-ln {

}

  font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre; overflow: auto; tab-size: 4; min-height: 120px; color: var(--ink);
}

/* ---------- wider screens: tablets and PCs ---------- */
@media (min-width: 1100px) {
  .main { max-width: 980px; }

}
.svg-hot:focus { outline: none; }
.svg-hot:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

/* ======== craft theme ======== */
/* Coursewright theme — indigo ink for the brand and burnt orange for highlights, on warm paper in light mode and
   near-black in dark mode, like a workbench with a notebook on it. Extra tokens: the box-model colours browsers'
   developer tools use (margin, border, padding, content), syntax colours for HTML, CSS and JavaScript, a phone
   frame and its screen, an SVG drawing grid, files and tools in build pipelines, and Android green. */
:root {
  --bg: #EEEBE4;
  --surface: #F7F5F0;
  --card: #FFFFFF;
  --ink: #1D1B17;
  --ink-2: #46413A;
  --ink-3: #6B655C;
  --line: #D7D1C5;
  --line-2: #E7E2D8;
  --brand: #3A47B0;
  --brand-2: #E2E5F8;
  --brand-ink: #FFFFFF;
  --gold: #C2410C;
  --gold-2: #FBE5D7;
  --gold-ink: #FFFFFF;
  --ok: #2B7F3E;
  --ok-2: #DCEEDF;
  --bad: #C0353F;
  --bad-2: #F7DCDE;
  --wire: #9C958A;
  --hot: #C7307A;
  --f-op: #2B7F3E;
  --f-rd: #1E5DBE;
  --f-f3: #C0353F;
  --f-rs1: #7841B3;
  --f-rs2: #A96500;
  --f-f7: #0B7A80;
  --f-imm: #B02E78;
  --f-op-2: #DCEEDF;
  --f-rd-2: #DEE7F7;
  --f-f3-2: #F7DCDE;

/* craft widgets */
/* symbols and units must keep their case: no upper-casing of table heads or stat labels (μ, m/s, MPa, M/Z) */
table.t th { text-transform: none; letter-spacing: .01em; white-space: normal; font-size: 12.5px; }
.stat .l { text-transform: none; letter-spacing: .01em; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.scroll-x > svg { max-width: none; }
.fig-box.center { display: flex; justify-content: center; }
.fig-box.center svg { max-width: 320px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv .k { color: var(--ink-3); font-weight: 700; }
.kv .v { font-family: var(--font-mono); min-width: 0; overflow-wrap: anywhere; }
.term { background: var(--term-bg); color: var(--term-ink); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.45; border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; margin: 0; }
.tests { display: flex; flex-direction: column; gap: 4px; }
.test-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 6px 8px; border-radius: 8px; background: var(--surface); border-left: 4px solid var(--ok); min-width: 0; }
.test-row.bad { border-left-color: var(--bad); }
.test-row .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; background: var(--ok-2); color: var(--ok); }
.test-row.bad .ic { background: var(--bad-2); color: var(--bad); }
.test-row .tx { min-width: 0; overflow-wrap: anywhere; }
.test-row .tx code { font-size: 12px; white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.note.bad { border-left-color: var(--bad); }
.note.info { border-left-color: var(--brand); }
.tog { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
.chips .chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.stage-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.stage-tabs button { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.stage-tabs button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); }
.legend-row i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border: 1px solid var(--line); }
.pick-pad { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-pad .pbtn { min-width: 44px; min-height: 40px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-family: var(--font-mono); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0 9px; }
.pick-pad .pbtn.on { background: var(--gold-2); border-color: var(--gold); color: var(--ink); }
.pick-pad .pbtn:disabled { opacity: .45; cursor: default; }
.state-line { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }
.deflist { display: flex; flex-direction: column; gap: 10px; }
.deflist .di { border-left: 3px solid var(--line); padding: 1px 0 1px 10px; min-width: 0; }
.deflist .dt { font-size: 13px; overflow-wrap: anywhere; }
.deflist .dd { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }
.pix-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pix-row figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pix-row canvas { width: 112px; height: 112px; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); }
.pix-row figcaption { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.hex-text { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; color: var(--ink-2); }
.meter-row { display: grid; grid-template-columns: 120px 1fr 74px; gap: 8px; align-items: center; font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid var(--line-2); }
.meter-row:last-child { border-bottom: 0; }
.meter-row .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.meter-row .bar { height: 10px; border-radius: 5px; background: var(--line-2); overflow: hidden; }
.meter-row .bar i { display: block; height: 100%; background: var(--brand); border-radius: 5px; }
.meter-row .bar i.alt { background: var(--gold); }
.meter-row .pc { font-family: var(--font-mono); text-align: right; }
.json-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; margin: 0; }
.slider-top { flex-wrap: wrap; row-gap: 0; }
.slider-val { white-space: normal; overflow-wrap: anywhere; min-width: 0; text-align: right; margin-left: auto; }

/* lab controls and figures */
.anim-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 14px; padding: 8px; overflow: hidden; }
.anim-box svg { display: block; width: 100%; height: auto; }
.tabs-mini { display: flex; gap: 6px; flex-wrap: wrap; }
.big-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.unit-note { font-size: 12px; color: var(--ink-3); }
.verdict { font-weight: 700; border-radius: 10px; padding: 8px 12px; background: var(--ok-2); color: var(--ok); }
.verdict.bad { background: var(--bad-2); color: var(--bad); }

/* Coursewright: code shown with syntax colours, the sandbox's live preview, and pictures the learner's code drew */
.code .syn-tag { color: var(--syn-tag); }
.code .syn-attr { color: var(--syn-attr); }
.code .syn-str { color: var(--syn-str); }
.code .syn-kw { color: var(--syn-kw); font-weight: 700; }
.code .syn-num { color: var(--syn-num); }
.code .syn-com { color: var(--syn-com); font-style: italic; }
.live-frame { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; display: block; }
.shot-row { display: flex; flex-wrap: wrap; gap: 8px; }
.shot-row img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #FFFFFF; }
.swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 74px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; font-size: 11px; }
.swatch i { display: block; height: 34px; }
.swatch span { display: block; padding: 4px 6px; font-family: var(--font-mono); overflow-wrap: anywhere; }
.preview-pane { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }

/* this course quotes long code, URLs and CSS inline: let code spans wrap anywhere instead of widening the page */
.body code, .why code, .answer code, .chip code, .spec code, figcaption code, .goal-line code, td code, dd code, .gloss code {
  white-space: normal; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone;
}

      rng: { text: 'Seeded random', src: 'function mulberry32(a) {\n  return function () {\n    a = (a + 0x6D2B79F5) >>> 0;\n    let t = a;\n    t = Math.imul(t ^ (t >>> 15), t | 1);\n    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nconst r = mulberry32(7);\nconsole.log(r(), r(), r());' },
      sm2: { text: 'SM-2 schedule', src: 'function sm2(c, q) {\n  if (q < 3) {\n    return { reps: 0, ef: c.ef, gap: 1 };\n  }\n  const ef = Math.max(1.3, c.ef + 0.1\n    - (5 - q) * (0.08 + (5 - q) * 0.02));\n  const reps = c.reps + 1;\n  const gap = reps === 1 ? 1 : reps === 2\n    ? 6 : Math.ceil(c.gap * ef);\n  return { reps, ef, gap };\n}\nlet c = { reps: 0, ef: 2.5, gap: 0 };\nfor (const q of [4, 4, 5, 3]) {\n  c = sm2(c, q);\n  console.log(c);\n}' }

  lab('fdroid', 'F-Droid metadata', 'git', 'Fill in your app’s details and get the metadata file F-Droid builds it from, with the checks fdroid lint would make.', body => {
    const d = { id: 'com.example.coursewright', name: 'Coursewright', license: 'MIT', repo: 'https://github.com/you/coursewright', version: '1.0.0', code: '1', summary: 'Build a learning app by hand, from HTML to F-Droid' };
    const out = h('div', { class: 'stack' }), form = h('div', { class: 'stack' });

(function () {
/* Part 1 — Learning that works. Unit 1: how people learn. Unit 2: the game layer. Unit 3: the shape of the app. */
const REF = GEN.REF;

CRAFT.units.push({
  id: 'u1', n: 1, track: 'learn', tone: 'rd', title: 'How people learn',
  blurb: 'What a century of experiments says makes learning stick: pulling answers out of memory, spacing and mixing practice, and feedback that explains. Every rule in this app comes from here.',
  lessons: [
    {
      id: 'u1l1', title: 'Remembering is practice',
      ref: REF.learning,
      items: [
        { t: 'learn', h: 'Testing beats rereading', body: 'In a classic experiment (Roediger & Karpicke, 2006), students read a short text, then either **read it again** or **wrote down all they could remember**. Five minutes later the re-readers did a little better. A week later the testers remembered far more: about **56% against 42%**.\n\nPulling an answer out of memory is called **retrieval practice**. It changes the memory itself, so the answer is easier to find next time. Rereading only feels useful, because a page you have seen looks familiar.\n\nThat is why every lesson here is mostly questions, with a short card before them.', viz: { k: 'plot', series: [{ name: 'read it again', pts: [[0, 81], [2, 54], [7, 42]], color: 'var(--ink-3)', sw: 2.2, dash: '5 4' }, { name: 'tested themselves', pts: [[0, 75], [2, 68], [7, 56]], color: 'var(--brand)', sw: 2.6 }], xlab: 'days after studying (0 = five minutes)', ylab: '% recalled', xmin: 0, xmax: 7, ymin: 30, ymax: 90, H: 210, cap: 'Roediger & Karpicke (2006), experiment 1, approximate values: rereading wins at five minutes and loses by a week.' } },
        { t: 'mcq', q: 'A learner has 20 minutes tonight for a test in a week. Which use of the time helps most?', opts: ['answer practice questions from memory, then check', 'read the chapter twice', 'highlight the key sentences', 'copy out the summary neatly'], a: 0, why: 'Retrieval practice with feedback. Rereading, highlighting and copying all feel productive but ask the memory to do very little.' },
        { t: 'num', q: 'A week later, the testers recalled about 56% and the re-readers about 42%. How many percentage points more did the testers recall?', a: 14, unit: 'points', why: '56 − 42 = 14 points: a third more than the re-readers, from the same study time.' },
        { t: 'tf', q: 'Students usually predict that rereading will work better than testing themselves.', a: true, why: 'In the same study the re-readers rated their own learning higher. Familiarity feels like knowing, which is why an app should make retrieval the default rather than an option.' },
        { t: 'match', q: 'Dunlosky and colleagues (2013) rated ten study techniques. Match each to its rating.', pairs: [['practice testing', 'high: answer from memory'], ['spacing study out', 'high: sessions spread over days'], ['interleaving', 'moderate: mix kinds of problem'], ['highlighting', 'low: feels busy, changes little'], ['rereading', 'low: familiar is not remembered']], why: 'Only practice testing and distributed (spaced) practice earned “high utility”. An app can build both in: questions in every lesson, and reviews days later.' },
        { t: 'mcq', q: 'Which item type makes the learner **produce** an answer rather than recognise one?', opts: ['typing a number', 'picking one of four options', 'true or false', 'tapping one of three labelled parts'], a: 0, why: 'Recognition (pick the right one) is easier than recall (produce it). Mix both: recognition to start, typed answers once the idea is familiar.' },
        { t: 'fill', q: 'Complete the sentence.', text: 'Pulling an answer out of memory is called ___ practice. It works best with ___ straight after, so wrong answers get corrected.', blanks: ['retrieval', 'feedback'], extra: ['massed', 'rereading'], why: 'Testing without feedback still helps, but a wrong answer may stick. Showing the right answer and the reason fixes that.' }
      ]
    },
    {
      id: 'u1l2', title: 'Spacing and mixing',
      ref: REF.learning + ' Cepeda et al., Psychological Science 19:1095 (2008).',
      items: [
        { t: 'learn', h: 'Spread it out, mix it up', body: '**Spacing.** The same study time remembers far better when it is split over days than crammed into one session. In one large study (Cepeda et al., 2008), to remember facts for **5 weeks** the best gap between two sessions was about **11 days**; for **1 week**, about **1 day**. The longer you need to remember, the longer the gaps can be.\n\n**Interleaving.** Mixing different kinds of problem beats doing a block of one kind, then the next. In Rohrer & Taylor (2007), students who practised mixed maths problems scored **63%** on a test a week later; those who practised in blocks scored **20%**, even though blocks felt easier during practice.\n\nIn the picture each review resets memory to full, and each time it fades more slowly.', viz: { k: 'memory', reviews: [0, 1, 4, 11, 30], days: 45, cap: 'A memory reviewed on days 1, 4, 11 and 30 (solid) and one never reviewed (dashed).' } },
        { t: 'mcq', q: 'A learner needs the material in 5 weeks. Which plan fits the research best?', opts: ['study now, review in about a week and a half, then again before the test', 'study three times today', 'study for hours the day before the test', 'study once now and trust it'], a: 0, why: 'For a 35-day wait, gaps of about 11 days worked best. Cramming the night before works for tomorrow and fails a month later.' },
        { t: 'tf', q: 'During practice, blocks of one kind of problem feel easier than mixed problems.', a: true, why: 'In Rohrer & Taylor’s study blocked practice scored 89% during practice against 60% for mixed, and then lost on the test a week later. Easy practice is not the same as good practice.' },
        { t: 'num', q: 'Mixed practice scored 63% a week later and blocked practice 20%. How many times higher is the mixed score? (1 decimal)', a: 3.15, tol: 0.06, unit: '×', why: '63 ÷ 20 = 3.15: about three times as much remembered, from the same number of problems.' },
        { t: 'mcq', q: 'Why does mixing problem types help on a test?', opts: ['the learner has to decide which method fits each problem, as the test will ask', 'mixed problems are easier', 'it takes less time', 'it hides the answers'], a: 0, why: 'In a block, the method is given away by the block’s title. Mixed practice trains the choosing too.' },
        { t: 'match', q: 'Match each feature of this app to the finding behind it.', pairs: [['questions after every card', 'retrieval practice'], ['reviews that come back days later', 'spacing'], ['drills that mix topics', 'interleaving'], ['a reason shown after each answer', 'feedback']], why: 'Each feature is there for a measured effect, not for decoration.' }
      ]
    },
    {
      id: 'u1l3', title: 'Feedback, examples and difficulty',
      ref: REF.feedback,
      items: [
        { t: 'learn', h: 'Feedback that teaches', body: 'A large review of feedback research (Hattie & Timperley, 2007) found that feedback about **the task** (what is right) and **the process** (how to get there) helps most, while praise of **the person** (“you are so clever”) helps least.\n\nGood feedback answers three questions: what was the answer, why, and what to do next time. In this app every item carries a `why`, shown after right and wrong answers alike, because a right guess deserves the reason too.', viz: { k: 'phone', screen: 'wrong', labels: [['banner', 'the answer and the reason'], ['options', 'right answer marked green'], ['continue', 'move on when ready']] } },
        { t: 'mcq', q: 'A learner typed 34% for “3/4 as a percentage”. Which feedback helps most?', opts: ['“75%: divide 3 by 4 to get 0.75, then multiply by 100.”', '“Wrong! Try harder.”', '“Great effort, you are so smart!”', '“The answer is 75%.”'], a: 0, why: 'It gives the answer and the process, so the next fraction comes out right. The bare answer helps a little; praise of the person and blame help least.' },
        { t: 'learn', h: 'Worked examples, then fade them', body: 'A beginner learns more from **studying a worked example** than from solving the same problem cold, because a beginner’s working memory is full of the search for a method (Sweller and colleagues). Working memory holds only a few new pieces at once, so each card here explains **one idea**.\n\nAs skill grows, examples help less, so **fade** them: a full example, then one with the last step missing, then one with only the first step, then a problem alone.\n\nSome difficulty is good (Bjork’s “desirable difficulties”): effort spent retrieving makes memory stronger, as long as the learner usually succeeds.' },
        { t: 'tf', q: 'A beginner learns more from solving ten problems with no examples than from studying worked examples first.', a: false, why: 'For novices, worked examples win: the effort of searching for a method leaves no room for learning it. For experts the reverse can hold (the expertise reversal effect).' },
        { t: 'order', q: 'Order the steps of fading a worked example, from most help to least.', items: ['a fully worked example to study', 'the same kind of problem with the last step blank', 'a problem with only the first step done', 'a new problem to solve alone'], why: 'Each step hands a little more of the work to the learner, so effort grows with skill.' },
        { t: 'mcq', q: 'Why are the cards in this app short, with one idea each?', opts: ['working memory holds only a few new pieces at a time', 'phones cannot show long text', 'short text loads faster', 'nobody reads long text'], a: 0, why: 'New material competes for a small working memory. One idea, then questions on it, then the next idea.' },
        { t: 'hotspot', q: 'Tap the part of the feedback screen that teaches, not just marks.', viz: { k: 'phone', screen: 'wrong' }, a: 'banner', aText: 'The banner with the answer and the reason', why: 'The banner holds the right answer and its `why`. The red and green options only mark; the reason is what changes the next answer.' },
        { t: 'fill', q: 'Complete the sentence.', text: 'Feedback about the ___ and the process helps; praise of the ___ helps least.', blanks: ['task', 'person'], extra: ['speed', 'score'], why: 'Hattie & Timperley’s four levels: task, process, self-regulation and self. Only the self level (“good girl”, “clever boy”) does little for learning.' }
      ]
    }
  ]
});

CRAFT.units.push({
  id: 'u2', n: 2, track: 'learn', tone: 'rd', title: 'The game layer',
  blurb: 'XP, streaks, levels, stars and a path: what each one is for, the rewards that help and the ones that backfire, and the loop inside one lesson.',
  lessons: [
    {
      id: 'u2l1', title: 'Why it feels like a game',
      ref: REF.game,
      items: [
        { t: 'learn', h: 'Small wins you can see', body: '**Self-determination theory** (Ryan & Deci) says people keep doing what makes them feel **competent** (I am getting better), **autonomous** (I chose this) and **related** (others are in it with me).\n\nGame elements are a cheap way to make progress visible:\n\n- a **progress bar** inside a lesson\n- **XP** for every first-try answer\n- a **streak** of days in a row\n- **levels**, **stars** and **badges** as milestones\n- a **path** that shows what comes next\n\nThey amplify real progress. They cannot replace it: points for a pointless task soon feel like a trick.', viz: { k: 'phone', screen: 'home', labels: [['streak', 'days in a row'], ['xp', 'XP today'], ['node', 'the next lesson'], ['locked', 'lessons still to come']] } },
        { t: 'hotspot', q: 'Tap what shows how many days in a row the learner has practised.', viz: { k: 'phone', screen: 'home' }, a: 'streak', aText: 'The flame with the day count', why: 'The streak sits top left with a flame. It is the strongest reason to open the app tomorrow, which makes spacing happen without a timetable.' },

      items: [
        { t: 'learn', h: 'One line of boxes', body: '`display: flex` lays children along one **main axis**, a row by default (`flex-direction: column` for a column). `gap` puts space between them; `justify-content` places them along the main axis and `align-items` across it.\n\nHow the space is shared: each item starts at its `flex-basis`; the **free space** (container − bases − gaps) is handed out in proportion to `flex-grow`.\n\nHere: 320 − 3 × 60 − 2 × 8 = **124 px** free; the grows add up to 4, so one share is 31 px. A and C get 60 + 31 = **91**, B gets 60 + 62 = **122**.', viz: { k: 'flexbox', items: [{ basis: 60, grow: 1, label: 'A' }, { basis: 60, grow: 2, label: 'B' }, { basis: 60, grow: 1, label: 'C' }], width: 320, gap: 8 } },
        { t: 'num', q: 'A 400 px row holds two items, each with basis 100 px, `flex-grow` 1 and 3, no gap. How wide is the second item?', a: 250, unit: 'px', why: 'Free space 400 − 200 = 200, in 4 shares of 50. The second item gets 100 + 3 × 50 = 250.' },
        { t: 'goal', q: 'Give B twice A’s share of the free space, and give C none.', viz: { k: 'tune', model: 'flex', only: ['g0', 'g1', 'g2'] }, goal: w => w.v.g0 > 0 && w.v.g1 === 2 * w.v.g0 && w.v.g2 === 0, solve: { g0: 1, g1: 2, g2: 0 }, aText: 'flex-grow 1, 2 and 0 (or 2, 4 and 0)', why: 'Shares follow the ratio of the grow values. 0 means “never grow”: C keeps its basis.' },
        { t: 'hotspot', q: 'These items have `flex-grow: 0`. Tap the free space nobody takes.', viz: { k: 'flexbox', items: [{ basis: 60, grow: 0, label: 'A' }, { basis: 80, grow: 0, label: 'B' }, { basis: 60, grow: 0, label: 'C' }], width: 320, gap: 8 }, a: 'free', aText: 'The empty space after C', why: 'With no grow, items keep their basis and the free space stays empty at the end (with `justify-content: flex-start`).' },
        { t: 'mcq', q: 'Which `justify-content` puts equal gaps between items and none at the two ends?', opts: ['`space-between`', '`space-around`', '`space-evenly`', '`center`'], a: 0, why: 'space-between: gaps only between; space-evenly: equal gaps everywhere, ends included; space-around: half-size gaps at the ends.' },
        { t: 'tf', q: 'In a row, `align-items: center` centres the items from left to right.', a: false, why: 'In a row, left to right is the main axis: that is `justify-content`. `align-items` works across it, top to bottom.' }

        { t: 'learn', h: 'Rows and columns at once', body: '`display: grid` places children into tracks:\n\n```\n.page {\n  display: grid;\n  grid-template-columns:\n    100px 1fr 2fr;\n  gap: 10px;\n}\n```\n\nFixed tracks come first, then the gaps; the leftover is split by `fr`. At 320 px: 320 − 100 − 2 × 10 = 200, so 1fr = **66.7 px** and 2fr = **133.3 px**.\n\nCards that wrap with no media query: `grid-template-columns: repeat(auto-fill, minmax(160px, 1fr))`.\n\nUse **flex** for one line of things (a toolbar, an icon and its label) and **grid** for rows and columns (a page, a set of cards).', viz: { k: 'gridbox', cols: ['100px', '1fr', '2fr'], width: 320, gap: 10 } },
        { t: 'num', q: '`grid-template-columns: 1fr 1fr 1fr` with `gap: 12px` in a 360 px container. How wide is each column?', a: 112, unit: 'px', why: '360 − 2 × 12 = 336 left, ÷ 3 = 112.' },
        { t: 'num', q: '`grid-template-columns: 200px 1fr` with a 20 px gap in a 500 px container. How wide is the 1fr column?', a: 280, unit: 'px', why: '500 − 200 − 20 = 280. One fr track takes all the leftover.' },
        { t: 'hotspot', q: 'Tap the track that gets the biggest share of the leftover space.', viz: { k: 'gridbox', cols: ['100px', '1fr', '2fr'], width: 320, gap: 10 }, a: 'c2', aText: 'The 2fr column', why: '2fr gets two of the three shares: 133.3 px against 66.7 px for 1fr.' },
        { t: 'mcq', q: 'Which layout suits grid better than a flex row?', opts: ['a page of course cards in rows and columns', 'three buttons in a toolbar', 'an icon next to its label', 'a row of tabs'], a: 0, why: 'Grid lines items up in two directions at once. A single row of things is flex’s job.' },

CRAFT.units.push({
  id: 'u6', n: 6, track: 'page', tone: 'op', title: 'Tokens, themes and contrast',
  blurb: 'Colours as named tokens, a dark theme by redefining them, contrast you can compute and check, and colour that never carries meaning alone.',
  lessons: [
    {
      id: 'u6l1', title: 'Colour tokens and two themes',
      ref: REF.themes,
      items: [
        { t: 'learn', h: 'Name every colour once', body: 'Define colours as **custom properties** on `:root` and use them everywhere with `var()`. The dark theme only redefines the tokens; components never change:\n\n```\n:root {\n  --bg: #EEEBE4;\n  --ink: #1D1B17;\n  --brand: #3A47B0;\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #0E0E10;\n    --ink: #ECEAE6;\n    --brand: #9AA3FF;\n  }\n}\nbody {\n  background: var(--bg);\n  color: var(--ink);\n}\n```\n\nA third block, `:root[data-theme="dark"]`, lets a switch in the app override the phone’s setting.', viz: { k: 'swatches' } },
        { t: 'hotspot', q: 'Tap the token used for the page background.', viz: { k: 'swatches' }, a: '--bg', aText: '`--bg`', why: 'Every colour has a job name, not a colour name: `--bg`, not `--beige`. In dark mode the same name holds a near-black.' },
        { t: 'mcq', q: 'A button sets `color: #1D1B17` directly. What happens in dark mode?', opts: ['its text stays nearly black on a dark background', 'nothing: it adapts', 'the button disappears', 'the page fails to load'], a: 0, why: 'A raw colour never changes with the theme. Use `var(--ink)` and the dark theme fixes it for free.' },
        { t: 'tf', q: 'To add a dark theme, you redefine the tokens and leave the components alone.', a: true, why: 'That is the point of tokens: one change per colour, not one per component.' },
        { t: 'fill', q: 'Complete the sentence.', text: 'Define colours as custom ___ on `:root`, use them with ___(), and redefine them in a `prefers-color-scheme: dark` media query.', blanks: ['properties', 'var'], extra: ['classes', 'calc'], why: 'Custom properties (CSS variables) cascade like any property, so redefining them on `:root` changes them everywhere.' },
        { t: 'mcq', q: 'Why also support `:root[data-theme="dark"]` besides the media query?', opts: ['so a theme switch in the app can override the phone’s setting', 'the media query does not work on phones', 'it is faster', 'old browsers need it'], a: 0, why: 'The media query follows the system. A data attribute set by the app lets the learner choose, in either direction.' }
      ]
    },
    {
      id: 'u6l2', title: 'Contrast you can compute',
      ref: REF.themes,
      items: [
        { t: 'learn', h: 'Luminance and the ratio', body: 'WCAG measures contrast from **relative luminance** L, the brightness the eye sees:\n\n1. scale each channel to 0–1 and undo the sRGB curve: c ≤ 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055)^{2.4}\n2. L = 0.2126 R + 0.7152 G + 0.0722 B (green looks brightest)\n3. **contrast** = (L_{light} + 0.05) / (L_{dark} + 0.05), from 1:1 to 21:1\n\n**AA** needs 4.5:1 for body text and 3:1 for large text (24 px, or 18.66 px bold) and for icons and field borders. **AAA** needs 7:1.\n\n#767676 on white is 4.54:1, the lightest grey that passes AA; #777777 is 4.48:1 and fails.', viz: { k: 'contrastcard', fg: '#767676', bg: '#FFFFFF' } },
        { t: 'num', q: 'Black on white: L = 0 and L = 1. What is the contrast ratio?', a: 21, unit: ':1', why: '(1 + 0.05) / (0 + 0.05) = 21. The 0.05 stands for screen glare, so the ratio never divides by zero.' },
        { t: 'goal', q: 'Find the lightest grey text that still passes AA (4.5:1) on a white background.', viz: { k: 'tune', model: 'contrast', only: ['fg'] }, goal: w => w.out.r >= 4.5 && w.v.fg === 46, solve: { fg: 46 }, aText: '46% grey (#757575), 4.61:1', why: '47% (#787878) gives only 4.42:1. Each step of lightness costs contrast fast in this range.' },
        { t: 'mcq', q: 'Which grey on white passes AA for body text?', opts: ['#767676', '#777777', '#999999', '#AAAAAA'], a: 0, why: '4.54:1 passes; #777777 is 4.48:1, #999999 2.85:1 and #AAAAAA 2.32:1. Trust the computed number, not your eyes on a bright screen.' },
        { t: 'num', q: 'The text has L = 0.2 and the background L = 1.0. What is the contrast ratio? (2 decimals)', a: 4.2, tol: 0.01, unit: ':1', why: '(1.0 + 0.05) / (0.2 + 0.05) = 1.05 / 0.25 = 4.20: enough for large text, not for body text.' },
        { t: 'tf', q: 'Large text, 24 px or about 18.7 px bold, needs only 3:1 for AA.', a: true, why: 'Big strokes are easier to read, so WCAG asks less of them. Body text at 16 px needs 4.5:1.' },
        { t: 'mcq', q: 'Which must have at least 3:1 against its background (WCAG 1.4.11)?', opts: ['the outline of a text field', 'a decorative photo', 'a disabled button’s label', 'a company logo'], a: 0, why: 'Parts of the interface you need to find, like field borders, icons and focus rings, need 3:1. Disabled controls and logos are exempt.' }
      ]
    },
    {
      id: 'u6l3', title: 'Colour that carries meaning',
      ref: REF.themes + ' ' + REF.a11y,
      items: [
        { t: 'learn', h: 'Never colour alone', body: 'About **1 in 12 men** (and 1 in 200 women) have red–green colour blindness. If right and wrong differ only in green and red, they cannot tell them apart. WCAG 1.4.1 asks for a second signal: an icon (✓, ✗), a word (“Not quite”), a shape or a position.\n\nMore rules for colour:\n\n- a **visible focus ring** for keyboard users (2.4.7), with 3:1 contrast\n- a dark theme is not an inverted one: use a **lighter brand colour** (#3A47B0 becomes #9AA3FF here) and a near-black, not pure black, so layers still show\n- check every pair in **both** themes', viz: { k: 'phone', screen: 'right', labels: [['banner', 'words, not only green'], ['options', 'the chosen answer outlined']] } },
        { t: 'mcq', q: 'An answer turns green when right and red when wrong, and nothing else changes. Who is most likely to miss it?', opts: ['about 1 in 12 men, with red–green colour blindness', 'nobody', 'people in dark mode', 'people on a slow network'], a: 0, why: 'Add a ✓ or ✗ and a word. Then the colour helps everyone and excludes no one.' },
        { t: 'mcq', q: 'Why does the dark theme use #9AA3FF for the brand instead of #3A47B0?', opts: ['#3A47B0 on a near-black page has only about 2.5:1 contrast', 'to save battery', 'blue is not allowed in dark mode', 'to match the phone’s accent colour'], a: 0, why: 'A dark blue on black almost disappears. The lighter tint keeps the same hue at about 8.3:1.' },
        { t: 'tf', q: 'Removing the focus outline with `outline: none` and adding nothing else fails WCAG AA.', a: true, why: '2.4.7 Focus Visible (AA) needs a visible focus indicator. If you dislike the default ring, style your own, but keep one.' },
        { t: 'match', q: 'Match each problem to its fix.', pairs: [['right and wrong shown only by colour', 'add an icon and a word'], ['brand blue too dark on a dark page', 'a lighter tint of the brand'], ['`outline: none` on buttons', 'a visible focus ring, 3:1'], ['grey placeholder used as the label', 'a real `<label>` above the field']], why: 'Each fix keeps the design and adds the signal that was missing.' },
        { t: 'hotspot', q: 'Tap what tells the learner they were right without relying on colour.', viz: { k: 'phone', screen: 'right' }, a: 'banner', aText: 'The banner with “Nice work!”', why: 'The words in the banner say it in plain text; the green is a second, not the only, signal.' }

        { t: 'goal', q: 'With a 16 px body, choose a ratio that makes h2 (two steps up) exactly 36 px.', viz: { k: 'tune', model: 'type', only: ['ratio'] }, goal: w => w.v.base === 16 && w.out.h2 === 36, solve: { ratio: 1.5 }, aText: 'ratio 1.5: 16 × 1.5 × 1.5 = 36', why: 'Two steps multiply: 16 × 1.5² = 36. A big ratio suits short headings on big screens; small screens prefer 1.2–1.25.' },
        { t: 'num', q: 'Body 16 px, ratio 1.2. How big is a heading two steps up? (1 decimal)', a: 23.04, tol: 0.06, unit: 'px', why: '16 × 1.2 × 1.2 = 23.04 px.' },
        { t: 'num', q: 'How many px is `1.5rem` with the default root size?', a: 24, unit: 'px', why: '1.5 × 16 = 24. If the reader sets the browser to 20 px, it becomes 30.' },
        { t: 'mcq', q: 'A card is 700 px wide with 16 px text, about 85 characters a line. What helps reading most?', opts: ['`max-width: 65ch` on the text', 'a smaller font', '`text-align: justify`', 'double the line height'], a: 0, why: 'Long lines make the eye lose its place on the way back. `ch` is the width of a zero, so 65ch is roughly 65 characters.' },

        { t: 'tf', q: 'Sizes in rem follow the reader’s browser font-size setting; sizes in px do not.', a: true, why: 'Both grow with page zoom, but only rem (and em) follow the font-size setting many people with low vision use.' }

        { t: 'num', q: 'A 48 dp touch target on an xxhdpi phone (× 3) is how many device pixels wide?', a: 144, unit: 'px', why: '48 × 3 = 144 device pixels, still about 9 mm on the glass.' },
        { t: 'num', q: 'An icon is 24 CSS px. How many device pixels wide is it at `devicePixelRatio` 2.75?', a: 66, unit: 'px', why: '24 × 2.75 = 66. Ratios like 2.625 and 2.75 are common on Android, which is why vector icons beat bitmaps.' },
        { t: 'mcq', q: 'Why are this app’s pictures SVG rather than PNG?', opts: ['SVG stays sharp at any ratio and can use the theme’s colours', 'PNG cannot show colour', 'SVG files are always smaller', 'phones cannot show PNG'], a: 0, why: 'An SVG drawn with `var(--ink)` even switches colour with dark mode. A PNG is fixed pixels and fixed colours.' },
        { t: 'tf', q: 'On a phone with `devicePixelRatio` 3, `width: 100px` covers 300 device pixels.', a: true, why: 'CSS sizes are multiplied by the ratio when drawn. You write sizes for the CSS pixel and the phone does the rest.' },
        { t: 'match', q: 'Match each Android density bucket to its px per dp.', pairs: [['mdpi', '1'], ['hdpi', '1.5'], ['xhdpi', '2'], ['xxhdpi', '3'], ['xxxhdpi', '4']], why: 'mdpi (160 dpi) is the baseline; the others are multiples of it. A launcher icon is 48 dp: 144 px at xxhdpi.' }

      ref: REF.type + ' ' + REF.a11y,
      items: [
        { t: 'learn', h: 'Room for a fingertip', body: 'Fingers are about 10 mm wide. The rules:\n\n- WCAG 2.2, 2.5.8 (AA): targets at least **24 × 24 CSS px**, or spaced so a 24 px circle around each touches no other\n- WCAG 2.5.5 (AAA): **44 × 44**\n- Android: **48 × 48 dp**; Apple: **44 × 44 pt**\n\nAn icon can stay small if its tappable area is padded around it.\n\n**Safe areas**: when a page draws edge to edge (`viewport-fit=cover`), notches and the gesture bar cover its edges. `env(safe-area-inset-top)` and its siblings say how far to pad: `padding-bottom: env(safe-area-inset-bottom)` keeps a tab bar clear of the gesture bar.', viz: { k: 'targets' } },

        { t: 'mcq', q: 'Which rule keeps a bottom tab bar clear of the phone’s gesture bar?', opts: ['`padding-bottom: env(safe-area-inset-bottom)`', '`margin-bottom: 48px`', '`position: absolute`', '`z-index: 999`'], a: 0, why: 'The inset is 0 on phones without a gesture bar and the right size on those with one. A fixed 48 px wastes space or falls short.' },

        { t: 'tf', q: '`0.1 + 0.2 === 0.3` is true in JavaScript.', a: false, why: '0.1 and 0.2 have no exact binary form, so the sum is 0.30000000000000004. Compare decimals with a tolerance instead.' },
        { t: 'match', q: 'Match each value to what `typeof` says about it.', pairs: [['`42`', '`\'number\'`'], ['`\'42\'`', '`\'string\'`'], ['`true`', '`\'boolean\'`'], ['`[1, 2]`', '`\'object\'`'], ['`() => 1`', '`\'function\'`']], why: 'Arrays are objects to `typeof`; test them with `Array.isArray`.' },
        { t: 'code', run: 'js', q: 'The number widget must accept 0.30000000000000004 for 0.3, and 4.4 for 4.5 when the tolerance is 0.1. Write `close(a, b, tol)`: true when a and b differ by at most tol.', src: `// true when a and b differ by at most tol

        { t: 'mcq', q: 'Which comparison should the engine use to check `a` against a stored answer?', opts: ['`===`', '`==`', '`=`', '`!=`'], a: 0, why: '`==` converts types first, so `0 == \'\'` and `null == undefined` are true. `=` assigns instead of comparing.' }
