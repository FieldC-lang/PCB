      ref: REF.js,
      items: [
        { t: 'learn', h: 'Small functions with one job', body: 'A function takes inputs (parameters) and gives back a result with `return`. Arrow functions are a short form; with no braces, the expression is returned. Parameters can have defaults.\n\nA **pure** function returns a result from its inputs only, and changes nothing outside: no saving, no clock, no global counters. Pure functions are easy to test, so the engine keeps its rules (XP, stars, levels, checks) pure and does the saving elsewhere.', viz: { k: 'code', lang: 'js', text: "function stars(acc) {\n  if (acc >= 0.95) return 3;\n  if (acc >= 0.75) return 2;\n  return 1;\n}\nconst xpFor = (n, kind = 'lesson') =>\n  n * (kind === 'drill' ? 8 : 10);\n\nstars(7 / 8);   // 2\nxpFor(5);       // 50" } },
        { t: 'code', run: 'js', q: 'Write `stars(acc)` for this app: 3 stars at 95% first-try accuracy or more, 2 at 75% or more, otherwise 1. `acc` is a fraction from 0 to 1.', src: `// 3 stars at 95% or more,
// 2 at 75% or more, else 1
function stars(acc) {
  return 1;
}
console.log(stars(7 / 8));`, solution: `// 3 stars at 95% or more,
// 2 at 75% or more, else 1
function stars(acc) {
  if (acc >= 0.95) return 3;
  if (acc >= 0.75) return 2;
  return 1;
}
console.log(stars(7 / 8));`, goal: JR.goal.pass, opts: { suite: 'stars' }, want: 'every test passes', why: 'Check the highest threshold first: once a `return` runs, the function stops. `>=` makes 0.95 itself worth 3 stars.' },
        { t: 'mcq', q: 'Which function is pure?', opts: ['`const add = (a, b) => a + b;`', '`function save(s) { localStorage.setItem(\'s\', s); }`', '`function now() { return Date.now(); }`', '`function tick() { count++; }`'], a: 0, why: '`save` changes storage, `now` depends on the clock and `tick` changes a variable outside. Only `add` gives the same output for the same input, every time.' },
        { t: 'num', q: 'With `const xpFor = (n, kind = \'lesson\') => n * (kind === \'drill\' ? 8 : 10);`, what is `xpFor(5)`?', a: 50, unit: 'XP', why: 'No kind is passed, so the default `\'lesson\'` applies and each answer is worth 10.' },
        { t: 'tf', q: 'The arrow function `x => x * 2` returns its result without the word `return`.', a: true, why: 'An arrow function whose body is an expression returns it. With braces, `x => { x * 2 }`, it returns nothing.' },
        { t: 'fill', q: 'Complete the sentence.', text: 'A ___ function gives a result from its inputs and changes nothing outside, which makes it easy to ___.', blanks: ['pure', 'test'], extra: ['global', 'hide'], why: 'Call it with inputs, compare the output: no setup, no clean-up. The test suites in Part 14 test pure functions only.' }
      ]
    },
    {
      id: 'u8l3', title: 'Arrays, objects and JSON',
      ref: REF.js,
      items: [
        { t: 'learn', h: 'Lists of things', body: 'Most of the engine is lists: lessons, items, options, days. Four methods do most of the work:\n\n- `map`: a new array, one result per item\n- `filter`: the items that pass a test\n- `reduce`: one value built from all the items\n- `find`: the first item that passes\n\nTo change an object without touching the original, copy it with the spread `...` and override what changes.\n\n**JSON** turns data into text and back: `JSON.stringify` to save, `JSON.parse` to load. Functions and `undefined` values are left out.', viz: { k: 'code', lang: 'js', text: "const lessons = [\n  { id: 'u8l1', xp: 70, stars: 3 },\n  { id: 'u8l2', xp: 64, stars: 2 },\n  { id: 'u8l3', xp: 0, stars: 0 }\n];\nlessons\n  .filter(l => l.stars > 0)\n  .map(l => l.xp)\n  .reduce((a, x) => a + x, 0);  // 134\n\nconst s2 = { ...s, xp: s.xp + 10 };\nJSON.stringify({ xp: 70 }); // '{\"xp\":70}'" } },
        { t: 'code', run: 'js', q: 'Write `totalXP(lessons)`: the sum of `xp` over the lessons that have at least one star.', src: `// sum of xp for lessons with stars > 0
function totalXP(lessons) {
  return 0;
}
console.log(totalXP([
  { id: 'a', xp: 70, stars: 3 },
  { id: 'b', xp: 25, stars: 0 }
]));`, solution: `// sum of xp for lessons with stars > 0
function totalXP(lessons) {
  return lessons
    .filter(l => l.stars > 0)
    .reduce((a, l) => a + l.xp, 0);
}
console.log(totalXP([
  { id: 'a', xp: 70, stars: 3 },
  { id: 'b', xp: 25, stars: 0 }
]));`, goal: JR.goal.pass, opts: { suite: 'totalXP' }, want: 'every test passes', why: 'filter, then reduce with a start value of 0. Without the 0, an empty list would throw instead of giving 0.' },
        { t: 'num', q: 'What is `[2, 4, 6].map(x => x / 2).filter(x => x > 1).length`?', a: 2, why: 'map gives [1, 2, 3]; filter keeps [2, 3]; its length is 2.' },
        { t: 'mcq', q: 'Which line makes a new state with 10 more XP and leaves the old state unchanged?', opts: ['`const s2 = { ...s, xp: s.xp + 10 };`', '`s.xp += 10;`', '`const s2 = s; s2.xp += 10;`', '`delete s.xp;`'], a: 0, why: '`const s2 = s` copies the reference, not the object: both names then point at the same, changed object.' },
        { t: 'tf', q: '`JSON.stringify` keeps functions and `undefined` values.', a: false, why: 'They are dropped (or become `null` inside arrays). Save only plain data: numbers, strings, booleans, arrays, objects and `null`.' },
        { t: 'match', q: 'Match each array method to what it returns.', pairs: [['`map`', 'a new array, one result per item'], ['`filter`', 'the items that pass a test'], ['`reduce`', 'one value from all the items'], ['`find`', 'the first item that passes'], ['`some`', 'true if any item passes']], why: 'None of them changes the original array; `sort` and `push` do, so use them on a copy.' }
      ]
    }
  ]
});

CRAFT.units.push({
  id: 'u9', n: 9, track: 'js', tone: 'rs2', title: 'Building the page by hand',
  blurb: 'Make elements from JavaScript with a tiny h() helper, put text in safely, handle every tap with one listener, and draw the screen from data.',
  lessons: [
    {
      id: 'u9l1', title: 'Elements from code',
      ref: REF.dom,
      items: [
        { t: 'learn', h: 'A helper called h()', body: 'The DOM’s own calls are long: `document.createElement`, `setAttribute`, `append`. The engine wraps them in a tiny helper, `h(tag, attrs, ...children)`, so a screen reads like the HTML it makes.\n\nChildren that are strings become **text nodes**, never HTML, so a learner’s answer with `<b>` in it shows as text instead of turning bold. Attributes starting with `on` become event listeners.', viz: { k: 'code', lang: 'js', text: "function h(tag, attrs, ...kids) {\n  const el = document.createElement(tag);\n  for (const k in attrs || {}) {\n    if (k.startsWith('on')) {\n      el.addEventListener(\n        k.slice(2), attrs[k]);\n    } else el.setAttribute(k, attrs[k]);\n  }\n  for (const kid of kids.flat()) {\n    if (kid == null || kid === false) {\n      continue;\n    }\n    el.append(kid); // text, never HTML\n  }\n  return el;\n}\nh('button',\n  { class: 'btn', onclick: check },\n  'Check');" } },
        { t: 'code', run: 'js', q: 'Without a browser, h() can return a plain object instead of an element. Make `h` return `{ tag, attrs, kids }` with `attrs` defaulting to `{}`, the children flattened, and `null`, `undefined` and `false` left out.', src: `// h(tag, attrs, ...kids) returns
// { tag, attrs, kids }
// attrs: {} when missing; flatten arrays;
// skip null, undefined and false
function h(tag, attrs, ...kids) {
  return { tag, attrs, kids };
}
console.log(h('p', null, 'Hi', null));`, solution: `// h(tag, attrs, ...kids) returns
// { tag, attrs, kids }
// attrs: {} when missing; flatten arrays;
// skip null, undefined and false
function h(tag, attrs, ...kids) {
  const out = [];
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined ||
        k === false) continue;
    out.push(k);
  }
  return {
    tag, attrs: attrs || {}, kids: out
  };
}
console.log(h('p', null, 'Hi', null));`, goal: JR.goal.pass, opts: { suite: 'vh' }, want: 'every test passes', why: 'Skipping `null` and `false` lets you write `cond && h(...)` or `cond ? h(...) : null` inside a call. Flattening lets you pass `items.map(...)` straight in.' },
        { t: 'mcq', q: 'Why put a learner’s answer on screen with text nodes (or `textContent`) rather than `innerHTML`?', opts: ['text is never parsed as HTML, so typed markup cannot run or restyle the page', 'it is shorter to type', '`innerHTML` does not work on phones', '`textContent` is newer'], a: 0, why: 'With `innerHTML`, typing `<img src=x onerror=…>` would run code. Text nodes show it as harmless characters.' },
        { t: 'tf', q: '`el.append(\'<b>hi</b>\')` shows the tags as text instead of making “hi” bold.', a: true, why: '`append` with a string adds a text node. That is exactly what you want for anything a person typed.' },
        { t: 'order', q: 'Order what h() does.', items: ['create the element', 'set its attributes and listeners', 'append each child as an element or text', 'return the element'], why: 'Create, configure, fill, return: the caller can then append it anywhere.' },
        { t: 'num', q: 'How many elements does `h(\'ul\', null, [\'a\', \'b\', \'c\'].map(x => h(\'li\', null, x)))` create?', a: 4, unit: 'elements', why: 'Three `li` elements and the `ul` that holds them; the three letters are text nodes.' }
      ]
    },
    {
      id: 'u9l2', title: 'Events and delegation',
      ref: REF.dom,
      items: [
        { t: 'learn', h: 'One listener for many buttons', body: '`addEventListener(\'click\', fn)` calls `fn(event)` when the element is pressed. `event.target` is the innermost element pressed, maybe an icon inside the button.\n\n**Delegation**: put one listener on a parent and find the child that matters with `closest`. It handles children added later too, and the path of 126 lessons needs one listener, not 126.\n\nA `<button>` fires `click` for a mouse, a finger, Enter and Space, so one listener serves everyone.', viz: { k: 'code', lang: 'js', text: "path.addEventListener('click', e => {\n  const node =\n    e.target.closest('[data-id]');\n  if (!node) return; // between nodes\n  openLesson(node.dataset.id);\n});" } },
        { t: 'mcq', q: 'The path shows 126 lesson nodes. How many click listeners does delegation need?', opts: ['one, on the path', '126', '252', 'none'], a: 0, why: 'One listener on the parent; `closest(\'[data-id]\')` finds which node was pressed.' },
        { t: 'mcq', q: '`e.target` is a `<span>` inside the lesson button. Which call finds the button?', opts: ['`e.target.closest(\'[data-id]\')`', '`e.target.parentNode`', '`document.querySelector(\'[data-id]\')`', '`e.target.firstChild`'], a: 0, why: '`closest` walks up from the element itself until a match. `parentNode` goes up exactly one step, which breaks when the icon moves deeper.' },
        { t: 'tf', q: 'With delegation, a lesson node added after the listener was set up still works.', a: true, why: 'The listener lives on the parent and looks at whatever was pressed, so new children need nothing.' },
        { t: 'hotspot', q: 'Tap the element whose single listener can handle taps on every lesson node.', viz: { k: 'phone', screen: 'home' }, a: 'path', aText: 'The path that holds the nodes', why: 'Clicks bubble up from a node to the path, where one listener reads `data-id`.' },
        { t: 'fill', q: 'Complete the sentence.', text: 'A `<button>` fires a ___ event for a mouse, a tap, Enter or Space, so one listener serves every way of pressing it.', blanks: ['click'], extra: ['keydown', 'touchstart'], why: 'Listening for `touchstart` or `keydown` instead leaves out the others. `click` is the device-neutral event.' }
      ]
    },
    {
      id: 'u9l3', title: 'Draw the screen from data',
      ref: REF.dom + ' ' + REF.player,
      items: [
        { t: 'learn', h: 'render(): data in, screen out', body: 'Instead of finding elements and changing them one by one when something happens, keep all the facts in one **state** object and write `render()`, which clears a container and builds the screen again from the state.\n\nA few hundred elements rebuild in a millisecond or two, and a whole kind of bug disappears: the screen can never disagree with the data. The engine’s path, tabs and results are drawn this way.', viz: { k: 'code', lang: 'js', text: "const box =\n  document.getElementById('app');\nconst row = l =>\n  h('li', { 'data-id': l.id }, l.title);\nfunction render() {\n  box.replaceChildren(\n    h('h1', null, 'Level ' + state.level),\n    h('ul', null, state.lessons.map(row))\n  );\n}" } },
        { t: 'code', run: 'js', q: 'The path needs a status for each lesson: `\'done\'` if finished, `\'next\'` for the first unfinished one, `\'locked\'` for the other unfinished ones. Write `pathView(ids, done)`.', src: `// 'done' if finished; 'next' for the
// first unfinished; 'locked' otherwise
function pathView(ids, done) {
  const out = [];
  for (const id of ids) {
    out.push({ id, status: 'locked' });
  }
  return out;
}
console.log(
  pathView(['a', 'b', 'c'], ['a']));`, solution: `// 'done' if finished; 'next' for the
// first unfinished; 'locked' otherwise
function pathView(ids, done) {
  const out = [];
  let found = false;
  for (const id of ids) {
    let status = 'locked';
    if (done.includes(id)) {
      status = 'done';
    } else if (!found) {
      status = 'next';
      found = true;
    }
    out.push({ id, status });
  }
  return out;
}
console.log(
  pathView(['a', 'b', 'c'], ['a']));`, goal: JR.goal.pass, opts: { suite: 'pathView' }, want: 'every test passes', why: 'The view is computed from the data each time. render() then turns each `{ id, status }` into a node: a tick, a glowing star or a lock.' },
        { t: 'mcq', q: 'A learner finishes a lesson. In a render-from-state app, what does the code do?', opts: ['update the state, save it, then call render()', 'find the lesson’s node and recolour it by hand', 'reload the page', 'edit the HTML file'], a: 0, why: 'Change the data, then redraw. Every screen that shows that lesson is right without anyone remembering to update it.' },
        { t: 'order', q: 'Order one round of a render-from-state app.', items: ['a tap calls a handler', 'the handler changes the state', 'the state is saved', 'render() rebuilds the screen from the state'], why: 'Events change data; data draws the screen. Nothing changes the screen directly.' },
        { t: 'tf', q: 'Rebuilding the screen from state means the screen cannot show something the state does not say.', a: true, why: 'Everything on screen comes from one place. Bugs where a counter shows 3 but the data says 4 cannot happen.' }
      ]
    }
  ]
});

CRAFT.units.push({
  id: 'u10', n: 10, track: 'js', tone: 'rs2', title: 'State, screens and navigation',
  blurb: 'One object for all progress, values computed rather than stored, a store that tells the screen when things change, and tabs and a back button with no router.',
  lessons: [
    {
      id: 'u10l1', title: 'One object holds the progress',
      ref: REF.storage + ' ' + REF.appshape,
      items: [
        { t: 'learn', h: 'The state of this app', body: 'All of a learner’s progress is one plain object, saved as JSON:\n\n- `xp`: total points\n- `lessons`: per lesson, done, stars, best score\n- `days`: XP earned on each day, by date\n- `streak`: its length and the last day practised\n- `badges`, `mistakes`, `settings`\n\nAnything that can be **computed** from these is not stored: the level comes from `xp`, today’s goal from `days`. Stored copies of computed values drift apart from their source; computed ones cannot.', viz: { k: 'code', lang: 'json', text: '{\n  "v": 1,\n  "xp": 1240,\n  "lessons": {\n    "u8l1": { "done": true, "stars": 3,\n              "best": 1 }\n  },\n  "days": { "2026-11-01": 70,\n            "2026-11-02": 64 },\n  "streak": { "n": 2,\n              "last": "2026-11-02" },\n  "badges": { "page": 1762041600000 },\n  "settings": { "sound": true }\n}' } },
        { t: 'mcq', q: 'Which of these should be **computed** each time rather than stored?', opts: ['the level', 'the XP total', 'the stars for a lesson', 'the date of the last practice'], a: 0, why: 'Level is a pure function of XP. Store it too and one day a bug will update one but not the other.' },
        { t: 'tf', q: 'The state includes a version number, `v`, so a future app can recognise and convert old saved data.', a: true, why: 'When the shape changes, code reads `v` and upgrades old records instead of crashing on them (Unit 23).' },
        { t: 'num', q: 'Today’s entry in `days` is 64 and the daily goal is 60. By how many XP has the learner passed the goal?', a: 4, unit: 'XP', why: '64 − 60 = 4. The goal ring is drawn from `days` each time, never from a separate “goal met” flag.' },
        { t: 'match', q: 'Match each question the app asks to where the answer comes from.', pairs: [['Is lesson u8l1 done?', '`lessons.u8l1.done`'], ['What level is the learner?', 'computed from `xp`'], ['How much XP today?', '`days` at today’s date'], ['Is the streak alive?', '`streak.last` compared with today']], why: 'Every screen is a question to the state. When the answer is not stored, it is computed from something that is.' }
      ]
    },
    {
      id: 'u10l2', title: 'A store that tells you when it changes',
      ref: REF.storage + ' ' + REF.js,
      items: [
        { t: 'learn', h: 'get, set, on', body: 'Screens need to know when the state changes. A **store** keeps the state private and offers three things:\n\n- `get()`: the current state\n- `set(patch)`: make a **new** state with the patch merged in, then tell every listener\n- `on(fn)`: add a listener\n\nThe top bar listens and redraws XP and the streak; the path listens and redraws the nodes. Neither needs to know who changed the state. The state lives in a **closure**: the variable `state` belongs to one call of `createStore`, and only the three functions can reach it.', viz: { k: 'code', lang: 'js', text: "const store = createStore({ xp: 0 });\nstore.on(s => drawTopBar(s));\nstore.set({ xp: 10 });  // drawTopBar runs" } },
        { t: 'code', run: 'js', q: 'Finish `set(patch)`: replace the state with a merged **copy**, then call every listener with the new state.', src: `function createStore(state) {
  const fns = [];
  return {
    get: () => state,
    set(patch) {
      // a merged copy, then tell everyone
    },
    on(fn) { fns.push(fn); }
  };
}
const st = createStore({ xp: 0 });
st.on(s => console.log('xp is', s.xp));
st.set({ xp: 10 });`, solution: `function createStore(state) {
  const fns = [];
  return {
    get: () => state,
    set(patch) {
      state = { ...state, ...patch };
      for (const fn of fns) {
        fn(state);
      }
    },
    on(fn) { fns.push(fn); }
  };
}
const st = createStore({ xp: 0 });
st.on(s => console.log('xp is', s.xp));
st.set({ xp: 10 });`, goal: JR.goal.pass, opts: { suite: 'store' }, want: 'every test passes', why: 'A new object on every change means anyone holding the old state sees the old values, and a quick `old !== new` tells you something changed.' },
        { t: 'mcq', q: 'What does the listener pattern buy the app?', opts: ['code that changes the state need not know which screens show it', 'faster saving', 'smaller files', 'it removes the need for render()'], a: 0, why: 'Add a new widget that shows XP and it subscribes itself; the code that awards XP never changes.' },
        { t: 'order', q: 'The lesson player awards 10 XP through the store. Order what happens.', items: ['the player calls `store.set({ xp: old + 10 })`', '`set` builds a new state object', '`set` calls each listener with it', 'the top bar redraws the XP'], why: 'The player never touches the top bar. The store connects them, so either can change without breaking the other.' },
        { t: 'tf', q: 'In `createStore`, other code can change `state` without calling `set`.', a: false, why: 'The variable is captured by the closure; outside code only has `get`, `set` and `on`. (It could still mutate the object `get` returns, which is why `set` makes copies.)' }
      ]
    },
    {
      id: 'u10l3', title: 'Tabs and the back button',
      ref: REF.appshape + ' ' + REF.webview,
      items: [
        { t: 'learn', h: 'Navigation without a router', body: 'The shell keeps where the learner is in two variables, `App.tab` and `App.labId`. `go(tab)` sets them and calls `render()`, which picks the view from a table:\n\n```\nconst views = {\n  learn: viewLearn, lab: viewLabs,\n  practice: viewPractice,\n  ref: viewRef, me: viewMe\n};\nmain.replaceChildren(\n  (views[App.tab] || viewLearn)());\n```\n\nThe phone’s back gesture asks `App.back()`, which closes what is open, in order: a panel, the lesson, a lab, another tab. It returns `false` only on the path, and then Android leaves the app.' },
        { t: 'order', q: 'A learner is in a lab, opened from the Labs tab. Order what each press of Back does.', items: ['close the lab and show the list of labs', 'go to the Learn tab', 'leave the app'], why: '`App.back()` undoes one level per press, and only lets Android close the app from the path.' },
        { t: 'mcq', q: 'Why does `render()` look the view up in an object instead of a long `if … else` chain?', opts: ['adding a tab is one new line, and unknown tabs fall back to a default', 'objects are always faster', 'if statements do not work in render', 'to save memory'], a: 0, why: 'A lookup table keeps the list of screens in one place. `|| viewLearn` covers a mistyped tab name.' },
        { t: 'tf', q: 'If `App.back()` returns false, the Android shell lets the system handle Back, which leaves the app.', a: true, why: 'The page says whether it used the gesture. Only when there is nothing left to close does the app give it back to Android.' },
        { t: 'hotspot', q: 'Tap the control that changes `App.tab`.', viz: { k: 'phone', screen: 'practice' }, a: 'tabs', aText: 'The tab bar', why: 'Each tab button calls `go(tab)`, which sets `App.tab` and renders.' }
      ]
    }
  ]
});

CRAFT.units.push({
  id: 'u11', n: 11, track: 'js', tone: 'rs2', title: 'Organising code without a bundler',
  blurb: 'One scope per file, a few global namespaces, files loaded in dependency order, and why this app ships one file instead of ES modules.',
  lessons: [
    {
      id: 'u11l1', title: 'One scope per file',
      ref: REF.modules,
      items: [
        { t: 'learn', h: 'Wrap each file', body: 'Plain scripts share one global scope: a `const total` in two files clashes. So each file wraps itself in a function that runs at once (an **IIFE**), and exports only one name onto the global object:\n\n```\n(function (G) {\n  \'use strict\';\n  const WEB = {};\n  const hidden = 42;  // private\n  WEB.contrast = (a, b) => …;\n  G.WEB = WEB;        // the export\n})(window);\n```\n\n`\'use strict\'` turns silent mistakes into errors: assigning to a misspelt variable throws instead of creating a global.' },
        { t: 'mcq', q: 'Two files each declare `const total` at the top level, as plain scripts. What happens?', opts: ['the second file fails: total is already declared', 'the second silently replaces the first', 'each file gets its own total', 'nothing: const is per file'], a: 0, why: 'Top-level `const` and `let` in classic scripts share one scope, and redeclaring is a SyntaxError. Inside an IIFE each file has its own.' },
        { t: 'tf', q: 'In strict mode, `totl = 5` (a typo for `total`) throws a ReferenceError instead of creating a global.', a: true, why: 'Without strict mode it quietly creates `window.totl` and the real `total` never changes: a bug that is hard to find.' },
        { t: 'fill', q: 'Complete the sentence.', text: 'An ___ is a function that runs as soon as it is defined; it gives each file a private scope, and the file exports one ___ onto the global object.', blanks: ['IIFE', 'namespace'], extra: ['event', 'array'], why: 'This app’s namespaces are short: WEB, LRN, GFX, SHIP, JR, GEN. Everything else stays private.' },
        { t: 'mcq', q: 'Which line is the export in the example?', opts: ['`G.WEB = WEB;`', '`const WEB = {};`', '`const hidden = 42;`', '`\'use strict\';`'], a: 0, why: 'Only what is put on `G` (here `window`) is visible to other files.' }
      ]
    },
    {
      id: 'u11l2', title: 'Load order',
      ref: REF.modules + ' ' + REF.build,
      items: [
        { t: 'learn', h: 'Each file after what it needs', body: 'Scripts run in the order they appear. If `gen.js` uses `WEB.contrast` while running, `web.js` must come first. A list of who-needs-whom is a **dependency graph**; an order where everything comes after its dependencies is a **topological order**.\n\nbuild.py keeps a hand-written list for each course. A cycle (a needs b, b needs a) has no valid order and means two files should be merged or split differently.', viz: { k: 'chain', items: [['web.js, learn.js, gfx.js, ship.js', 'models: need nothing', 'op'], ['jsrun.js, suites.js', 'need the models', 'rs2'], ['viz-*.js', 'drawings: need the models', 'rd'], ['gen.js, labs.js', 'need models and drawings', 'f3'], ['content/*.js', 'need GEN.REF, JR, V', 'rs1'], ['course.js', 'needs everything', 'f7']] } },

  const visit = name => {
    if (state[name] === 'done') return;
    if (state[name] === 'busy') {

    for (const d of deps[name] || []) {

    state[name] = 'done';

      items: [
        { t: 'learn', h: 'Gaps that fit each card', body: 'SM-2 (Woźniak) gives each card a repetition count, an interval and an **easiness factor** EF, starting at 2.5. After each review the learner grades recall from 0 (blank) to 5 (perfect):\n\n- grade below 3: start again, interval 1 day, EF kept\n- otherwise EF′ = EF + 0.1 − (5 − q)(0.08 + (5 − q) × 0.02), never below 1.3\n- the interval is 1 day, then 6 days, then the last interval × EF′, **rounded up**\n\nGrade 5 every time gives reviews on days 1, 7, 24, 74 and 224. Grade 4 keeps EF at 2.5.', viz: { k: 'tune', model: 'sm2' } },

        { t: 'goal', q: 'Choose four grades so the gap after the fourth review is at least 45 days.', viz: { k: 'tune', model: 'sm2' }, goal: w => w.out.card.interval >= 45, solve: { q1: 5, q2: 5, q3: 5, q4: 5 }, aText: 'Mostly 5s: four 5s give a 50-day gap', why: 'Each 5 raises EF by 0.1, and the gap multiplies by EF, so a few easy reviews stretch the schedule fast. One grade of 2 resets it to 1 day.' },
        { t: 'code', run: 'js', q: 'Write `sm2(card, q)` for cards `{ reps, ef, interval }`: below 3 start again (reps 0, interval 1, ef kept); otherwise update ef first (at least 1.3, rounded to 3 decimals), add a rep, and set the interval to 1, 6, or the last interval × the new ef, rounded up.', src: `function sm2(card, q) {

  if (q < 3) {
    return { reps: 0, ef: card.ef,
      interval: 1 };
  }
  const d = 5 - q;
  let ef = card.ef + 0.1 -
    d * (0.08 + d * 0.02);

  const reps = card.reps + 1;

CRAFT.units.push({
  id: 'u26', n: 26, track: 'svg', tone: 'rd', title: 'Charts',
  blurb: 'A linear scale from data to pixels, nice tick values, and a line chart put together by hand.',
  lessons: [
    {
      id: 'u26l1', title: 'Scales',
      ref: REF.charts,
      items: [
        { t: 'learn', h: 'From data to pixels', body: 'A **scale** maps a data range, the **domain**, onto a pixel range:\n\nx = r_{0} + (v − d_{0}) ÷ (d_{1} − d_{0}) × (r_{1} − r_{0})\n\nFor a y axis, run the pixel range from the bottom up (for example 200 down to 20), because SVG’s y grows downwards. To find which value is under a tap, run it backwards: the **inverse** scale.', viz: { k: 'scalemap', d: [0, 100], r: [40, 320], values: [0, 25, 75, 100] } },
        { t: 'num', q: 'Domain 0–100 maps to pixels 40–320. Where does 75 land?', a: 250, unit: 'px', why: '40 + 0.75 × 280 = 250.' },
        { t: 'goal', q: 'Make the value 75 land at exactly 200 px.', viz: { k: 'tune', model: 'scale' }, goal: w => Math.abs(w.out.x - 200) < 1e-9, solve: { r0: 20, r1: 260 }, aText: 'For example domain 0–100 onto 20–260 px', why: 'With 0–100, 75 sits three quarters of the way: 20 + 0.75 × 240 = 200. Other domains and ranges work too.' },
        { t: 'code', run: 'js', q: 'Write `scale(d0, d1, r0, r1)`: return a function that maps a value to pixels, with an `invert` function on it that maps pixels back.', src: `function scale(d0, d1, r0, r1) {
  const f = v => v;
  f.invert = p => p;
  return f;
}
const x = scale(0, 100, 40, 320);
console.log(x(75), x.invert(180));`, solution: `function scale(d0, d1, r0, r1) {
  const f = v =>
    r0 + (v - d0) / (d1 - d0) * (r1 - r0);
  f.invert = p =>
    d0 + (p - r0) / (r1 - r0) * (d1 - d0);
  return f;
}
const x = scale(0, 100, 40, 320);
console.log(x(75), x.invert(180));`, goal: JR.goal.pass, opts: { suite: 'scale' }, want: 'every test passes', why: 'A function is an object, so it can carry its inverse as a property: `x(75)` and `x.invert(180)`.' },
        { t: 'num', q: 'On the same scale (0–100 onto 40–320), a tap lands at 180 px. Which value is under it?', a: 50, why: '(180 − 40) ÷ 280 × 100 = 50: the inverse scale.' },
        { t: 'tf', q: 'To draw a y axis upwards, the pixel range runs from the bottom to the top, such as 200 to 20.', a: true, why: 'Then bigger values get smaller y, which is higher on screen.' }
      ]
    },
    {
      id: 'u26l2', title: 'Nice ticks',
      ref: REF.charts,
      items: [
        { t: 'learn', h: 'Round numbers on the axis', body: 'Ticks at 3.7, 24.6 and 45.5 are hard to read. Heckbert’s **nice numbers** (1990) pick round ones:\n\n1. round the data range up to 1, 2, 5 or 10 × a power of ten\n2. the step is that range ÷ (ticks − 1), rounded to 1, 2, 5 or 10 × a power of ten\n3. start at the step below the minimum and end at the step above the maximum\n\nFor data from 3.7 to 87.2 with about 5 ticks: the range becomes 100, the step 20, and the ticks 0, 20, 40, 60, 80, 100.', viz: { k: 'ticks', min: 3.7, max: 87.2, n: 5 } },
        { t: 'num', q: 'Data from 0 to 47, about 5 ticks. Which step does the method pick?', a: 10, why: 'The range 47 rounds up to 50; 50 ÷ 4 = 12.5 rounds to 10. Ticks: 0, 10, 20, 30, 40, 50.' },
        { t: 'code', run: 'js', q: 'Write Heckbert’s `niceNum(x, round)`. Split x into a fraction f (1 to 10) times 10^{e}. With `round`, f below 1.5 → 1, below 3 → 2, below 7 → 5, else 10; without it, f up to 1 → 1, up to 2 → 2, up to 5 → 5, else 10.', src: `function niceNum(x, round) {
  const e = Math.floor(Math.log10(x));
  const f = x / 10 ** e;
  let nf = f;
  // pick 1, 2, 5 or 10
  return nf * 10 ** e;
}
console.log(niceNum(83.5, false));`, solution: `function niceNum(x, round) {
  const e = Math.floor(Math.log10(x));
  const f = x / 10 ** e;
  let nf;
  if (round) {
    nf = f < 1.5 ? 1 : f < 3 ? 2
      : f < 7 ? 5 : 10;
  } else {
    nf = f <= 1 ? 1 : f <= 2 ? 2
      : f <= 5 ? 5 : 10;
  }
  return nf * 10 ** e;
}
console.log(niceNum(83.5, false));`, goal: JR.goal.pass, opts: { suite: 'niceNum' }, want: 'every test passes', why: 'Without rounding it goes up (the range must cover the data); with rounding it goes to the nearest friendly step.' },
        { t: 'tf', q: 'Nice ticks always include the data’s exact minimum and maximum.', a: false, why: 'They bracket the data: 3.7 to 87.2 gets ticks 0 to 100. The axis is a little wider than the data.' },
        { t: 'mcq', q: 'Which steps can the nice-number method choose?', opts: ['1, 2, 5 or 10 times a power of ten', 'any whole number', 'powers of two', 'the range divided by 10'], a: 0, why: 'People count comfortably in 1s, 2s and 5s; 0.25 or 3 make an axis hard to read.' }
      ]
    },
    {
      id: 'u26l3', title: 'A line chart by hand',
      ref: REF.charts + ' ' + REF.a11y,
      items: [
        { t: 'learn', h: 'Putting it together', body: '1. leave **margins**: room on the left for y labels, below for x labels\n2. build an x scale and a y scale (flipped)\n3. draw **ticks** and faint grid lines at nice values\n4. draw the **line**: a path through the scaled points\n5. add dots, axis titles, and an `aria-label` that states the point of the chart\n\nUse theme colours and keep the text 10–12 px at the drawn size.', viz: { k: 'plot', series: [{ name: 'XP per day', pts: [[1, 20], [2, 60], [3, 64], [4, 0], [5, 70], [6, 75], [7, 64], [8, 62], [9, 80], [10, 70], [11, 66], [12, 90], [13, 70], [14, 72]], color: 'var(--brand)', sw: 2.2 }], xlab: 'day', ylab: 'XP', xmin: 1, xmax: 14, ymin: 0, ymax: 100, hmarks: [{ y: 60, label: 'daily goal' }], legend: false, H: 200, cap: 'Two weeks of practice: the line crosses the 60 XP goal most days.' } },
        { t: 'code', run: 'js', q: 'Write `toPixels(values, W, H)`: one `[x, y]` per value, x spread evenly from 0 to W, and y = H at 0 and 0 at the largest value.', src: `// values → [[x, y]]: x from 0 to W,
// y from H (value 0) up to 0 (the max)
function toPixels(values, W, H) {
  return values.map((v, i) => [i, v]);
}
console.log(toPixels([0, 50, 100], 200,
  100));`, solution: `// values → [[x, y]]: x from 0 to W,
// y from H (value 0) up to 0 (the max)
function toPixels(values, W, H) {
  const max = Math.max(...values);
  const n = values.length;
  return values.map((v, i) => [
    n > 1 ? i / (n - 1) * W : 0,
    H - v / max * H
  ]);
}
console.log(toPixels([0, 50, 100], 200,
  100));`, goal: JR.goal.pass, opts: { suite: 'toPixels' }, want: 'every test passes', why: 'Two small scales in one: index to x, value to a flipped y. A single value sits at x = 0.' },
        { t: 'order', q: 'Order the steps of drawing a chart.', items: ['choose the margins', 'build the x and y scales', 'draw the ticks and grid lines', 'draw the line through the scaled points', 'add axis titles and an aria-label'], why: 'Scales need the margins; everything else needs the scales.' },
        { t: 'tf', q: 'A chart’s `aria-label` should state its point, such as “XP met the daily goal on 11 of 14 days”.', a: true, why: 'A screen-reader user cannot see the line. The sentence gives them what a glance gives everyone else.' },
        { t: 'mcq', q: 'Why leave a margin on the left of the plot area?', opts: ['room for the y-axis labels', 'to centre the chart', 'browsers require it', 'to hide the first point'], a: 0, why: 'Labels drawn at x = 0 would hang off the left edge and be cut.' }
      ]

        { t: 'learn', h: 'Headers, data, directory, end', body: 'A ZIP is records one after another:\n\n- for each file: a **local header** (30 bytes, then the name), then the data, stored or deflated\n- the **central directory**: one 46-byte entry plus the name for each file, with where its local header is\n- the **end record**, 22 bytes, which says where the central directory starts\n\nReaders start at the **end**: find the end record, jump to the central directory, then to each file. Each entry also carries a CRC-32 checksum of its data.', viz: { k: 'zipmap' } },
        { t: 'hotspot', q: 'Tap the record a ZIP reader looks at first.', viz: { k: 'zipmap' }, a: 'eocd', aText: 'The end record', why: 'It sits at the end, so a reader searches backwards for its signature, the bytes 50 4B 05 06.' },
        { t: 'num', q: 'A stored entry named `classes.dex` (11 bytes) holds 16,212 bytes. How many bytes from the start of its local header to the end of its data?', a: 16253, unit: 'bytes', why: '30 + 11 + 16,212 = 16,253, with no extra field.' },
        { t: 'code', run: 'js', q: 'Write `eocdAt(bytes)`: the offset of the end record, the last place the bytes 50 4B 05 06 appear, starting at least 22 bytes before the end; −1 if there is none.', src: `const SIG = [0x50, 0x4B, 0x05, 0x06];
// search backwards for the end record
function eocdAt(bytes) {
  return -1;
}
const b = new Array(100).fill(0);
b.splice(78, 4, ...SIG);
console.log(eocdAt(b));`, solution: `const SIG = [0x50, 0x4B, 0x05, 0x06];
// search backwards for the end record
function eocdAt(bytes) {
  for (let i = bytes.length - 22;
       i >= 0; i--) {
    if (SIG.every((s, k) =>
        bytes[i + k] === s)) {
      return i;
    }
  }
  return -1;
}
const b = new Array(100).fill(0);
b.splice(78, 4, ...SIG);
console.log(eocdAt(b));`, goal: JR.goal.pass, opts: { suite: 'eocdAt' }, want: 'every test passes', why: 'The end record is at least 22 bytes long and may be followed by a comment, so the search starts 22 bytes from the end and walks back.' },
        { t: 'tf', q: 'A ZIP reader finds the files by starting from the end of the archive.', a: true, why: 'Through the end record and the central directory. Bytes that no directory entry points at are simply never read.' },
        { t: 'mcq', q: 'Why can the APK Signing Block sit just before the central directory without upsetting ZIP readers?', opts: ['readers follow the offsets in the end record and directory, and skip what lies between', 'ZIP readers ignore signatures', 'the block hides inside a file', 'it is compressed'], a: 0, why: 'Nothing points into the block, so plain ZIP tools never see it; Android’s verifier knows where to look.' }
      ]
    },
    {
      id: 'u37l3', title: 'Alignment',
      ref: REF.apk,
      items: [
        { t: 'learn', h: 'Data on 4-byte boundaries', body: '**zipalign** pads each uncompressed file’s local header so its data starts at a multiple of 4 bytes. Then Android can map the data straight from the APK into memory, without copying it. Apps that target Android 11 or later must keep `resources.arsc` uncompressed and aligned like this.\n\nThe padding goes into the header’s extra field: data would start at offset + 30 + name length, so pad = (4 − that mod 4) mod 4.\n\nAlignment moves bytes, so it must happen **before** signing.', viz: { k: 'tune', model: 'zipalign' } },
        { t: 'num', q: 'A stored entry’s local header starts at byte 1,000 and its name is 21 bytes. How many padding bytes give 4-byte alignment?', a: 1, unit: 'byte', why: 'Data would start at 1000 + 30 + 21 = 1051; 1051 mod 4 = 3, so 1 byte of padding moves it to 1052.' },
        { t: 'goal', q: 'With 4-byte alignment, choose a name length that makes zipalign add exactly 3 bytes of padding.', viz: { k: 'tune', model: 'zipalign', only: ['name'] }, goal: w => w.out.al === 4 && w.out.pad === 3, solve: { name: 22 }, aText: 'A 22-byte name (or 26, 30…): data would start at 89', why: '37 + 30 + 22 = 89, which is 1 past a multiple of 4, so 3 bytes are needed to reach 92.' },
        { t: 'tf', q: 'zipalign must run before apksigner signs an APK with scheme v2.', a: true, why: 'The v2 signature covers the whole file; aligning afterwards would change bytes and break it.' },
        { t: 'mcq', q: 'Why align uncompressed data to 4 bytes?', opts: ['so Android can read it straight from the file in memory, without copying', 'to compress better', 'to make the ZIP valid', 'to hide the data'], a: 0, why: 'Memory-mapping needs the data at aligned addresses. It saves RAM and start-up time.' }
      ]
    }
  ]

CRAFT.units.push({

        { t: 'hotspot', q: 'Tap where the page’s files come from.', viz: { k: 'bridge' }, a: 'assets', aText: 'assets/www inside the APK', why: 'Every request to the app’s own host name is answered from the APK’s assets.' },

        { t: 'order', q: 'Order what `onCreate` does.', items: ['make the WebView', 'turn on JavaScript and DOM storage', 'set the client that serves the assets', 'load index.html from the app’s own https host'], why: 'Configure everything before the first load, or the first request misses the asset server.' }

        { t: 'learn', h: 'Page to Java and back', body: '`addJavascriptInterface(new Bridge(), "AndroidApp")` makes a Java object appear in the page as `window.AndroidApp`. Each method the page may call needs the `@JavascriptInterface` annotation.\n\n- the page checks `if (window.AndroidApp)` to know it runs in the app\n- calls arrive on a background thread, so screen changes go through `runOnUiThread`\n- Java calls the page with `evaluateJavascript("App.back()", callback)`\n\nAny page loaded in that WebView can call the bridge, which is one more reason to load only your own pages.', viz: { k: 'code', lang: 'java', text: "final class Bridge {\n  @JavascriptInterface\n  public void setFullscreen(boolean on) {\n    runOnUiThread(() -> full(on));\n  }\n  @JavascriptInterface\n  public String platform() {\n    return \"android\";\n  }\n}\nweb.addJavascriptInterface(\n  new Bridge(), \"AndroidApp\");" } },

        { t: 'hotspot', q: 'Tap the part that lets the page call Java.', viz: { k: 'bridge' }, a: 'bridge', aText: 'The AndroidApp bridge', why: 'One object, a handful of methods: bar colours, full screen, platform.' },
        { t: 'mcq', q: 'How does the page know it is running inside the Android app?', opts: ['it checks whether `window.AndroidApp` exists', 'it reads the address', 'it asks the learner', 'it cannot tell'], a: 0, why: 'Feature detection: the same page runs on the web, where the bridge is missing, and in the app, where it is there.' }

        { t: 'mcq', q: 'An app targets API 36. Where does its content draw?', opts: ['edge to edge, behind the status and navigation bars', 'only between the bars', 'in a floating window', 'full screen with the bars hidden'], a: 0, why: 'Since API 35 edge-to-edge is the default; the app must pad its own content using the insets.' },
        { t: 'order', q: 'Order what happens on a back gesture.', items: ['the user swipes back', 'the shell’s back callback runs', 'it asks the page `App.back()`', 'true: the page closed something; false: the activity finishes'], why: 'The page knows what is open; the shell only asks.' },
        { t: 'tf', q: 'When `App.back()` returns false, the shell lets the app close.', a: true, why: 'False means nothing is left to close: the learner is on the path, so back leaves the app, as on any Android app.' },
        { t: 'mcq', q: 'Why list orientation and screenSize in the activity’s `configChanges`?', opts: ['so turning the phone does not destroy the activity and reload the page', 'to lock the app upright', 'to save battery', 'Google Play requires it'], a: 0, why: 'Without it, Android recreates the activity on rotation, and the WebView would load the page again, mid-lesson.' }

  id: 'u39', n: 39, track: 'android', tone: 'f7', title: 'Building without Gradle',
  blurb: 'The Android build as a handful of commands: javac and d8 for the code, aapt2 for the resources, then zip, zipalign, apksigner and a check, all from a short Python script.',
  lessons: [
    {
      id: 'u39l1', title: 'From Java to DEX',
      ref: REF.androidbuild,
      items: [
        { t: 'learn', h: 'Two compilers', body: 'Android does not run Java’s own bytecode, so the code is compiled twice:\n\n1. **javac** compiles MainActivity.java against `android.jar` into `.class` files (Java bytecode). android.jar holds only **stubs**: every method’s body just throws; the real code is on the phone\n2. **d8** turns the `.class` files into one `classes.dex` (Dalvik bytecode, which Android’s runtime runs). `--min-api 24` lets it use what Android 7.0 and later support; `--release` optimises\n\nNo Gradle, no plugins: two commands, a few seconds.', viz: { k: 'pipeline', mode: 'apk', hl: ['s0', 's1', 's2'] } },
        { t: 'order', q: 'Order the code’s path into the APK.', items: ['MainActivity.java', 'javac makes .class files', 'd8 makes classes.dex', 'classes.dex is zipped into the APK'], why: 'Source, Java bytecode, DEX bytecode, package.' },
        { t: 'mcq', q: 'What does d8 do?', opts: ['turns Java .class files into a classes.dex for Android', 'signs the APK', 'compiles the resources', 'aligns the ZIP'], a: 0, why: 'd8 is the dexer; it replaced the older dx in 2018.' },
        { t: 'tf', q: '`android.jar` contains the real Android system code.', a: false, why: 'It contains stubs: the classes and method signatures to compile against. On a phone, the real implementations are used.' },
        { t: 'fill', q: 'Complete the sentence.', text: 'javac makes ___ files; d8 turns them into ___.', blanks: ['.class', 'classes.dex'], extra: ['.apk', '.aab'], why: 'Two formats of bytecode: one for the Java virtual machine, one for Android’s runtime.' },
        { t: 'hotspot', q: 'Tap the step that makes the DEX bytecode.', viz: { k: 'pipeline', mode: 'apk' }, a: 's2', aText: 'd8', why: 'javac makes .class files; d8 turns them into classes.dex.' }
      ]
    },
    {
      id: 'u39l2', title: 'Resources with aapt2',
      ref: REF.androidbuild,
      items: [
        { t: 'learn', h: 'Compile, then link', body: '**aapt2 compile** turns each file in `res/` (colour lists, launcher icons) into a compiled `.flat` file.\n\n**aapt2 link** then builds an APK without code: the binary manifest, `resources.arsc`, the compiled `res/`, and everything in `assets/`. It needs `-I android.jar` to know the platform’s own resources, and takes the min and target SDK and the version.\n\nFolders carry **qualifiers**: `values-night/` holds the dark theme’s bar colours, `mipmap-xxhdpi/` the icon for × 3 screens.', viz: { k: 'pipeline', mode: 'apk', hl: ['s3', 's4'] } },
        { t: 'hotspot', q: 'Tap the step that builds `resources.arsc`.', viz: { k: 'pipeline', mode: 'apk' }, a: 's4', aText: 'aapt2 compile + link', why: 'Linking gathers every compiled resource into the table and writes the binary manifest.' },
        { t: 'mcq', q: 'Where do the dark theme’s bar colours go?', opts: ['`res/values-night/colors.xml`', '`res/values/colors.xml`', '`assets/www/dark.css`', '`AndroidManifest.xml`'], a: 0, why: 'Android picks `values-night` when the phone is in dark mode, with no code.' },
        { t: 'num', q: 'A launcher icon is 48 dp. How many px wide is its xxxhdpi (× 4) version?', a: 192, unit: 'px', why: '48 × 4 = 192. This app renders its icon for all five densities from one drawing.' },
        { t: 'tf', q: '`aapt2 link` needs android.jar to know the platform’s own resources.', a: true, why: 'Themes and attributes such as `android:label` are defined by the platform, and link must check them.' }
      ]
    },
    {
      id: 'u39l3', title: 'Zip, align, sign, check',
      ref: REF.androidbuild + ' ' + REF.signing,
      items: [
        { t: 'learn', h: 'The last four steps', body: '1. add `classes.dex` to the linked APK with any ZIP library\n2. `zipalign -p -f 4`: align the uncompressed data\n3. `apksigner sign`: sign it; with minSdk 24 it writes v2 and v3 signatures and leaves out the old v1\n4. `apksigner verify --print-certs`: check it, and print the certificate\n\nThen `adb install` puts it on a phone. This app’s whole Android build is a Python script of about 300 lines that runs these commands, in about 20 seconds.', viz: { k: 'table', head: ['Step', 'Command'], rows: [['compile', 'javac -source 8 -target 8 …'], ['dex', 'd8 --release --min-api 24 …'], ['resources', 'aapt2 compile; aapt2 link …'], ['align', 'zipalign -p -f 4 in.apk out.apk'], ['sign', 'apksigner sign --ks release.jks …'], ['check', 'apksigner verify --print-certs'], ['install', 'adb install App-1.0.0.apk']] } },
        { t: 'order', q: 'Order the end of the build.', items: ['zip in classes.dex', 'zipalign -p -f 4', 'apksigner sign', 'apksigner verify', 'adb install'], why: 'Align before signing; verify before shipping.' },

        { t: 'num', q: 'This app’s minSdk is Android 7.0. What API level is that?', a: 24, why: 'API 24, Nougat. About 99% of phones in use run it or newer.' }

        { t: 'hotspot', q: 'Tap what Android compares to decide whether an update may install.', viz: { k: 'signing' }, a: 'cert', aText: 'The certificate', why: 'The new APK’s signing certificate must match the installed one’s, or Android refuses the update.' },
        { t: 'mcq', q: 'You lose the keystore of an app you distribute yourself. What happens?', opts: ['no update can ever install over it; users must uninstall first, losing their data', 'Android lets you reset it', 'nothing changes', 'the installed app stops working'], a: 0, why: 'That is why the key needs backups. On Google Play, Play App Signing softens this: a lost upload key can be replaced.' },

        { t: 'match', q: 'Match each scheme to what it adds.', pairs: [['v1', 'a signature for each file inside'], ['v2', 'one signature over the whole file'], ['v3', 'moving to a new key'], ['v4', 'installing while still downloading']], why: 'v2 is the core; v3 and v4 add features on top.' },
        { t: 'mcq', q: 'Which scheme lets an app move to a new signing key?', opts: ['v3', 'v1', 'v2', 'v4'], a: 0, why: 'v3 includes a lineage: the old key vouches for the new one, so updates signed with the new key install.' },
        { t: 'tf', q: 'A v2 signature fails if any byte outside the signing block changes.', a: true, why: 'It protects the contents, the central directory and the end record, so tampering anywhere is caught.' },
        { t: 'num', q: 'From which API level do phones understand v2 signatures?', a: 24, why: 'Android 7.0, API 24: exactly this app’s minSdk, which is why it needs no v1.' }

    {
      id: 'u40l3', title: 'App bundles',
      ref: REF.signing + ' ' + REF.androidbuild,
      items: [
        { t: 'learn', h: 'One upload, many APKs', body: 'An **Android App Bundle** (.aab) is a publishing format, not an installable one. It holds the code and resources for every device, with resources in protocol-buffer form (`aapt2 link --proto-format`), in a `base` module with `manifest/`, `dex/`, `res/`, `assets/` and `root/` folders.\n\nGoogle Play turns it into small APKs for each phone, split by screen density, language and processor, and signs them with the **app signing key** it holds (Play App Signing). You sign the bundle with your **upload key** (`jarsigner`). New apps on Play must use bundles, since August 2021.\n\n`bundletool build-bundle` makes it; `bundletool build-apks` lets you test what Play would make.', viz: { k: 'aabsplit' } },
